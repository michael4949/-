<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业高价值AI场景识别与排序 · 智能引导 | 奇点达科技</title>
<script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.2/dist/html2pdf.bundle.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  /* ===== 智能体自身配色：AI 科技感（深空紫 + 电光青），与"企业AI成熟度评估"的藏蓝+金差异化 ===== */
  --bg:#070713;--bg2:#0c0a1f;--panel:rgba(22,20,46,.72);--panel-solid:#14122c;
  --violet:#8b5cf6;--violet2:#a78bfa;--cyan:#22d3ee;--magenta:#e879f9;
  --grad:linear-gradient(135deg,#8b5cf6 0%,#22d3ee 100%);
  --grad-soft:linear-gradient(135deg,rgba(139,92,246,.18),rgba(34,211,238,.16));
  --ink:#ecebfb;--ink2:#c7c6e6;--muted:#8c8ab4;--line:rgba(255,255,255,.09);
  --line2:rgba(255,255,255,.14);--ok:#34d399;
}
body{font-family:'PingFang SC','Microsoft YaHei',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;overflow:hidden}

/* 背景：AI 气息——星云光晕 + 细网格 */
.bgfx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bgfx::before{content:"";position:absolute;width:60vw;height:60vw;top:-15vw;left:-10vw;background:radial-gradient(circle,rgba(139,92,246,.35),transparent 60%);filter:blur(40px);animation:float1 18s ease-in-out infinite}
.bgfx::after{content:"";position:absolute;width:55vw;height:55vw;bottom:-18vw;right:-12vw;background:radial-gradient(circle,rgba(34,211,238,.28),transparent 60%);filter:blur(40px);animation:float2 22s ease-in-out infinite}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:46px 46px;mask-image:radial-gradient(ellipse 80% 60% at 50% 40%,#000,transparent 85%)}
@keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(6vw,4vh)}}
@keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(-5vw,-4vh)}}

.shell{position:relative;z-index:1;display:flex;height:100vh;overflow:hidden}

/* ===== 侧栏 ===== */
.sb{width:286px;background:linear-gradient(180deg,rgba(16,14,38,.92),rgba(8,7,20,.92));backdrop-filter:blur(14px);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0}
.sb-top{padding:22px 20px 18px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.brand .orb{width:34px;height:34px;border-radius:10px;background:var(--grad);position:relative;box-shadow:0 6px 22px rgba(139,92,246,.5);flex-shrink:0}
.brand .orb::after{content:"";position:absolute;inset:5px;border-radius:7px;background:var(--bg2);}
.brand .orb::before{content:"✦";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;z-index:1}
.brand .tag{font-size:9px;letter-spacing:3px;color:var(--muted)}
.brand b{font-size:12px;font-weight:700;letter-spacing:.5px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sb-top h1{font-size:15px;font-weight:800;line-height:1.45;letter-spacing:.3px}
.sb-top p{font-size:10px;color:var(--muted);margin-top:5px;letter-spacing:1px}
.sb-steps{flex:1;overflow-y:auto;padding:18px 16px}
.sb-steps::-webkit-scrollbar{width:5px}.sb-steps::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
.si{display:flex;gap:12px;padding:9px 0;opacity:.4;transition:opacity .35s}
.si.on{opacity:1}.si.ok{opacity:.7}
.si-rail{display:flex;flex-direction:column;align-items:center}
.si-dot{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;background:rgba(255,255,255,.03);transition:all .3s}
.si.on .si-dot{border-color:transparent;background:var(--grad);color:#fff;box-shadow:0 0 0 4px rgba(139,92,246,.18),0 6px 18px rgba(34,211,238,.3)}
.si.ok .si-dot{border-color:var(--cyan);color:var(--cyan);background:rgba(34,211,238,.08)}
.si-line{width:2px;flex:1;margin:4px 0;background:var(--line);border-radius:2px;min-height:8px}
.si.ok .si-line{background:linear-gradient(var(--cyan),var(--line))}
.si-lbl{padding-top:3px}
.si-lbl b{display:block;font-size:12px;font-weight:600}
.si-lbl span{font-size:10px;color:var(--muted)}
.sb-ft{padding:14px 18px;border-top:1px solid var(--line);font-size:8.5px;color:var(--muted);line-height:1.7;letter-spacing:.3px}
.sb-ft b{color:var(--violet2)}

/* ===== 主区 ===== */
.mn{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;border-bottom:1px solid var(--line);background:rgba(10,9,24,.6);backdrop-filter:blur(10px);flex-shrink:0}
.topbar .t-l{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink2)}
.topbar .live{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--cyan)}
.topbar .live i{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.topbar .pill{font-size:10px;color:var(--muted);border:1px solid var(--line2);padding:3px 10px;border-radius:20px}

.chat{flex:1;overflow-y:auto;padding:24px 28px;scroll-behavior:smooth}
.chat::-webkit-scrollbar{width:7px}.chat::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
.msg{margin-bottom:18px;max-width:840px}
.msg.ai{margin-right:auto}.msg.usr{margin-left:auto;max-width:560px}
.msg.report{max-width:none}
.who{font-size:9.5px;color:var(--muted);margin-bottom:5px;font-weight:600;letter-spacing:1px;display:flex;align-items:center;gap:6px}
.who .av{width:18px;height:18px;border-radius:6px;background:var(--grad);display:inline-flex;align-items:center;justify-content:center;font-size:9px;color:#fff}
.msg.usr .who{justify-content:flex-end}
.bbl{padding:14px 18px;border-radius:14px;font-size:13.5px;line-height:1.85}
.msg.ai .bbl{background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-top-left-radius:3px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.msg.usr .bbl{background:var(--grad);color:#0b0a1c;font-weight:500;border-top-right-radius:3px;box-shadow:0 8px 24px rgba(34,211,238,.25)}
.msg.ai .bbl strong{color:var(--violet2)}
.msg.usr .bbl strong{color:#072a30}

/* 选项 */
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.opts .ohint{width:100%;font-size:10.5px;color:var(--muted);margin-top:2px}
.opt{padding:9px 16px;border:1px solid var(--line2);border-radius:12px;font-size:12.5px;cursor:pointer;background:rgba(255,255,255,.03);color:var(--ink);font-family:inherit;transition:all .2s;display:inline-flex;align-items:center;gap:7px}
.opt:hover{border-color:var(--violet);background:var(--grad-soft);transform:translateY(-1px);box-shadow:0 6px 18px rgba(139,92,246,.22)}
.opt .chk{width:15px;height:15px;border-radius:5px;border:1.5px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;font-size:10px}
.opt.sel{border-color:var(--cyan);background:rgba(34,211,238,.12);color:#fff}
.opt.sel .chk{background:var(--cyan);border-color:var(--cyan);color:#06222a}
.confirm-row{display:flex;gap:10px;margin-top:12px;align-items:center}
.confirm-btn{padding:9px 22px;background:var(--grad);color:#0b0a1c;border:none;border-radius:12px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 6px 18px rgba(34,211,238,.3)}
.confirm-btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.confirm-row .c-hint{font-size:10.5px;color:var(--muted)}

.dot-anim{display:flex;align-items:center;gap:9px}
.dot-anim .dots span{display:inline-block;width:6px;height:6px;background:var(--violet2);border-radius:50%;margin-right:4px;animation:pk 1.4s infinite}
.dot-anim .dots span:nth-child(2){animation-delay:.2s;background:var(--cyan)}
.dot-anim .dots span:nth-child(3){animation-delay:.4s;background:var(--magenta)}
.dot-anim .lbl{font-size:11px;color:var(--muted)}
@keyframes pk{0%,80%,100%{opacity:.2;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}

/* 输入栏 */
.inp-bar{border-top:1px solid var(--line);background:rgba(10,9,24,.72);backdrop-filter:blur(12px);padding:14px 24px;flex-shrink:0}
.file-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.up-btn{display:flex;align-items:center;gap:6px;padding:7px 14px;border:1px dashed var(--line2);border-radius:10px;font-size:11.5px;color:var(--muted);cursor:pointer;background:rgba(255,255,255,.02);transition:all .2s}
.up-btn:hover{border-color:var(--violet);color:var(--violet2)}
.ftag{display:flex;align-items:center;gap:6px;padding:5px 11px;background:var(--grad-soft);border:1px solid var(--line2);border-radius:9px;font-size:11px;color:var(--ink2)}
.ftag .x{cursor:pointer;opacity:.5}.ftag .x:hover{opacity:1}
.inp-row{display:flex;gap:10px;align-items:flex-end}
.inp-row textarea{flex:1;border:1px solid var(--line2);border-radius:14px;padding:12px 16px;font-size:13.5px;font-family:inherit;resize:none;outline:none;min-height:46px;max-height:150px;line-height:1.6;background:rgba(255,255,255,.04);color:var(--ink)}
.inp-row textarea::placeholder{color:#6e6c93}
.inp-row textarea:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(139,92,246,.16)}
.send-btn{width:46px;height:46px;background:var(--grad);color:#0b0a1c;border:none;border-radius:13px;cursor:pointer;font-size:17px;flex-shrink:0;transition:transform .15s,box-shadow .2s;box-shadow:0 6px 18px rgba(34,211,238,.3)}
.send-btn:hover{transform:translateY(-1px)}
.send-btn:disabled{background:#2a2845;color:#555;cursor:not-allowed;box-shadow:none}
.done-note{text-align:center;padding:8px;color:var(--muted);font-size:11.5px}
.done-note a{color:var(--violet2);cursor:pointer;text-decoration:underline}

/* ===== 欢迎/设置页 ===== */
.welcome{display:flex;align-items:center;justify-content:center;flex:1;padding:30px;overflow-y:auto}
.wbox{background:var(--panel);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:22px;padding:40px 38px;max-width:600px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.45);position:relative;overflow:hidden}
.wbox::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad)}
.wbox .wtag{font-size:9.5px;color:var(--muted);letter-spacing:4px;margin-bottom:10px}
.wbox h2{font-size:25px;font-weight:800;margin-bottom:6px;letter-spacing:.5px}
.wbox h2 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.wbox .sub{color:var(--ink2);font-size:13px;line-height:1.85;margin-bottom:22px}
.wbox .sub b{color:var(--cyan)}
.steps-preview{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:24px}
.sp-item{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:11px;padding:11px 13px;border-left:3px solid var(--violet);transition:all .2s}
.sp-item:hover{border-left-color:var(--cyan);background:var(--grad-soft)}
.sp-item b{font-size:11.5px;display:block;margin-bottom:2px}
.sp-item span{font-size:10px;color:var(--muted)}
.setup-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.fld{text-align:left}
.fld label{font-size:11px;color:var(--ink2);display:block;margin-bottom:6px;font-weight:600}
.fld input,.fld select{width:100%;padding:11px 14px;border:1px solid var(--line2);border-radius:11px;font-size:13px;font-family:inherit;outline:none;background:rgba(255,255,255,.05);color:var(--ink)}
.fld input:focus,.fld select:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(139,92,246,.16)}
.fld select option{background:var(--panel-solid)}
.fld.full{grid-column:1/-1}
.toggles{display:flex;gap:18px;flex-wrap:wrap;margin:4px 0 18px;font-size:11.5px;color:var(--ink2)}
.toggles label{display:flex;align-items:center;gap:7px;cursor:pointer}
.toggles input{width:15px;height:15px;accent-color:var(--violet)}
.key-hint{font-size:10px;color:var(--muted);margin-top:7px;line-height:1.6}
.go-btn{width:100%;padding:15px;background:var(--grad);color:#0b0a1c;border:none;border-radius:14px;font-size:15.5px;font-weight:800;cursor:pointer;font-family:inherit;letter-spacing:1px;transition:transform .15s,box-shadow .2s;box-shadow:0 12px 32px rgba(34,211,238,.32)}
.go-btn:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(139,92,246,.4)}
.wfoot{font-size:10px;color:var(--muted);margin-top:16px;text-align:center;letter-spacing:.5px}

/* ===== 报告（明亮高端版式，按行业属性配色，变量在节点 inline 注入） ===== */
.report-wrap{margin-top:6px}
.report-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.report-head .rh-l b{font-size:14px;display:flex;align-items:center;gap:8px}
.report-head .rh-l .badge{font-size:9.5px;background:var(--grad);color:#0b0a1c;padding:3px 9px;border-radius:20px;font-weight:700}
.report-head .rh-l p{font-size:11px;color:var(--muted);margin-top:5px}
.report-head .rh-r{display:flex;gap:9px;flex-wrap:wrap}
.rbtn{padding:10px 18px;border-radius:11px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;border:none;display:inline-flex;align-items:center;gap:7px}
.rbtn.pri{background:var(--grad);color:#0b0a1c;box-shadow:0 6px 18px rgba(34,211,238,.3)}
.rbtn.gho{background:rgba(255,255,255,.04);color:var(--ink);border:1px solid var(--line2)}
.rbtn:hover{transform:translateY(-1px)}
.preview-frame{background:#33334a;border:1px solid var(--line);border-radius:14px;padding:18px;overflow:auto;max-height:74vh}

.pdf-doc{width:794px;margin:0 auto;background:#fff;color:#1f2230;font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  --rp:#274690;--rs:#0e1830;--ra:#e08e3c;--rl:#eef2fb;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pdf-doc .cover{position:relative;width:794px;height:1123px;overflow:hidden;background:var(--rs);color:#fff;display:flex;flex-direction:column}
.pdf-doc .cover .photo{position:absolute;inset:0;background-size:cover;background-position:center;filter:saturate(1.05)}
.pdf-doc .cover .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.30) 0%,rgba(0,0,0,.10) 30%,rgba(0,0,0,.55) 70%,var(--rs) 100%)}
.pdf-doc .cover .scrim2{position:absolute;inset:0;opacity:.55;background:linear-gradient(115deg,var(--rs) 0%,transparent 52%)}
.pdf-doc .cover .ctop{position:relative;z-index:2;padding:56px 60px 0;display:flex;align-items:center;justify-content:space-between}
.pdf-doc .cover .ctop .logo{display:flex;align-items:center;gap:11px}
.pdf-doc .cover .ctop .logo .lo{width:38px;height:38px;border-radius:11px;background:var(--ra);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:800}
.pdf-doc .cover .ctop .logo b{font-size:14px;letter-spacing:1px}
.pdf-doc .cover .ctop .logo span{display:block;font-size:9px;letter-spacing:3px;opacity:.8}
.pdf-doc .cover .ctop .ribbon{font-size:10px;letter-spacing:2px;border:1px solid rgba(255,255,255,.4);padding:6px 13px;border-radius:30px}
.pdf-doc .cover .cmid{position:relative;z-index:2;margin-top:auto;padding:0 60px 70px}
.pdf-doc .cover .kicker{display:inline-block;font-size:11px;letter-spacing:3px;background:var(--ra);color:#fff;padding:6px 14px;border-radius:6px;margin-bottom:20px;font-weight:700}
.pdf-doc .cover h1{font-family:Georgia,'Songti SC','SimSun',serif;font-size:50px;line-height:1.18;font-weight:800;letter-spacing:1px;text-shadow:0 4px 24px rgba(0,0,0,.4);margin-bottom:8px}
.pdf-doc .cover h1 em{font-style:normal;color:var(--ra)}
.pdf-doc .cover .csub{font-size:15px;opacity:.9;letter-spacing:4px;margin-bottom:30px}
.pdf-doc .cover .cfor{font-size:20px;font-weight:700;margin-bottom:6px}
.pdf-doc .cover .cfor b{color:var(--ra)}
.pdf-doc .cover .cmeta{display:flex;gap:26px;margin-top:26px;border-top:1px solid rgba(255,255,255,.25);padding-top:20px;font-size:12px}
.pdf-doc .cover .cmeta div span{display:block;font-size:9px;letter-spacing:2px;opacity:.65;margin-bottom:4px}
.pdf-doc .cover .cmeta div b{font-size:13px;font-weight:600}
.pbreak{page-break-after:always;break-after:page;height:0}

.pdf-doc .content{padding:54px 60px 60px}
.pdf-doc .content h1{font-size:25px;color:var(--rp);margin:0 0 18px;font-weight:800}
.pdf-doc .content h2{font-size:18px;color:var(--rs);margin:30px 0 12px;padding-bottom:9px;border-bottom:2px solid var(--rp);position:relative;font-weight:800;page-break-after:avoid}
.pdf-doc .content h2::before{content:"";position:absolute;left:0;bottom:-2px;width:62px;height:2px;background:var(--ra)}
.pdf-doc .content h3{font-size:14.5px;color:var(--rp);margin:20px 0 8px;font-weight:700;page-break-after:avoid}
.pdf-doc .content p{font-size:12.5px;line-height:1.9;margin-bottom:8px;color:#33384a}
.pdf-doc .content strong{color:var(--rs)}
.pdf-doc .content ul{margin:4px 0 10px}
.pdf-doc .content .li{font-size:12.5px;line-height:1.85;padding-left:18px;position:relative;margin-bottom:5px;color:#33384a}
.pdf-doc .content .li::before{content:"";position:absolute;left:2px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--ra)}
.pdf-doc table{width:100%;border-collapse:collapse;font-size:11px;margin:12px 0;page-break-inside:auto}
.pdf-doc thead{display:table-header-group}
.pdf-doc tr{page-break-inside:avoid}
.pdf-doc th{background:var(--rp);color:#fff;padding:9px 10px;text-align:left;font-weight:600;border:1px solid var(--rp)}
.pdf-doc td{padding:8px 10px;border:1px solid #e3e7f0;color:#3a3f52}
.pdf-doc tbody tr:nth-child(even) td{background:var(--rl)}
.pdf-doc .callout{background:var(--rl);border-left:4px solid var(--ra);border-radius:0 10px 10px 0;padding:14px 18px;margin:12px 0;page-break-inside:avoid}
.pdf-doc .callout h3{margin-top:0}
.pdf-doc .rfoot{margin-top:30px;border-top:1px solid #e3e7f0;padding-top:12px;display:flex;justify-content:space-between;font-size:9px;color:#9aa0b4}

@media print{.sb,.inp-bar,.topbar,.report-head,.bgfx{display:none!important}.mn,.chat{overflow:visible!important}.preview-frame{max-height:none!important;border:none;padding:0;background:#fff}}
@media(max-width:820px){.sb{display:none}.setup-grid,.steps-preview{grid-template-columns:1fr}.pdf-doc,.pdf-doc .cover{width:100%}}
</style>
</head>
<body>
<div class="bgfx"><div class="grid"></div></div>
<div class="shell">
  <aside class="sb">
    <div class="sb-top">
      <div class="brand">
        <div class="orb"></div>
        <div><div class="tag">SINGULARITY REACH</div><b>奇点达 · AI</b></div>
      </div>
      <h1>企业高价值AI场景<br>识别与排序</h1>
      <p>AI SCENARIO DISCOVERY &amp; PRIORITIZATION</p>
    </div>
    <div class="sb-steps" id="steps"></div>
    <div class="sb-ft">奇点达"3+2+1"标准化产品 · <b>软件第二件</b><br>智能引导式访谈 / 五维VFDCS量化模型<br>38+行业专家 · 128+落地案例 · 实时联网</div>
  </aside>
  <div class="mn" id="main"></div>
</div>
<input type="file" id="fileIn" multiple accept=".pdf,.png,.jpg,.jpeg,.txt,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.csv" style="display:none">

<script>
/* ===================== 状态 ===================== */
var PHASES=[
  {t:"业务全景采集",d:"行业·规模·价值链"},

function lighten(hex){ // 生成浅色底纹
  var n=parseInt(hex.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=Math.round(r+(255-r)*0.9);g=Math.round(g+(255-g)*0.9);b=Math.round(b+(255-b)*0.9);
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

/* markdown -> HTML（报告正文） */
function mdToHtml(raw){
  var lines=raw.split("\n"),h="",inTable=false,headerDone=false;
  function closeTable(){if(inTable){h+="</tbody></table>";inTable=false;headerDone=false;}}
  for(var i=0;i<lines.length;i++){
    var l=lines[i].trim();
    if(!l){closeTable();continue;}
    var isRow=l.indexOf("|")>=0&&/\|.*\|/.test(l);
    if(isRow){
      if(/^[\|\s\-:]+$/.test(l))continue; // 分隔行
      var cells=l.split("|").filter(function(c){return c.trim()!=="";});
      if(!inTable){h+='<table><thead>';inTable=true;headerDone=false;}
      if(!headerDone){h+="<tr>";cells.forEach(function(c){h+="<th>"+fmt(c.trim())+"</th>";});h+="</tr></thead><tbody>";headerDone=true;}
      else{h+="<tr>";cells.forEach(function(c){h+="<td>"+fmt(c.trim())+"</td>";});h+="</tr>";}
      continue;
    }
    closeTable();
    if(l.indexOf("### ")===0){h+="<h3>"+fmt(l.slice(4))+"</h3>";continue;}
    if(l.indexOf("## ")===0){h+="<h2>"+fmt(l.slice(3))+"</h2>";continue;}
    if(l.indexOf("# ")===0){h+="<h1>"+fmt(l.slice(2))+"</h1>";continue;}
    if(/^[-•*]\s/.test(l)){h+='<div class="li">'+fmt(l.slice(2))+'</div>';continue;}
    if(/^\d+[.、]\s*/.test(l)){h+='<div class="li">'+fmt(l.replace(/^\d+[.、]\s*/,""))+'</div>';continue;}
    h+="<p>"+fmt(l)+"</p>";
  }
  closeTable();
  return h;
}

    '<div class="rfoot"><span>奇点达科技 · 企业高价值AI场景识别与排序</span><span>'+esc(rd.company)+' · '+rd.date+' · 机密</span></div></section>';
  return '<div id="pdfDoc" class="pdf-doc" style="--rp:'+P.p+';--rs:'+P.s+';--ra:'+P.a+';--rl:'+rl+'">'+cover+content+'</div>';
}

/* 生成行业相关封面图（Pollinations 实时生成，无需额外Key；失败则渐变兜底） */
function fetchCover(prompt){
  return new Promise(function(resolve){
    var p=encodeURIComponent((prompt||"professional corporate scene, modern, cinematic, wide angle").slice(0,300));
    var url="https://image.pollinations.ai/prompt/"+p+"?width=1024&height=1448&nologo=true&model=flux";
    var done=false;
    var timer=setTimeout(function(){if(!done){done=true;resolve(null);}},32000);
    fetch(url,{mode:"cors"}).then(function(r){if(!r.ok)throw 0;return r.blob();}).then(function(b){
      var fr=new FileReader();fr.onload=function(){if(!done){done=true;clearTimeout(timer);resolve(fr.result);}};fr.onerror=function(){if(!done){done=true;clearTimeout(timer);resolve(null);}};fr.readAsDataURL(b);
    }).catch(function(){if(!done){done=true;clearTimeout(timer);resolve(null);}});
  });
}

/* ===================== API 调用（含联网搜索 + pause_turn 续跑） ===================== */
function buildApiMsgs(){
  var apiMsgs=[],recent=conv.slice(-20);
  recent.forEach(function(m){
    if(m.rpt)return; // 报告不回传
    var role=m.from==="ai"?"assistant":"user",content;
    if(m.files&&m.files.length){
      var parts=[];
      m.files.forEach(function(f){
        if(f.type&&f.type.indexOf("image/")===0)parts.push({type:"image",source:{type:"base64",media_type:f.type,data:f.b64}});
        else if(f.type==="application/pdf")parts.push({type:"document",source:{type:"base64",media_type:"application/pdf",data:f.b64}});
      });
      parts.push({type:"text",text:m.text});content=parts;
    }else content=m.text;
    if(apiMsgs.length&&apiMsgs[apiMsgs.length-1].role===role&&typeof apiMsgs[apiMsgs.length-1].content==="string"&&typeof content==="string")apiMsgs[apiMsgs.length-1].content+="\n"+content;
    else apiMsgs.push({role:role,content:content});
  });
  if(apiMsgs.length&&apiMsgs[0].role==="assistant")apiMsgs.unshift({role:"user",content:"开始场景识别"});
  return apiMsgs;
}

function callOnce(apiMsgs,withTools){
  var body={model:MODEL,max_tokens:(phase>=5?14000:3000),system:getSys(),messages:apiMsgs};
  if(withTools)body.tools=[{type:"web_search_20260209",name:"web_search"},{type:"web_fetch_20260209",name:"web_fetch"}];
  return fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify(body)
  }).then(function(r){return r.json();});
}

function callAPI(){
  busy=true;busyLabel=useWeb?"联网检索 & 分析中…":"分析中…";if(phase>=5)busyLabel="正在生成定制化报告…";render();
  var apiMsgs=buildApiMsgs();
  var fullText="",rounds=0,triedNoTool=false,useTools=useWeb;

  function step(msgs){
    rounds++;
    return callOnce(msgs,useTools).then(function(data){
      if(data.error){
        // 工具不可用时自动降级重试一次
        var em=(data.error.message||"")+"";
        if(useTools&&!triedNoTool&&/tool|web_search|web_fetch|not.*support|unknown/i.test(em)){
          triedNoTool=true;useTools=false;busyLabel="分析中…";render();return step(apiMsgs);
        }
        throw new Error(em||JSON.stringify(data.error));
      }
      var text="";(data.content||[]).forEach(function(c){if(c.type==="text")text+=c.text;});
      fullText+=text;
      if(data.stop_reason==="pause_turn"&&rounds<6){
        return step(msgs.concat([{role:"assistant",content:data.content}]));
      }
      return fullText;
    });
  }

  step(apiMsgs).then(function(txt){
    if(!txt)txt="（未获取到回复，请重试或换一句话描述）";
    return processResp(txt);
  }).catch(function(err){
    busy=false;conv.push({from:"ai",text:"⚠️ 连接失败："+err.message+"\n\n请检查 API Key、网络，或在设置中关闭联网搜索后重试。"});render();
  });
}

function processResp(raw){
  var text=raw;
  if(text.indexOf("[NEXT]")>=0){text=text.replace(/\[NEXT\]/g,"").trim();phase=Math.min(phase+1,5);}
  var opts=null,optType="single";
  var mm=text.match(/\[MULTI\]([\s\S]*?)\[\/MULTI\]/);
  var om=text.match(/\[OPT\]([\s\S]*?)\[\/OPT\]/);
  if(mm){optType="multi";opts=mm[1].split("|").map(function(s){return s.trim();}).filter(Boolean);text=text.replace(/\[MULTI\][\s\S]*?\[\/MULTI\]/g,"").trim();}
  else if(om){opts=om[1].split("|").map(function(s){return s.trim();}).filter(Boolean);text=text.replace(/\[OPT\][\s\S]*?\[\/OPT\]/g,"").trim();}

  var rm=text.match(/\[RPT\]([\s\S]*?)\[\/RPT\]/);
  if(rm){
    var rraw=rm[1].trim();
    var ind=(text.match(/\[IND\]([\s\S]*?)\[\/IND\]/)||[])[1]||"";
    var comp=(text.match(/\[COMPANY\]([\s\S]*?)\[\/COMPANY\]/)||[])[1]||"贵司";
    var img=(text.match(/\[IMG\]([\s\S]*?)\[\/IMG\]/)||[])[1]||"";
    var intro=text.replace(/\[RPT\][\s\S]*?\[\/RPT\]/,"").replace(/\[IND\][\s\S]*?\[\/IND\]/,"").replace(/\[COMPANY\][\s\S]*?\[\/COMPANY\]/,"").replace(/\[IMG\][\s\S]*?\[\/IMG\]/,"").trim();
    return finalizeReport(rraw,ind.trim(),comp.trim(),img.trim(),intro);
  }

  multiSel={};
  busy=false;
  conv.push({from:"ai",text:text,opts:opts,optType:optType});
  render();
  return Promise.resolve();
}

function finalizeReport(rraw,ind,comp,img,intro){
  busyLabel="正在按「"+(ind||"行业")+"」生成定制封面…";render();
  var pal=pickPalette(ind);
  return fetchCover(img).then(function(cover){
    var d=new Date();
    reportData={
      raw:rraw,industry:ind||"综合",company:comp||"贵司",pal:pal,paletteName:pal.n,
      cover:cover,coverOk:!!cover,
      date:d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2),
      id:"AIS-"+Math.random().toString(36).substr(2,6).toUpperCase()
    };
    reportData.docHTML=buildDocHTML(reportData);
    busy=false;done=true;phase=5;
    if(intro)conv.push({from:"ai",text:intro});
    conv.push({from:"ai",rpt:true,reportData:reportData});
    render();
  });
}

/* ===================== 交互动作 ===================== */
function startChat(){
  var ki=document.getElementById("keyInput");apiKey=ki?ki.value.trim():"";
  if(!apiKey){alert("请先填写 Anthropic API Key");return;}
  MODEL=document.getElementById("modelSel").value;
  useWeb=document.getElementById("webChk").checked;
  if(document.getElementById("rememberChk").checked){try{localStorage.setItem("sr_ais_key",apiKey);localStorage.setItem("sr_ais_model",MODEL);localStorage.setItem("sr_ais_web",useWeb?"1":"0");localStorage.setItem("sr_ais_remember","1");}catch(e){}}
  else{try{localStorage.removeItem("sr_ais_key");localStorage.setItem("sr_ais_remember","0");}catch(e){}}
  conv.push({from:"usr",text:"你好，我想识别我们企业最有价值的AI应用场景，并排出优先级。"});
  render();callAPI();
}
function pickOpt(text){if(busy)return;multiSel={};conv.push({from:"usr",text:text});render();callAPI();}
function confirmMulti(){
  var sel=Object.keys(multiSel).filter(function(k){return multiSel[k];});
  if(!sel.length||busy)return;
  conv.push({from:"usr",text:"我选择："+sel.join("、")});multiSel={};render();callAPI();
}
function sendMsg(){
  if(busy)return;
  var ta=document.getElementById("ta"),txt=ta?ta.value.trim():"";
  if(!txt&&pendFiles.length===0)return;
  var display=txt||"请分析我上传的材料",msgFiles=pendFiles.length?pendFiles.slice():null;
  if(msgFiles)display+="\n[附件: "+msgFiles.map(function(f){return f.name;}).join(", ")+"]";
  multiSel={};conv.push({from:"usr",text:display,files:msgFiles});pendFiles=[];render();callAPI();
}
function exportPDF(){
  var node=document.getElementById("pdfDoc");if(!node)return;
  if(!window.html2pdf){alert("PDF组件未加载，将改用打印导出。");window.print();return;}
  var btn=document.getElementById("exportPdf");if(btn){btn.textContent="⏳ 正在导出…";btn.disabled=true;}
  html2pdf().set({
    margin:0,
    filename:"企业高价值AI场景识别与排序报告_"+(reportData?reportData.company:"")+".pdf",
    image:{type:"jpeg",quality:0.98},
    html2canvas:{scale:2,useCORS:true,backgroundColor:"#ffffff",windowWidth:794},
    jsPDF:{unit:"px",format:[794,1123],orientation:"portrait",hotfixes:["px_scaling"]},
    pagebreak:{mode:["css","legacy"],avoid:["tr","table","h2","h3",".callout",".rfoot"]}
  }).from(node).save().then(function(){if(btn){btn.textContent="⬇ 导出高清PDF";btn.disabled=false;}}).catch(function(){if(btn){btn.textContent="⬇ 导出高清PDF";btn.disabled=false;}window.print();});
}

/* ===================== 事件委托 ===================== */
document.addEventListener("click",function(e){
  var t=e.target;
  if(t.closest("#startBtn")){startChat();return;}
  if(t.closest("#upBtn")){document.getElementById("fileIn").click();return;}
  if(t.closest("#sendBtn")){sendMsg();return;}
  if(t.closest("#confirmMulti")){confirmMulti();return;}
  if(t.closest("#exportPdf")){exportPDF();return;}
  if(t.closest("#printRpt")){window.print();return;}
  if(t.closest("#restart")){location.reload();return;}
  var rm=t.closest('[data-act="rmfile"]');if(rm){pendFiles.splice(+rm.getAttribute("data-idx"),1);render();return;}
  var op=t.closest('[data-act="opt"]');if(op){var last=conv[conv.length-1];if(last&&last.opts)pickOpt(last.opts[+op.getAttribute("data-idx")]);return;}
  var mu=t.closest('[data-act="multi"]');if(mu){var last2=conv[conv.length-1];if(last2&&last2.opts){var o=last2.opts[+mu.getAttribute("data-idx")];multiSel[o]=!multiSel[o];render();}return;}
});
document.addEventListener("keydown",function(e){
  if(e.target&&e.target.id==="ta"&&e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMsg();}
});
document.getElementById("fileIn").addEventListener("change",function(e){
  Array.from(e.target.files).forEach(function(file){
    if(pendFiles.length>=3)return;
    var reader=new FileReader();
    reader.onload=function(ev){pendFiles.push({name:file.name,type:file.type,b64:ev.target.result.split(",")[1]});render();};
    reader.readAsDataURL(file);
  });
  e.target.value="";
});

/* 预填记忆 */
(function(){try{
  if(localStorage.getItem("sr_ais_remember")==="1"){
    var k=localStorage.getItem("sr_ais_key")||"";var md=localStorage.getItem("sr_ais_model")||"claude-opus-4-8";var w=localStorage.getItem("sr_ais_web");
    render();
    var ki=document.getElementById("keyInput");if(ki)ki.value=k;
    var ms=document.getElementById("modelSel");if(ms)ms.value=md;
    var wc=document.getElementById("webChk");if(wc&&w!=null)wc.checked=(w==="1");
    return;
  }
}catch(e){}render();})();
</script>
