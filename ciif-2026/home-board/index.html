<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>薯片AI智能体 · 工博会首页</title>
<style>
  /* 首页展板：定稿图做底，九张卡片、光带、AI 核心用 HTML/SVG 叠在图上做动效。
     舞台固定 2000×1136（与图同尺寸），按视口等比缩放，两侧留边，绝不拉伸。 */
  :root{
    --ink:#2B1F55; --ink2:#5B5380;
    --c-lead:#FF6A3D; --c-scene:#8B5CF6; --c-roi:#F2B233;
    --c-s1:#F0508A; --c-s2:#1FB98A; --c-s3:#E5484D; --c-s4:#C247D6; --c-s5:#19B3C9; --c-s6:#8BC34A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#EDE9F7;overflow:hidden;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:min(100vw,calc(100vh*2000/1136));aspect-ratio:2000/1136;overflow:hidden;container-type:inline-size}
  #stage>img.bg{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* —— 环境光：两团缓慢漂移的柔光 + 标题扫光 —— */
  .glow{position:absolute;border-radius:50%;filter:blur(4.500cqw);opacity:.55;mix-blend-mode:screen;pointer-events:none}
  .glow.a{width:35.000cqw;height:25.000cqw;left:-6.000cqw;top:-8.000cqw;background:radial-gradient(circle,#FFD9C2,transparent 60%);animation:driftA 14s ease-in-out infinite alternate}
  .glow.b{width:40.000cqw;height:30.000cqw;right:-10.000cqw;bottom:-12.000cqw;background:radial-gradient(circle,#D9CCFF,transparent 60%);animation:driftB 18s ease-in-out infinite alternate}
  @keyframes driftA{to{transform:translate(6.000cqw,3.000cqw)}}
  @keyframes driftB{to{transform:translate(-7.000cqw,-4.000cqw)}}
  .sweep{position:absolute;left:2.000cqw;top:5.000cqw;width:65.000cqw;height:5.500cqw;overflow:hidden;pointer-events:none;mix-blend-mode:screen}
  .sweep::after{content:"";position:absolute;top:-2.000cqw;bottom:-2.000cqw;left:-30%;width:26%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.75) 50%,transparent);transform:skewX(-18deg);animation:sweep 7s ease-in-out infinite}
  @keyframes sweep{0%,55%{left:-30%}85%,100%{left:130%}}

  /* —— 光带与 AI 核心 —— */
  svg.ribbons{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .rb{fill:none;stroke-width:5;stroke-linecap:round;opacity:.9;stroke-dasharray:26 34;animation:flow 1.6s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-60}}
  .rb.glowline{stroke-width:14;opacity:.28;filter:blur(0.300cqw);stroke-dasharray:none;animation:none}
  .dot{filter:drop-shadow(0 0 0.400cqw currentColor)}
  .core{position:absolute;left:37%;top:55.90%;width:0;height:0;pointer-events:none}
  .core i{position:absolute;left:-3.500cqw;top:-3.500cqw;width:7.000cqw;height:7.000cqw;border-radius:50%;border:0.100cqw solid rgba(255,140,60,.9);box-shadow:0 0 1.500cqw rgba(255,140,60,.6);animation:pulse 2.4s ease-out infinite}
  .core i:nth-child(2){animation-delay:.8s}.core i:nth-child(3){animation-delay:1.6s}
  @keyframes pulse{0%{transform:scale(.35);opacity:.9}100%{transform:scale(1.6);opacity:0}}

  /* —— 热区：完全透明，底图原样显示；悬停或轮巡时只描一圈同色光晕 —— */
  .hot{position:absolute;background:transparent;border:0;cursor:pointer;border-radius:1.2cqw;padding:0;
       box-shadow:0 0 0 0 transparent;transition:box-shadow .35s}
  .hot:hover,.hot.lit{box-shadow:0 0 0 .18cqw color-mix(in srgb,var(--c) 85%,#fff),0 0 1.6cqw .2cqw color-mix(in srgb,var(--c) 45%,transparent)}
  .hot:active{box-shadow:0 0 0 .25cqw var(--c)}
  /* 顶部与底部热区（透明，只接交互） */
  .hot{position:absolute;background:transparent;border:0;cursor:pointer;border-radius:1.500cqw}
  .hot:hover{box-shadow:0 0 0 0.150cqw rgba(255,106,61,.5)}
  select.hot{appearance:none;color:transparent;font-size:1.200cqw}
  select.hot option{color:#222;font-size:0.800cqw}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
(function(){
  var stage=document.getElementById('stage');

  /* 待机轮巡：每 2.8 秒点亮一张卡；有鼠标停留时暂停 */
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cards=[].slice.call(document.querySelectorAll('button.hot')), idx=-1, paused=false;
  function next(){ if(paused||reduce)return; cards.forEach(function(c){c.classList.remove('lit');}); idx=(idx+1)%cards.length; cards[idx].classList.add('lit'); }
  setTimeout(function(){ next(); setInterval(next,2800); },1600);
  stage.addEventListener('mouseenter',function(){paused=true;cards.forEach(function(c){c.classList.remove('lit');});});
  stage.addEventListener('mouseleave',function(){paused=false;});

  /* 点卡片 → 路由（接入外壳后由 shell 接管） */
  cards.forEach(function(c){ c.addEventListener('click',function(){ location.hash='#/'+c.dataset.route; if(window.DGG_GO)window.DGG_GO(c.dataset.route); }); });
})();
</script>
