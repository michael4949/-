<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>球形燃料生产工艺 · AI Copilot · 202厂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.0/marked.min.js"></script>
<style>
:root {
  --bg-base: #F8F6F1;
  --bg-paper: #FFFFFF;
  --bg-paper-warm: #FCFAF5;
  --bg-subtle: #F0EDE3;
  --bg-data: #FAFBFC;
  --navy: #1A2B4A;
  --navy-deep: #0E1A30;
  --navy-light: #2C4270;
  --industrial-red: #B91C1C;
  --industrial-red-soft: #DC2626;
  --industrial-red-bg: #FEF2F2;
  --industrial-green: #15803D;
  --industrial-green-soft: #22C55E;
  --industrial-green-bg: #F0FDF4;
  --warning-amber: #B45309;
  --warning-amber-soft: #D97706;
  --warning-amber-bg: #FFFBEB;
  --gold: #B08D3C;
  --gold-soft: #D4AF6A;
  --gold-bg: #F8F0DC;
  --data-blue: #1E40AF;
  --data-blue-soft: #3B82F6;
  --data-blue-bg: #EFF6FF;
  --ink: #1E293B;
  --ink-soft: #475569;
  --muted: #94A3B8;
  --border: #DDD5C2;
  --border-light: #EDE6D4;
  --grid-line: #E8E4D8;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; overflow: hidden; }

body {
  font-family: "Noto Sans SC", "PingFang SC", -apple-system, sans-serif;
  background: var(--bg-base);
  color: var(--ink);
  font-size: 13px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

.serif { font-family: "Noto Serif SC", serif; }
.mono { font-family: "IBM Plex Mono", "SF Mono", monospace; }
.display { font-family: "Playfair Display", "Noto Serif SC", serif; }

/* ============ APP SHELL ============ */
#app { display: flex; height: 100vh; flex-direction: column; }

/* ============ TOP BAR ============ */
.topbar {
  height: 60px;
  background: var(--navy);
  color: white;
  display: flex; align-items: center;
  padding: 0 20px;
  border-bottom: 3px solid var(--industrial-red);
  position: relative;
  flex-shrink: 0;
}
.topbar::before {
  content: "";
  position: absolute;
  bottom: -3px; left: 0; width: 100px; height: 3px;
  background: var(--gold);
}

.brand {
  display: flex; align-items: center; gap: 12px;
  padding-right: 16px;
  border-right: 1px solid rgba(255,255,255,0.15);
  margin-right: 16px;
}
.brand-mark {
  width: 38px; height: 38px;
  background: var(--industrial-red);
  display: flex; align-items: center; justify-content: center;
  font-family: "Noto Serif SC", serif;
  font-weight: 900;
  font-size: 16px;
  color: white;
  position: relative;
}
.brand-mark::after {
  content: "";
  position: absolute;
  bottom: -2px; right: -2px;
  width: 10px; height: 10px;
  background: var(--gold);
}
.brand-text .t1 {
  font-family: "Noto Serif SC", serif;
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 0.8px;
}
.brand-text .t2 {
  font-size: 9px;
  opacity: 0.65;
  letter-spacing: 1.5px;
  margin-top: 1px;
  font-family: "IBM Plex Mono", monospace;
}

.workspace-title {
  display: flex; align-items: center; gap: 10px;
  font-size: 13px;
}
.workspace-title-cn {
  font-family: "Noto Serif SC", serif;
  font-weight: 500;
  letter-spacing: 1px;
}
.workspace-title-en {
  font-family: "IBM Plex Mono", monospace;
  font-size: 10px;
  opacity: 0.55;
  letter-spacing: 1.5px;
}

.topbar-spacer { flex: 1; }

.shift-info {
  display: flex; gap: 16px;
  font-size: 11px;
  color: rgba(255,255,255,0.7);
  font-family: "IBM Plex Mono", monospace;
  letter-spacing: 0.5px;
  margin-right: 16px;
}
.shift-info .si-item .label { opacity: 0.5; margin-right: 4px; }
.shift-info .si-item .value { color: white; font-weight: 500; }

.live-indicator {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 12px;
  background: rgba(21,128,61,0.2);
  border: 1px solid var(--industrial-green-soft);
  font-family: "IBM Plex Mono", monospace;
  font-size: 10px;
  letter-spacing: 1.5px;
  color: var(--industrial-green-soft);
  margin-right: 12px;
}
.live-dot {
  width: 6px; height: 6px;
  background: var(--industrial-green-soft);
  border-radius: 50%;
  animation: live-pulse 1.5s infinite;
}
@keyframes live-pulse {
  0%, 100% { opacity: 1; box-shadow: 0 0 0 0 var(--industrial-green-soft); }
  50% { opacity: 0.6; box-shadow: 0 0 0 4px transparent; }
}

.user-chip {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 12px 4px 4px;
  background: rgba(255,255,255,0.08);
  border-radius: 20px;
}
.user-avatar {
  width: 26px; height: 26px;
  background: var(--gold);
  color: var(--navy);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700;
  font-size: 10px;
  font-family: "Noto Serif SC", serif;
}
.user-info .uname { font-size: 11px; font-weight: 500; }
.user-info .udept { font-size: 9px; opacity: 0.6; font-family: "IBM Plex Mono", monospace; letter-spacing: 0.5px; }

/* ============ MAIN LAYOUT ============ */
.main {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 420px;
  overflow: hidden;
}

/* ============ LEFT: PRODUCTION CONSOLE ============ */
.console {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg-base);
  border-right: 1px solid var(--border);
}

.stage-tabs {
  display: flex;
  background: var(--bg-paper);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.stage-tab {
  flex: 1;
  padding: 14px 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 14px;
  border: none;
  background: transparent;
  border-right: 1px solid var(--border-light);
  text-align: left;
  font-family: inherit;
  transition: all 0.2s;
  position: relative;
}
.stage-tab:last-child { border-right: none; }
.stage-tab:hover { background: var(--bg-paper-warm); }
.stage-tab.active {
  background: var(--navy);
  color: white;
}
.stage-tab.active::after {
  content: "";
  position: absolute;
  bottom: -1px; left: 0; right: 0;
  height: 3px;
  background: var(--industrial-red);
}
.stage-num {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  font-family: "Playfair Display", serif;
  font-weight: 700;
  font-size: 16px;
  background: var(--bg-subtle);
  color: var(--navy);
  flex-shrink: 0;
  transition: all 0.2s;
}
.stage-tab.active .stage-num {
  background: var(--gold);
  color: var(--navy);
}
.stage-info { flex: 1; min-width: 0; }
.stage-name {
  font-family: "Noto Serif SC", serif;
  font-weight: 600;
  font-size: 14px;
  letter-spacing: 0.5px;
  margin-bottom: 1px;
}
.stage-en {
  font-size: 9px;
  font-family: "IBM Plex Mono", monospace;
  letter-spacing: 1.2px;
  opacity: 0.6;
}
.stage-tab.active .stage-en { opacity: 0.7; }

.stage-status {
  display: flex; align-items: center; gap: 6px;
  font-size: 10px;
  font-family: "IBM Plex Mono", monospace;
  letter-spacing: 1px;
  color: var(--muted);
}
.stage-tab.active .stage-status { color: rgba(255,255,255,0.8); }
.status-led {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--industrial-green);
}
.status-led.warning { background: var(--warning-amber); }
.status-led.alarm { background: var(--industrial-red); animation: alarm-blink 0.8s infinite; }
@keyframes alarm-blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

.console-body {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* Section header */
.section-head {
  display: flex; align-items: center; justify-content: space-between;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border-light);
  margin-bottom: 4px;
}
.section-title {
  font-family: "Noto Serif SC", serif;
  font-weight: 600;
  font-size: 13px;
  color: var(--navy);
  letter-spacing: 1px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.section-title::before {
  content: "";
  width: 3px; height: 14px;
  background: var(--industrial-red);
}
.section-meta {
  font-size: 10px;
  color: var(--muted);
  font-family: "IBM Plex Mono", monospace;
  letter-spacing: 0.5px;
}

/* Batch traceability bar */
.batch-bar {
  background: var(--bg-paper);
  border: 1px solid var(--border-light);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 18px;
}
.batch-id {
  display: flex;
  flex-direction: column;
}
.batch-id-label {
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 1.5px;
  margin-bottom: 4px;
  font-family: "IBM Plex Mono", monospace;
}
.batch-id-value {
  font-family: "IBM Plex Mono", monospace;
  font-size: 16px;
  font-weight: 600;
  color: var(--navy);
  letter-spacing: 0.5px;
}
.batch-progress-bar {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
}
.batch-step {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  position: relative;
  padding-top: 4px;
}
.batch-step::after {
  content: "";
  position: absolute;
  top: 12px; right: -4px;
  width: 8px;
  height: 1px;
  background: var(--border);
}
.batch-step:last-child::after { display: none; }
.batch-step-dot {
  width: 12px; height: 12px;
  border-radius: 50%;
  border: 2px solid var(--border);
  background: white;
}
.batch-step.completed .batch-step-dot {
  background: var(--industrial-green);
  border-color: var(--industrial-green);
}
.batch-step.active .batch-step-dot {
  background: var(--industrial-red);
  border-color: var(--industrial-red);
  box-shadow: 0 0 0 3px rgba(185,28,28,0.2);
  animation: step-pulse 1.5s infinite;
}
@keyframes step-pulse {
  0%, 100% { box-shadow: 0 0 0 3px rgba(185,28,28,0.2); }
  50% { box-shadow: 0 0 0 6px rgba(185,28,28,0.1); }
}
.batch-step-name {
  font-size: 9px;
  color: var(--muted);
  letter-spacing: 0.5px;
}
.batch-step.completed .batch-step-name,
.batch-step.active .batch-step-name {
  color: var(--navy);
  font-weight: 500;
}
.batch-step.active .batch-step-name { color: var(--industrial-red); font-weight: 600; }

.batch-stats {
  display: flex;
  gap: 16px;
  padding-left: 16px;
  border-left: 1px solid var(--border-light);
}
.batch-stat .label {
  font-size: 9px;
  color: var(--muted);
  letter-spacing: 1px;
  margin-bottom: 2px;
  font-family: "IBM Plex Mono", monospace;
}
.batch-stat .value {
  font-family: "IBM Plex Mono", monospace;
  font-size: 13px;
  font-weight: 600;
  color: var(--navy);
}

/* Parameter cards grid */
.params-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 10px;
}
.param-card {
  background: var(--bg-paper);
  border: 1px solid var(--border-light);
  padding: 12px 14px;
  cursor: pointer;
  transition: all 0.15s;
  position: relative;
  overflow: hidden;
}
.param-card::before {
  content: "";
  position: absolute;
  top: 0; left: 0; bottom: 0;
  width: 3px;
  background: var(--industrial-green);
  transition: background 0.2s;
}
.param-card.warning::before { background: var(--warning-amber); }
.param-card.alarm::before { background: var(--industrial-red); }
.param-card:hover {
  background: var(--bg-paper-warm);
  border-color: var(--navy);
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}
.param-card-head {
  display: flex; justify-content: space-between; align-items: flex-start;
  margin-bottom: 10px;
}
.param-name {
  font-size: 11px;
  font-weight: 500;
  color: var(--ink-soft);
  letter-spacing: 0.3px;
  line-height: 1.4;
}
.param-status {
  font-family: "IBM Plex Mono", monospace;
  font-size: 8px;
  letter-spacing: 1px;
  padding: 2px 5px;
  background: var(--industrial-green-bg);
  color: var(--industrial-green);
  font-weight: 600;
}
.param-card.warning .param-status {
  background: var(--warning-amber-bg);
  color: var(--warning-amber);
}
.param-card.alarm .param-status {
  background: var(--industrial-red-bg);
  color: var(--industrial-red);
}
.param-value {
  font-family: "IBM Plex Mono", monospace;
  font-size: 22px;
  font-weight: 600;
  color: var(--navy);
  line-height: 1;
  display: flex;
  align-items: baseline;
  gap: 4px;
  margin-bottom: 6px;
}
.param-value-num.changed { animation: value-flash 0.4s; }
@keyframes value-flash {
  0% { color: var(--data-blue-soft); }
  100% { color: var(--navy); }
}
.param-unit {
  font-size: 11px;
  font-weight: 400;
  color: var(--muted);
  font-family: "IBM Plex Mono", monospace;
}
.param-meta {
  display: flex;
  justify-content: space-between;
  font-size: 9px;
  color: var(--muted);
  font-family: "IBM Plex Mono", monospace;
  letter-spacing: 0.3px;
}
.param-meta .target { color: var(--ink-soft); }
.param-trend {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  font-family: "IBM Plex Mono", monospace;
}
.trend-up { color: var(--industrial-red); }
.trend-down { color: var(--data-blue); }
.trend-flat { color: var(--muted); }

/* SPC Chart */
.spc-panel {
  background: var(--bg-paper);
  border: 1px solid var(--border-light);
  padding: 14px 16px 12px;
  position: relative;
}
.spc-head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 12px;
}
.spc-title {
  font-family: "Noto Serif SC", serif;
  font-size: 13px;
  font-weight: 600;
  color: var(--navy);
}
.spc-meta {
  display: flex; gap: 14px;
  font-size: 10px;
  font-family: "IBM Plex Mono", monospace;
  color: var(--muted);
  letter-spacing: 0.5px;
}
.spc-meta .m-item .lbl { opacity: 0.6; margin-right: 3px; }
.spc-meta .m-item .val { color: var(--ink); font-weight: 500; }
.spc-meta .m-item .val.good { color: var(--industrial-green); }
.spc-meta .m-item .val.warn { color: var(--warning-amber); }
.spc-meta .m-item .val.bad { color: var(--industrial-red); }

.spc-chart {
  width: 100%;
  height: 180px;
  position: relative;
}
.spc-chart svg {
  width: 100%;
  height: 100%;
  cursor: crosshair;
}
.spc-axis-line { stroke: var(--ink-soft); stroke-width: 1; }
.spc-grid-line { stroke: var(--grid-line); stroke-width: 1; stroke-dasharray: 2,3; }
.spc-cl-line { stroke: var(--ink-soft); stroke-width: 1; stroke-dasharray: 4,3; opacity: 0.6; }
.spc-ucl-line { stroke: var(--industrial-red); stroke-width: 1; stroke-dasharray: 5,3; opacity: 0.7; }
.spc-lcl-line { stroke: var(--industrial-red); stroke-width: 1; stroke-dasharray: 5,3; opacity: 0.7; }
.spc-data-line { stroke: var(--data-blue); stroke-width: 1.5; fill: none; }
.spc-data-point {
  fill: var(--data-blue);
  stroke: white;
  stroke-width: 1.5;
  cursor: pointer;
}
.spc-data-point.warning { fill: var(--warning-amber); }
.spc-data-point.alarm { fill: var(--industrial-red); }
.spc-data-point:hover { r: 5; }
.spc-axis-label {
  font-family: "IBM Plex Mono", monospace;
  font-size: 9px;
  fill: var(--muted);
}
.spc-cl-label, .spc-ucl-label, .spc-lcl-label {
  font-family: "IBM Plex Mono", monospace;
  font-size: 8px;
  font-weight: 600;
}
.spc-cl-label { fill: var(--ink-soft); }
.spc-ucl-label, .spc-lcl-label { fill: var(--industrial-red); }

/* Anomaly stream */
.anomaly-stream {
  background: var(--bg-paper);
  border: 1px solid var(--border-light);
  display: flex;
  flex-direction: column;
  max-height: 200px;
  overflow: hidden;
}
.stream-head {
  padding: 10px 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--navy);
  color: white;
  flex-shrink: 0;
}
.stream-head-title {
  font-family: "Noto Serif SC", serif;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 1px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.stream-head-counter {
  font-family: "IBM Plex Mono", monospace;
  font-size: 10px;
  background: var(--industrial-red);
  padding: 2px 8px;
  letter-spacing: 0.5px;
}

.stream-body {
  flex: 1;
  overflow-y: auto;
  padding: 4px;
}
.stream-item {
  padding: 8px 10px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  border-bottom: 1px dashed var(--border-light);
  cursor: pointer;
  transition: background 0.15s;
}
.stream-item:hover { background: var(--bg-paper-warm); }
.stream-item.alarm { background: var(--industrial-red-bg); }
.stream-item.warning { background: var(--warning-amber-bg); }
.stream-item:last-child { border-bottom: none; }

.stream-time {
  font-family: "IBM Plex Mono", monospace;
  font-size: 10px;
  color: var(--muted);
  flex-shrink: 0;
  min-width: 56px;
  letter-spacing: 0.5px;
}
.stream-icon {
  font-family: "IBM Plex Mono", monospace;
  font-size: 12px;
  font-weight: 700;
  flex-shrink: 0;
}
.stream-icon.info { color: var(--data-blue); }
.stream-icon.warning { color: var(--warning-amber); }
.stream-icon.alarm { color: var(--industrial-red); }
.stream-icon.success { color: var(--industrial-green); }
.stream-text {
  flex: 1;
  font-size: 11px;
  line-height: 1.5;
}
.stream-text strong {
  font-family: "IBM Plex Mono", monospace;
  color: var(--navy);
  font-weight: 600;
}

/* Equipment status bar */
.equip-bar {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 8px;
}
.equip-card {
  background: var(--bg-paper);
  border: 1px solid var(--border-light);
  padding: 10px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 11px;
  cursor: pointer;
  transition: all 0.15s;
}
.equip-card:hover { border-color: var(--navy); }
.equip-led {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--industrial-green);
  box-shadow: 0 0 6px var(--industrial-green-soft);
  flex-shrink: 0;
}
.equip-led.warning {
  background: var(--warning-amber);
  box-shadow: 0 0 6px var(--warning-amber-soft);
}
.equip-led.alarm {
  background: var(--industrial-red);
  box-shadow: 0 0 6px var(--industrial-red-soft);
  animation: alarm-blink 1s infinite;
}
.equip-info { flex: 1; min-width: 0; }
.equip-name {
  font-family: "IBM Plex Mono", monospace;
  font-size: 11px;
  color: var(--navy);
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: 0.3px;
}
.equip-state {
  font-size: 9px;
  color: var(--muted);
  font-family: "IBM Plex Mono", monospace;
  letter-spacing: 0.5px;
}

/* ============ RIGHT: AI COPILOT ============ */
.copilot {
  display: flex;
  flex-direction: column;
  background: var(--bg-paper);
  overflow: hidden;
}

.copilot-head {
  padding: 14px 18px;
  background: var(--navy);
  color: white;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 3px solid var(--gold);
  flex-shrink: 0;
}
.copilot-icon {
  width: 38px; height: 38px;
  background: var(--industrial-red);
  display: flex; align-items: center; justify-content: center;
  font-family: "Noto Serif SC", serif;
  font-weight: 700;
  font-size: 16px;
  color: white;
  position: relative;
  flex-shrink: 0;
}
.copilot-icon::after {
  content: "";
  position: absolute;

// Initialize parameter history
function initParamHistory() {
  for (const stage of Object.keys(STAGE_CONFIG)) {
    for (const p of STAGE_CONFIG[stage].params) {
      const key = stage + '_' + p.key;
      STATE.paramHistory[key] = [];
      // Seed 30 historical points around target
      for (let i = 0; i < 30; i++) {
        STATE.paramHistory[key].push({
          v: gaussianRandom(p.target, p.sigma),
          t: Date.now() - (30 - i) * 60000,
        });
      }
    }
  }
}

// Gaussian random
function gaussianRandom(mean, sigma) {
  const u = 1 - Math.random();
  const v = Math.random();
  const z = Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
  return mean + z * sigma;
}

// ====================================================================
//                    SIMULATION ENGINE
// ====================================================================
// Each parameter independently evolves with normal noise + occasional drift events
function simulateTick() {
  const allStages = Object.keys(STAGE_CONFIG);
  for (const stage of allStages) {
    const cfg = STAGE_CONFIG[stage];
    for (const p of cfg.params) {
      const key = stage + '_' + p.key;
      const hist = STATE.paramHistory[key];

      // Inject occasional drift events (low probability)
      if (Math.random() < 0.005) {
        p.drift = (Math.random() - 0.5) * p.sigma * 4;  // up to ±2σ drift
      }
      // Drift decays
      p.drift *= 0.95;

      // Generate new value
      const newValue = gaussianRandom(p.target + p.drift, p.sigma);
      hist.push({ v: newValue, t: Date.now() });

      // Trim history to last 60 points
      if (hist.length > 60) hist.shift();
    }
  }

  detectAnomalies();
  if (STATE.currentStage) renderConsoleBody();
}

// Anomaly detection (Western Electric rules + simple range)
function detectAnomalies() {
  const newAnomalies = [];
  for (const stage of Object.keys(STAGE_CONFIG)) {
    const cfg = STAGE_CONFIG[stage];
    for (const p of cfg.params) {
      const key = stage + '_' + p.key;
      const hist = STATE.paramHistory[key];
      if (hist.length < 8) continue;
      const recent = hist.slice(-8).map(h => h.v);
      const last = recent[recent.length - 1];

      // Out of control limit (3σ basically)
      if (last > p.ucl || last < p.lcl) {
        const sev = Math.abs(last - p.target) > 3 * p.sigma ? 'alarm' : 'warning';
        newAnomalies.push({
          stage, paramKey: p.key, paramName: p.name,
          value: last, target: p.target, ucl: p.ucl, lcl: p.lcl, unit: p.unit,
          severity: sev,
          rule: '超出控制限',
          time: Date.now(),
          id: `${stage}_${p.key}_${Date.now()}`,
        });
      }
      // Western Electric Rule 2: 8 consecutive points on the same side
      else if (recent.length >= 8) {
        const aboveCount = recent.filter(v => v > p.target).length;
        const belowCount = recent.filter(v => v < p.target).length;
        if (aboveCount >= 8 || belowCount >= 8) {
          newAnomalies.push({
            stage, paramKey: p.key, paramName: p.name,
            value: last, target: p.target, ucl: p.ucl, lcl: p.lcl, unit: p.unit,
            severity: 'warning',
            rule: '连续8点同侧偏移',
            time: Date.now(),
            id: `${stage}_${p.key}_${Date.now()}`,
          });
        }
      }
    }
  }

  // Add new anomalies, dedup
  const existingKeys = new Set(STATE.anomalies.map(a => a.stage + '_' + a.paramKey + '_' + a.rule));
  for (const a of newAnomalies) {
    const key = a.stage + '_' + a.paramKey + '_' + a.rule;
    if (!existingKeys.has(key)) {
      STATE.anomalies.unshift(a);
      STATE.anomalyCount++;
      // Auto-trigger AI alert for alarm-severity anomalies (rate-limited)
      if (a.severity === 'alarm' && Math.random() < 0.5) {
        triggerAIAnomalyAlert(a);
      }
    }
  }
  // Trim
  if (STATE.anomalies.length > 50) {
    STATE.anomalies = STATE.anomalies.slice(0, 50);
  }
}

    const prev = hist[hist.length - 2] || last;
    const value = last.v;

    let status = 'normal';
    let statusText = 'NORMAL';
    if (value > p.ucl || value < p.lcl) {
      status = 'alarm'; statusText = 'OOC';
    } else if (Math.abs(value - p.target) > 2 * p.sigma) {
      status = 'warning'; statusText = '2σ';

    let trend = 'flat', arrow = '→';
    if (value > prev.v + 0.3 * p.sigma) { trend = 'up'; arrow = '↑'; }

    const recentVals = hist.slice(-30).map(h => h.v);

    const std = Math.sqrt(recentVals.reduce((a,b)=>a+(b-mean)**2,0) / recentVals.length);
    const cpk = std > 0 ? Math.min((p.ucl - mean) / (3*std), (mean - p.lcl) / (3*std)) : 999;

// ====================================================================
//                    SPC CHART RENDERING (SVG)
// ====================================================================
function renderSPCChart(param, hist, stage) {
  const w = 800, h = 180;
  const padding = { top: 16, right: 60, bottom: 22, left: 50 };
  const chartW = w - padding.left - padding.right;
  const chartH = h - padding.top - padding.bottom;

  if (!hist || hist.length === 0) return '<div class="spc-chart"></div>';

  const recent = hist.slice(-30);
  const cl = param.target;
  const ucl = param.ucl;
  const lcl = param.lcl;

  const yMin = Math.min(lcl, ...recent.map(h => h.v)) - param.sigma;
  const yMax = Math.max(ucl, ...recent.map(h => h.v)) + param.sigma;

  const xScale = (i) => padding.left + (i / (recent.length - 1)) * chartW;
  const yScale = (v) => padding.top + (1 - (v - yMin) / (yMax - yMin)) * chartH;

  // Compute mean & cpk
  const mean = recent.reduce((a, b) => a + b.v, 0) / recent.length;
  const std = Math.sqrt(recent.reduce((a, b) => a + (b.v - mean) ** 2, 0) / recent.length);
  const cpk = std > 0 ? Math.min((ucl - mean) / (3 * std), (mean - lcl) / (3 * std)) : 999;
  const cpkStatus = cpk >= 1.33 ? 'good' : cpk >= 1.0 ? 'warn' : 'bad';

  // Build path
  const linePath = recent.map((p, i) => {
    return (i === 0 ? 'M' : 'L') + xScale(i) + ',' + yScale(p.v);
  }).join(' ');

  // Build points
  const points = recent.map((p, i) => {
    let cls = '';
    if (p.v > ucl || p.v < lcl) cls = 'alarm';
    else if (Math.abs(p.v - cl) > 2 * param.sigma) cls = 'warning';
    return `<circle class="spc-data-point ${cls}" cx="${xScale(i)}" cy="${yScale(p.v)}" r="3" data-idx="${i}" data-value="${p.v.toFixed(3)}" data-time="${p.t}"/>`;
  }).join('');

  // X axis ticks (every 5 points)
  const xTicks = [];
  for (let i = 0; i < recent.length; i += 5) {
    const t = new Date(recent[i].t);
    const label = String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0');
    xTicks.push(`<text class="spc-axis-label" x="${xScale(i)}" y="${h - padding.bottom + 14}" text-anchor="middle">${label}</text>`);
  }

  // Y axis ticks (5 levels)
  const yTicks = [];
  for (let i = 0; i <= 4; i++) {
    const v = yMin + (yMax - yMin) * (i / 4);
    yTicks.push(`<text class="spc-axis-label" x="${padding.left - 6}" y="${yScale(v) + 3}" text-anchor="end">${v.toFixed(2)}</text>`);
    yTicks.push(`<line class="spc-grid-line" x1="${padding.left}" y1="${yScale(v)}" x2="${padding.left + chartW}" y2="${yScale(v)}"/>`);
  }

  return `
    <div class="spc-head">
      <div class="spc-title">${param.name}（${param.unit}）· n=${recent.length}</div>
      <div class="spc-meta">
        <span class="m-item"><span class="lbl">CL</span><span class="val">${cl.toFixed(3)}</span></span>
        <span class="m-item"><span class="lbl">σ</span><span class="val">${std.toFixed(3)}</span></span>
        <span class="m-item"><span class="lbl">MEAN</span><span class="val">${mean.toFixed(3)}</span></span>
        <span class="m-item"><span class="lbl">CPK</span><span class="val ${cpkStatus}">${cpk.toFixed(2)}</span></span>
      </div>
    </div>
    <div class="spc-chart">
      <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">
        ${yTicks.join('')}
        ${xTicks.join('')}
        <line class="spc-axis-line" x1="${padding.left}" y1="${padding.top}" x2="${padding.left}" y2="${h - padding.bottom}"/>
        <line class="spc-axis-line" x1="${padding.left}" y1="${h - padding.bottom}" x2="${padding.left + chartW}" y2="${h - padding.bottom}"/>

        <line class="spc-ucl-line" x1="${padding.left}" y1="${yScale(ucl)}" x2="${padding.left + chartW}" y2="${yScale(ucl)}"/>
        <text class="spc-ucl-label" x="${padding.left + chartW + 6}" y="${yScale(ucl) + 3}">UCL ${ucl.toFixed(2)}</text>

        <line class="spc-cl-line" x1="${padding.left}" y1="${yScale(cl)}" x2="${padding.left + chartW}" y2="${yScale(cl)}"/>
        <text class="spc-cl-label" x="${padding.left + chartW + 6}" y="${yScale(cl) + 3}">CL ${cl.toFixed(2)}</text>

        <line class="spc-lcl-line" x1="${padding.left}" y1="${yScale(lcl)}" x2="${padding.left + chartW}" y2="${yScale(lcl)}"/>
        <text class="spc-lcl-label" x="${padding.left + chartW + 6}" y="${yScale(lcl) + 3}">LCL ${lcl.toFixed(2)}</text>

        <path class="spc-data-line" d="${linePath}"/>
        ${points}
      </svg>
    </div>
  `;
}

// ====================================================================
function formatValue(v, p) {
  if (typeof v !== 'number') return '-';
  if (Math.abs(v) >= 100) return v.toFixed(1);
  if (Math.abs(v) >= 10) return v.toFixed(2);
  if (Math.abs(v) >= 1) return v.toFixed(3);
  return v.toFixed(3);
}

function toast(msg, type = 'info') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (type !== 'info' ? ' ' + type : '');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove('show'), 3500);

//                    CLAUDE API
// ====================================================================
async function callClaudeStream(messages, system, onChunk, options = {}) {
  if (!STATE.apiKey) throw new Error('API密钥未设置');
  const response = await fetch(API_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': STATE.apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: MODEL,
      max_tokens: options.maxTokens || 2048,
      system,
      messages,
      stream: true,
    }),
  });

  if (!response.ok) {
    const err = await response.text();
    let msg = response.status + ': ' + err;
    try { const j = JSON.parse(err); if (j.error?.message) msg = j.error.message; } catch(e){}
    throw new Error(msg);
  }

  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop() || '';
    for (const line of lines) {
      if (!line.startsWith('data: ')) continue;
      const data = line.slice(6).trim();
      if (!data || data === '[DONE]') continue;
      try {
        const event = JSON.parse(data);
        if (event.type === 'content_block_delta' && event.delta?.type === 'text_delta') {
          onChunk(event.delta.text);
        }
      } catch (e) {}
    }
  }
}

async function callClaude(messages, system, options = {}) {
  if (!STATE.apiKey) throw new Error('API密钥未设置');
  const response = await fetch(API_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': STATE.apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: MODEL,
      max_tokens: options.maxTokens || 1024,
      system,
      messages,
    }),
  });
  if (!response.ok) throw new Error(response.status + ': ' + await response.text());
  const data = await response.json();
  let text = '';
  for (const block of data.content || []) {
    if (block.type === 'text') text += block.text;
  }
  return text;
}

const SYS_KNOWLEDGE = `你是中核北方核燃料元件有限公司（202厂）球形燃料事业部的AI工艺Copilot，部署在生产驾驶舱中，为工艺工程师、班组长、质量工程师提供实时智能支持。

## 你的工艺知识背景

球形燃料元件（HTGR球床堆燃料）是高温气冷堆的核心燃料形态，202厂为石岛湾示范工程（HTR-PM）批量供货。三段式制造工艺：

### 第I段·铀核芯制备（凝胶外滴法 GSP）
UO2(NO3)2 溶液经滴定塔在氨水中成型为凝胶微球前驱体，经陈化、干燥、煅烧（约850℃）、H2还原烧结（约1550℃）后得到 UO2 核芯。
- 核芯目标：直径 500±20μm、密度 ≥10.4 g/cm³（约理论密度97%）、铀含量 88±0.5%、球形度（长短径比）<1.08、缺陷率<5‰
- 关键控制点：溶液浓度（影响成核）、滴定流速（影响粒径）、煅烧温度（影响相变完整度）、还原温度（影响最终密度）

### 第II段·TRISO包覆（流化床CVD）
核芯在流化床中依次沉积四层结构：
- 缓冲层（疏松热解碳，约95μm）：吸收裂变气体压力与位移损伤，原料 C2H2
- 内热解碳层 IPyC（致密热解碳，约40μm）：阻挡腐蚀性裂变产物，原料 C3H6 + Ar，温度1300℃
- SiC 层（碳化硅，约35μm）：核心承压层与扩散屏障，原料 MTS（CH3SiCl3）+ H2，温度1500℃
- 外热解碳层 OPyC（致密热解碳，约40μm）：保护SiC、与基体结合，工艺类似IPyC
- 关键质量指标：SiC 层致密度（>3.18 g/cm³）、四层厚度均匀性、SiC 破损率（<100 ppm）
- 典型缺陷：椭球（核芯非球形传播）、双核（粘连）、缺包覆、SiC 微孔（密度不足）

### 第III段·球形元件成型
TRISO 颗粒（每球约 12000 个）+ 石墨基体粉（重量比约 1:5）经混料、冷准等静压成型为 Φ60mm 球，再经退火（约1900℃，去挥发分+石墨化）、机加工至最终尺寸、CT 无损检测。
- 关键质量：直径 60±0.5mm、基体密度 1.70-1.74 g/cm³、TRISO 分布均匀性、压溃强度 >25kN、SiC 完整率（CT 检出无破损TRISO）
- 常见问题：等静压压力波动→密度不均、退火升温过快→TRISO 应力破损、混料不充分→颗粒聚集

## 你的工作风格

1. **基于实时数据说话**：你的回答必须紧密结合用户提供的当前产线状态（参数实时值、SPC趋势、异常事件、批次进度），不能给出与现实数据脱节的泛泛之论

3. **可执行的建议**：给出具体的工艺参数调整建议，明确调整方向、幅度、预期效果
4. **风险意识**：核工业容错率极低，对涉及核安全、辐射防护、SiC完整性的事项必须高度敏感
5. **简洁专业**：回答控制在300字以内，多用工艺工程师熟悉的术语，避免冗长解释。重要数据用 markdown **加粗** 突出

## 你不应该做的

- 不要回避用户的具体问题去做泛泛而谈
- 不要给出"建议进一步监测"这种缺乏实质的建议

- 不要使用一般工业 AI 的话术，要体现出对核燃料工艺的深度理解`;

function buildProductionContext() {
  const stage = STATE.currentStage;
  const cfg = STAGE_CONFIG[stage];
  const stageName = { core: '铀核芯制备', triso: 'TRISO包覆', sphere: '球形元件成型' }[stage];
  const batch = STATE.batchInfo[stage];

  let ctx = `# 当前产线实时状态（${new Date().toLocaleTimeString('zh-CN', {hour12: false})}）\n\n`;
  ctx += `## 当前关注段：第${{core:'I',triso:'II',sphere:'III'}[stage]}段·${stageName}\n`;
  ctx += `## 在产批次：${batch.id}\n`;
  ctx += `## 当前工序步骤：${cfg.batchSteps[cfg.activeStep]}（${cfg.activeStep + 1}/${cfg.batchSteps.length}）\n`;
  ctx += `## 已运行：${((Date.now() - batch.startTime) / 3600000).toFixed(1)}小时\n\n`;

  ctx += `## 关键工艺参数实时值\n`;
  for (const p of cfg.params) {
    const key = stage + '_' + p.key;
    const hist = STATE.paramHistory[key];
    const last = hist[hist.length - 1].v;
    const recent = hist.slice(-10).map(h => h.v);
    const mean = recent.reduce((a,b)=>a+b,0) / recent.length;
    const trend = last > mean + 0.5 * p.sigma ? '↑' : last < mean - 0.5 * p.sigma ? '↓' : '→';
    let status = '';
    if (last > p.ucl || last < p.lcl) status = ' [超限!]';
    else if (Math.abs(last - p.target) > 2 * p.sigma) status = ' [2σ预警]';
    ctx += `- ${p.name}：**${last.toFixed(3)} ${p.unit}**（目标 ${p.target}±${(p.ucl-p.target).toFixed(2)}，趋势${trend}）${status}${p.key_quality?' ★关键':''}\n`;
  }

  ctx += `\n## 设备运行状态\n`;
  for (const e of cfg.equipment) {
    ctx += `- ${e.id} ${e.name}：${e.state}\n`;
  }

  // Active anomalies
  const stageAnomalies = STATE.anomalies.filter(a => a.stage === stage).slice(0, 5);
  if (stageAnomalies.length > 0) {
    ctx += `\n## 当前段未处置异常事件\n`;
    for (const a of stageAnomalies) {
      const tm = new Date(a.time).toLocaleTimeString('zh-CN', {hour12: false});
      ctx += `- [${tm} ${a.severity === 'alarm' ? '严重' : '注意'}] ${a.paramName} = ${a.value.toFixed(3)}${a.unit}（${a.rule}，目标 ${a.target}±${(a.ucl-a.target).toFixed(2)}）\n`;
    }
  }

  // Cross-stage status
  ctx += `\n## 其他工艺段状态概览\n`;
  for (const s of ['core', 'triso', 'sphere']) {
    if (s === stage) continue;
    const otherCfg = STAGE_CONFIG[s];
    const otherBatch = STATE.batchInfo[s];
    const otherAnomalies = STATE.anomalies.filter(a => a.stage === s);
    const stageNm = { core: '第I段铀核芯', triso: '第II段TRISO包覆', sphere: '第III段球形成型' }[s];
    ctx += `- ${stageNm}：批次${otherBatch.id}，工序${otherCfg.batchSteps[otherCfg.activeStep]}，异常${otherAnomalies.length}个\n`;
  }

  return ctx;
}

function onParamClick(stage, paramKey) {
  const cfg = STAGE_CONFIG[stage];
  const p = cfg.params.find(x => x.key === paramKey);
  const histKey = stage + '_' + paramKey;
  const hist = STATE.paramHistory[histKey];
  const recent = hist.slice(-15);
  const last = recent[recent.length - 1].v;
  const mean = recent.reduce((a,b)=>a+b.v,0) / recent.length;
  const std = Math.sqrt(recent.reduce((a,b)=>a+(b.v-mean)**2,0) / recent.length);
  const cpk = std > 0 ? Math.min((p.ucl - mean) / (3*std), (mean - p.lcl) / (3*std)) : 999;

  const query = `请深度分析参数【${p.name}】的当前状态：
- 当前值：${last.toFixed(3)} ${p.unit}
- 近15点均值：${mean.toFixed(3)}
- 近15点σ：${std.toFixed(3)}
- CPK：${cpk.toFixed(2)}
- 目标：${p.target} ${p.unit}（控制限 ${p.lcl} - ${p.ucl}）

请从工艺机理角度分析当前状态，识别潜在风险，并给出工艺工程师下一步的具体动作建议。`;
  quickAsk(query);
}
