<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>ppt assets</title><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent}
body{font-family:"Noto Sans SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
/* ---- 画板 2560×1440（13.333×7.5 in @192dpi） ---- */
.board{position:relative;width:2560px;height:1440px;overflow:hidden;background:linear-gradient(160deg,#070B1F 0%,#0B1437 45%,#130F3A 100%)}
.aur{position:absolute;inset:-10%;background:
  radial-gradient(42% 55% at 8% 12%,rgba(59,130,246,.55),transparent 62%),
  radial-gradient(38% 52% at 92% 8%,rgba(139,92,246,.5),transparent 62%),
  radial-gradient(30% 40% at 78% 100%,rgba(236,72,153,.32),transparent 62%),
  radial-gradient(28% 38% at 20% 98%,rgba(34,211,238,.28),transparent 62%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:96px 96px;-webkit-mask:radial-gradient(70% 70% at 50% 50%,#000 30%,transparent 100%)}
/* 光环：倾斜椭圆，宽柔光带 + 细芯 */
.rg{position:absolute;perspective:1600px}
.rg .r{position:absolute;inset:0;transform-style:preserve-3d}
.rg .r i{position:absolute;inset:0;border-radius:50%;display:block;background:conic-gradient(from var(--a,0deg),transparent 0 5%,var(--c1) 18%,var(--c2) 42%,var(--c3) 62%,transparent 84%);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - var(--w)),#000 calc(100% - var(--w) + 1px))}
.rg .r i.gl{--w:70px;filter:blur(40px);opacity:.85}
.rg .r i.co{--w:5px;opacity:.95;filter:blur(1px) drop-shadow(0 0 10px rgba(255,255,255,.5))}
.rb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.6}
.scan{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#22d3ee 20%,#3b82f6 45%,#a855f7 70%,transparent);box-shadow:0 0 30px 4px rgba(99,102,241,.6)}
/* 透视地面网格 */
.floor{position:absolute;left:-20%;right:-20%;bottom:0;height:46%;background-image:linear-gradient(rgba(96,165,250,.22) 2px,transparent 2px),linear-gradient(90deg,rgba(96,165,250,.22) 2px,transparent 2px);background-size:160px 120px;transform:perspective(1200px) rotateX(64deg);transform-origin:50% 100%;-webkit-mask:linear-gradient(transparent,#000 60%)}
.sky{position:absolute;left:0;right:0;bottom:0}
.tower{position:absolute}
/* 截图相框 */
.frame{position:relative;padding:14px;border-radius:28px;background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(96,165,250,.55) 35%,rgba(167,139,250,.5) 70%,rgba(34,211,238,.6));box-shadow:0 60px 120px -40px rgba(0,0,0,.8),0 0 80px -10px rgba(99,102,241,.55)}
.frame .in{border-radius:18px;overflow:hidden;background:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.6)}
.frame img{display:block;width:100%}
.frame .bar{position:absolute;left:50%;top:6px;transform:translateX(-50%);width:120px;height:4px;border-radius:2px;background:rgba(255,255,255,.7)}
/* 图标 */
.ic{width:256px;height:256px;display:flex;align-items:center;justify-content:center}
.ic svg{width:200px;height:200px;fill:none;stroke:#fff;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 14px rgba(255,255,255,.55))}
.badge{position:relative;width:400px;height:400px}
.badge .o{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,#22d3ee,#3b82f6,#8b5cf6,#ec4899,#22d3ee);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 22px),#000 calc(100% - 21px));filter:drop-shadow(0 0 28px rgba(99,102,241,.8))}
.badge .f{position:absolute;inset:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.18),rgba(255,255,255,.04) 60%,transparent 100%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.dot{width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,#fff 0,rgba(165,180,252,.9) 18%,rgba(99,102,241,.45) 40%,transparent 70%)}
.glass{width:1200px;height:700px;border-radius:40px;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.06));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 0 0 1.5px rgba(255,255,255,.18),0 40px 100px -30px rgba(0,0,0,.6)}
.pill{width:1200px;height:200px;border-radius:100px;background:linear-gradient(90deg,#2563eb,#7c3aed 55%,#db2777);box-shadow:0 0 0 1.5px rgba(255,255,255,.35) inset,0 0 44px rgba(124,58,237,.55)}
.pill.cy{background:linear-gradient(90deg,#0891b2,#2563eb 60%,#7c3aed)}
.pill.am{background:linear-gradient(90deg,#d97706,#f43f5e 60%,#9333ea)}
.pill.gn{background:linear-gradient(90deg,#059669,#0891b2 60%,#2563eb)}
.orb{width:260px;height:260px;border-radius:50%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.45),transparent 38%),linear-gradient(135deg,#22d3ee,#3b82f6 45%,#8b5cf6 75%,#ec4899);box-shadow:0 0 0 2px rgba(255,255,255,.35) inset,0 0 40px rgba(99,102,241,.75)}
.orb.am{background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.45),transparent 38%),linear-gradient(135deg,#fbbf24,#f97316 50%,#ec4899)}
.orb.gn{background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.45),transparent 38%),linear-gradient(135deg,#34d399,#06b6d4 55%,#3b82f6)}
.orb.cy{background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.45),transparent 38%),linear-gradient(135deg,#67e8f9,#06b6d4 50%,#2563eb)}
.glow.gn{background:radial-gradient(circle,rgba(52,211,153,.5),rgba(52,211,153,.15) 35%,transparent 70%)}
.glow.am{background:radial-gradient(circle,rgba(251,191,36,.5),rgba(251,191,36,.15) 35%,transparent 70%)}
.hair{width:2400px;height:24px;border-radius:12px;background:linear-gradient(90deg,#22d3ee,#3b82f6 30%,#8b5cf6 60%,#ec4899 85%,transparent);box-shadow:0 0 30px rgba(99,102,241,.8)}
.vbar{width:40px;height:600px;border-radius:20px;background:linear-gradient(180deg,#22d3ee,#8b5cf6,#ec4899);box-shadow:0 0 40px rgba(99,102,241,.9)}
.glow{width:1600px;height:1600px;border-radius:50%;background:radial-gradient(circle,rgba(99,102,241,.55),rgba(99,102,241,.18) 35%,transparent 70%)}
.glow.cy{background:radial-gradient(circle,rgba(34,211,238,.5),rgba(34,211,238,.15) 35%,transparent 70%)}
.glow.pk{background:radial-gradient(circle,rgba(236,72,153,.5),rgba(236,72,153,.15) 35%,transparent 70%)}
.tile{width:800px;height:800px;border-radius:64px;background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.04));box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 0 0 1.5px rgba(255,255,255,.2),0 30px 80px -30px rgba(0,0,0,.7)}
.tile.ac::after{content:'';position:absolute;inset:0;border-radius:64px;padding:2px;background:linear-gradient(135deg,#22d3ee,#8b5cf6 55%,#ec4899);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.tile{position:relative}
.logo{width:560px;height:200px;border-radius:30px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px rgba(255,255,255,.45),0 12px 34px rgba(0,0,0,.4)}.logo img{height:150px}
.bolt{position:absolute;width:3px;background:linear-gradient(#22d3ee,transparent);opacity:.7}
</style></head><body><div id="root"></div>
<script>
const q = Object.fromEntries(new URLSearchParams(location.search));
const ring = (cls, size, x, y, rings) => `<div class="rg ${cls}" style="width:${size}px;height:${size}px;left:${x}px;top:${y}px">` +
  rings.map(r => `<div class="r" style="inset:${r.inset || 0}%;transform:rotateX(${r.tx}deg) rotateZ(${r.tz}deg)"><i class="gl" style="--c1:${r.c[0]};--c2:${r.c[1]};--c3:${r.c[2]};--a:${r.a || 0}deg"></i><i class="co" style="--c1:${r.c[0]};--c2:${r.c[1]};--c3:${r.c[2]};--a:${r.a || 0}deg"></i></div>`).join('') + '</div>';
const R1 = [{ tx: 66, tz: -18, c: ['#67e8f9', '#60a5fa', '#a78bfa'], a: 30 }, { tx: 56, tz: 34, c: ['#a78bfa', '#f472b6', '#fbcfe8'], a: 210, inset: 7 }, { tx: 78, tz: -58, c: ['#fb923c', '#f472b6', '#c4b5fd'], a: 120, inset: 15 }];
const R2 = [{ tx: 70, tz: 24, c: ['#3b82f6', '#22d3ee', '#67e8f9'], a: 80 }, { tx: 60, tz: -34, c: ['#a78bfa', '#8b5cf6', '#3b82f6'], a: 260, inset: 8 }];
function skyline(w, h, seed) { /* 程序化城市天际线（模板封面城市的影子）：矩形楼 + 一座尖塔 */
  let x = 0, s = seed, out = ''; const rnd = () => (s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296;
  while (x < w) { const bw = 40 + rnd() * 90, bh = 60 + rnd() * (h - 80); const g = rnd();
    out += `<rect x="${x}" y="${h - bh}" width="${bw}" height="${bh}" fill="rgba(${g > .5 ? '59,130,246' : '139,92,246'},${.18 + rnd() * .25})"/>`;
    for (let yy = h - bh + 18; yy < h - 10; yy += 26) for (let xx = x + 10; xx < x + bw - 10; xx += 22) if (rnd() > .55) out += `<rect x="${xx}" y="${yy}" width="8" height="10" fill="rgba(199,210,254,${.25 + rnd() * .5})"/>`;
    x += bw + 6 + rnd() * 14; }
  out += `<polygon points="${w * .62},${h} ${w * .62 + 70},${h} ${w * .62 + 40},${h - h * 1.25} ${w * .62 + 30},${h - h * 1.25}" fill="rgba(96,165,250,.45)"/><line x1="${w * .62 + 35}" y1="${h - h * 1.25}" x2="${w * .62 + 35}" y2="${h - h * 1.6}" stroke="#93c5fd" stroke-width="3"/>`;
  return `<svg class="sky" width="${w}" height="${h * 1.7}" viewBox="0 ${-h * .7} ${w} ${h * 1.7}" style="height:${h * 1.7}px">${out}</svg>`;
}
function tower(x, y, s) { /* 输电铁塔线稿（模板结尾铁塔照片的影子） */
  const p = `M0 420 L60 0 L120 420 M20 300 L100 300 M12 360 L108 360 M30 220 L90 220 M-70 120 L190 120 M-70 120 L30 220 M190 120 L90 220 M40 60 L80 60 M-40 60 L160 60 M-40 60 L45 115 M160 60 L75 115 M12 360 L108 300 M108 360 L12 300 M30 220 L90 300 M90 220 L30 300`;
  return `<svg class="tower" style="left:${x}px;top:${y}px" width="${260 * s}" height="${440 * s}" viewBox="-80 -10 280 440"><path d="${p}" fill="none" stroke="rgba(147,197,253,.75)" stroke-width="3" style="filter:drop-shadow(0 0 10px rgba(96,165,250,.8))"/><path d="M-70 120 L-500 60 M190 120 L700 40 M-40 60 L-500 20 M160 60 L700 0" stroke="rgba(199,210,254,.35)" stroke-width="2" fill="none"/></svg>`;
}
const ICONS = {
  users: '<circle cx="80" cy="72" r="30"/><path d="M28 170c0-30 24-52 52-52s52 22 52 52"/><circle cx="148" cy="80" r="22"/><path d="M150 118c26 0 44 20 44 46"/>',
  shield: '<path d="M100 22l66 24v56c0 42-28 72-66 86-38-14-66-44-66-86V46z"/><path d="M72 100l20 20 40-44"/>',
  chart: '<path d="M30 170h140"/><rect x="48" y="96" width="24" height="60"/><rect x="92" y="60" width="24" height="96"/><rect x="136" y="110" width="24" height="46"/>',
  clip: '<rect x="44" y="40" width="112" height="136" rx="12"/><path d="M76 40v-14h48v14M70 96h60M70 128h40"/>',
  bolt: '<path d="M112 22L50 110h52l-14 68 62-88h-52z"/>',
  cog: '<circle cx="100" cy="100" r="28"/><path d="M100 30v20M100 150v20M30 100h20M150 100h20M51 51l14 14M135 135l14 14M149 51l-14 14M65 135l-14 14"/>',
  book: '<path d="M40 44h60c8 0 14 6 14 14v110c0-8-6-14-14-14H40zM160 44h-46v110h46z"/>',
  heart: '<path d="M100 170s-62-38-62-84c0-22 18-36 36-36 14 0 22 8 26 16 4-8 12-16 26-16 18 0 36 14 36 36 0 46-62 84-62 84z"/>',
  target: '<circle cx="100" cy="100" r="68"/><circle cx="100" cy="100" r="40"/><circle cx="100" cy="100" r="12"/>',
  layers: '<path d="M100 36l72 36-72 36-72-36z"/><path d="M28 108l72 36 72-36M28 144l72 36 72-36"/>',
  grid: '<rect x="36" y="36" width="52" height="52" rx="8"/><rect x="112" y="36" width="52" height="52" rx="8"/><rect x="36" y="112" width="52" height="52" rx="8"/><rect x="112" y="112" width="52" height="52" rx="8"/>',
  check: '<circle cx="100" cy="100" r="68"/><path d="M68 102l22 22 44-48"/>',
  cpu: '<rect x="56" y="56" width="88" height="88" rx="12"/><rect x="84" y="84" width="32" height="32"/><path d="M80 56V32M120 56V32M80 168v-24M120 168v-24M56 80H32M56 120H32M168 80h-24M168 120h-24"/>',
  db: '<ellipse cx="100" cy="56" rx="60" ry="22"/><path d="M40 56v88c0 12 27 22 60 22s60-10 60-22V56M40 100c0 12 27 22 60 22s60-10 60-22"/>',
  cycle: '<path d="M160 100a60 60 0 1 1-18-43"/><path d="M150 36l-6 28 28-6"/>',
  star: '<path d="M100 28l22 46 50 7-36 35 9 50-45-24-45 24 9-50-36-35 50-7z"/>',
  hand: '<path d="M60 112V60a12 12 0 0 1 24 0v40M84 96V48a12 12 0 0 1 24 0v48M108 96V56a12 12 0 0 1 24 0v52M132 108V76a12 12 0 0 1 24 0v44c0 32-24 56-56 56s-48-20-62-44l-18-30a12 12 0 0 1 20-13l16 23"/>',
  chat: '<path d="M44 48h112a12 12 0 0 1 12 12v68a12 12 0 0 1-12 12H96l-36 30v-30H44a12 12 0 0 1-12-12V60a12 12 0 0 1 12-12z"/><path d="M68 84h64M68 108h40"/>',
  rocket: '<path d="M100 28c30 24 42 60 42 96l-42 20-42-20c0-36 12-72 42-96z"/><circle cx="100" cy="92" r="14"/><path d="M58 124l-22 24 34-6M142 124l22 24-34-6M100 144v30"/>',
  eye: '<path d="M24 100s30-52 76-52 76 52 76 52-30 52-76 52-76-52-76-52z"/><circle cx="100" cy="100" r="22"/>',
  flag: '<path d="M48 176V32M48 40h100l-20 30 20 30H48"/>',
  compass: '<circle cx="100" cy="100" r="68"/><path d="M128 72l-18 46-46 18 18-46z"/>',
  key: '<circle cx="76" cy="124" r="32"/><path d="M98 102l62-62M140 60l20 20M124 76l16 16"/>',
  globe: '<circle cx="100" cy="100" r="68"/><path d="M32 100h136M100 32c-30 30-30 106 0 136M100 32c30 30 30 106 0 136"/>'
};
const root = document.getElementById('root');
if (q.k === 'cover') root.innerHTML = `<div class="board"><div class="aur"></div><div class="grid"></div><div class="floor"></div>${skyline(2560, 240, 7)}${ring('', 1500, 1300, -350, R1)}${ring('', 760, -260, 760, R2)}<div class="rb" style="width:900px;height:360px;left:1500px;top:600px;background:linear-gradient(90deg,transparent,rgba(96,165,250,.7),rgba(167,139,250,.7),transparent);transform:rotate(-22deg)"></div></div>`;
else if (q.k === 'section') root.innerHTML = `<div class="board"><div class="aur"></div><div class="grid"></div>${ring('', 1300, -420, 60, R1)}${ring('', 640, 1900, 880, R2)}<div class="scan" style="top:1180px;opacity:.7"></div></div>`;
else if (q.k === 'content') root.innerHTML = `<div class="board"><div class="aur" style="opacity:.75"></div><div class="grid"></div>${ring('', 900, 1960, -520, R1)}${ring('', 520, -260, 1120, R2)}</div>`;
else if (q.k === 'end') root.innerHTML = `<div class="board"><div class="aur"></div><div class="grid"></div><div class="floor"></div>${ring('', 1400, 580, -300, R1)}${tower(1880, 520, 2.2)}${tower(260, 760, 1.2)}<div class="scan" style="top:1240px"></div></div>`;
else if (q.k === 'frame') { const w = +q.w || 1440; document.body.style.padding = '90px'; root.innerHTML = `<div class="frame" style="width:${w + 28}px"><div class="in"><img src="${q.img}"></div></div>`; }
else if (q.k === 'icon') root.innerHTML = `<div class="ic" id="shot"><svg viewBox="0 0 200 200">${ICONS[q.n] || ''}</svg></div>`;
else if (q.k === 'pill') { document.body.style.padding = '60px'; root.innerHTML = `<div class="pill ${q.v || ''}" id="shot"></div>`; }
else if (q.k === 'orb') { document.body.style.padding = '60px'; root.innerHTML = `<div class="orb ${q.v || ''}" id="shot"></div>`; }
else if (q.k === 'hair') { document.body.style.padding = '40px'; root.innerHTML = `<div class="hair" id="shot"></div>`; }
else if (q.k === 'vbar') { document.body.style.padding = '60px'; root.innerHTML = `<div class="vbar" id="shot"></div>`; }
else if (q.k === 'glow') { document.body.style.padding = '0'; root.innerHTML = `<div class="glow ${q.v || ''}" id="shot"></div>`; }
else if (q.k === 'tile') { document.body.style.padding = '60px'; root.innerHTML = `<div class="tile ${q.v || ''}" id="shot"></div>`; }
else if (q.k === 'logo') { document.body.style.padding = '60px'; root.innerHTML = `<div class="logo" id="shot"><img src="${q.img}"></div>`; }
else if (q.k === 'badge') { document.body.style.padding = '40px'; root.innerHTML = `<div class="badge" id="shot"><div class="o"></div><div class="f"></div></div>`; }
else if (q.k === 'dot') root.innerHTML = `<div class="dot" id="shot"></div>`;
else if (q.k === 'glass') { document.body.style.padding = '60px'; root.innerHTML = `<div class="glass" id="shot"></div>`; }
else if (q.k === 'ringonly') { document.body.style.padding = '0'; root.innerHTML = `<div style="position:relative;width:1600px;height:1600px" id="shot">${ring('', 1500, 50, 50, R1)}</div>`; }
</script></body></html>
