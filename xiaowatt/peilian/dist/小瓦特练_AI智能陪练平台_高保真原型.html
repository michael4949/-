<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小瓦特·练 · AI智能陪练平台</title>
<style>
/* ===== 小瓦特·练 · 基础样式（变量 / 按钮 / 弹层 / 标签） ===== */
:root{
  --bg:#f5f6f1; --bg2:#f0f1e9; --panel:#ffffff; --panel2:#f7f8f1; --line:#e2dfd0;
  --line2:#c9c6b0; --txt:#243329; --txt2:#5c6b5f; --txt3:#98a69c;
  /* 主色系：绿系 / 橙系（每张卡片只用其一）+ 金色描边 */
  --gold:#c9a227; --goldD:#a8821b; --goldln:#d4b862; --goldsoft:#e6d9a8; --goldbg:#fdf9ec;
  --gr:#0e8f5a; --grd:#0a6b44; --grl:#57bd8b; --grbg:#ecf6ee; --grln:#b5d9c0;
  --or:#e07a2a; --ord:#b85c14; --orl:#f2a15e; --orbg:#fdf1e6; --orln:#f0c9a3;
  --ac:var(--gr); --acd:var(--grd); --acl:var(--grl); --acbg:var(--grbg); --acln:var(--grln);
  --csg:var(--ac); --csgD:var(--acd); --csgL:var(--acl);
  --on:#e23b2e;      /* 合闸/带电 红 */
  --off:#23b26a;     /* 分闸/停电 绿 */
  --gnd:#e8b22a;     /* 接地 黄 */
  --warn:#c9772e; --red:#d43a2f; --ok:var(--ac);
  --mono:'JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace;
  --ui:'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif;
}
/* 色系切换：.hg 绿系 / .ho 橙系，卡内强调色、图表、标签、按钮全部跟随 */
.hg{--ac:var(--gr);--acd:var(--grd);--acl:var(--grl);--acbg:var(--grbg);--acln:var(--grln);--csg:var(--ac);--csgD:var(--acd);--csgL:var(--acl);--ok:var(--ac)}
.ho{--ac:var(--or);--acd:var(--ord);--acl:var(--orl);--acbg:var(--orbg);--acln:var(--orln);--csg:var(--ac);--csgD:var(--acd);--csgL:var(--acl);--ok:var(--ac)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--ui);font-size:13px;overflow:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(1200px 600px at 12% -10%, rgba(14,143,90,.16), transparent 60%),
    radial-gradient(900px 500px at 100% 110%, rgba(201,162,39,.12), transparent 60%);
}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.05;
  background-image:linear-gradient(rgba(70,80,60,.55) 1px,transparent 1px),linear-gradient(90deg,rgba(70,80,60,.55) 1px,transparent 1px);
  background-size:44px 44px;mask-image:radial-gradient(ellipse at 50% 40%,#000 20%,transparent 78%)}
#app{position:relative;z-index:2;height:100vh;display:flex;flex-direction:column}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#cfccba;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}
button{font-family:inherit}

/* ---------- 顶栏 ---------- */
.top{display:flex;align-items:center;gap:16px;padding:0 16px;height:56px;flex:none;
  background:linear-gradient(180deg,#f6f7ee,#eef0e6);border-bottom:1px solid var(--line);
  box-shadow:0 6px 22px rgba(100,108,88,.16)}
.brand{display:flex;align-items:center;gap:12px;padding-right:16px;border-right:1px solid var(--line)}
.brand img{height:30px;display:block;filter:brightness(0) invert(1) opacity(.92)}
.brand .pill{font-size:11px;color:var(--csgL);border:1px solid var(--acln);background:var(--acbg);
  padding:2px 8px;border-radius:3px;letter-spacing:.5px;white-space:nowrap}
.task{min-width:0}
.task .t1{font-size:14px;font-weight:700;letter-spacing:.4px;white-space:nowrap}
.task .t2{font-size:11px;color:var(--txt3);margin-top:2px;font-family:var(--mono)}
.spacer{flex:1}
.states{display:flex;align-items:center;gap:0}
.stp{display:flex;align-items:center;gap:7px;padding:0 12px;position:relative}
.stp:not(:last-child)::after{content:'';width:22px;height:1px;background:var(--line2);position:absolute;right:-11px}
.stp i{width:9px;height:9px;border-radius:50%;background:#dcd9c8;border:1px solid #c2c9b4;display:block}
.stp span{font-size:12px;color:var(--txt3);white-space:nowrap}
.stp.done i{background:var(--off);border-color:var(--off);box-shadow:0 0 8px rgba(35,178,106,.7)}
.stp.done span{color:var(--txt2)}
.stp.cur i{background:var(--warn);border-color:var(--warn);box-shadow:0 0 10px rgba(201,148,45,.9);animation:pulse 1.4s infinite}
.stp.cur span{color:#a86a1e;font-weight:700}
@keyframes pulse{50%{transform:scale(1.35)}}
.kpis{display:flex;gap:10px}
.kpi{background:#f4f5ec;border:1px solid var(--goldln);border-radius:5px;padding:5px 11px;min-width:76px}
.kpi b{display:block;font-family:var(--mono);font-size:16px;line-height:1.1;letter-spacing:.5px}
.kpi span{font-size:10px;color:var(--txt3)}
.kpi.bad b{color:var(--red)} .kpi.warn b{color:var(--warn)} .kpi.good b{color:var(--ok)}

/* ---------- 主体 ---------- */
.main{flex:1;display:grid;grid-template-columns:392px 1fr 384px;gap:1px;background:var(--line);min-height:0}
.col{background:var(--bg2);min-height:0;display:flex;flex-direction:column;overflow:hidden}

/* ---------- 数字人舞台 ---------- */
.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#f4f5ec}
#scene{position:absolute;inset:0}
#dh{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center}
.stage-tag{position:absolute;left:12px;top:12px;display:flex;gap:8px;align-items:center;z-index:5}
.stage-tag .loc{background:rgba(255,255,255,.9);border:1px solid var(--goldln);border-radius:4px;
  padding:5px 10px;font-size:12px;color:#b3bfb2;backdrop-filter:blur(4px);max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage-tag .live{display:flex;align-items:center;gap:5px;background:rgba(226,59,46,.16);
  border:1px solid rgba(226,59,46,.5);border-radius:4px;padding:5px 9px;font-size:11px;color:#c25549;font-family:var(--mono)}
.stage-tag .live i{width:6px;height:6px;border-radius:50%;background:#d43a2f;animation:pulse 1.1s infinite}
.rolecard{position:absolute;right:12px;bottom:104px;z-index:6;background:rgba(255,255,255,.92);border:1px solid var(--goldln);
  border:1px solid var(--line2);border-radius:5px;padding:7px 10px;backdrop-filter:blur(4px);text-align:right;max-width:180px}
.rolecard b{display:block;font-size:12.5px;letter-spacing:.8px}
.rolecard span{font-size:10px;color:var(--csgL);line-height:1.4;display:block}
.rolecard em{display:none}
.sub .who{font-size:10.5px;color:var(--csgL);letter-spacing:1px;margin-bottom:4px}
.sub .txt{font-size:14.5px;line-height:1.6;min-height:46px;text-shadow:0 2px 10px #000}
.sub .txt .hl{color:#a8821b}
.dh-wave{display:inline-flex;gap:2px;align-items:flex-end;height:11px;margin-left:6px;vertical-align:-1px}
.dh-wave i{width:2px;background:var(--csgL);border-radius:1px;animation:wv .6s infinite ease-in-out}
.dh-wave i:nth-child(2){animation-delay:.1s}.dh-wave i:nth-child(3){animation-delay:.2s}
.dh-wave i:nth-child(4){animation-delay:.3s}.dh-wave i:nth-child(5){animation-delay:.15s}
@keyframes wv{0%,100%{height:3px}50%{height:11px}}

/* 唇形·动作同步指示条 */
.sync{flex:none;display:flex;align-items:center;gap:7px;padding:6px 10px;border-top:1px solid var(--line);
  background:#eef0e6;font-family:var(--mono);font-size:10px;color:var(--txt3);overflow:hidden}
.sync .lb{color:var(--csgL);letter-spacing:1px;flex:none}
.sync .ch{background:var(--acbg);color:#1f2d24;border-radius:3px;padding:1px 6px;font-size:12px;
  font-family:var(--ui);min-width:26px;text-align:center;flex:none}
.sync b{color:#2f4438;font-weight:600;flex:none;white-space:nowrap}
.sync .bar{flex:1 1 24px;height:5px;background:#f1f3e8;border-radius:3px;overflow:hidden;min-width:20px}
.sync .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--acl));width:0%}
.sync .g{color:var(--ac);flex:none;white-space:nowrap}
.beats{flex:none;display:flex;border-top:1px solid var(--line);background:#f2f3ea}
.beat{flex:1;padding:9px 2px 8px;text-align:center;position:relative;border-right:1px solid #edf1e5}
.beat:last-child{border-right:0}
.beat b{display:block;font-size:10.5px;white-space:nowrap;color:var(--txt3);font-weight:600;letter-spacing:.3px}
.beat i{display:block;font-style:normal;font-family:var(--mono);font-size:9px;color:#a8b3a3;margin-top:2px}
.beat.on{background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 30%,transparent),color-mix(in srgb,var(--ac) 5%,transparent))}
.beat.on b{color:var(--acd)}
.beat.on::before{content:'';position:absolute;left:0;right:0;top:0;height:2px;background:var(--csgL);box-shadow:0 0 10px var(--csgL)}
.beat.done b{color:var(--ok)}
.beat.done i::after{content:' ✓'}

/* ---------- 中列：设备操作区 ---------- */
.opbar{flex:none;display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);background:#f6f7ee}
.opbar .lbl{font-size:11px;color:var(--txt3);letter-spacing:1px}
.opbar .now{font-size:13px;font-weight:700;color:#2f4438}
.locbar{flex:none;display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);background:#f2f3ea}
.locbtn{flex:none;background:#eef0e4;border:1px solid var(--line);color:var(--txt3);border-radius:4px;
  padding:5px 10px;font-size:11.5px;cursor:pointer;transition:.15s;white-space:nowrap}
.locbtn:hover{border-color:var(--line2);color:var(--txt2)}
.locbtn.cur{background:var(--acbg);border-color:var(--ac);color:#1f2d24}
.locbtn.need{border-color:#d8c078;color:#a8821b;animation:needp 1.6s infinite}
@keyframes needp{50%{background:#faf3dc}}
.panelwrap{flex:1;min-height:0;overflow:auto;padding:14px;position:relative}
.pnl{background:var(--panel);border:1px solid var(--goldln);border-radius:7px;padding:12px;margin-bottom:12px;position:relative}
.pnl h4{margin:0 0 10px;font-size:12px;color:#a9b3a4;letter-spacing:1px;font-weight:700;
  display:flex;align-items:center;gap:8px}
.pnl h4::before{content:'';width:3px;height:12px;background:var(--csgL);border-radius:2px}
.pnl h4 .r{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--txt3);letter-spacing:0}

/* 一次接线图 */
.sld{background:#f2f3ea;border:1px solid var(--line);border-radius:6px}
.sld svg{display:block;width:100%}
.dev{cursor:pointer}
.dev .hit{fill:transparent}
.dev:hover .hit{fill:color-mix(in srgb,var(--ac) 14%,transparent)}
.dev.sel .hit{fill:rgba(255,216,138,.18);stroke:#a8821b;stroke-width:1.4;stroke-dasharray:3 3}
.dev.tgt .hit{stroke:var(--acl);stroke-width:1.4;stroke-dasharray:4 3;fill:color-mix(in srgb,var(--ac) 10%,transparent);animation:tgtp 1.6s infinite}
@keyframes tgtp{50%{fill:color-mix(in srgb,var(--ac) 24%,transparent)}}
.devlbl{font-family:var(--mono);font-size:10px;fill:#a9b3a4}
.devnm{font-size:10.5px;fill:#3c5245}

/* 遥测 / 报文 */
.telem{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tm{background:#f6f7ee;border:1px solid var(--line);border-radius:5px;padding:8px 10px;cursor:pointer}
.tm:hover{border-color:var(--line2)}
.tm.sel{border-color:#a8821b;box-shadow:0 0 0 1px rgba(255,216,138,.3)}
.tm span{font-size:10px;color:var(--txt3);display:block}
.tm b{font-family:var(--mono);font-size:18px;color:var(--ac);letter-spacing:.5px}
.tm.zero b{color:#98a69c}
.msgs{height:118px;overflow:auto;background:#f4f5ec;border:1px solid var(--line);border-radius:5px;padding:8px;font-family:var(--mono);font-size:10.5px;line-height:1.8}
.msgs div{color:#8b988c;white-space:nowrap}
.msgs div.new{color:var(--ac)}
.msgs div.alm{color:#c25d2a}
.msgs .ts{color:#a5b0a1;margin-right:7px}

/* 屏柜 / 汇控柜 */
.cab{display:grid;gap:10px}
.cab.c2{grid-template-columns:1fr 1fr}
.cab.c3{grid-template-columns:repeat(3,1fr)}
.knob{background:#f7f8f1;border:1px solid var(--goldsoft);border-radius:6px;padding:12px;text-align:center;cursor:pointer;transition:.15s}
.knob:hover{border-color:var(--line2)}
.knob.tgt{border-color:var(--acl);box-shadow:0 0 0 1px color-mix(in srgb,var(--ac) 35%,transparent)}
.knob .nm{font-family:var(--mono);font-size:12px;color:#3c5245;margin-bottom:2px}
.knob .de{font-size:10px;color:var(--txt3);margin-bottom:9px;height:26px}
.knob svg{display:block;margin:0 auto}
.knob .st{margin-top:8px;font-size:11px;font-family:var(--mono)}
.knob .st.a{color:var(--on)} .knob .st.b{color:var(--off)}
.mcb{background:#f7f8f1;border:1px solid var(--goldsoft);border-radius:6px;padding:10px;cursor:pointer;display:flex;gap:10px;align-items:center;transition:.15s}
.mcb:hover{border-color:var(--line2)}
.mcb.tgt{border-color:var(--acl);box-shadow:0 0 0 1px color-mix(in srgb,var(--ac) 35%,transparent)}
.mcb .body{width:26px;height:44px;background:#dfe2d2;border:1px solid #c8cfb9;border-radius:3px;position:relative;flex:none}
.mcb .lev{position:absolute;left:6px;width:14px;height:15px;border-radius:2px;background:var(--on);transition:.25s;top:5px}
.mcb.off .lev{top:24px;background:var(--off)}
.mcb .i .nm{font-family:var(--mono);font-size:12px;color:#3c5245}
.mcb .i .de{font-size:10.5px;color:var(--txt3);margin-top:2px}
.mcb .i .st{font-size:11px;margin-top:4px;font-family:var(--mono);color:var(--on)}
.mcb.off .i .st{color:var(--off)}
.tagslot{position:relative}
.tagcard{position:absolute;right:8px;top:8px;background:#f3e6b8;color:#7a1414;border:2px solid #b93a2a;
  border-radius:3px;padding:4px 7px;font-size:10px;font-weight:800;line-height:1.35;text-align:center;
  box-shadow:0 5px 14px rgba(100,108,88,.16);transform-origin:top center;animation:hang .55s cubic-bezier(.2,1.5,.4,1)}
@keyframes hang{0%{transform:translateY(-24px) rotate(-14deg);opacity:0}100%{transform:none;opacity:1}}

/* 现场四指示 */
.ind{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.indc{background:#f7f8f1;border:1px solid var(--goldsoft);border-radius:6px;padding:10px;cursor:pointer;text-align:center;transition:.15s}
.indc:hover{border-color:var(--line2)}
.indc.chk{border-color:var(--ok);background:var(--acbg)}
.indc .nm{font-size:11px;color:#3c5245;margin-bottom:8px;height:28px;line-height:1.3}
.indc .val{font-family:var(--mono);font-size:12px;margin-top:8px}
.indc .val.a{color:var(--on)}.indc .val.b{color:var(--off)}.indc .val.g{color:var(--gnd)}
.indc .tick{font-size:10px;color:var(--ok);margin-top:4px;min-height:14px}

/* 间隔选择 */
.bays{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bayc{background:#f7f8f1;border:1px solid var(--goldsoft);border-radius:6px;padding:14px 10px;text-align:center;cursor:pointer;transition:.15s}
.bayc:hover{border-color:var(--line2);transform:translateY(-1px)}
.bayc.cur{border-color:var(--ac);background:var(--acbg)}
.bayc .n{font-family:var(--mono);font-size:15px;color:#1f2d24}
.bayc .d{font-size:10.5px;color:var(--txt3);margin-top:3px}
.bayc .s{font-size:10px;margin-top:6px;font-family:var(--mono)}

/* 调度电话 */
.phone{display:grid;grid-template-columns:196px 1fr;gap:14px}
.handset{background:#f7f8f1;border:1px solid var(--line);border-radius:8px;padding:14px;text-align:center}
.handset .ring{width:76px;height:76px;border-radius:50%;margin:4px auto 10px;background:var(--acbg);
  display:flex;align-items:center;justify-content:center;border:2px solid var(--ac)}
.handset.ringing .ring{animation:ringp .9s infinite}
@keyframes ringp{50%{box-shadow:0 0 0 12px color-mix(in srgb,var(--ac) 16%,transparent)}}
.handset .nm{font-size:12.5px;color:#1f2d24}.handset .de{font-size:10.5px;color:var(--txt3);margin-top:2px}
.reclog{background:#f6f7ee;border:1px solid var(--line);border-radius:6px;padding:10px}
.reclog .row{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px dashed #e9e6d8}
.reclog .row:last-child{border-bottom:0}
.reclog .k{width:78px;font-size:11px;color:var(--txt3);flex:none}
.reclog .v{font-family:var(--mono);font-size:11.5px;color:#3c5245}
.reclog input{background:#f2f3ea;border:1px solid var(--line2);color:#3c5245;border-radius:4px;
  padding:4px 7px;font-family:var(--mono);font-size:11.5px;width:100%}

/* 五防 */
.wf{background:#f4f5ec;border:1px solid #dcd9c8;border-radius:6px;padding:12px}
.wfsteps{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.wfs{background:#f7f8f1;border:1px solid var(--line);border-radius:5px;padding:8px 11px;font-size:11.5px;color:var(--txt2);cursor:pointer}
.wfs.done{border-color:var(--ok);color:var(--ok);background:var(--acbg)}
.wfs.tgt{border-color:var(--acl);color:#1f2d24}

/* ---------- 右列：操作票 + 对话 ---------- */
.ticket{flex:1;min-height:0;display:flex;flex-direction:column}
.thead{flex:none;padding:10px 12px;border-bottom:1px solid var(--line);background:#f6f7ee}
.thead .ttl{font-size:12.5px;font-weight:700;letter-spacing:.5px}
.thead .meta{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;margin-top:7px}
.thead .meta div{font-size:10.5px;color:var(--txt3);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thead .meta b{color:#a9b3a4;font-weight:400}
.trows{flex:1;overflow:auto;padding:2px 0}
.trow{display:flex;gap:8px;padding:7px 12px;border-bottom:1px solid #eef0e4;cursor:pointer;transition:.12s}
.trow:hover{background:#eef0e4}
.trow .no{width:30px;flex:none;font-family:var(--mono);font-size:11px;color:var(--txt3);padding-top:1px}
.trow .tx{flex:1;font-size:11.5px;line-height:1.55;color:var(--txt2)}
.trow .ck{width:22px;flex:none;text-align:center;font-family:var(--mono);font-size:14px;color:#d5d9c6}
.trow.cur{background:linear-gradient(90deg,color-mix(in srgb,var(--ac) 24%,transparent),transparent)}
.trow.cur .tx{color:#1f2d24}
.trow.cur .no{color:#a8821b;font-weight:700}
.trow.done .tx{color:#98a69c}
.trow.done .ck{color:var(--ok)}
.trow.bad{background:rgba(212,58,47,.10)}
.trow.bad .ck{color:var(--red)}
.trow.seg{background:#f0f1e9;cursor:default;padding:6px 12px}
.trow.seg .tx{font-size:10.5px;color:#9aa79b;letter-spacing:1px}
.trow.seg:hover{background:#f0f1e9}
.chat{flex:none;height:262px;border-top:1px solid var(--line);display:flex;flex-direction:column;background:#eef0e6}
.chat .ch{flex:none;padding:7px 12px;font-size:11px;color:var(--txt3);letter-spacing:1px;border-bottom:1px solid #eef0e4}
.chat .cb{flex:1;overflow:auto;padding:10px 12px}
.msg{margin-bottom:9px;display:flex;gap:8px}
.msg .av{width:22px;height:22px;border-radius:4px;flex:none;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.msg.j .av{background:var(--acbg);color:var(--acd)}
.msg.o .av{background:var(--acbg);color:var(--ac)}
.msg.s .av{background:#efe9f6;color:#6b4fa0}
.msg .bd{flex:1;font-size:11.5px;line-height:1.62;color:var(--txt2);background:#f4f5ec;border:1px solid #ecead9;border-radius:5px;padding:7px 9px}
.msg.o .bd{background:var(--acbg);border-color:var(--acln)}
.msg.err .bd{background:#fbe9e7;border-color:#eac1bb;color:#b3372c}
.msg.ok .bd{background:var(--acbg);border-color:var(--acln)}
.msg .bd .tag{display:inline-block;font-size:9.5px;padding:1px 5px;border-radius:3px;margin-right:6px;vertical-align:1px}
.tag.rl{background:#f6d9d5;color:#b3372c}.tag.wn{background:#f3ead0;color:#a8821b}.tag.ok{background:var(--acbg);color:var(--ac)}

/* ---------- 底部操作条 ---------- */
.act{flex:none;border-top:1px solid var(--line);background:linear-gradient(180deg,#f6f7ee,#eef0e6);padding:10px 14px}
.actrow{display:flex;gap:9px;align-items:center}
.mic{width:40px;height:40px;border-radius:50%;border:1px solid var(--ac);background:var(--acbg);color:#1f2d24;
  cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;transition:.15s}
.mic:hover{background:var(--acln)}
.mic.rec{background:#e0a89f;border-color:#c8352b;animation:pulse 1s infinite}
.rin{flex:1;background:#f2f3ea;border:1px solid var(--line2);color:#243329;border-radius:6px;
  padding:10px 12px;font-size:13px;font-family:var(--ui)}
.rin::placeholder{color:#a8b3a3}
.rin:focus{outline:none;border-color:var(--ac)}
.btn{border:1px solid var(--line2);background:#ffffff;color:#3c5245;border-radius:6px;padding:10px 15px;
  font-size:12.5px;cursor:pointer;white-space:nowrap;transition:.15s}
.btn:hover{background:#eaf0e4;border-color:var(--ac)}
.btn:disabled{opacity:.34;cursor:not-allowed}
.btn.pri{background:var(--csg);border-color:var(--acl);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--acl)}
.btn.dan{background:#fbe9e7;border-color:#e0a89f;color:#b3372c}
.btn.dan:hover{background:#f3cfc9}
.btn.warn{background:#faf3dc;border-color:#d8c078;color:#a8821b}
.hintrow{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:11px;color:var(--txt3)}
.hintrow .k{background:#eef0e4;border:1px solid var(--line);border-radius:3px;padding:1px 6px;font-family:var(--mono);color:var(--txt2)}

/* ---------- 弹层 ---------- */
.mask{position:fixed;inset:0;background:rgba(44,52,42,.45);z-index:60;display:flex;align-items:center;
  justify-content:center;padding:26px;backdrop-filter:blur(3px);animation:fin .2s}
@keyframes fin{from{opacity:0}}
.dlg{background:#ffffff;border:1px solid var(--goldln);border-radius:10px;width:min(880px,96vw);
  max-height:90vh;overflow:auto;box-shadow:0 30px 90px rgba(100,108,88,.2);animation:din .25s cubic-bezier(.2,.9,.3,1)}
@keyframes din{from{transform:translateY(18px) scale(.98);opacity:0}}
.dlg .dh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.dlg .dh b{font-size:15px;letter-spacing:.5px}
.dlg .dh .cls{margin-left:auto;cursor:pointer;color:var(--txt3);font-size:18px;line-height:1}
.dlg .db{padding:18px}
.dlg.red{border-color:#e0a89f}
.dlg.red .dh{background:linear-gradient(90deg,rgba(212,58,47,.18),transparent)}
.dlg.red .dh b{color:#b3372c}
.dlg .df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.sec{margin-bottom:13px}
.sec .st{font-size:11px;letter-spacing:1.5px;color:var(--csgL);margin-bottom:7px}
.sec .sc{font-size:13px;line-height:1.75;color:var(--txt2)}
.sec .sc.quote{background:#f6f7ee;border-left:3px solid var(--csg);padding:10px 13px;border-radius:0 5px 5px 0;font-size:12.5px}
.chain{display:flex;gap:0;align-items:stretch;margin-top:12px;flex-wrap:wrap}
.chain .cn{flex:1;min-width:132px;background:#fdf3f1;border:1px solid #f0d4cf;border-radius:5px;padding:9px 11px;margin-right:16px;position:relative}
.chain .cn:last-child{margin-right:0}
.chain .cn::after{content:'▶';position:absolute;right:-14px;top:50%;transform:translateY(-50%);color:#eac1bb;font-size:11px}
.chain .cn:last-child::after{display:none}
.chain .cn b{display:block;font-size:11.5px;color:#b3372c;margin-bottom:3px}
.chain .cn span{font-size:10.5px;color:#a05248;line-height:1.5}
#arc{display:block;width:100%;border-radius:6px;background:#ffffff;border:1px solid #fbe9e7}

/* 准备阶段 */
.prep{padding:20px;overflow:auto;height:100%}
.prepgrid{display:grid;grid-template-columns:1fr;gap:12px}
.pc .chkrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
.pc{background:var(--panel);border:1px solid var(--goldln);border-radius:8px;padding:14px}
.pc h5{margin:0 0 4px;font-size:13px;color:#2f4438}
.pc .sub2{font-size:10.5px;color:var(--txt3);margin-bottom:10px}
.chk{display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border-radius:5px;cursor:pointer;transition:.12s}
.chk:hover{background:#eef0e4}
.chk .bx{width:15px;height:15px;border:1px solid #c2c9b4;border-radius:3px;flex:none;margin-top:2px;
  display:flex;align-items:center;justify-content:center;font-size:10px;color:#ffffff}
.chk.on .bx{background:var(--ok);border-color:var(--ok)}
.chk .lb{font-size:11.5px;line-height:1.5;color:var(--txt2)}
.chk.on .lb{color:#2f4438}
.risks{margin-top:14px;background:var(--panel);border:1px solid var(--goldln);border-radius:8px;padding:14px}
.rk{border:1px solid var(--goldsoft);border-radius:6px;margin-bottom:8px;overflow:hidden}
.rk .rh{display:flex;gap:9px;align-items:center;padding:9px 11px;cursor:pointer;background:#f7f8f1}
.rk .rh .n{font-family:var(--mono);font-size:11px;color:var(--warn);width:24px}
.rk .rh .t{flex:1;font-size:12px;color:var(--txt2)}
.rk .rh .s{font-size:10.5px;color:var(--txt3);font-family:var(--mono)}
.rk.on .rh .s{color:var(--ok)}
.rk .rb{display:none;padding:10px 12px;background:#f2f3ea;font-size:11.5px;line-height:1.7;color:var(--txt3)}
.rk.open .rb{display:block}
.rk .rb b{color:#a9b3a4;font-weight:600}

/* 讲师台 */
.demo{position:fixed;right:12px;bottom:12px;z-index:50}
.demo .tg{background:#ffffff;border:1px solid var(--line2);color:var(--txt2);border-radius:20px;
  padding:7px 14px;font-size:11px;cursor:pointer}
.demo .bd{display:none;position:absolute;right:0;bottom:38px;width:246px;background:#ffffff;
  border:1px solid var(--line2);border-radius:8px;padding:11px;box-shadow:0 20px 50px rgba(100,108,88,.2)}
.demo.open .bd{display:block}
.demo .bd .t{font-size:10.5px;color:var(--txt3);letter-spacing:1px;margin-bottom:8px}
.demo .bd button{display:block;width:100%;text-align:left;margin-bottom:6px;background:#ffffff;
  border:1px solid var(--line);color:var(--txt2);border-radius:5px;padding:7px 9px;font-size:11.5px;cursor:pointer}
.demo .bd button:hover{background:#eaf0e4}
.foot{display:none}
.tt{position:fixed;z-index:70;background:#ffffff;border:1px solid var(--line2);border-radius:5px;
  padding:7px 10px;font-size:11px;color:var(--txt2);max-width:280px;line-height:1.5;pointer-events:none;
  box-shadow:0 10px 30px rgba(100,108,88,.18);display:none}
.toast{position:fixed;left:50%;top:74px;transform:translateX(-50%);z-index:80;background:#ffffff;
  border:1px solid var(--line2);border-radius:6px;padding:10px 16px;font-size:12.5px;
  box-shadow:0 14px 40px rgba(100,108,88,.2);animation:tin .25s}
.toast.bad{border-color:#e0a89f;color:#b3372c;background:#fbe9e7}
.toast.ok{border-color:var(--acln);color:var(--ac);background:var(--acbg)}
@keyframes tin{from{transform:translate(-50%,-12px);opacity:0}}
@media (max-width:1440px){.main{grid-template-columns:340px 1fr 340px}}

/* ================= 教学引导层 ================= */
.taskbar{flex:none;background:linear-gradient(180deg,#eef0e4,#f0f1e9);border-bottom:1px solid var(--line);padding:9px 14px 8px}
.tb1{display:flex;align-items:center;gap:11px}
.tbno{flex:none;background:var(--acbg);color:var(--acd);border:1px solid var(--ac);border-radius:4px;
  padding:3px 9px;font-family:var(--mono);font-size:11.5px;font-weight:700}
.tbtx{flex:1;font-size:13px;color:#1f2d24;font-weight:600;line-height:1.45;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.modesw{flex:none;display:flex;border:1px solid var(--line2);border-radius:5px;overflow:hidden}
.modesw button{background:#f7f8f1;border:0;color:var(--txt3);font-size:11px;padding:5px 10px;cursor:pointer;
  border-right:1px solid var(--line);white-space:nowrap}
.modesw button:last-child{border-right:0}
.modesw button:hover{color:var(--txt2);background:#f1f3e8}
.modesw button.on{background:var(--csg);color:#fff;font-weight:600}
.tb2{display:flex;align-items:center;gap:5px;margin-top:8px;flex-wrap:wrap}
.gs{display:inline-flex;align-items:center;gap:6px;background:#f7f8f1;border:1px solid var(--line);
  border-radius:14px;padding:4px 11px 4px 5px;font-size:11.5px;color:var(--txt3);white-space:nowrap}
.gs i{width:16px;height:16px;border-radius:50%;background:#dcd9c8;color:#9aa79b;font-style:normal;
  display:flex;align-items:center;justify-content:center;font-size:10px;font-family:var(--mono)}
.gs.ok{border-color:var(--acln);color:var(--ac);background:var(--acbg)}
.gs.ok i{background:var(--ok);color:#ffffff}
.gs.now{border-color:var(--ac);color:#1f2d24;background:var(--acbg);box-shadow:0 0 0 1px color-mix(in srgb,var(--ac) 35%,transparent)}
.gs.now i{background:var(--acl);color:#ffffff;animation:pulse 1.5s infinite}
.tb2 .ar{color:#c8ccb8;font-size:12px}
.tbsp{flex:1}
.hintbtn{background:#ffffff;border:1px solid var(--line2);color:#3c5245;border-radius:5px;
  padding:5px 11px;font-size:11.5px;cursor:pointer;white-space:nowrap;margin-left:6px}
.hintbtn:hover{background:#eaf0e4}

/* 知识点卡 */
#kpbox{flex:none}
.kp{border-bottom:1px solid var(--line);background:#f6f7ee}
.kph{display:flex;align-items:center;gap:9px;padding:8px 14px;cursor:pointer}
.kph:hover{background:#e8ebde}
.kph b{font-size:12.5px;color:#2f4438;font-weight:600}
.tag2{background:#efe9f6;color:#6b4fa0;border-radius:3px;padding:2px 7px;font-size:10px;flex:none}
.kpsp{flex:1}
.kpfold{font-size:11px;color:var(--txt3)}
.kpb{display:none;padding:2px 14px 12px}
.kp.open .kpb{display:block}
.kprow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kpc{margin-bottom:9px}
.kpt{font-size:10.5px;letter-spacing:1.2px;color:var(--csgL);margin-bottom:5px}
.kpt.warn{color:var(--warn)}
.kpc ul{margin:0;padding-left:16px}
.kpc li{font-size:11.5px;color:var(--txt2);line-height:1.7;margin-bottom:2px}
.kpc ul.err li{color:#c98f86}
.kpc p{margin:0;font-size:11.5px;color:var(--txt2);line-height:1.75}
.kpc p.rule{color:var(--txt3);font-size:11px}
.kpc.say{background:var(--acbg);border:1px solid var(--acln);border-radius:6px;padding:9px 11px;margin-top:4px}
.stdsay{color:var(--ac) !important;font-size:12.5px !important;margin-bottom:8px !important}
.kpc.say .btn{padding:5px 12px;font-size:11.5px}
.kplink{margin-top:8px;font-size:11px;color:var(--txt3)}
.kplink a{color:var(--acd);cursor:pointer;margin-right:12px;border-bottom:1px dashed var(--ac)}

/* 知识地图 */
.knav{background:#f0f1e9;border-right:1px solid var(--line);padding:10px 0;max-height:70vh;overflow:auto}
.kn{padding:9px 14px;cursor:pointer;border-left:3px solid transparent}
.kn:hover{background:#eef0e4}
.kn b{display:block;font-size:12.5px;color:var(--txt2);font-weight:600}
.kn span{display:block;font-size:10.5px;color:var(--txt3);margin-top:2px}
.kn.on{background:var(--acbg);border-left-color:var(--acl)}
.kn.on b{color:#1f2d24}
.kn.rel b::after{content:'　本项相关';font-size:9.5px;color:var(--ac);font-weight:400}
.kbody{padding:16px 20px 20px;max-height:70vh;overflow:auto}
.kbody h3{margin:0 0 14px;font-size:17px;color:#1f2d24}
.kbody h3 em{font-style:normal;font-size:11px;color:var(--txt3);margin-left:10px;font-family:var(--mono)}
.kb{margin-bottom:14px;padding-left:12px;border-left:2px solid #e2dfd0}
.kbt{font-size:12.5px;color:var(--acd);font-weight:600;margin-bottom:5px}
.kb p{margin:0;font-size:12.5px;color:var(--txt2);line-height:1.85}
.klink{color:var(--acd);cursor:pointer;border-bottom:1px dashed var(--ac)}

.kpnew{background:#f3ead0;color:#a8821b;border-radius:3px;padding:1px 6px;font-size:9.5px;margin-left:6px}
.gs{padding:3px 9px 3px 4px;font-size:11px}
.gs i{width:15px;height:15px;font-size:9.5px}
.tb2{gap:4px;margin-top:7px}

#dhvid{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom;display:none;background:transparent}
.cfgbtn{background:rgba(255,255,255,.9);border:1px solid var(--line2);color:var(--txt2);border-radius:4px;
  width:26px;height:26px;cursor:pointer;font-size:13px;line-height:1;backdrop-filter:blur(4px)}
.cfgbtn:hover{color:#1f2d24;border-color:var(--ac)}
.cfgrow{display:grid;gap:8px}
.cfgopt{display:flex;gap:10px;align-items:flex-start;background:#f7f8f1;border:1px solid var(--goldsoft);
  border-radius:6px;padding:10px 12px;cursor:pointer}
.cfgopt.on{border-color:var(--ac);background:var(--acbg)}
.cfgopt input{margin-top:3px}
.cfgopt b{display:block;font-size:12.5px;color:#2f4438}
.cfgopt span{display:block;font-size:11px;color:var(--txt3);margin-top:2px}
.cfgin{display:flex;gap:10px;align-items:center;margin-bottom:7px}
.cfgin label{width:104px;flex:none;font-size:11.5px;color:var(--txt3)}
.cfgin input{flex:1;background:#f2f3ea;border:1px solid var(--line2);color:#3c5245;border-radius:4px;
  padding:6px 9px;font-family:var(--mono);font-size:11.5px}

/* ================= 对练区通用（输入条 / 麦克风 / 提示行） ================= */
.main2{flex:1;display:grid;grid-template-columns:1fr 412px;gap:1px;background:var(--line);min-height:0}
.arena{position:relative;background:#f4f5ec;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.arena-top{flex:1;min-height:0;display:grid;grid-template-columns:44% 56%;position:relative;z-index:2}
.arena #scene{position:absolute;inset:0;z-index:0}
.arena #scene svg{opacity:.85}
.arena::after{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(90deg,transparent 40%,rgba(245,246,241,.55) 60%,rgba(245,246,241,.82) 100%)}
.arena-l{position:relative;z-index:2;min-height:0}
.arena-l #dh{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center}
.arena-l .sync{position:absolute;left:12px;right:12px;bottom:10px;z-index:6;border:1px solid var(--goldln);
  border-radius:5px;background:rgba(255,255,255,.9);backdrop-filter:blur(4px);border-top:1px solid var(--line2)}
.arena-l .rolecard{bottom:46px;right:auto;left:50%;transform:translateX(-50%);text-align:center;padding:5px 14px;min-width:150px}
.arena-r{position:relative;z-index:3;min-height:0;display:flex;flex-direction:column;padding:12px 14px 12px 6px}
.chathead{flex:none;font-size:11px;letter-spacing:1.5px;color:var(--txt3);padding:2px 4px 8px;display:flex;align-items:center;gap:8px}
.chathead span{background:var(--acbg);color:var(--acd);border-radius:3px;padding:1px 7px;font-size:10px;letter-spacing:0}
.arena-r .cb{flex:1;overflow:auto;padding:0 6px 8px 2px;scroll-behavior:smooth}
/* 气泡：监护人靠左，操作人靠右 */
.arena-r .msg{margin-bottom:10px;gap:9px;animation:bub .25s cubic-bezier(.2,.9,.3,1)}
@keyframes bub{from{transform:translateY(8px);opacity:0}}
.arena-r .msg .av{width:26px;height:26px;border-radius:50%;font-size:11px}
.arena-r .msg .bd{font-size:13px;line-height:1.7;padding:9px 12px;border-radius:9px;max-width:88%;
  background:rgba(255,255,255,.94);border:1px solid #dce4d3;backdrop-filter:blur(3px)}
.arena-r .msg.j .bd{border-top-left-radius:3px;color:#243329}
.arena-r .msg.o{flex-direction:row-reverse}
.arena-r .msg.o .bd{border-top-right-radius:3px;background:rgba(234,245,238,.95);border-color:var(--acln);color:var(--acd)}
.arena-r .msg.s{justify-content:center}
.arena-r .msg.s .av{display:none}
.arena-r .msg.s .bd{background:transparent;border:0;color:#9aa79b;font-size:11.5px;text-align:center;max-width:100%;padding:2px 8px}
.arena-r .msg.s.err .bd{color:#b3372c}
.arena-r .msg.s.ok .bd{color:var(--ac)}
.arena-r .msg.j.latest .bd{box-shadow:0 0 0 1px color-mix(in srgb,var(--ac) 55%,transparent),0 8px 30px color-mix(in srgb,var(--ac) 25%,transparent)}

/* 道具层（底部抽屉） */
.sheet{position:relative;z-index:8;flex:none;background:rgba(252,252,247,.97);border-top:1px solid var(--line2);
  box-shadow:0 -18px 50px rgba(100,108,88,.18);display:flex;flex-direction:column;overflow:hidden;
  height:52%;transition:height .32s cubic-bezier(.2,.9,.3,1)}
.sheet.closed{height:0;border-top:0}
.sheethead{flex:none;display:flex;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid var(--line);background:#f6f7ee}
.sheettitle{font-size:11px;letter-spacing:1.5px;color:var(--csgL);flex:none}
.sheethead .locbar{flex:1;padding:0;border:0;background:transparent;flex-wrap:nowrap;overflow-x:auto}
.sheethead .locbar .locbtn{padding:4px 9px;font-size:11px}
.sheetfold{flex:none;background:#ffffff;border:1px solid var(--line2);color:var(--txt2);border-radius:4px;padding:4px 10px;font-size:11px;cursor:pointer}
.sheet .panelwrap{flex:1;min-height:0;overflow:auto;padding:12px 14px}
.sheetpeek{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:7;background:var(--acbg);border:1px solid var(--ac);
  color:#1f2d24;border-radius:16px;padding:6px 14px;font-size:11.5px;cursor:pointer;display:none;box-shadow:0 8px 24px rgba(100,108,88,.16)}
.sheetpeek.show{display:block}
.sheetpeek.need{animation:needp 1.6s infinite;border-color:#d8c078;color:#a8821b}

/* 右栏 */
.side{background:var(--bg2);min-height:0;display:flex;flex-direction:column;overflow:hidden}
.side .ticket{flex:1;min-height:0;display:flex;flex-direction:column}
.side .thead .meta{grid-template-columns:1fr 1fr}
.side .taskbar{padding:9px 12px 8px}
.side .tbtx{font-size:12.5px}

/* 底部操作条 + 节拍带并排 */
.act{display:flex;align-items:stretch;gap:0;padding:0}
.act #actbar{flex:1;padding:10px 14px;min-width:0}
.act .beats{flex:none;width:412px;border-top:0;border-left:1px solid var(--line)}
.act .beat{padding:8px 2px 7px}
.act .beat i{display:none}
.askbtn{background:#efe9f6;border-color:#b7a6d6;color:#5b447e}
.askbtn:hover{background:#e6def2}
.main,.col{display:none}

.trow.skip{opacity:.35;cursor:default}
.trow.skip:hover{background:transparent}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cfgopt.dis{opacity:.45;cursor:not-allowed}

.arena.sheetopen .rolecard,.arena.sheetopen .sync,.arena.sheetopen .stage-tag .live{display:none}
.arena.sheetopen .arena-l #dh{top:6px}
.sheet{height:60%}

/* ---------- 指令卡（通用） ---------- */
.tbfoc{display:flex;align-items:center;gap:12px;margin-top:9px;padding:10px 13px;
  background:linear-gradient(90deg,color-mix(in srgb,var(--ac) 24%,transparent),color-mix(in srgb,var(--ac) 5%,transparent));
  border:1px solid var(--ac);border-radius:8px}
@keyframes focin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.tbic{width:32px;height:32px;flex:none;display:flex;align-items:center;justify-content:center;

@media print{#pg_arena,.hhead,#fxp,.hsil,.bgph,.demo,#htip,.phr,.chips{display:none !important}#pg_home{position:static;overflow:visible;background:#fff}.hcard{box-shadow:none;break-inside:avoid}}

/* ===== 配色体系 9/2：金色描边 + 绿/橙分卡 + AI·人力资源动效 ===== */
@property --ga{syntax:'<angle>';inherits:false;initial-value:0deg}
.hcard::before,.taskcard::before,.hourcard::before,.rcard::before,.ccard::before,.xwbar::before,.pnl::before,.tbfoc::before,.edprev::before{
  content:'';position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;pointer-events:none;z-index:3;
  background:conic-gradient(from var(--ga),transparent 0 58%,rgba(255,244,196,.9) 70%,var(--gold) 76%,rgba(201,162,39,.35) 82%,transparent 90%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
  animation:glint 11s linear infinite;opacity:.9}
.hcard:nth-child(2n)::before,.rcard:nth-child(2n)::before,.ccard:nth-child(2n)::before{animation-delay:-4s}
.hcard:nth-child(3n)::before,.rcard:nth-child(3n)::before,.ccard:nth-child(3n)::before{animation-delay:-7.5s}
.ckc::before{animation-duration:8s}
@keyframes glint{to{--ga:360deg}}
.hcard{transform:translateZ(0)}
.hcard:hover{transform:translateY(-2px)}
.ppage .hcard:nth-child(1){animation-delay:.02s}.ppage .hcard:nth-child(2){animation-delay:.08s}.ppage .hcard:nth-child(3){animation-delay:.14s}.ppage .hcard:nth-child(4){animation-delay:.2s}
.gtwo .hcard:nth-child(2),.cockpit .ck.tr,.cockpit .ck.br{animation-delay:.1s}
/* 卡头：色条随卡片色系，AI 标记脉冲 */
.hch b::before{background:linear-gradient(180deg,var(--gold),var(--ac))}
.hch em.ai,.rwhy i.ai,.ai-tag{font-style:normal;font-size:9.5px;letter-spacing:1px;color:#fff;background:linear-gradient(135deg,var(--acd),var(--ac));border-radius:10px;padding:2px 8px 2px 6px;display:inline-flex;align-items:center;gap:4px;vertical-align:1px;box-shadow:0 0 0 0 color-mix(in srgb,var(--ac) 40%,transparent);animation:aipulse 2.4s infinite}
.hch em.ai::before,.ai-tag::before{content:'';width:5px;height:5px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}
@keyframes aipulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ac) 45%,transparent)}60%{box-shadow:0 0 0 7px color-mix(in srgb,var(--ac) 0%,transparent)}}
/* 顶栏：AI 流光线 + 标识 */
.hhead::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--gr),var(--gold),var(--gr),transparent);background-size:220% 100%;animation:hflow 5s linear infinite;opacity:.9}
@keyframes hflow{from{background-position:0 0}to{background-position:220% 0}}
#pg_home .brand .pill{position:relative;overflow:hidden}
#pg_home .brand .pill::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.7) 48%,transparent 62%);background-size:260% 100%;animation:pavsheen 5s ease-in-out infinite}
.hgreet h1{background:linear-gradient(90deg,var(--grd),var(--gr) 35%,var(--gold) 55%,var(--gr) 75%,var(--grd));background-size:240% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:h1shine 7s linear infinite}
@keyframes h1shine{from{background-position:0 0}to{background-position:240% 0}}
/* 人力资源元素：班组伙伴条 + 背景上升人形 */
.hteam{display:flex;align-items:center;gap:6px;margin-top:14px;flex-wrap:wrap}
.hteam .lb{font-size:10.5px;color:#8b988c;letter-spacing:1px;margin-right:4px}
.hteam .tm{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;background:linear-gradient(135deg,var(--gr),var(--grl));border:2px solid #fff;box-shadow:0 2px 6px rgba(60,80,60,.18);animation:tmwave 4.8s ease-in-out infinite;cursor:pointer}
.hteam .tm.me{background:linear-gradient(135deg,var(--gold),#e3c05a);color:#3a2d08;font-weight:700}
.hteam .tm.idle{background:#d9d6c5;color:#7a8578}
.hteam .tm:nth-child(2n){animation-delay:-.6s}.hteam .tm:nth-child(3n){animation-delay:-1.2s}.hteam .tm:nth-child(4n){animation-delay:-1.8s}.hteam .tm:nth-child(5n){animation-delay:-2.4s}

<script>
/* ===== 公共工具（底座与陪练关卡共用）：DOM / 文本相近度 / 提示条 / 语音输入 / 知识库召回 / 启动 ===== */

function h(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
const now = () => { const d = new Date(); return d.toTimeString().slice(0, 8); };
const stamp = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')} ${d.toTimeString().slice(0, 5)}`; };


function norm(s) { return (s || '').replace(/[\s，。、；：？！,.;:?!（）()"'“”‘’·「」 ]/g, ''); }
function lcs(a, b) {
  const m = a.length, n = b.length; if (!m || !n) return 0;
  let prev = new Array(n + 1).fill(0), cur = new Array(n + 1).fill(0);
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) cur[j] = a[i - 1] === b[j - 1] ? prev[j - 1] + 1 : Math.max(prev[j], cur[j - 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[n];
}
function sim(a, b) { a = norm(a); b = norm(b); if (!a || !b) return 0; return lcs(a, b) / Math.max(a.length, b.length); }
function toast(t, k) {
  const e = el('div', 'toast ' + (k || ''), t); document.body.appendChild(e);
  setTimeout(() => { e.style.transition = '.3s'; e.style.opacity = 0; setTimeout(() => e.remove(), 320); }, 2100);
}

/* 语音输入：联网且经 http(s) 打开时浏览器识别（结果可改再发）；本地文件 / 离线 / 失败时兜底识别＝逐字打入当前该说的内容 */
let recTimer = null, recNow = null;
/* 语音输入：联网时用浏览器识别（结果可改再发）；离线按当前该说的内容逐字打入（复诵 / 回报的内容本来就在票面上） */
function micStart(btn, inp, fallback) {
  if (!btn || !inp) return;
  if (recNow) { try { recNow.stop(); } catch (e) { } recNow = null; btn.classList.remove('rec'); return; }
  if (recTimer) return;
  /* 浏览器识别只在联网且经 http(s) 打开时可用（本地文件打开拿不到麦克风权限，内网没有识别服务）；其余情况走兜底识别 */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const canSR = SR && navigator.onLine && location.protocol !== 'file:' && !window.__DH_MUTE;
  if (canSR) {
    try {
      const r = new SR(); r.lang = 'zh-CN'; r.interimResults = true; r.continuous = false;
      let got = false;
      r.onresult = e => { got = true; inp.value = Array.from(e.results).map(x => x[0].transcript).join(''); if (inp.oninput) inp.oninput(); };
      r.onend = () => { btn.classList.remove('rec'); recNow = null; if (!got && fallback) micType(btn, inp, fallback); };
      r.onerror = () => { got = true; btn.classList.remove('rec'); recNow = null; if (fallback) micType(btn, inp, fallback); else { toast('语音识别未能启动，请在文字框中输入', 'bad'); inp.focus(); } };
      btn.classList.add('rec'); r.start(); recNow = r; return;
    } catch (e) { }
  }
  if (fallback) return micType(btn, inp, fallback);
  toast('当前环境不支持语音识别，请在文字框中输入', ''); inp.focus();
}
function micType(btn, inp, text) {
  btn.classList.add('rec'); inp.value = ''; inp.placeholder = '正在识别…';
  let i = 0;
  recTimer = setInterval(() => {
    i += 2; inp.value = text.slice(0, i); if (inp.oninput) inp.oninput();
    if (i >= text.length) { clearInterval(recTimer); recTimer = null; btn.classList.remove('rec'); inp.placeholder = ''; }
  }, 34);
}

function chRadar(dims, now, prev, opt) {
  opt = opt || {};
  const W = opt.w || 330, H = opt.h || 250, cx = W / 2, cy = H / 2 + 6, R = Math.min(W, H) / 2 - 44;
  const key = opt.key || 'dim', fs = dims.length > 8 ? 9.5 : 10;
  const pt = (vals, k) => dims.map((_, i) => { const a = -Math.PI / 2 + i * Math.PI * 2 / dims.length, r = R * vals[i] / 100 * (k || 1); return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; });
  const ring = k => `<polygon points="${dims.map((_, i) => { const a = -Math.PI / 2 + i * Math.PI * 2 / dims.length; return `${cx + Math.cos(a) * R * k},${cy + Math.sin(a) * R * k}`; }).join(' ')}" fill="none" stroke="#e9e6d8"/>`;
  const P1 = pt(now), P0 = pt(prev);
  return `<svg viewBox="0 0 ${W} ${H}" class="chsvg">
    ${[.33, .66, 1].map(ring).join('')}
    ${dims.map((_, i) => { const a = -Math.PI / 2 + i * Math.PI * 2 / dims.length; return `<line x1="${cx}" y1="${cy}" x2="${cx + Math.cos(a) * R}" y2="${cy + Math.sin(a) * R}" stroke="#e9e6d8"/>`; }).join('')}
    <polygon points="${P0.map(p => p.join(',')).join(' ')}" fill="none" stroke="${opt.c2 || '#b3bfb2'}" stroke-width="1.4" stroke-dasharray="4 4"/>
    ${opt.target ? `<polygon points="${pt(opt.target).map(p => p.join(',')).join(' ')}" fill="rgba(201,162,39,.08)" stroke="#c9a227" stroke-width="1.6" stroke-dasharray="2 5" stroke-linecap="round"/>` : ''}
    <polygon class="anim-poly" points="${P1.map(p => p.join(',')).join(' ')}" fill="color-mix(in srgb,var(--ac) 16%,transparent)" stroke="var(--ac)" stroke-width="2"/>
    ${dims.map((n, i) => {
      const a = -Math.PI / 2 + i * Math.PI * 2 / dims.length, lr = R + 26;
      const lx = cx + Math.cos(a) * lr, ly = cy + Math.sin(a) * lr;
      const diff = now[i] - prev[i];
      return `<g class="hitv" data-${key}="${i}" data-tip="${n} ${now[i]} 分 · 较${opt.l2 || '上月'}${diff >= 0 ? '+' : ''}${diff}${opt.target ? ' · 目标 ' + opt.target[i] : ''}">
        <circle cx="${P1[i][0]}" cy="${P1[i][1]}" r="9" fill="transparent"/>
        <circle cx="${P1[i][0]}" cy="${P1[i][1]}" r="3.2" fill="var(--ac)"/>
        <text x="${lx}" y="${ly}" text-anchor="middle" font-size="${fs}" fill="#6b7a70">${n}</text>
        <text x="${lx}" y="${ly + 12}" text-anchor="middle" font-size="10.5" font-family="var(--mono)" fill="${now[i] < 70 ? '#a8821b' : 'var(--ac)'}">${now[i]}</text></g>`;
    }).join('')}
    <g font-size="10" fill="#98a69c"><rect x="${W - 104}" y="8" width="10" height="3" fill="var(--ac)"/><text x="${W - 90}" y="13">${opt.l1 || '本月'}</text>
    <rect x="${W - 52}" y="8" width="10" height="3" fill="${opt.c2 || '#b3bfb2'}"/><text x="${W - 38}" y="13">${opt.l2 || '上月'}</text>
    ${opt.target ? `<rect x="8" y="8" width="10" height="3" fill="#c9a227"/><text x="22" y="13">目标</text>` : ''}</g></svg>`;
}

/* ② 近30天 双轴柱线：柱=时长(min) 线=次数，某日可点击下钻 */
function chCombo(byDay, opt) {
  const W = (opt && opt.w) || 340, H = (opt && opt.h) || 240, pl = 34, pr = 30, pt2 = 18, pb = 26, iw = W - pl - pr, ih = H - pt2 - pb;
  const days = []; for (let d = 29; d >= 0; d--) days.push({ d, m: (byDay[d] || {}).min || 0, c: (byDay[d] || {}).cnt || 0 });
  const mMax = Math.max(60, ...days.map(x => x.m)), cMax = Math.max(2, ...days.map(x => x.c));
  const bw = iw / 30 * .58;
  const X = i => pl + iw / 30 * (i + .5);
  const line = days.map((x, i) => x.c ? `${X(i)},${pt2 + ih - ih * x.c / cMax}` : null).filter(Boolean).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" class="chsvg">
    ${[0, .5, 1].map(k => `<line x1="${pl}" y1="${pt2 + ih * k}" x2="${W - pr}" y2="${pt2 + ih * k}" stroke="#e9e6d8"/>
      <text x="${pl - 5}" y="${pt2 + ih * k + 3}" text-anchor="end" font-size="9" fill="#98a69c">${Math.round(mMax * (1 - k))}</text>
      <text x="${W - pr + 5}" y="${pt2 + ih * k + 3}" font-size="9" fill="#98a69c">${(cMax * (1 - k)).toFixed(0)}</text>`).join('')}
    ${days.map((x, i) => x.m ? `<rect class="hitv anim-bar" data-day="${x.d}" data-tip="${dayLabel(x.d)} · ${x.m} 分钟 · ${x.c} 场" x="${X(i) - bw / 2}" y="${pt2 + ih - ih * x.m / mMax}" width="${bw}" height="${ih * x.m / mMax}" rx="1.5" fill="url(#gbar)" style="animation-delay:${i * 14}ms"/>` : '').join('')}
    <polyline class="anim-line" points="${line}" fill="none" stroke="var(--ac)" stroke-width="1.6"/>
    ${days.map((x, i) => x.c ? `<circle class="hitv" data-day="${x.d}" data-tip="${dayLabel(x.d)} · ${x.c} 场" cx="${X(i)}" cy="${pt2 + ih - ih * x.c / cMax}" r="2.6" fill="var(--ac)"/>` : '').join('')}
    ${days.map((x, i) => i % 6 === 0 ? `<text x="${X(i)}" y="${H - 8}" text-anchor="middle" font-size="9" fill="#98a69c">${dayLabel(x.d)}</text>` : '').join('')}
    <defs><linearGradient id="gbar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3c05a"/><stop offset="1" stop-color="#c9a227"/></linearGradient></defs>
    <g font-size="10" fill="#98a69c"><rect x="${pl}" y="4" width="10" height="5" fill="#c9a227"/><text x="${pl + 14}" y="9">时长(分钟)</text>
    <circle cx="${pl + 84}" cy="6.5" r="3" fill="var(--ac)"/><text x="${pl + 91}" y="9">次数</text></g></svg>`;
}

/* ③ 练习方式分布 环形：分段可点击 */
function chDonut(cnt) {
  const W = 330, H = 240, cx = W / 2 - 44, cy = H / 2, R = 74, sw = 26;
  const PAL = ['var(--ac)', '#c9a227', 'var(--acl)', '#8fa08b', '#d98a3a', '#6f8fb8', '#b3bfb2'];
  const keys = Object.keys(cnt), total = keys.reduce((a, k) => a + cnt[k], 0) || 1;
  const CLR = {}; keys.forEach((k, i) => { CLR[k] = PAL[i % PAL.length]; });
  const C = 2 * Math.PI * R; let acc = 0;
  const segs = keys.map(k => {
    const frac = cnt[k] / total, off = acc; acc += frac;
    return `<circle class="hitv anim-seg" data-plan="${k}" data-tip="${k} · ${cnt[k]} 次 · ${Math.round(frac * 100)}%"
      cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${CLR[k]}" stroke-width="${sw}"
      stroke-dasharray="${(frac * C - 2.5).toFixed(1)} ${(C - frac * C + 2.5).toFixed(1)}"
      stroke-dashoffset="${(-off * C).toFixed(1)}" transform="rotate(-90 ${cx} ${cy})"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="chsvg">${segs}
    <text x="${cx}" y="${cy - 4}" text-anchor="middle" font-size="26" font-family="var(--mono)" fill="#1f2d24">${total}</text>
    <text x="${cx}" y="${cy + 15}" text-anchor="middle" font-size="10" fill="#98a69c">近30天次数</text>
    ${keys.map((k, i) => `<g class="hitv" data-plan="${k}" data-tip="点击查看${k}明细">
      <rect x="${W - 108}" y="${62 + i * 30}" width="9" height="9" rx="2" fill="${CLR[k]}"/>
      <text x="${W - 93}" y="${70 + i * 30}" font-size="11" fill="#6b7a70">${k}</text>
      <text x="${W - 93}" y="${82 + i * 30}" font-size="10" font-family="var(--mono)" fill="#98a69c">${cnt[k]} 次</text></g>`).join('')}</svg>`;
}

/* ④ 扣分与红线趋势 面积图：周点可点击 */
function chArea(weeks, reds) {
  const W = 340, H = 240, pl = 34, pr = 14, pt2 = 20, pb = 30, iw = W - pl - pr, ih = H - pt2 - pb;
  const vMax = Math.max(10, ...weeks);
  const X = i => pl + iw * (4 - i) / 4, Y = v => pt2 + ih - ih * v / vMax;
  const pts = [4, 3, 2, 1, 0].map(i => `${X(i)},${Y(weeks[i])}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" class="chsvg">
    ${[0, .5, 1].map(k => `<line x1="${pl}" y1="${pt2 + ih * k}" x2="${W - pr}" y2="${pt2 + ih * k}" stroke="#e9e6d8"/>
      <text x="${pl - 5}" y="${pt2 + ih * k + 3}" text-anchor="end" font-size="9" fill="#98a69c">${Math.round(vMax * (1 - k))}</text>`).join('')}
    <polygon class="anim-poly" points="${pl},${pt2 + ih} ${pts} ${W - pr},${pt2 + ih}" fill="url(#garea)" stroke="none"/>
    <polyline class="anim-line" points="${pts}" fill="none" stroke="#c9942d" stroke-width="2"/>
    ${[4, 3, 2, 1, 0].map(i => `<g class="hitv" data-week="${i}" data-tip="${i === 0 ? '本周' : i + ' 周前'} · 扣分 ${weeks[i]}${reds[i] ? ' · 红线 ' + reds[i] + ' 次' : ''}">
      <circle cx="${X(i)}" cy="${Y(weeks[i])}" r="8" fill="transparent"/>
      <circle cx="${X(i)}" cy="${Y(weeks[i])}" r="3.4" fill="#c9942d"/>
      ${reds[i] ? `<path d="M ${X(i) - 5} ${Y(weeks[i]) - 10} l 5 -8 l 5 8 z" fill="#d43a2f"/>` : ''}
      <text x="${X(i)}" y="${H - 10}" text-anchor="middle" font-size="9.5" fill="#98a69c">${i === 0 ? '本周' : i + '周前'}</text></g>`).join('')}
    <defs><linearGradient id="garea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(201,148,45,.30)"/><stop offset="1" stop-color="rgba(201,148,45,.02)"/></linearGradient></defs>
    <g font-size="10" fill="#98a69c"><path d="M ${pl} 6 l 4 -7 l 4 7 z" fill="#d43a2f"/><text x="${pl + 12}" y="8">红线触发</text>
    <rect x="${pl + 70}" y="2" width="10" height="4" fill="#c9942d"/><text x="${pl + 84}" y="8">周扣分合计</text></g></svg>`;
}

/* ⑤ 能力对标热力矩阵（CSS Grid）：格可点击 */
function chHeat(dims, mine, team) {
  const cell = (v, extra) => {
    const t = Math.max(0, Math.min(1, (v - 40) / 60));
    const bg = `color-mix(in srgb,var(--ac) ${Math.round((.08 + t * .70) * 100)}%,transparent)`;
    const fg = t > .55 ? '#fff' : 'var(--acd)';
    return `<div class="heatc hitv" data-tip="${extra}" style="background:${bg};color:${fg}">${v}</div>`;
  };
  return `<div class="heatg">
    <div class="heath"></div><div class="heath">我</div><div class="heath">班组均值</div><div class="heath">差距</div>
    ${dims.map((n, i) => {
      const d = mine[i] - team[i];
      return `<div class="heatn hitv" data-hdim="${i}" data-tip="点击查看「${n}」明细">${n}</div>
        ${cell(mine[i], `我的「${n}」 ${mine[i]} 分`)}
        ${cell(team[i], `班组均值 ${team[i]} 分（组织级口径）`)}
        <div class="heatc hitv ${d < 0 ? 'neg' : 'pos'}" data-hdim="${i}" data-tip="点击查看「${n}」明细与练习建议">${d >= 0 ? '+' + d : d}</div>`;
    }).join('')}</div>`;
}

/* ⑥ 岗位胜任度 仪表盘：整体可点击 */
function chGauge(f) {
  const W = 330, H = 240, cx = W / 2, cy = H / 2 + 36, R = 92;
  const a0 = Math.PI * 1.17, a1 = -Math.PI * .17;                 // 起止角
  const arc = (r, f0, f1, col, w2, cls) => {
    const s = a0 + (a1 - a0) * f0, e = a0 + (a1 - a0) * f1;
    const large = Math.abs(e - s) > Math.PI ? 1 : 0;
    return `<path class="${cls || ''}" d="M ${cx + Math.cos(s) * r} ${cy - Math.sin(s) * r} A ${r} ${r} 0 ${large} 1 ${cx + Math.cos(e) * r} ${cy - Math.sin(e) * r}" fill="none" stroke="${col}" stroke-width="${w2}" stroke-linecap="round"/>`;
  };
  const na = a0 + (a1 - a0) * f.pct / 100;
  return `<svg viewBox="0 0 ${W} ${H}" class="chsvg hitv" data-gauge="1" data-tip="点击查看胜任度构成与差距项">
    ${arc(R, 0, 1, '#ece9db', 15)}
    ${arc(R, 0, f.pct / 100, 'url(#ggau)', 15, 'anim-line')}
    ${[0, 25, 50, 75, 100].map(v => { const a = a0 + (a1 - a0) * v / 100; return `<text x="${cx + Math.cos(a) * (R + 20)}" y="${cy - Math.sin(a) * (R + 20) + 3}" text-anchor="middle" font-size="9" fill="#98a69c">${v}</text>`; }).join('')}
    <line x1="${cx}" y1="${cy}" x2="${cx + Math.cos(na) * (R - 24)}" y2="${cy - Math.sin(na) * (R - 24)}" stroke="#1f2d24" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="5" fill="#1f2d24"/>
    <text x="${cx}" y="${cy + 34}" text-anchor="middle" font-size="34" font-family="var(--mono)" fill="var(--ac)">${f.pct}<tspan font-size="15" fill="#98a69c">%</tspan></text>
    <text x="${cx}" y="${cy + 52}" text-anchor="middle" font-size="10.5" fill="#6b7a70">${f.post} · 胜任度测算</text>
    <text x="${cx}" y="${cy + 68}" text-anchor="middle" font-size="9" fill="#98a69c">测算供参考，任职评定以人工审核为准</text>
    <defs><linearGradient id="ggau" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c9a227"/><stop offset="1" stop-color="var(--ac)"/></linearGradient></defs></svg>`;
}

/* ⑧ 场次成长曲线（多序列可切换）：得分折线 / 用时柱 / 扣分项 / 提示次数 / 7 日均线 / 及格线 */
function chSessionCurve(pts, show, opt) {
  opt = opt || {}; show = show || {};
  const W = opt.w || 900, H = opt.h || 250, pl = 36, pr = 40, pt = 22, pb = 44, iw = W - pl - pr, ih = H - pt - pb;
  const n = pts.length;
  const X = i => pl + iw * (n > 1 ? i / (n - 1) : .5), Y = v => pt + ih - ih * (v - 50) / 50;
  const durMax = Math.max(30, ...pts.map(s => s.dur)); const YD = v => pt + ih - ih * v / durMax;
  const cntMax = 4; const YC = v => pt + ih - ih * Math.min(cntMax, v) / cntMax;
  const line = pts.map((s, i) => `${X(i)},${Y(s.score)}`).join(' ');
  const avg7 = pts.map((s, i) => { const w = pts.filter((x, j) => j <= i && s.d - x.d >= -7 && Math.abs(s.d - x.d) <= 7); return Math.round(w.reduce((a, x) => a + x.score, 0) / w.length); });
  const short = s => s.plan.replace('专项 · ', '').replace('分段 · ', '').replace('完整操作票', '完整票').replace(' → ', '→');
  return `<svg viewBox="0 0 ${W} ${H}" class="chsvg curve">
    ${[50, 60, 70, 80, 90, 100].map(v => `<line x1="${pl}" y1="${Y(v)}" x2="${W - pr}" y2="${Y(v)}" stroke="${v === 80 || v === 90 ? '#eee9d0' : '#eeece2'}"/><text x="${pl - 6}" y="${Y(v) + 3}" text-anchor="end" font-size="9" fill="#98a69c">${v}</text>`).join('')}
    ${show.pass !== false ? `<line x1="${pl}" y1="${Y(80)}" x2="${W - pr}" y2="${Y(80)}" stroke="#c9a227" stroke-dasharray="6 5" stroke-width="1.2"/><text x="${W - pr + 4}" y="${Y(80) + 3}" font-size="9" fill="#a8821b">及格 80</text>
    <line x1="${pl}" y1="${Y(90)}" x2="${W - pr}" y2="${Y(90)}" stroke="var(--ac)" stroke-dasharray="6 5" stroke-width="1.2"/><text x="${W - pr + 4}" y="${Y(90) + 3}" font-size="9" fill="var(--acd)">考核 90</text>` : ''}
    ${show.dur ? pts.map((s, i) => `<rect class="hitv anim-bar" data-sess="${s.id || ''}" data-tip="${dayLabel(s.d)} · 用时 ${s.dur} 分钟" x="${X(i) - 7}" y="${YD(s.dur)}" width="14" height="${ih - (YD(s.dur) - pt)}" rx="2" fill="rgba(201,162,39,.32)"/>`).join('') : ''}
    ${show.vio ? `<polyline points="${pts.map((s, i) => `${X(i)},${YC(s.vio.length)}`).join(' ')}" fill="none" stroke="#b3372c" stroke-width="1.4" stroke-dasharray="3 3"/>${pts.map((s, i) => `<rect x="${X(i) - 3}" y="${YC(s.vio.length) - 3}" width="6" height="6" fill="#b3372c" transform="rotate(45 ${X(i)} ${YC(s.vio.length)})"/>`).join('')}` : ''}
    ${show.hint ? `<polyline points="${pts.map((s, i) => `${X(i)},${YC((s.hints || []).length)}`).join(' ')}" fill="none" stroke="#6b4fa0" stroke-width="1.4" stroke-dasharray="1 4" stroke-linecap="round"/>${pts.map((s, i) => `<circle cx="${X(i)}" cy="${YC((s.hints || []).length)}" r="2.6" fill="none" stroke="#6b4fa0" stroke-width="1.4"/>`).join('')}` : ''}
    ${show.avg ? `<polyline points="${pts.map((s, i) => `${X(i)},${Y(avg7[i])}`).join(' ')}" fill="none" stroke="var(--acl)" stroke-width="2" stroke-dasharray="8 5" opacity=".9"/>` : ''}
    ${show.score !== false ? `<polygon points="${pl},${Y(50)} ${line} ${X(n - 1)},${Y(50)}" fill="color-mix(in srgb,var(--ac) 8%,transparent)"/><polyline class="anim-line" points="${line}" fill="none" stroke="var(--ac)" stroke-width="2.2"/>` : ''}
    ${pts.map((s, i) => { const red = s.vio.some(v => v.lv === 'red'); return `<g class="hitv" data-sess="${s.id || ''}" data-tip="${dayLabel(s.d)} · ${s.plan} · ${s.mode} · ${s.score} 分 · ${s.dur} 分钟 · 扣分 ${s.vio.length} · 提示 ${(s.hints || []).length}${red ? ' · 红线' : ''}">
      <circle cx="${X(i)}" cy="${Y(s.score)}" r="10" fill="transparent"/>
      ${red ? `<circle cx="${X(i)}" cy="${Y(s.score)}" r="8" fill="none" stroke="#d43a2f" stroke-width="1.5"><animate attributeName="r" values="6;10;6" dur="1.8s" repeatCount="indefinite"/></circle>` : ''}
      <circle cx="${X(i)}" cy="${Y(s.score)}" r="4" fill="${red ? '#d43a2f' : s.mode === '考核模式' ? 'var(--acd)' : '#c9a227'}" stroke="#fff" stroke-width="1.5"/>
      <text x="${X(i)}" y="${Y(s.score) - 9}" text-anchor="middle" font-size="9.5" font-family="var(--mono)" fill="${s.score < 75 ? '#a8821b' : 'var(--ac)'}">${s.score}</text>
      <text x="${X(i)}" y="${H - 28}" text-anchor="middle" font-size="9" fill="#98a69c">${dayLabel(s.d)}</text>
      <text x="${X(i)}" y="${H - 16}" text-anchor="middle" font-size="8.5" fill="#b3bfb2">${short(s)}</text>
      <text x="${X(i)}" y="${H - 5}" text-anchor="middle" font-size="8.5" fill="${s.mode === '考核模式' ? 'var(--acd)' : '#b3bfb2'}">${s.mode.slice(0, 2)}</text></g>`; }).join('')}
    ${show.dur ? `<text x="${W - pr + 4}" y="${pt + 4}" font-size="9" fill="#a8821b">${durMax}′</text>` : ''}
  </svg>`;
}

/* ⑦ 学员成长地图（驾驶舱中心件）：流向边 + 流动粒子 + 状态节点，全节点可下钻 */
function chGrowthMap(nodes, edges) {
  const NC = { done: 'var(--ac)', cur: '#c9a227', next: '#c9a227', ahead: 'var(--ac)', future: '#b9c4b9', feed: 'var(--acl)' };
  const EC = { done: 'gedge gdone', act: 'gedge gact', feed: 'gedge gfeed', future: 'gedge gfut' };
  return `<svg viewBox="0 0 880 600" class="chsvg gmap">
    <path d="M85,505 C230,430 340,360 465,285 C540,320 620,300 695,250 C760,205 812,142 818,88"
      fill="none" stroke="#eef1e2" stroke-width="54" stroke-linecap="round"/>
    <path d="M555,88 C640,98 725,125 795,158 M425,135 C550,143 675,150 793,162"
      fill="none" stroke="#f2f4e9" stroke-width="30" stroke-linecap="round"/>
    <g stroke="#dfe3d0" stroke-dasharray="3 8"><line x1="315" y1="30" x2="315" y2="562"/><line x1="640" y1="30" x2="640" y2="562"/></g>
    <g font-size="12.5" fill="#b3bfaa" letter-spacing="6" text-anchor="middle">
      <text x="165" y="582">入职适应期</text><text x="478" y="582">岗位强化期</text><text x="762" y="582">胜任晋升期</text></g>
    ${edges.map(e => `<path d="${e.d}" class="${EC[e.s]}" fill="none"/>`).join('')}
    ${edges.filter(e => e.p).map(e => `
      <circle r="3.4" fill="${e.s === 'act' ? '#c9a227' : 'var(--ac)'}" opacity=".9"><animateMotion dur="${e.s === 'act' ? '2.2s' : '3.6s'}" repeatCount="indefinite" path="${e.d}"/></circle>`).join('')}
    ${nodes.map(n => {
      const c = NC[n.s], r = n.s === 'cur' ? 17 : n.s === 'next' ? 15 : n.s === 'future' ? 12 : 13;
      return `<g class="hitv gnode" data-node="${n.id}" data-tip="${n.t}${n.v ? ' · ' + n.v : ''}">

const RULEMAP = {}; RULES.forEach(r => { RULEMAP[r.id] = r; });
function ruleDoc(id) { return RULE_DOCS.find(d => d.id === (RULEMAP[id] || {}).doc) || {}; }
function ruleCite(id) { const r = RULEMAP[id]; if (!r) return null; const d = ruleDoc(id); return { id, file: d.n, short: d.short, no: r.no, t: r.t, body: r.body, pri: d.pri }; }

/* 按错误事实与关键词检索条款：只返回真实命中的条款，命中不足时明确要求人工复核 */
function ruleFind(words, prefer) {
  const ws = (words || []).filter(Boolean);
  const hit = RULES.map(r => {
    let sc = 0;
    ws.forEach(w => { const n = norm(w); if (!n) return; r.k.forEach(k => { if (norm(k).includes(n) || n.includes(norm(k))) sc += 2; }); if (norm(r.body).includes(n)) sc += 1; if (norm(r.t).includes(n)) sc += 2; });
    if (prefer && prefer.includes(r.id)) sc += 6;
    return { r, sc };
  }).filter(x => x.sc >= 3).sort((a, b) => b.sc - a.sc || ruleDoc(a.r.id).pri - ruleDoc(b.r.id).pri);
  return hit.slice(0, 3).map(x => ruleCite(x.r.id));
}

/* ===== 操作票自动判卷引擎 =====
   顺序：步骤匹配 → 状态阶段 → 换序 / 特殊顺序 → 漏项 → 文字 → 危险规则。
   原则：确定性规则优先；不逐行死比；允许换序不判错；漏一项不连锁错位；同一根本错误只算一次；
        危险规则命中直接整票不合格；错误解释只引用真实检索到的条款，检索不到就要求人工复核。 */

const ERR_KINDS = {

};

const TK_VERBS = ['合上', '断开', '拉开', '投入', '退出', '检查', '切换', '装设', '拆除', '摇至', '调整'];
/* ---------- 步骤匹配：先认出学员这句话对应标准票哪一步 ---------- */
function tkScore(text, s) {
  const n = norm(text); if (!n) return 0;
  let sc = 0;
  const kh = s.k.filter(k => n.includes(norm(k))).length;
  sc += (s.k.length ? kh / s.k.length : 0) * 60;
  if (s.v) { sc += n.includes(s.v) ? 25 : -22; } else sc += TK_VERBS.some(v => n.includes(v)) ? -30 : 6;   // 屏柜抬头行不接带动词的操作项
  sc += sim(text, s.t) * 18;
  return sc;
}
function tkMatchAll(rows) {
  const used = {}, out = [];
  rows.forEach((r, i) => {
    const cands = TICKET.map(s => ({ s, sc: tkScore(r.t, s) })).sort((a, b) => b.sc - a.sc);
    const top = cands[0] ? cands[0].sc : 0;
    if (top < 42) { out.push({ i, row: r, s: null, sc: top }); return; }
    const near = cands.filter(x => x.sc >= top - 6);
    const pick = near.find(x => used[x.s.no] == null) || near[0];
    if (used[pick.s.no] == null) used[pick.s.no] = i;
    out.push({ i, row: r, s: pick.s, sc: pick.sc, dup: used[pick.s.no] !== i });
  });
  return { list: out, used };
}

/* ---------- 文字规则：严格一致 / 仅关键字严格 / 允许规范等价表达 ---------- */
function tkText(row, s) {
  const a = norm(row.t), b = norm(s.t);
  if (s.txt === '严格一致') {
    if (a === b) return null;
    if (sim(row.t, s.t) >= 0.92) return null;
    return { bad: '严格一致', tip: '该步骤要求严格一致，应照标准票原文填写' };
  }
  if (s.txt === '仅关键字严格') {
    const lost = s.k.filter(k => !a.includes(norm(k)));
    if (!lost.length) return null;
    const code = lost.filter(k => /[A-Z]|\d[A-Z]|^\d+P$/.test(k));
    return { bad: '仅关键字严格', tip: code.length ? '屏柜、压板、空开、把手编号应按屏柜附表填写，缺：' + lost.join('、') : '缺关键字：' + lost.join('、') };
  }
  if (sim(row.t, s.t) >= 0.55) return null;
  const lost = s.k.filter(k => !a.includes(norm(k)));
  if (!lost.length) return null;
  return { bad: '允许规范等价表达', tip: '表达与标准写法差异过大，缺：' + lost.join('、') };
}

/* ---------- 换序判定：同组且业务确认可换序的，组内顺序不同不判错 ---------- */
function tkSwappable(a, b) {
  if (a.grp !== b.grp) return false;
  if (a.swap === '否' || b.swap === '否') return false;
  const seq = TICKET_ORD.seq.find(g => g.includes(a.no) && g.includes(b.no));
  if (seq) return false;
  if ((TICKET_ORD.after[b.no] || []).includes(a.no)) return false;
  if ((TICKET_ORD.before[a.no] || []).includes(b.no)) return false;
  return true;
}

  const add = e => { errs.push(e); };
  const cite = (ref, words) => { const c = ruleFind(words, ref); return c.length ? c : (ref || []).map(ruleCite).filter(Boolean).slice(0, 2); };

  /* 1. 危险操作：确定性规则，优先级最高，命中即整票不合格；同一漏写项只在第一条命中的规则里计一次 */
  const covered = new Set();
  TICKET_DANGER.forEach(d => {
    const hits = tkDangerHits(d, pos);
    if (!hits.length) return;
    const fresh = hits.filter(x => !(x.lack && covered.has(x.a)));
    if (!fresh.length) return;
    fresh.forEach(x => { if (x.lack) covered.add(x.a); });
    const h0 = fresh[0], S = TSTEP[h0.b];
    fatal.push(d.n);
    add({
      kind: 'danger', at: pos[h0.b], stdNo: h0.b, std: S ? S.t : '',
      title: d.n, why: fresh.map(x => (x.lack ? '未写' : '把') + '第' + x.a + '项「' + TSTEP[x.a].t + '」' + (x.lack ? '，就' : '写在了') + '第' + x.b + '项「' + TSTEP[x.b].t + '」' + (x.lack ? '。' : '之后。')).join('') + d.why,
      whyBiz: d.src, cites: (d.ref || []).map(ruleCite).filter(Boolean), fix: d.fix,
      deduct: 0, fatalHit: true, cover: fresh.filter(x => x.lack).map(x => x.a), pairs: fresh.map(x => x.a + '>' + x.b)
    });
  });

  /* 2. 阶段越界：前一阶段必要条件未完成就出现下一阶段受限操作 */
  TICKET_META.stages.forEach(stg => {
    const st = stg.k, need = stg.need || [];
    if (!need.length) return;
    const first = TICKET.filter(s => s.st === st && !s.head).map(s => pos[s.no]).filter(v => v != null).sort((a, b) => a - b)[0];
    if (first == null) return;
    const lack = need.filter(no => (pos[no] == null || pos[no] > first) && !covered.has(no));
    if (!lack.length) return;
    const s0 = TICKET.filter(s => s.st === st && pos[s.no] === first)[0];
    add({
      kind: 'cross', at: first, stdNo: s0 ? s0.no : '', std: s0 ? s0.t : '',
      title: '阶段越界：' + (TICKET_META.stages.find(x => x.k === st) || {}).n,
      why: '进入该阶段前，上一阶段的必要操作「' + lack.map(no => '第' + no + '项 ' + TSTEP[no].t).join('；') + '」尚未完成，属于阶段越界，不是普通行号不一致。',
      whyBiz: (TICKET_META.stages.find(x => x.k === st) || {}).watch,
      cites: cite(['dz454', 'dz451'], ['操作顺序', '隔离开关', '断路器']),
      fix: '先补齐上一阶段的必要操作，再写本阶段步骤。', deduct: cfg.cross, cover: lack.filter(no => pos[no] == null)
    });
  });

  /* 3. 顺序错误：只在两步都写了的情况下判，按事件计一次，允许换序的不判 */
  const seen = {};
  const pair = (a, b) => {                       // 标准要求 a 在 b 之前
    if (pos[a] == null || pos[b] == null) return;
    if (pos[a] < pos[b]) return;
    const A = TSTEP[a], B = TSTEP[b];
    if (tkSwappable(A, B)) return;
    const key = a + '>' + b; if (seen[key]) return; seen[key] = 1;
    if (errs.some(e => (e.kind === 'cross' || e.kind === 'danger') && e.stdNo === b)) return;
    add({
      kind: 'order', at: pos[b], stdNo: b, std: B.t,
      title: '第' + b + '项写在了第' + a + '项之前',
      why: '标准票要求「' + A.t + '」在「' + B.t + '」之前。' + (B.ord ? '顺序要求：' + B.ord + '。' : ''),
      whyBiz: B.why || A.why || '', cites: cite((B.ref || []).concat(A.ref || []), [B.v, A.v].concat(B.k, A.k)),
      fix: '把第' + b + '项移到第' + a + '项之后。', deduct: cfg.order
    });
  };
  TICKET_ORD.seq.forEach(g => { for (let i = 0; i < g.length - 1; i++) pair(g[i], g[i + 1]); });
  Object.keys(TICKET_ORD.after).forEach(b => TICKET_ORD.after[b].forEach(a => pair(a, b)));
  Object.keys(TICKET_ORD.before).forEach(a => TICKET_ORD.before[a].forEach(b => pair(a, b)));
  if (pos[TICKET_ORD.last] != null) {
    const lastAt = pos[TICKET_ORD.last];
    const after = M.list.filter(x => x.s && x.i > lastAt);
    if (after.length) add({
      kind: 'order', at: lastAt, stdNo: TICKET_ORD.last, std: TSTEP[TICKET_ORD.last].t,
      title: '「' + TSTEP[TICKET_ORD.last].t + '」不是最后一项', why: '该项为全票最后一步，其后不应再有操作项目。', whyBiz: TSTEP[TICKET_ORD.last].why,
      cites: cite(['dz6119'], ['汇报', '巡维中心']), fix: '把该项移到全票最后。', deduct: cfg.order
    });
  }
  Object.keys(TICKET_ORD.tight).forEach(x => {
    const a = TICKET_ORD.tight[x];
    if (pos[x] == null || pos[a] == null || pos[x] < pos[a]) return;
    const between = M.list.filter(y => y.s && y.i > pos[a] && y.i < pos[x] && !TICKET_ORD.child[y.s.no]);
    if (!between.length) return;
    add({
      kind: 'order', at: pos[x], stdNo: x, std: TSTEP[x].t, title: '第' + x + '项未紧贴第' + a + '项之后',
      why: '顺序要求：' + TSTEP[x].ord + '。中间插入了「' + between.map(y => y.row.t).slice(0, 2).join('」「') + '」。',
      whyBiz: TSTEP[x].why, cites: cite(TSTEP[x].ref, TSTEP[x].k), fix: '把第' + x + '项紧接在第' + a + '项之后。', deduct: cfg.order
    });
  });

  /* 4. 漏项：优先按该步骤的漏写处理执行，不再因缺失制造后续顺序错误 */
  const coveredAll = new Set(); errs.forEach(e => (e.cover || []).forEach(no => coveredAll.add(no)));
  TICKET.forEach(s => {
    if (pos[s.no] != null || coveredAll.has(s.no)) return;
    const merged = M.list.find(x => x.s && x.s.no !== s.no && /[、和及]/.test(x.row.t) && s.k.every(k => norm(x.row.t).includes(norm(k))) && (!s.v || norm(x.row.t).includes(s.v)));
    if (merged) {                                  // 两项写进一行：按并项计文字错误，不再重复计漏项
      add({
        kind: 'text', at: merged.i, stdNo: s.no, std: s.t, title: '第' + merged.s.no + '项与第' + s.no + '项并项填写',
        why: '一个操作项目栏内只应有一个动词、一个操作对象，「' + merged.row.t + '」把两项合在了一行。',
        whyBiz: s.why, cites: cite(['dz618'], ['并项', '一个动词']), fix: merged.s.t + '　/　' + s.t, deduct: cfg.text
      });
      return;
    }
    const isFatal = s.miss === '整票不合格';
    if (isFatal && !fatal.includes('漏写整票不合格项')) fatal.push('漏写整票不合格项');
    add({
      kind: 'miss', at: null, stdNo: s.no, std: s.t, title: '漏写第' + s.no + '项' + (isFatal ? '（漏写即整票不合格）' : ''),
      why: '标准票第' + s.no + '项未在答卷中出现。该项漏写处理为「' + s.miss + '」。',
      whyBiz: s.why, cites: cite(s.ref, s.k.concat([s.v])), fix: s.t, deduct: cfg.miss, fatalHit: isFatal
    });
  });

  /* 5. 文字与层级 */
  M.list.forEach(x => {
    if (!x.s) {
      const lp = tkGearHit(x.row.t);
      if (lp) {
        add({
          kind: 'extra', at: x.i, stdNo: '—', std: '—', title: '标准票未列的压板 / 空开操作：' + lp.c + ' ' + lp.n,
          why: '这一项在标准票中没有，但「' + lp.c + ' ' + lp.n + '」是本任务相关屏柜（' + lp.p + '）上的设备，是否需要操作请由考评员核对。',
          whyBiz: '', cites: cite(['dz618'], ['压板', '连接片']), fix: '请考评员核对后确定是否保留。', deduct: 0, review: true
        });
        return;
      }
      add({
        kind: 'extra', at: x.i, stdNo: '—', std: '—', title: '无关步骤 / 未能匹配到标准步骤',
        why: '这一项在标准票中找不到对应步骤，可能是多写、写法偏离过大或设备编号写错。',
        whyBiz: '', cites: cite(['dz612'], ['双重名称', '术语']), fix: '核对设备双重名称与操作术语后重写，或删除该项。', deduct: cfg.extra, review: true
      });
      return;
    }
    const t = tkText(x.row, x.s);
    if (t) add({
      kind: 'text', at: x.i, stdNo: x.s.no, std: x.s.t, title: '第' + x.s.no + '项文字不符合「' + x.s.txt + '」要求',
      why: t.tip + '。该步骤的文字要求为「' + x.s.txt + '」。', whyBiz: x.s.why,
      cites: cite((x.s.ref || []).concat(['dz612', 'dz618']), ['双重名称', '术语', '并项']), fix: x.s.t, deduct: cfg.text
    });
    const p = TICKET_ORD.child[x.s.no];
    if (p && pos[p] != null && pos[p] > x.i) add({
      kind: 'level', at: x.i, stdNo: x.s.no, std: x.s.t, title: '第' + x.s.no + '项写在了父项第' + p + '项之前',
      why: '该项必须作为第' + p + '项的子步骤。' + (x.s.ord || ''), whyBiz: x.s.why,
      cites: cite(['dz6120'], ['主项', '子项', '汇控柜']), fix: '先写父项「' + TSTEP[p].t + '」，再把该项作为其子步骤。', deduct: cfg.text
    });
  });

  /* 6. 汇总 */
  const deduct = errs.reduce((s, e) => s + (e.deduct || 0), 0);
  const raw = Math.max(0, cfg.base - deduct);
  const score = fatal.length ? 0 : raw;
  const ok = !fatal.length && raw >= cfg.pass;
  const stages = TICKET_META.stages.map(st => {
    const all = TICKET.filter(s => s.st === st.k);
    const done = all.filter(s => pos[s.no] != null).length;
    return { k: st.k, n: st.n, done, n2: all.length, pct: Math.round(done / all.length * 100) };
  });
  const byKind = {}; errs.forEach(e => { byKind[e.kind] = (byKind[e.kind] || 0) + 1; });
  return { errs, fatal, score, raw, deduct, pass: ok, stages, byKind, match: M.list, pos, cfg, rows };
}

/* 答卷里出现的压板 / 空开编号是否属于本任务屏柜附表（标准票未列时交考评员核对，不扣分） */
function tkGearHit(text) {
  const n = norm(text);
  for (const g of TICKET_META.gear) for (const r of g.rows) {
    if (!/LP|K/.test(r[0]) || r[0].length < 3) continue;
    if (n.includes(norm(r[0])) && /压板|空气开关|空开/.test(n)) return { c: r[0], n: r[1], p: g.p };
  }
  return null;
}

/* ---------- 自动填票（讲师演示台用：一键生成七种典型答卷） ---------- */
function tkAuto(kind) {
  const base = TICKET.map(s => ({ no: s.no, t: s.t, parent: s.parent }));
  const a = base.slice();
  const at = no => a.findIndex(r => r.no === no);
  const sw = (x, y) => { const i = at(x), j = at(y); const t = a[i]; a[i] = a[j]; a[j] = t; };
  const moveBefore = (nos, target) => { const rows = nos.map(no => a.splice(at(no), 1)[0]); a.splice(at(target), 0, ...rows); };
  if (kind === 'ok') return base;
  if (kind === 'miss') return base.filter(r => !['12', '17.3', '25', '43'].includes(r.no));
  if (kind === 'order') { moveBefore(['33', '34', '35'], '30'); return a; }          // 一般顺序错误：先拉母线侧11032、后拉主变侧11034
  if (kind === 'swap') { sw('4', '5'); sw('17.1', '17.2'); sw('56.1', '56.2'); return a; }   // 允许换序：应当不判错
  if (kind === 'danger') return base.filter(r => r.no !== '40');                      // 危险操作：未检查带电显示装置无电压即合地刀
  if (kind === 'load') { moveBefore(['15', '16'], '10'); return a; }                 // 危险操作：未合532转负荷就断开503
  if (kind === 'text') {                                                              // 文字不规范：并项、缺双重名称
    a[at('50.1')] = { no: '50.1', t: '断开QS、QE刀闸电源2QL、110340地刀电机电源5ZK空气开关', parent: '50' };
    a[at('20')] = { no: '20', t: '断开1103开关', parent: null };
    return a.filter(r => r.no !== '50.2');
  }
  return base;
}

function emgHitGroups(text, groups) {
  const n = norm(text);
  const hit = groups.filter(g => g.split('|').some(w => n.includes(norm(w)))).length;
  const need = groups.length <= 2 ? groups.length : groups.length - 1;
  return { hit, need, full: hit >= need, part: hit > 0 && hit < need };
}
function emgScore(e, a) {
  a = a || {};

  const ptot = hasN ? EMG_CFG.pts : EMG_CFG.pts + EMG_CFG.notes, per = ptot / e.pts.length;
  const pts = e.pts.map((p, i) => {
    const r = emgHitGroups(a.pts || '', p.k);
    const st = r.full ? 'ok' : r.part ? 'part' : 'miss';
    return { i, t: p.t, st, got: st === 'ok' ? per : st === 'part' ? per / 2 : 0, per, aid: EMG_AID.test(p.t) };
  });
  const bads = hasN ? e.cs.bad.map((b, i) => {
    const r = emgHitGroups(a.cs || '', b.k);
    const per2 = EMG_CFG.notes / e.cs.bad.length;
    return { i, t: b.t, note: e.notes[b.n], st: r.full ? 'ok' : 'miss', got: r.full ? per2 : 0, per: per2 };
  }) : [];
  const rep = (e.rep || []).map(k => { const r = emgHitGroups(a.rep || '', EMG_REP[k].k); return { k, t: EMG_REP[k].t, st: r.full ? 'ok' : 'miss', got: r.full ? EMG_CFG.bonus : 0 }; });
  const sp = pts.reduce((s, x) => s + x.got, 0), sn = bads.reduce((s, x) => s + x.got, 0), sb = rep.reduce((s, x) => s + x.got, 0);
  const base = Math.round((sp + sn) * 10) / 10;
  const score = Math.min(100, Math.round((base + sb) * 10) / 10);
  const aid = pts.filter(x => x.aid);
  return {
    pts, bads, rep, sp: Math.round(sp * 10) / 10, sn: Math.round(sn * 10) / 10, sb, base, score, pass: score >= EMG_CFG.pass, ptot, hasN,
    keyMiss: bads.filter(x => x.st === 'miss').length,
    dims: {

  };
}

function emgReview(e, r) {

/* ---------------- KPI 数字滚动（页面首次渲染时） ---------------- */
function countUp(root) {
  (root || document).querySelectorAll('.kpi b, .rvbig').forEach(b => {
    if (b.__cu) return; b.__cu = true;
    const raw = b.textContent.trim(), m = /^(\d+(?:\.\d+)?)(.*)$/.exec(raw); if (!m) return;
    const end = parseFloat(m[1]), dec = (m[1].split('.')[1] || '').length, suf = m[2], t0 = performance.now(), dur = 700 + Math.min(500, end);
    const tick = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3); b.textContent = (end * e).toFixed(dec) + suf; if (k < 1) requestAnimationFrame(tick); else b.textContent = raw; };
    requestAnimationFrame(tick);
  });
}

/* ---------------- 背景动效：粒子 + 变电站剪影 ---------------- */
const HomeFX = (() => {
  let cv, ctx, raf = 0, active = false, N = [];
  function init() {
    cv = $('#fxp'); if (!cv) return;
    ctx = cv.getContext('2d');
    const rs = () => { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; };
    rs(); addEventListener('resize', rs);
    N = Array.from({ length: 56 }, () => ({
      x: Math.random(), y: Math.random(),
      vx: (Math.random() - .5) * 22e-5, vy: (Math.random() - .5) * 22e-5,
      r: 1 + Math.random() * 1.8
    }));
  }
  function tick() {
    if (!active || !ctx) return;
    const W = cv.width, H = cv.height, dp = devicePixelRatio;
    ctx.clearRect(0, 0, W, H);
    N.forEach(p => {
      p.x = (p.x + p.vx + 1) % 1; p.y = (p.y + p.vy + 1) % 1;
      ctx.beginPath(); ctx.arc(p.x * W, p.y * H, p.r * dp, 0, 7);
      ctx.fillStyle = 'color-mix(in srgb,var(--ac) 38%,transparent)'; ctx.fill();
    });
    for (let i = 0; i < N.length; i++) for (let j = i + 1; j < N.length; j++) {
      const dx = (N[i].x - N[j].x) * W, dy = (N[i].y - N[j].y) * H, d2 = dx * dx + dy * dy, lim = (130 * dp) ** 2;
      if (d2 < lim) {
        ctx.beginPath(); ctx.moveTo(N[i].x * W, N[i].y * H); ctx.lineTo(N[j].x * W, N[j].y * H);
        ctx.strokeStyle = `rgba(178,142,32,${(.26 * (1 - d2 / lim)).toFixed(3)})`; ctx.lineWidth = dp * .7; ctx.stroke();
      }
    }
    raf = requestAnimationFrame(tick);
  }
  return {
    init,
    on() { if (active) return; active = true; raf = requestAnimationFrame(tick); },
    off() { active = false; cancelAnimationFrame(raf); }
  };
})();
