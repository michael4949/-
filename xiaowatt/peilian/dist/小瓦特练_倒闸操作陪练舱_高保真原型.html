/* ---------------- 执行动作 ---------------- */
function doExecute(st) {
  const d = S.dev;
  switch (st.act) {
    case 'open': d[st.target] = 'open';
      pushMsg('110kV仿真站 培训三线1163开关 分闸 变位', 'new');
      pushMsg('110kV仿真站 培训三线1163开关 保护出口 复归', ''); break;
    case 'pull': d[st.target] = 'open';
      pushMsg(`110kV仿真站 ${st.target.slice(2)}刀闸 分闸 变位`, 'new'); break;
    case 'closeE':
      if (!(S.verify.v1 && S.verify.v2)) { redlineGround([]); return; }
      d[st.target] = 'close';
      pushMsg('110kV仿真站 培训三线线路侧116340地刀 合闸 变位', 'new'); break;
    case 'knob': d[st.target] = (d[st.target] === '远控' ? '就地' : '远控');
      pushMsg(`110kV仿真站 ${devName(st.target)} 切至${d[st.target]}`, ''); break;
    case 'mcb': d[st.target] = 'off';
      pushMsg(`110kV仿真站 ${devName(st.target)} 断开`, ''); break;
    case 'tag': S.tags[st.target] = true; break;
    case 'check': case 'verify': case 'gis':
      if (st.vd === 1) S.verify.v1 = true;
      if (st.vd === 2) S.verify.v2 = true;
      break;
  }
  // 异常注入（第11项 GIS 核对）
  if (st.act === 'gis' && st.target === 'DS11634' && S.abn.armed && !S.abn.fired) {
    S.abn.fired = true;
    pushMsg('110kV仿真站 培训三线11634刀闸 位置指示不一致 告警', 'alm');
  }
  setBeat(4);
  renderPanel(); renderTop();
  say('o', st.act === 'check' || st.act === 'gis' ? `（核对${devName(st.target)}）` : `（执行：${st.ticket}）`);
  if (st.act === 'gis') {
    speak('到现场按设备结构逐项核对四项位置指示，四项一致后再回报。', { pose: 'point' });
    if (st.target !== 'ES116340') goLoc('bay');
  } else {
    speak('执行到位。请检查设备状态并回报。', { pose: 'explain' });
  }
}

/* ---------------- 五拍推进 ---------------- */
function setBeat(b) { S.beat = b; renderBeats(); renderPanel(); updateActbar(); Sheet.sync(); }

async function enterStep(i) {
  const nst = STEPS[i];
  if (nst && !S.previewed[nst.phase]) {
    S.previewed[nst.phase] = true;
    if (nst.phase > 1) { return openPreview(nst.phase, () => enterStep(i)); }
  }
  S.idx = i; S.sel = null; S.gis = {}; S.beat = 0;
  const st = STEP();
  renderTicket(); renderTop(); renderLocbar(); renderBeats(); renderPanel(); updateActbar();
  if (st.act === 'recv' || st.act === 'report') useChar(st.act === 'recv' ? 'diaodu' : 'jianhu');
  else useChar('jianhu');

  if (st.loc !== S.loc) {
    say('j', `去${LOC[st.loc].name}。`);
    await speak(`去${LOC[st.loc].name}。`, { pose: 'point' });
    if (S.mode === 'teach') { goLoc(st.loc); say('s', `教学模式：已跟随监护人到达${LOC[st.loc].name}。`); }
  }
  // 票令陷阱
  let call = st.call;
  if (st.trap === 'order' && S.trap.armed && !S.trap.fired) {
    S.trap.fired = true;
    call = '现在调度下令：将110kV培训三线1163线路由运行转冷备用。';
  }
  if (st.act === 'recv') {
    S.ord.cur = call.replace(/^现在调度下令：/, '').replace(/。$/, '');
    S.ord.time = stamp();
    renderPanel();
  }
  say(st.act === 'recv' ? 'd' : 'j', call);
  await speak(call, { pose: st.act === 'recv' ? 'explain' : 'call', who: st.act === 'recv' ? '值班调度员' : '监护人 陈志远' });
  setBeat(1);
  if (st.act === 'recv') {
    say('s', '请复诵调度下令内容，并核对操作票任务与下令是否一致。');
  } else {
    say('s', `请到 ${LOC[st.loc].name}，手指操作对象「${devName(st.target)}」并完整复诵票面内容。`);
  }
}

/* ---------------- 复诵 / 回报 ---------------- */
async function submitInput() {
  if (S.lock) return;
  S.lock = true;
  try { await _submitInput(); } finally { S.lock = false; }
}
async function _submitInput() {
  const v = $('#rin').value.trim();
  if (!v) return;
  const st = STEP();
  $('#rin').value = '';
  if (S.beat === 1) {
    // 复诵
    if (st.act !== 'recv' && st.act !== 'report' && !S.sel) {
      say('o', v);
      violation('minor', 'dual', '只复诵未手指', '复诵前未手指操作对象',
        '附录E：遵守"手指口述"原则规范唱票复诵，做到口到、眼到、手到。');
      await speak('你只复诵了，没有手指操作对象。请手指设备后再复诵一次。', { pose: 'correct', shake: true });
      return;
    }
    say('o', v);
    const sc = sim(v, st.recite);
    if (sc < 0.62 && lenient('recite')) {
      say('s', `<span class="tag wn">提醒</span>复诵与票面不一致（吻合度 ${(sc * 100).toFixed(0)}%）。票面原文：${st.recite}。教学模式下这一次不计违规，请再念一遍。`);
      await speak('复诵与票面不一致。我再念一遍票面，你跟着复诵：' + st.recite, { pose: 'correct' });
      if (S.mode === 'teach') $('#rin').value = '';
      return;
    }
    if (sc < 0.62) {
      violation('minor', 'term', '复诵与票面不一致', `复诵内容与票面文字吻合度 ${(sc * 100).toFixed(0)}%`,
        '风险4：监护人完整唱票、操作人手指操作对象并复诵，监护人确认后方可操作。');
      await speak('复诵与票面不一致，请按票面文字完整复诵一次。', { pose: 'correct', shake: true });
      return;
    }
    if (sc < 0.86) {
      violation('minor', 'term', '复诵不完整', '缺少设备双重名称或电压等级等要素',
        '附录F 2.10：必须注明设备的电压等级，操作项目中设备名称须填写双重称号。');
      await speak('基本正确，但不够完整。设备双重名称要念全。本项先继续，记一次不规范。', { pose: 'correct' });
    }
    // 票令陷阱判定
    if (st.trap === 'order' && S.trap.fired && S.trap.passed === null) {
      S.trap.passed = false;
      violation('major', 'rule', '票令不一致未发现',
        '调度下令为"由运行转冷备用"，操作票任务为"由热备用转冷备用"，复诵后仍继续执行',
        '细则第十八条：接到调度正式指令后，应再次"三审"，核实操作票内容是否与调度正式指令一致。');
      useChar('jianhu');
      await speak('等一下。刚才调度下的令是"由运行转冷备用"，我们的操作票这一段是"由热备用转冷备用"。票令不一致，必须中止并汇报值班长。这一项你没有核出来。',
        { pose: 'stop', shake: true, who: '监护人 陈志远' });
      await reissueOrder();
      return;
    }
    useChar('jianhu');
    say('j', '对，执行。');
    await speak('对，执行。', { pose: 'confirm', nod: 1, who: '监护人 陈志远' });
    setBeat(3);
    if (st.act === 'recv' || st.act === 'report') { doPhone(st); return; }
    say('s', '已发出执行令。请在设备上执行本项操作。');
    return;
  }
  if (S.beat === 4) {
    say('o', v);
    // GIS 四项指示
    if (st.act === 'gis') {
      const need = ['hui', 'mech', 'arm', 'line'];
      const got = need.filter(k => S.gis[k]).length;
      if (S.abn.fired && !S.abn.handled && st.target === 'DS11634') {
        if (S.gis.mech) {
          redlineAbnormal(); return;
        }
      }
      if (got < 4) {
        violation('major', 'state', 'GIS位置确认不充分', `仅核对 ${got}/4 项位置指示即回报到位`,
          '附录G-5：GIS组合电器的刀闸、地刀操作后，应当检查监控后台刀闸位置显示、报文、汇控柜刀闸电气指示、刀闸机构箱机械指示、刀闸拐臂指示、转轴划线标识是否正确。');
        await speak('不行。GIS刀闸位置不能只看一两项。汇控柜电气指示、机构箱机械指示、拐臂指示、转轴划线标识，四项都要核对到。', { pose: 'stop', shake: true });
        return;
      }
    }
    if (st.vd === 2 && !S.verify.v1) {
      violation('major', 'rule', '验电顺序不完整', '未完成后台二次电压核对即进行第二种原理验电',
        '附录G-23：不能直接验电的，应有两个及以上非同样原理或非同源的指示且均已同时发生变化。');
    }
    const sc = sim(v, st.report);
    if (sc < 0.28) {
      violation('minor', 'term', '回报要素不全', '未说明设备位置、信号或报文核对结果',
        '附录G-21.2：操作后应在监控后台核对运行方式与操作结果相符，核对报文与操作过程相符。');
      await speak('回报太简单了。要说清楚设备位置、相关信号和报文的核对结果。本项先记一次不规范。', { pose: 'correct' });
    }
    await tickStep();
  }
}

async function tickStep() {
  const st = STEP();
  if (st._done) return;
  st._done = true;
  say('j', '收到。（在本项"操作√"栏标注 √）');
  await speak('收到。本项完成，我已经在操作票上标注对勾。', { pose: 'confirm', nod: 1 });
  S.score.rule += 4; S.score.order += 3; S.score.dual += 3; S.score.state += 3; S.score.term += 3;
  renderTicket(); renderTop();
  const order = S.plan ? S.plan.steps : STEPS.map((_, i) => i);
  const nx = order.find(k => !STEPS[k]._done);
  if (nx === undefined) { finish(); return; }
  setTimeout(() => enterStep(nx), 400);
}

/* 调度类项目 */

  if (st.act === 'recv') {

    }

}

    <div class="dh"><b>${o.title}</b><span style="font-size:11px;color:#93a9c4;font-family:var(--mono)">RED LINE · 一票否决</span><span class="cls">×</span></div>

      <div class="sec"><div class="st">正确做法</div><div class="sc">${o.right}</div></div>
      <div class="sec"><div class="st">事故后果推演</div>
        <canvas id="arc" width="820" height="230"></canvas>
        <div class="chain">${o.chain.map(c => `<div class="cn"><b>${c[0]}</b><span>${c[1]}</span></div>`).join('')}</div>
      </div>
    </div>
    <div class="df"><button class="btn" id="rl_replay">重放推演</button><button class="btn pri" id="rl_ok">返回被中止的项目</button></div>
  </div>`;
  document.body.appendChild(m);
  const close = () => { m.remove(); resumeAfterRedline(); };
  m.querySelector('.cls').onclick = close;
  m.querySelector('#rl_ok').onclick = close;
  m.querySelector('#rl_replay').onclick = () => arcAnim();
  setTimeout(arcAnim, 260);
}

function arcAnim() {
  const c = $('#arc'); if (!c) return;
  const g = c.getContext('2d'), W = c.width, H = c.height;
  let t = 0;
  const draw = () => {
    if (!document.body.contains(c)) return;
    t += 1 / 60;
    g.clearRect(0, 0, W, H);
    g.fillStyle = '#05090f'; g.fillRect(0, 0, W, H);
    // 设备示意
    g.strokeStyle = '#20344c'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(60, 40); g.lineTo(760, 40); g.stroke();
    g.fillStyle = '#7f9cbb'; g.font = '12px monospace';
    g.fillText('110kV 培训三线（线路侧仍带电）', 60, 30);
    g.strokeStyle = t > 1.1 ? '#e23b2e' : '#2b4767'; g.lineWidth = 3;
    g.beginPath(); g.moveTo(410, 40); g.lineTo(410, 120); g.stroke();
    // 地刀
    const close = Math.min(1, Math.max(0, (t - 0.35) / 0.8));
    g.save(); g.translate(410, 120);
    g.strokeStyle = close >= 1 ? '#e8b22a' : '#23b26a'; g.lineWidth = 5; g.lineCap = 'round';
    g.rotate((1 - close) * -0.9);
    g.beginPath(); g.moveTo(0, 0); g.lineTo(0, 62); g.stroke(); g.restore();
    g.strokeStyle = '#4a637f'; g.lineWidth = 3;
    g.beginPath(); g.moveTo(386, 186); g.lineTo(434, 186); g.stroke();
    g.beginPath(); g.moveTo(394, 194); g.lineTo(426, 194); g.stroke();
    g.beginPath(); g.moveTo(402, 202); g.lineTo(418, 202); g.stroke();
    g.fillStyle = '#5f7794'; g.font = '11px monospace';
    g.fillText('116340 接地刀闸', 448, 158);
    // 弧光
    if (t > 1.1 && t < 3.4) {
      const k = Math.min(1, (t - 1.1) / .35);
      const flick = .55 + .45 * Math.sin(t * 47) * Math.sin(t * 13);
      const R = (70 + 130 * k) * flick;
      const gr = g.createRadialGradient(410, 130, 4, 410, 130, R);
      gr.addColorStop(0, 'rgba(255,255,255,' + (.95 * flick) + ')');
      gr.addColorStop(.16, 'rgba(255,236,170,' + (.85 * flick) + ')');
      gr.addColorStop(.42, 'rgba(255,140,60,' + (.45 * flick) + ')');
      gr.addColorStop(1, 'rgba(255,60,40,0)');
      g.fillStyle = gr; g.beginPath(); g.arc(410, 130, R, 0, 7); g.fill();
      g.strokeStyle = 'rgba(255,255,255,' + (.85 * flick) + ')'; g.lineWidth = 2;
      for (let i = 0; i < 7; i++) {
        g.beginPath(); g.moveTo(410, 108);
        let x = 410, y = 108;
        for (let j = 0; j < 6; j++) { x += (Math.random() - .5) * 30; y += 12; g.lineTo(x, y); }
        g.stroke();
      }
      g.fillStyle = 'rgba(255,255,255,' + (.10 * flick) + ')'; g.fillRect(0, 0, W, H);
    }
    if (t > 1.35) {
      g.fillStyle = '#ff9aa8'; g.font = 'bold 15px sans-serif';
      g.fillText('带电合接地刀闸 → 金属性短路', 520, 60);
      g.fillStyle = '#ffcf7a'; g.font = '12px monospace';
      g.fillText('短路电流 ≈ 21.4 kA', 520, 84);
      g.fillText('电弧温度 > 6000 ℃', 520, 104);
    }
    if (t > 2.1) {
      g.fillStyle = '#ff9aa8'; g.font = '12px monospace';
      g.fillText('T+0.08s  线路保护动作', 60, 100);
      g.fillText('T+0.12s  母差保护动作', 60, 120);
      g.fillText('T+0.20s  110kV 2M 失压', 60, 140);
      g.fillText('后果      设备损坏 · 人身电弧灼伤 · 人为责任事件', 60, 160);
    }
    if (t < 4.6) requestAnimationFrame(draw);
  };
  draw();
}

function resumeAfterRedline() {
  const st = STEP();

  renderTicket();
}

async function autoStep() {

      await new Promise(r => setTimeout(r, 250));

    if (st.act === 'recv' && !S.ord.unit) { S.ord.unit = '深圳地调'; S.ord.from = '值班调度员'; renderPanel(); }
    $('#rin').value = st.recite; await new Promise(r => setTimeout(r, 150)); submitInput();

    if (st.target) devClick(st.target);

    if (st.act === 'verify' || st.act === 'check') { }

  }
}

const Sheet = {
  manual: null,   // 用户手动收起/展开后的意愿
  open(force) { const s = $('#sheet'); if (!s) return; s.classList.remove('closed'); $('#sheetpeek').classList.remove('show'); $('.arena').classList.add('sheetopen'); if (force) this.manual = null; },
  close() { const s = $('#sheet'); if (!s) return; s.classList.add('closed'); $('#sheetpeek').classList.add('show'); $('.arena').classList.remove('sheetopen'); },
  want() {
    // 自动规则：准备/五防阶段常开；执行阶段在需要手指、执行、回报时打开
    if (S.stage === 'prep' || S.stage === 'wufang') return true;

    const st = STEP(); if (!st) return false;
    if (st.act === 'recv' || st.act === 'report') return S.beat >= 1 && S.beat <= 4;
    return S.beat === 1 || S.beat === 3 || S.beat === 4;
  },
  sync() {
    if (this.manual === 'closed') { this.close(); return; }
    if (this.manual === 'open') { this.open(); return; }
    if (this.want()) this.open(); else this.close();
    const st = STEP();
    const pk = $('#sheetpeek');
    if (pk) pk.classList.toggle('need', S.stage === 'run' && !!st && this.want() === false && S.beat === 1);
  },
  bind() {

};

function retrieve(q) {
  const qs = norm(q);
  const grams = new Set();
  for (let i = 0; i < qs.length - 1; i++) grams.add(qs.slice(i, i + 2));
  let best = null, bs = 0;
  const cur = STEP();
  for (const k of KNOW) {
    k.body.forEach((b, bi) => {
      const tt = norm(k.t), th = norm(b[0]), tb = norm(b[1]);
      let sc = 0;
      grams.forEach(g => { if (tt.includes(g)) sc += 3; if (th.includes(g)) sc += 2; if (tb.includes(g)) sc += 1; });
      if (bi === 0) sc += 2;
      if (cur && STEPKP[cur.no] && STEPKP[cur.no].k.includes(k.id)) sc *= 1.25;
      if (sc > bs) { bs = sc; best = { text: b[1], src: k.t + '（' + k.sub + '）', topic: k.id }; }
    });
  }
  if (cur) {
    const t = norm(cur.ticket + cur.why + cur.rule);
    let sc = 0; grams.forEach(g => { if (t.includes(g)) sc++; });
    if (sc * 2.2 > bs) best = { text: cur.why, src: cur.rule, topic: (STEPKP[cur.no].k || [])[0] };
  }
  if (!best || bs < 6) best = { text: '这个问题知识库里没有直接对应的条款。你可以问我关于设备状态、三审票令、五防、唱票复诵、验电接地、GIS 位置核对、二次隔离、异常处置、调度记录这九类内容。', src: '知识地图', topic: null };
  return best;
}

/* ---------- 生成式复盘：依据本场真实过程 ---------- */
function genReview() {
  const done = STEPS.filter(s => s._done).length;
  const red = S.vio.filter(v => v.level === 'red');
  const major = S.vio.filter(v => v.level === 'major');
  const minor = S.vio.filter(v => v.level === 'minor');
  const hints = S.hints.length, asks = (S.asks || []).length;
  const p = [];
  p.push(`本次以操作人视角完成「${S.plan ? S.plan.name : '完整操作票'}」，用时 ${$('#ktime').textContent}，执行 ${done} 项。`);
  if (red.length) p.push(`触发一票否决 ${red.length} 次：${red.map(v => `第${v.step}项${v.title.replace(/（.*?）/, '')}`).join('；')}。这类错误在现场对应的是人身、设备或电网事故，任何一次都不允许发生，本次评价按否决处理。`);
  else p.push('全程未触碰红线，验电接地顺序与异常处置判断均正确。');
  if (major.length) p.push(`严重扣分 ${major.length} 项，集中在${Array.from(new Set(major.map(v => ({ order: '操作顺序', dual: '双人核对', state: '设备状态核对', rule: '规程符合', risk: '风险辨识', term: '术语记录' })[v.dim]))).join('、')}。${major[0] ? `例如第${major[0].step}项：${major[0].detail}。` : ''}`);
  if (minor.length) p.push(`不规范 ${minor.length} 处，主要是${Array.from(new Set(minor.map(v => v.title))).slice(0, 3).join('、')}，属于习惯问题，多练几次即可固化。`);
  if (S.praise.length) p.push(`值得肯定的是：${S.praise.map(x => x.title).join('、')}。`);
  if (hints || asks) p.push(`过程中使用提示 ${hints} 次、提问 ${asks} 次，说明对${hints > 2 ? '流程顺序' : '个别要点'}还不够熟练，建议在演练模式下再走一遍。`);
  if (S.abn.handled) p.push('发现指示不一致后按"凡变化必上报"处置，这是本次最有价值的表现。');
  return p.join('');
}

/* ① 六维雷达：本月实线 vs 上月虚线，顶点可点击下钻 */
function chRadar(dims, now, prev, opt) {
  const W = (opt && opt.w) || 330, H = (opt && opt.h) || 250, cx = W / 2, cy = H / 2 + 6, R = Math.min(W, H) / 2 - 44;
  const pt = (vals, k) => dims.map((_, i) => { const a = -Math.PI / 2 + i * Math.PI * 2 / dims.length, r = R * vals[i] / 100 * (k || 1); return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; });
  const ring = k => `<polygon points="${dims.map((_, i) => { const a = -Math.PI / 2 + i * Math.PI * 2 / dims.length; return `${cx + Math.cos(a) * R * k},${cy + Math.sin(a) * R * k}`; }).join(' ')}" fill="none" stroke="#e9e6d8"/>`;
  const P1 = pt(now), P0 = pt(prev);
  return `<svg viewBox="0 0 ${W} ${H}" class="chsvg">
    ${[.33, .66, 1].map(ring).join('')}
    ${dims.map((_, i) => { const a = -Math.PI / 2 + i * Math.PI * 2 / dims.length; return `<line x1="${cx}" y1="${cy}" x2="${cx + Math.cos(a) * R}" y2="${cy + Math.sin(a) * R}" stroke="#e9e6d8"/>`; }).join('')}
    <polygon points="${P0.map(p => p.join(',')).join(' ')}" fill="none" stroke="#b3bfb2" stroke-width="1.4" stroke-dasharray="4 4"/>
    <polygon class="anim-poly" points="${P1.map(p => p.join(',')).join(' ')}" fill="rgba(14,143,90,.16)" stroke="#0e8f5a" stroke-width="2"/>
    ${dims.map((n, i) => {
      const a = -Math.PI / 2 + i * Math.PI * 2 / dims.length, lr = R + 26;
      const lx = cx + Math.cos(a) * lr, ly = cy + Math.sin(a) * lr;
      const diff = now[i] - prev[i];
      return `<g class="hitv" data-dim="${i}" data-tip="${n} ${now[i]} 分 · 较上月${diff >= 0 ? '+' : ''}${diff}">
        <circle cx="${P1[i][0]}" cy="${P1[i][1]}" r="9" fill="transparent"/>
        <circle cx="${P1[i][0]}" cy="${P1[i][1]}" r="3.2" fill="#0e8f5a"/>
        <text x="${lx}" y="${ly}" text-anchor="middle" font-size="10" fill="#6b7a70">${n}</text>
        <text x="${lx}" y="${ly + 12}" text-anchor="middle" font-size="10.5" font-family="var(--mono)" fill="${now[i] < 70 ? '#a8821b' : '#0e8f5a'}">${now[i]}</text></g>`;
    }).join('')}
    <g font-size="10" fill="#98a69c"><rect x="${W - 92}" y="8" width="10" height="3" fill="#0e8f5a"/><text x="${W - 78}" y="13">本月</text>
    <rect x="${W - 46}" y="8" width="10" height="3" fill="#b3bfb2"/><text x="${W - 32}" y="13">上月</text></g></svg>`;
}

/* ② 近30天 双轴柱线：柱=时长(min) 线=次数，某日可点击下钻 */
function chCombo(byDay, opt) {
  const W = (opt && opt.w) || 340, H = (opt && opt.h) || 240, pl = 34, pr = 30, pt2 = 18, pb = 26, iw = W - pl - pr, ih = H - pt2 - pb;
  const days = []; for (let d = 29; d >= 0; d--) days.push({ d, m: (byDay[d] || {}).min || 0, c: (byDay[d] || {}).cnt || 0 });
  const mMax = Math.max(60, ...days.map(x => x.m)), cMax = Math.max(2, ...days.map(x => x.c));
  const bw = iw / 30 * .58;
  const X = i => pl + iw / 30 * (i + .5);
  const line = days.map((x, i) => x.c ? `${X(i)},${pt2 + ih - ih * x.c / cMax}` : null).filter(Boolean).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" class="chsvg">
    ${[0, .5, 1].map(k => `<line x1="${pl}" y1="${pt2 + ih * k}" x2="${W - pr}" y2="${pt2 + ih * k}" stroke="#e9e6d8"/>
      <text x="${pl - 5}" y="${pt2 + ih * k + 3}" text-anchor="end" font-size="9" fill="#98a69c">${Math.round(mMax * (1 - k))}</text>
      <text x="${W - pr + 5}" y="${pt2 + ih * k + 3}" font-size="9" fill="#98a69c">${(cMax * (1 - k)).toFixed(0)}</text>`).join('')}
    ${days.map((x, i) => x.m ? `<rect class="hitv anim-bar" data-day="${x.d}" data-tip="${dayLabel(x.d)} · ${x.m} 分钟 · ${x.c} 场" x="${X(i) - bw / 2}" y="${pt2 + ih - ih * x.m / mMax}" width="${bw}" height="${ih * x.m / mMax}" rx="1.5" fill="url(#gbar)" style="animation-delay:${i * 14}ms"/>` : '').join('')}
    <polyline class="anim-line" points="${line}" fill="none" stroke="#0e8f5a" stroke-width="1.6"/>
    ${days.map((x, i) => x.c ? `<circle class="hitv" data-day="${x.d}" data-tip="${dayLabel(x.d)} · ${x.c} 场" cx="${X(i)}" cy="${pt2 + ih - ih * x.c / cMax}" r="2.6" fill="#0e8f5a"/>` : '').join('')}
    ${days.map((x, i) => i % 6 === 0 ? `<text x="${X(i)}" y="${H - 8}" text-anchor="middle" font-size="9" fill="#98a69c">${dayLabel(x.d)}</text>` : '').join('')}
    <defs><linearGradient id="gbar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3c05a"/><stop offset="1" stop-color="#c9a227"/></linearGradient></defs>
    <g font-size="10" fill="#98a69c"><rect x="${pl}" y="4" width="10" height="5" fill="#c9a227"/><text x="${pl + 14}" y="9">时长(分钟)</text>
    <circle cx="${pl + 84}" cy="6.5" r="3" fill="#0e8f5a"/><text x="${pl + 91}" y="9">次数</text></g></svg>`;
}

/* ③ 练习方式分布 环形：分段可点击 */
function chDonut(cnt) {
  const W = 330, H = 240, cx = W / 2 - 44, cy = H / 2, R = 74, sw = 26;
  const CLR = { '完整操作票': '#0e8f5a', '分段练习': '#57bd8b', '专项练习': '#c9a227', '错题重练': '#8fa08b' };
  const keys = Object.keys(cnt), total = keys.reduce((a, k) => a + cnt[k], 0);
  const C = 2 * Math.PI * R; let acc = 0;
  const segs = keys.map(k => {
    const frac = cnt[k] / total, off = acc; acc += frac;

      stroke-dashoffset="${(-off * C).toFixed(1)}" transform="rotate(-90 ${cx} ${cy})"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="chsvg">${segs}
    <text x="${cx}" y="${cy - 4}" text-anchor="middle" font-size="26" font-family="var(--mono)" fill="#22352a">${total}</text>

}

/* ⑤ 能力对标热力矩阵（CSS Grid）：格可点击 */
function chHeat(dims, mine, team) {
  const cell = (v, extra) => {
    const t = Math.max(0, Math.min(1, (v - 40) / 60));
    const bg = `rgba(14,143,90,${(.08 + t * .70).toFixed(2)})`;
    const fg = t > .55 ? '#fff' : '#2d5c40';
    return `<div class="heatc hitv" data-tip="${extra}" style="background:${bg};color:${fg}">${v}</div>`;
  };
  return `<div class="heatg">
    <div class="heath"></div><div class="heath">我</div><div class="heath">班组均值</div><div class="heath">差距</div>
    ${dims.map((n, i) => {
      const d = mine[i] - team[i];
      return `<div class="heatn hitv" data-hdim="${i}" data-tip="点击查看「${n}」明细">${n}</div>
        ${cell(mine[i], `我的「${n}」 ${mine[i]} 分`)}
        ${cell(team[i], `班组均值 ${team[i]} 分（组织级口径）`)}
        <div class="heatc hitv ${d < 0 ? 'neg' : 'pos'}" data-hdim="${i}" data-tip="点击查看「${n}」明细与练习建议">${d >= 0 ? '+' + d : d}</div>`;
    }).join('')}</div>`;
}

/* ⑥ 岗位胜任度 仪表盘：整体可点击 */
function chGauge(f) {
  const W = 330, H = 240, cx = W / 2, cy = H / 2 + 36, R = 92;
  const a0 = Math.PI * 1.17, a1 = -Math.PI * .17;                 // 起止角
  const arc = (r, f0, f1, col, w2, cls) => {
    const s = a0 + (a1 - a0) * f0, e = a0 + (a1 - a0) * f1;
    const large = Math.abs(e - s) > Math.PI ? 1 : 0;
    return `<path class="${cls || ''}" d="M ${cx + Math.cos(s) * r} ${cy - Math.sin(s) * r} A ${r} ${r} 0 ${large} 1 ${cx + Math.cos(e) * r} ${cy - Math.sin(e) * r}" fill="none" stroke="${col}" stroke-width="${w2}" stroke-linecap="round"/>`;
  };
  const na = a0 + (a1 - a0) * f.pct / 100;
  return `<svg viewBox="0 0 ${W} ${H}" class="chsvg hitv" data-gauge="1" data-tip="点击查看胜任度构成与差距项">
    ${arc(R, 0, 1, '#ece9db', 15)}
    ${arc(R, 0, f.pct / 100, 'url(#ggau)', 15, 'anim-line')}
    ${[0, 25, 50, 75, 100].map(v => { const a = a0 + (a1 - a0) * v / 100; return `<text x="${cx + Math.cos(a) * (R + 20)}" y="${cy - Math.sin(a) * (R + 20) + 3}" text-anchor="middle" font-size="9" fill="#98a69c">${v}</text>`; }).join('')}
    <line x1="${cx}" y1="${cy}" x2="${cx + Math.cos(na) * (R - 24)}" y2="${cy - Math.sin(na) * (R - 24)}" stroke="#22352a" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="5" fill="#22352a"/>
    <text x="${cx}" y="${cy + 34}" text-anchor="middle" font-size="34" font-family="var(--mono)" fill="#0e8f5a">${f.pct}<tspan font-size="15" fill="#98a69c">%</tspan></text>
    <text x="${cx}" y="${cy + 52}" text-anchor="middle" font-size="10.5" fill="#6b7a70">${f.post} · 胜任度测算</text>
    <text x="${cx}" y="${cy + 68}" text-anchor="middle" font-size="9" fill="#98a69c">测算供参考，任职评定以人工审核为准</text>
    <defs><linearGradient id="ggau" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c9a227"/><stop offset="1" stop-color="#0e8f5a"/></linearGradient></defs></svg>`;
}

/* 小型六维条（复盘页展开行用） */
function miniBars(vals) {

}

  return `<svg viewBox="0 0 880 600" class="chsvg gmap">
    <path d="M85,505 C230,430 340,360 465,285 C540,320 620,300 695,250 C760,205 812,142 818,88"
      fill="none" stroke="#eef1e2" stroke-width="54" stroke-linecap="round"/>
    <path d="M555,88 C640,98 725,125 795,158 M425,135 C550,143 675,150 793,162"
      fill="none" stroke="#f2f4e9" stroke-width="30" stroke-linecap="round"/>
    <g stroke="#dfe3d0" stroke-dasharray="3 8"><line x1="315" y1="30" x2="315" y2="562"/><line x1="640" y1="30" x2="640" y2="562"/></g>
    <g font-size="12.5" fill="#b3bfaa" letter-spacing="6" text-anchor="middle">

    ${edges.map(e => `<path d="${e.d}" class="${EC[e.s]}" fill="none"/>`).join('')}
    ${edges.filter(e => e.p).map(e => `
      <circle r="3.4" fill="${e.s === 'act' ? '#c9a227' : '#0e8f5a'}" opacity=".9"><animateMotion dur="${e.s === 'act' ? '2.2s' : '3.6s'}" repeatCount="indefinite" path="${e.d}"/></circle>`).join('')}
    ${nodes.map(n => {
      const c = NC[n.s], r = n.s === 'cur' ? 17 : n.s === 'next' ? 15 : n.s === 'future' ? 12 : 13;
      return `<g class="hitv gnode" data-node="${n.id}" data-tip="${n.t}${n.v ? ' · ' + n.v : ''}">
      ${n.s === 'cur' ? `<circle cx="${n.x}" cy="${n.y}" r="26" fill="rgba(201,162,39,.2)"><animate attributeName="r" values="21;31;21" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".55;.1;.55" dur="2s" repeatCount="indefinite"/></circle>` : ''}
      <circle cx="${n.x}" cy="${n.y}" r="${r}" fill="${n.s === 'done' || n.s === 'cur' ? c : '#fff'}" stroke="${c}" stroke-width="${n.s === 'next' ? 2.6 : 2}" ${n.s === 'next' ? 'stroke-dasharray="5 4"' : ''}/>
      ${n.s === 'done' ? `<path d="M ${n.x - 6} ${n.y} l 4.2 5 l 8 -9.4" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/>` : ''}
      ${n.s === 'cur' ? `<circle cx="${n.x}" cy="${n.y}" r="6" fill="#fff"/>` : ''}
      ${n.s === 'next' ? `<text x="${n.x}" y="${n.y + 4.5}" text-anchor="middle" font-size="14" fill="#a8821b" font-weight="700">!</text>` : ''}
      <text x="${n.x}" y="${n.y + r + 19}" text-anchor="middle" font-size="13" fill="#2c3c31" font-weight="600">${n.t}</text>
      ${n.v ? `<text x="${n.x}" y="${n.y + r + 35}" text-anchor="middle" font-size="11.5" font-family="var(--mono)" fill="${n.s === 'cur' ? '#a8821b' : n.s === 'future' ? '#98a69c' : '#0e8f5a'}">${n.v}</text>` : ''}</g>`;
    }).join('')}
    <g font-size="11" fill="#98a69c" transform="translate(26,26)">
      <circle cx="5" cy="0" r="5" fill="#0e8f5a"/><text x="15" y="3">已完成</text>

      <circle cx="128" cy="0" r="5" fill="#fff" stroke="#c9a227" stroke-dasharray="3 3"/><text x="138" y="3">待完成</text>
      <circle cx="190" cy="0" r="5" fill="#fff" stroke="#b9c4b9"/><text x="200" y="3">规划中</text></g>
  </svg>`;
}

/* ---- 由 SESSIONS 推导的聚合（保证各图表数字一致） ---- */
function homeAgg() {
  const byDay = {};                      // 天 → {min, cnt}
  SESSIONS.forEach(s => { (byDay[s.d] = byDay[s.d] || { min: 0, cnt: 0 }); byDay[s.d].min += s.dur; byDay[s.d].cnt += 1; });
  const planCnt = {};                    // 练习方式 → 场次
  SESSIONS.forEach(s => { const k = s.plan.startsWith('专项') ? '专项练习' : s.plan.startsWith('分段') ? '分段练习' : s.plan.startsWith('完整') ? '完整操作票' : '错题重练'; planCnt[k] = (planCnt[k] || 0) + 1; });
  const weeks = [0, 0, 0, 0, 0], reds = [0, 0, 0, 0, 0];   // 近5周扣分/红线（w0=最近一周）
  SESSIONS.forEach(s => {
    const w = Math.min(4, Math.floor(s.d / 7));
    s.vio.forEach(v => { weeks[w] += v.lv === 'red' ? 10 : v.lv === 'major' ? 5 : 2; if (v.lv === 'red') reds[w] += 1; });
  });
  const totalMin = SESSIONS.reduce((a, s) => a + s.dur, 0);
  const avg = Math.round(SESSIONS.reduce((a, s) => a + s.score, 0) / SESSIONS.length);
  return { byDay, planCnt, weeks, reds, totalMin, avg, cnt: SESSIONS.length };
}

function dayLabel(d) {                   // 距今 d 天 → M/D
  const t = new Date(Date.now() - d * 864e5);
  return `${t.getMonth() + 1}/${t.getDate()}`;
}
function dateAfter(days) {
  const t = new Date(Date.now() + days * 864e5);
  return `${t.getMonth() + 1}月${t.getDate()}日`;
}

let __arenaEntered = false, __planPre = null, __xwTyped = false;
const COACH_IMGS = {};   // 构建时由 assets/coaches/<id>.png 内联
function goPage(h) { location.hash = '#' + h; }

/* ---------------- 路由 ---------------- */
function route() {
  let h = (location.hash || '').replace(/^#\/?/, '') || 'home';
  const toPlaza = h === 'plaza'; if (toPlaza) h = 'home';
  if (!['home', 'arena', 'review', 'growth', 'classroom'].includes(h)) h = 'home';
  $('#pg_arena').style.display = h === 'arena' ? '' : 'none';
  $('#pg_home').style.display = h === 'arena' ? 'none' : '';
  if (h === 'arena') {
    HomeFX.off();
    if (!__arenaEntered) { __arenaEntered = true; openEntry(__planPre); __planPre = null; }
  } else {
    const em = $('#en_mask'); if (em) { em.remove(); __arenaEntered = false; }
    renderHPage(h); HomeFX.on();
    if (toPlaza) setTimeout(() => { const p = $('#plaza'); if (p) p.scrollIntoView({ behavior: 'smooth' }); }, 80);
  }
  $$('#hnav .hnavi').forEach(a => a.classList.toggle('on', a.dataset.h === (toPlaza ? 'plaza' : h)));
}

function enterCoach(id, pre) {
  const c = COACHES.find(x => x.id === id);
  if (!c || !c.open) return toast('该教练在本单位尚未开通');
  __planPre = pre || null;
  if (location.hash === '#arena') { if (!__arenaEntered) { __arenaEntered = true; openEntry(__planPre); __planPre = null; } }
  else goPage('arena');
}

/* ---------------- AI 教练中心 ---------------- */

const COACH_GLYPH = { '变电运行': '运', '变电检修': '检', '配网': '配', '调度': '调', '营销服务': '营', '安全监督': '安', '班组管理': '班' };
const COACH_GRAD = { '变电运行': ['#1e63b8', '#4d97e8'], '变电检修': ['#0e7a5f', '#2fd08a'], '配网': ['#8a5a14', '#e8b22a'], '调度': ['#5b3a9e', '#c3a8e8'], '营销服务': ['#9e3a5b', '#e88aa8'], '安全监督': ['#9e4a1e', '#ff8a3d'], '班组管理': ['#14648a', '#4dc3e8'] };

function pagePlaza() {
  const doms = ['全部', ...new Set(COACHES.filter(c => PF.fam === '全部' || c.fam === PF.fam).map(c => c.dom))];
  const tags = ['全部', ...new Set(COACHES.flatMap(c => c.tags))];
  const list = COACHES.filter(c =>
    (PF.fam === '全部' || c.fam === PF.fam) &&
    (PF.dom === '全部' || c.dom === PF.dom) &&
    (PF.tag === '全部' || c.tags.includes(PF.tag)));

  return `
  <section id="plaza" class="plaza">
    <div class="pzh"><b>AI 教练中心</b><span>${COACHES.length} 位预设教练 · 覆盖 ${COACH_FAMS.length} 个岗位族 · 本单位已开通 ${COACHES.filter(c => c.open).length} 位</span></div>
    <div class="pzf"><label>岗位族</label>${['全部', ...COACH_FAMS].map(v => chip('fam', v, PF.fam)).join('')}</div>
    <div class="pzf"><label>业务域</label>${doms.map(v => chip('dom', v, PF.dom)).join('')}</div>
    <div class="pzf"><label>能力项</label>${tags.map(v => chip('tag', v, PF.tag)).join('')}</div>
    <div class="pzgrid">
      ${list.map(c => {
        const g = COACH_GRAD[c.fam];
        return `<div class="ccard ${c.open ? 'openc' : 'lockc'}" data-coach="${c.id}">
        <div class="crow1">
          ${COACH_IMGS[c.id] ? `<img class="cav" src="${COACH_IMGS[c.id]}" alt="${c.n}">` : `<div class="cav" style="background:linear-gradient(135deg,${g[0]},${g[1]})">${COACH_GLYPH[c.fam]}</div>`}
          <div class="cmeta"><b>${c.n}</b><span>${c.fam} · ${c.dom}</span></div>
          ${c.open ? '<span class="copen">已开通</span>' : '<span class="clock">未开通</span>'}
        </div>
        <div class="cdesc">${c.desc}</div>
        <div class="ctags">${c.tags.map(t => `<i>${t}</i>`).join('')}</div>
        <div class="cstat"><span>难度 ${'●'.repeat(c.lvl)}${'○'.repeat(3 - c.lvl)}</span><span>${c.min} 分钟</span><span>已练 ${c.users} 人</span><span>平均提分 +${c.gain}</span></div>
        ${c.open ? `<button class="btn pri cgo" data-coach="${c.id}">开始练习</button>` : ''}

function refreshPlaza() {
  const old = $('#plaza'); if (!old) return;
  const tmp = el('div', '', pagePlaza()); old.replaceWith(tmp.firstElementChild);
}

/* ---------------- 事件委托（首页与各薄页共用） ---------------- */
function bindHPage() {
  $('#hpage').onclick = e => {
    const q = s => e.target.closest(s); let n;
    if (n = q('[data-fchip]')) { PF[n.dataset.fchip] = n.dataset.v; if (n.dataset.fchip === 'fam') { PF.dom = '全部'; } refreshPlaza(); return; }
    if (n = q('.cgo')) return enterCoach(n.dataset.coach, null);
    if (n = q('[data-coach]')) { const c = COACHES.find(x => x.id === n.dataset.coach); return c && c.open ? enterCoach(c.id, null) : toast('该教练在本单位尚未开通'); }
    if (n = q('[data-reco]')) return recoAct(n.dataset.reco);
    if (n = q('[data-train]')) return enterCoach('daozha', n.dataset.train === 'full' ? null : n.dataset.train);
    if (n = q('[data-go]')) return goPage(n.dataset.go);
    if (n = q('[data-dim]')) return drillDim(+n.dataset.dim);
    if (n = q('[data-hdim]')) return drillDim(+n.dataset.hdim);
    if (n = q('[data-day]')) return drillDay(+n.dataset.day);
    if (n = q('[data-plan]')) return drillPlan(n.dataset.plan);
    if (n = q('[data-week]')) return drillWeek(+n.dataset.week);
    if (n = q('[data-gauge]')) return drillFit();
    if (n = q('[data-node]')) return nodeClick(n.dataset.node);
    if (n = q('[data-row]')) { const d = $('#rx' + n.dataset.row); if (d) d.hidden = !d.hidden; return; }
  };
}

function recoAct(id) {
  const r = RECO.find(x => x.coach === id), c = COACHES.find(x => x.id === id);
  if (c.open) return enterCoach(id, r.pre);
  PF.fam = c.fam; PF.dom = '全部'; PF.tag = '全部'; refreshPlaza();
  const p = $('#plaza'); if (p) p.scrollIntoView({ behavior: 'smooth' });
}

/* ---------------- 下钻弹层 ---------------- */
function openDrill(title, sub, html, foot) {
  const m = el('div', 'mask lite');
  m.innerHTML = `<div class="dlg" style="width:min(720px,95vw)">
    <div class="dh"><b>${title}</b><span style="font-size:11px;color:#93a9c4">${sub || ''}</span><span class="cls">×</span></div>
    <div class="db" style="max-height:64vh;overflow:auto">${html}</div>
    ${foot ? `<div class="df">${foot}</div>` : ''}</div>`;
  document.body.appendChild(m);
  m.querySelector('.cls').onclick = () => m.remove();
  m.onclick = e => {
    if (e.target === m) return m.remove();
    const q = s => e.target.closest(s); let n;
    if (n = q('[data-train]')) { m.remove(); return enterCoach('daozha', n.dataset.train === 'full' ? null : n.dataset.train); }
    if (n = q('[data-go]')) { m.remove(); return goPage(n.dataset.go); }
  };
  return m;
}
function sessTable(list) {
  return `<table class="htbl"><tr><th>日期</th><th>练习方式</th><th>模式</th><th>用时</th><th>得分</th><th>扣分项</th></tr>
    ${list.map(s => `<tr><td class="mono">${dayLabel(s.d)}</td><td>${s.plan}</td><td>${s.mode}</td><td class="mono">${s.dur} 分钟</td>
      <td class="mono ${s.score < 75 ? 'wv' : ''}">${s.score}</td><td>${s.vio.length ? s.vio.length + ' 项' : '—'}</td></tr>`).join('')}</table>`;
}
function vioDim(v) {
  const t = v.t;
  if (/核对|指示/.test(t)) return '设备状态核对';
  if (/复诵|唱票|双重名称/.test(t)) return '唱票复诵';
  if (/接令|术语|用语|汇报/.test(t)) return '调度术语';
  if (/验电|接地|规程|记录/.test(t)) return '规程记忆';
  if (/异常|中止/.test(t)) return '异常处置';
  return '风险辨识';
}
const DIM_PLAN = { '设备状态核对': ['sp_gis', 'GIS 四项核对'], '调度术语': ['sp_ord', '接令与票令核对'], '规程记忆': ['sp_vd', '验电接地'], '唱票复诵': ['sp_vd', '验电接地'] };

function drillDim(i) {
  const n = DIMS6[i];
  const hints = SESSIONS.filter(s => s.hints.some(h => h[0] === n));
  const vios = SESSIONS.flatMap(s => s.vio.filter(v => vioDim(v) === n).map(v => ({ ...v, d: s.d })));
  const sp = DIM_PLAN[n];
  openDrill(`能力明细 · ${n}`, `本月 ${RADAR_NOW[i]} 分 · 上月 ${RADAR_PREV[i]} 分 · 班组均值 ${TEAM_AVG[i]} 分`, `
    <div class="sec"><div class="st">相关扣分记录（近30天）</div><div class="sc">
      ${vios.length ? `<table class="htbl"><tr><th>日期</th><th>第几项</th><th>扣分内容</th><th>依据</th></tr>
        ${vios.map(v => `<tr><td class="mono">${dayLabel(v.d)}</td><td class="mono">第${v.step}项</td>
        <td><span class="tag ${v.lv === 'red' ? 'rl' : v.lv === 'major' ? 'wn' : ''}">${v.lv === 'red' ? '一票否决' : v.lv === 'major' ? '严重' : '不规范'}</span> ${v.t}</td>
        <td class="mono">${v.cite}</td></tr>`).join('')}</table>` : '近30天该维度无扣分记录。'}</div></div>
    <div class="sec"><div class="st">提示使用记录</div><div class="sc">
      ${hints.length ? hints.map(s => `<div class="hrow"><span class="mono">${dayLabel(s.d)}</span> ${s.plan} · ${s.hints.filter(h => h[0] === n).map(h => h[1]).join('、')}</div>`).join('') : '近30天该维度未使用提示。'}</div></div>`,
    `${sp ? `<button class="btn pri" data-train="${sp[0]}">练「${sp[1]}」专项</button>` : ''}<button class="btn" data-go="review">打开评分复盘</button>`);
}
function drillDay(d) {
  const list = SESSIONS.filter(s => s.d === d);
  openDrill(`练习明细 · ${dayLabel(d)}`, `${list.length} 场 · 合计 ${list.reduce((a, s) => a + s.dur, 0)} 分钟`, sessTable(list),
    `<button class="btn" data-go="review">打开评分复盘</button>`);
}
function drillPlan(k) {
  const match = s => (k === '专项练习' && s.plan.startsWith('专项')) || (k === '分段练习' && s.plan.startsWith('分段')) || (k === '完整操作票' && s.plan.startsWith('完整')) || (k === '错题重练' && s.plan.startsWith('错题'));
  const list = SESSIONS.filter(match);
  openDrill(`练习方式明细 · ${k}`, `近30天 ${list.length} 场`, sessTable(list),
    `<button class="btn" data-go="review">打开评分复盘</button>`);
}
function drillWeek(w) {
  const list = SESSIONS.filter(s => Math.min(4, Math.floor(s.d / 7)) === w && s.vio.length);
  const vios = list.flatMap(s => s.vio.map(v => ({ ...v, d: s.d, plan: s.plan })));
  openDrill(`扣分明细 · ${w === 0 ? '本周' : w + ' 周前'}`, `扣分 ${homeAgg().weeks[w]} · 红线 ${homeAgg().reds[w]} 次`, `
    ${vios.length ? `<table class="htbl"><tr><th>日期</th><th>场次</th><th>扣分内容</th><th>依据</th></tr>
      ${vios.map(v => `<tr><td class="mono">${dayLabel(v.d)}</td><td>${v.plan}</td>
      <td><span class="tag ${v.lv === 'red' ? 'rl' : v.lv === 'major' ? 'wn' : ''}">${v.lv === 'red' ? '一票否决' : v.lv === 'major' ? '严重' : '不规范'}</span> 第${v.step}项 ${v.t}</td>
      <td class="mono">${v.cite}</td></tr>`).join('')}</table>` : '当周无扣分记录。'}`,
    `<button class="btn" data-go="review">打开评分复盘</button>`);
}
function drillFit() {
  openDrill(`岗位胜任度构成 · ${FITNESS.post}`, `综合测算 ${FITNESS.pct}%`, `
    <table class="htbl"><tr><th>构成项</th><th>当前</th><th>要求</th><th>状态</th></tr>
      ${FITNESS.parts.map(p => `<tr><td>${p.n}</td><td class="mono">${p.v}</td><td class="mono">${p.need}</td>
        <td>${p.ok ? '<span class="tag ok">达标</span>' : '<span class="tag wn">待补齐</span>'}</td></tr>`).join('')}</table>
    <div class="sec" style="margin-top:12px"><div class="st">差距项</div><div class="sc">
      ${FITNESS.parts.filter(p => !p.ok).map(p => `<div class="hrow">· ${p.gap}</div>`).join('') || '无'}</div></div>
    <div class="tk3" style="margin-top:10px">胜任度为系统测算参考，任职资格评定以人工审核结果为准。</div>`,
    `<button class="btn" data-go="growth">查看成长档案</button><button class="btn pri" data-train="full">去完成演练场次</button>`);
}

  if (id === 'g4') { const l = SESSIONS.filter(s => s.plan.startsWith('分段') || s.plan.startsWith('专项')); return openDrill('分段与专项强化', `近30天 ${l.length} 场`, sessTable(l), `<button class="btn" data-go="review">打开评分复盘</button>`); }
  if (id === 'g8') return openDrill('晋升通道 · 主值', '当前差距项', `
    <table class="htbl"><tr><th>差距项</th><th>当前</th><th>要求</th></tr>
    ${FITNESS.parts.filter(p => !p.ok).map(p => `<tr><td>${p.n}</td><td class="mono">${p.v}</td><td class="mono">${p.need}</td></tr>`).join('')}</table>
    <div class="tk3" style="margin-top:10px">晋升资格以人工审核结果为准。</div>`,
    `<button class="btn" data-go="growth">查看成长档案</button><button class="btn pri" data-train="full">去完成演练场次</button>`);
  if (id === 'b2') return openDrill('实操场次', `12 / 15 场（胜任度要求）`, sessTable(SESSIONS),
    `<button class="btn pri" data-train="full">去完成任务</button>`);
}

}
const PLAN2ID = [['完整', 'full'], ['分段 · 运行', 'p1'], ['分段 · 热备用', 'p2'], ['分段 · 冷备用', 'p3'], ['专项 · GIS', 'sp_gis'], ['专项 · 验电', 'sp_vd'], ['专项 · 接令', 'sp_ord'], ['错题', 'wrong']];

/* ---------------- 悬浮提示 ---------------- */
function bindTip() {
  const tip = $('#htip'), hm = $('#pg_home');
  hm.addEventListener('mousemove', e => {
    const n = e.target.closest('[data-tip]');
    if (!n) { tip.hidden = true; return; }
    tip.textContent = n.dataset.tip; tip.hidden = false;
    const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 10);
    tip.style.left = x + 'px'; tip.style.top = (e.clientY + 16) + 'px';
  });
  hm.addEventListener('mouseleave', () => { tip.hidden = true; });
}

/* ---------------- 打字机 ---------------- */
function typeInto(node, text) {
  if (!node) return; let i = 0; node.textContent = '';
  const t = setInterval(() => { i += 1; node.textContent = text.slice(0, i); if (i >= text.length) clearInterval(t); }, 26);
}

/* ---------------- 背景动效：粒子 + 变电站剪影 ---------------- */
const HomeFX = (() => {
  let cv, ctx, raf = 0, active = false, N = [];
  function init() {
    cv = $('#fxp'); if (!cv) return;
    ctx = cv.getContext('2d');
    const rs = () => { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; };
    rs(); addEventListener('resize', rs);
    N = Array.from({ length: 56 }, () => ({
      x: Math.random(), y: Math.random(),
      vx: (Math.random() - .5) * 22e-5, vy: (Math.random() - .5) * 22e-5,
      r: 1 + Math.random() * 1.8
    }));
  }
  function tick() {
    if (!active || !ctx) return;
    const W = cv.width, H = cv.height, dp = devicePixelRatio;
    ctx.clearRect(0, 0, W, H);
    N.forEach(p => {
      p.x = (p.x + p.vx + 1) % 1; p.y = (p.y + p.vy + 1) % 1;
      ctx.beginPath(); ctx.arc(p.x * W, p.y * H, p.r * dp, 0, 7);
      ctx.fillStyle = 'rgba(14,143,90,.38)'; ctx.fill();
    });
    for (let i = 0; i < N.length; i++) for (let j = i + 1; j < N.length; j++) {
      const dx = (N[i].x - N[j].x) * W, dy = (N[i].y - N[j].y) * H, d2 = dx * dx + dy * dy, lim = (130 * dp) ** 2;
      if (d2 < lim) {
        ctx.beginPath(); ctx.moveTo(N[i].x * W, N[i].y * H); ctx.lineTo(N[j].x * W, N[j].y * H);
        ctx.strokeStyle = `rgba(178,142,32,${(.26 * (1 - d2 / lim)).toFixed(3)})`; ctx.lineWidth = dp * .7; ctx.stroke();
      }
    }
    raf = requestAnimationFrame(tick);
  }
  return {
    init,
    on() { if (active) return; active = true; raf = requestAnimationFrame(tick); },
    off() { active = false; cancelAnimationFrame(raf); }
  };
})();
