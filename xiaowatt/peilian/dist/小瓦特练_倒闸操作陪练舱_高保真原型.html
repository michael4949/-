<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小瓦特·练 · AI智能陪练底座</title>
<style>
/* ===== 小瓦特·练 · 陪练舱 ===== */
:root{
  --bg:#060d18; --bg2:#0a1524; --panel:#0e1b2e; --panel2:#122238; --line:#1c3350;
  --line2:#26456b; --txt:#e6edf6; --txt2:#93a9c4; --txt3:#5f7794;
  --csg:#1e63b8; --csgD:#00367A; --csgL:#4d97e8;
  --on:#e23b2e;      /* 合闸/带电 红 */
  --off:#23b26a;     /* 分闸/停电 绿 */
  --gnd:#e8b22a;     /* 接地 黄 */
  --warn:#ff8a3d; --red:#ff3b52; --ok:#2fd08a;
  --mono:'JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace;
  --ui:'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--ui);font-size:13px;overflow:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(1200px 600px at 12% -10%, rgba(30,99,184,.20), transparent 60%),
    radial-gradient(900px 500px at 100% 110%, rgba(20,140,120,.12), transparent 60%);
}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.05;
  background-image:linear-gradient(rgba(255,255,255,.7) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.7) 1px,transparent 1px);
  background-size:44px 44px;mask-image:radial-gradient(ellipse at 50% 40%,#000 20%,transparent 78%)}
#app{position:relative;z-index:2;height:100vh;display:flex;flex-direction:column}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#22405f;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}
button{font-family:inherit}

/* ---------- 顶栏 ---------- */
.top{display:flex;align-items:center;gap:16px;padding:0 16px;height:56px;flex:none;
  background:linear-gradient(180deg,#0b1728,#081321);border-bottom:1px solid var(--line);
  box-shadow:0 6px 22px rgba(0,0,0,.5)}
.brand{display:flex;align-items:center;gap:12px;padding-right:16px;border-right:1px solid var(--line)}
.brand img{height:30px;display:block;filter:brightness(0) invert(1) opacity(.92)}
.brand .pill{font-size:11px;color:var(--csgL);border:1px solid #1d4b7d;background:#0d2745;
  padding:2px 8px;border-radius:3px;letter-spacing:.5px;white-space:nowrap}
.task{min-width:0}
.task .t1{font-size:14px;font-weight:700;letter-spacing:.4px;white-space:nowrap}
.task .t2{font-size:11px;color:var(--txt3);margin-top:2px;font-family:var(--mono)}
.spacer{flex:1}
.states{display:flex;align-items:center;gap:0}
.stp{display:flex;align-items:center;gap:7px;padding:0 12px;position:relative}
.stp:not(:last-child)::after{content:'';width:22px;height:1px;background:var(--line2);position:absolute;right:-11px}
.stp i{width:9px;height:9px;border-radius:50%;background:#1d3350;border:1px solid #2c4d72;display:block}
.stp span{font-size:12px;color:var(--txt3);white-space:nowrap}
.stp.done i{background:var(--off);border-color:var(--off);box-shadow:0 0 8px rgba(35,178,106,.7)}
.stp.done span{color:var(--txt2)}
.stp.cur i{background:var(--warn);border-color:var(--warn);box-shadow:0 0 10px rgba(255,138,61,.9);animation:pulse 1.4s infinite}
.stp.cur span{color:#ffd0a8;font-weight:700}
@keyframes pulse{50%{transform:scale(1.35)}}
.kpis{display:flex;gap:10px}
.kpi{background:#0c1a2c;border:1px solid var(--line);border-radius:5px;padding:5px 11px;min-width:76px}
.kpi b{display:block;font-family:var(--mono);font-size:16px;line-height:1.1;letter-spacing:.5px}
.kpi span{font-size:10px;color:var(--txt3)}
.kpi.bad b{color:var(--red)} .kpi.warn b{color:var(--warn)} .kpi.good b{color:var(--ok)}

/* ---------- 主体 ---------- */
.main{flex:1;display:grid;grid-template-columns:392px 1fr 384px;gap:1px;background:var(--line);min-height:0}
.col{background:var(--bg2);min-height:0;display:flex;flex-direction:column;overflow:hidden}

/* ---------- 数字人舞台 ---------- */
.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#07101d}
#scene{position:absolute;inset:0}
#dh{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center}
#dh svg{width:100%;height:100%}
.stage-tag{position:absolute;left:12px;top:12px;display:flex;gap:8px;align-items:center;z-index:5}
.stage-tag .loc{background:rgba(6,16,28,.82);border:1px solid var(--line2);border-radius:4px;
  padding:5px 10px;font-size:12px;color:#bcd4ee;backdrop-filter:blur(4px);max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage-tag .live{display:flex;align-items:center;gap:5px;background:rgba(226,59,46,.16);
  border:1px solid rgba(226,59,46,.5);border-radius:4px;padding:5px 9px;font-size:11px;color:#ff9a90;font-family:var(--mono)}
.stage-tag .live i{width:6px;height:6px;border-radius:50%;background:#ff5646;animation:pulse 1.1s infinite}
.rolecard{position:absolute;right:12px;bottom:104px;z-index:6;background:rgba(6,16,28,.86);
  border:1px solid var(--line2);border-radius:5px;padding:7px 10px;backdrop-filter:blur(4px);text-align:right;max-width:180px}
.rolecard b{display:block;font-size:12.5px;letter-spacing:.8px}
.rolecard span{font-size:10px;color:var(--csgL);line-height:1.4;display:block}
.rolecard em{display:none}
.sub{position:absolute;left:0;right:0;bottom:0;padding:12px 14px 14px;z-index:6;
  background:linear-gradient(180deg,transparent,rgba(4,10,18,.94) 34%)}
.sub .who{font-size:10.5px;color:var(--csgL);letter-spacing:1px;margin-bottom:4px}
.sub .txt{font-size:14.5px;line-height:1.6;min-height:46px;text-shadow:0 2px 10px #000}
.sub .txt .hl{color:#ffd88a}
.dh-wave{display:inline-flex;gap:2px;align-items:flex-end;height:11px;margin-left:6px;vertical-align:-1px}
.dh-wave i{width:2px;background:var(--csgL);border-radius:1px;animation:wv .6s infinite ease-in-out}
.dh-wave i:nth-child(2){animation-delay:.1s}.dh-wave i:nth-child(3){animation-delay:.2s}
.dh-wave i:nth-child(4){animation-delay:.3s}.dh-wave i:nth-child(5){animation-delay:.15s}
@keyframes wv{0%,100%{height:3px}50%{height:11px}}

/* 唇形·动作同步指示条 */
.sync{flex:none;display:flex;align-items:center;gap:7px;padding:6px 10px;border-top:1px solid var(--line);
  background:#081321;font-family:var(--mono);font-size:10px;color:var(--txt3);overflow:hidden}
.sync .lb{color:var(--csgL);letter-spacing:1px;flex:none}
.sync .ch{background:#123763;color:#dbeafe;border-radius:3px;padding:1px 6px;font-size:12px;
  font-family:var(--ui);min-width:26px;text-align:center;flex:none}
.sync b{color:#cfe4fb;font-weight:600;flex:none;white-space:nowrap}
.sync .bar{flex:1 1 24px;height:5px;background:#12233a;border-radius:3px;overflow:hidden;min-width:20px}
.sync .bar i{display:block;height:100%;background:linear-gradient(90deg,#1e63b8,#4d97e8);width:0%}
.sync .g{color:#8fe8c0;flex:none;white-space:nowrap}
.beats{flex:none;display:flex;border-top:1px solid var(--line);background:#091425}
.beat{flex:1;padding:9px 2px 8px;text-align:center;position:relative;border-right:1px solid #10203a}
.beat:last-child{border-right:0}
.beat b{display:block;font-size:10.5px;white-space:nowrap;color:var(--txt3);font-weight:600;letter-spacing:.3px}
.beat i{display:block;font-style:normal;font-family:var(--mono);font-size:9px;color:#3d566f;margin-top:2px}
.beat.on{background:linear-gradient(180deg,rgba(30,99,184,.30),rgba(30,99,184,.05))}
.beat.on b{color:#9ecbff}
.beat.on::before{content:'';position:absolute;left:0;right:0;top:0;height:2px;background:var(--csgL);box-shadow:0 0 10px var(--csgL)}
.beat.done b{color:var(--ok)}
.beat.done i::after{content:' ✓'}

/* ---------- 中列：设备操作区 ---------- */
.opbar{flex:none;display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);background:#0b1728}
.opbar .lbl{font-size:11px;color:var(--txt3);letter-spacing:1px}
.opbar .now{font-size:13px;font-weight:700;color:#cfe4fb}
.locbar{flex:none;display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);background:#091423}
.locbtn{flex:none;background:#0d1d31;border:1px solid var(--line);color:var(--txt3);border-radius:4px;
  padding:5px 10px;font-size:11.5px;cursor:pointer;transition:.15s;white-space:nowrap}
.locbtn:hover{border-color:var(--line2);color:var(--txt2)}
.locbtn.cur{background:#123763;border-color:#2a6fbe;color:#dbeafe}
.locbtn.need{border-color:#7a5a1a;color:#ffcf7a;animation:needp 1.6s infinite}
@keyframes needp{50%{background:#2a1f08}}
.panelwrap{flex:1;min-height:0;overflow:auto;padding:14px;position:relative}
.pnl{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:12px;margin-bottom:12px}
.pnl h4{margin:0 0 10px;font-size:12px;color:#a9c4e2;letter-spacing:1px;font-weight:700;
  display:flex;align-items:center;gap:8px}
.pnl h4::before{content:'';width:3px;height:12px;background:var(--csgL);border-radius:2px}
.pnl h4 .r{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--txt3);letter-spacing:0}

/* 一次接线图 */
.sld{background:#081222;border:1px solid var(--line);border-radius:6px}
.sld svg{display:block;width:100%}
.dev{cursor:pointer}
.dev .hit{fill:transparent}
.dev:hover .hit{fill:rgba(77,151,232,.14)}
.dev.sel .hit{fill:rgba(255,216,138,.18);stroke:#ffd88a;stroke-width:1.4;stroke-dasharray:3 3}
.dev.tgt .hit{stroke:#4d97e8;stroke-width:1.4;stroke-dasharray:4 3;fill:rgba(77,151,232,.10);animation:tgtp 1.6s infinite}
@keyframes tgtp{50%{fill:rgba(77,151,232,.24)}}
.devlbl{font-family:var(--mono);font-size:10px;fill:#8fb2d8}
.devnm{font-size:10.5px;fill:#cfe0f2}

/* 遥测 / 报文 */
.telem{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tm{background:#0a1626;border:1px solid var(--line);border-radius:5px;padding:8px 10px;cursor:pointer}
.tm:hover{border-color:var(--line2)}
.tm.sel{border-color:#ffd88a;box-shadow:0 0 0 1px rgba(255,216,138,.3)}
.tm span{font-size:10px;color:var(--txt3);display:block}
.tm b{font-family:var(--mono);font-size:18px;color:#8fe8c0;letter-spacing:.5px}
.tm.zero b{color:#5f7794}
.msgs{height:118px;overflow:auto;background:#070f1c;border:1px solid var(--line);border-radius:5px;padding:8px;font-family:var(--mono);font-size:10.5px;line-height:1.8}
.msgs div{color:#7f9cbb;white-space:nowrap}
.msgs div.new{color:#8fe8c0}
.msgs div.alm{color:#ff9a6b}
.msgs .ts{color:#4a637f;margin-right:7px}

/* 屏柜 / 汇控柜 */
.cab{display:grid;gap:10px}
.cab.c2{grid-template-columns:1fr 1fr}
.cab.c3{grid-template-columns:repeat(3,1fr)}
.knob{background:#0b1729;border:1px solid var(--line);border-radius:6px;padding:12px;text-align:center;cursor:pointer;transition:.15s}
.knob:hover{border-color:var(--line2)}
.knob.tgt{border-color:#4d97e8;box-shadow:0 0 0 1px rgba(77,151,232,.35)}
.knob .nm{font-family:var(--mono);font-size:12px;color:#cfe0f2;margin-bottom:2px}
.knob .de{font-size:10px;color:var(--txt3);margin-bottom:9px;height:26px}
.knob svg{display:block;margin:0 auto}
.knob .st{margin-top:8px;font-size:11px;font-family:var(--mono)}
.knob .st.a{color:var(--on)} .knob .st.b{color:var(--off)}
.mcb{background:#0b1729;border:1px solid var(--line);border-radius:6px;padding:10px;cursor:pointer;display:flex;gap:10px;align-items:center;transition:.15s}
.mcb:hover{border-color:var(--line2)}
.mcb.tgt{border-color:#4d97e8;box-shadow:0 0 0 1px rgba(77,151,232,.35)}
.mcb .body{width:26px;height:44px;background:#16283f;border:1px solid #2b4767;border-radius:3px;position:relative;flex:none}
.mcb .lev{position:absolute;left:6px;width:14px;height:15px;border-radius:2px;background:var(--on);transition:.25s;top:5px}
.mcb.off .lev{top:24px;background:var(--off)}
.mcb .i .nm{font-family:var(--mono);font-size:12px;color:#cfe0f2}
.mcb .i .de{font-size:10.5px;color:var(--txt3);margin-top:2px}
.mcb .i .st{font-size:11px;margin-top:4px;font-family:var(--mono);color:var(--on)}
.mcb.off .i .st{color:var(--off)}
.tagslot{position:relative}
.tagcard{position:absolute;right:8px;top:8px;background:#f3e6b8;color:#7a1414;border:2px solid #b93a2a;
  border-radius:3px;padding:4px 7px;font-size:10px;font-weight:800;line-height:1.35;text-align:center;
  box-shadow:0 5px 14px rgba(0,0,0,.55);transform-origin:top center;animation:hang .55s cubic-bezier(.2,1.5,.4,1)}
@keyframes hang{0%{transform:translateY(-24px) rotate(-14deg);opacity:0}100%{transform:none;opacity:1}}

/* 现场四指示 */
.ind{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.indc{background:#0b1729;border:1px solid var(--line);border-radius:6px;padding:10px;cursor:pointer;text-align:center;transition:.15s}
.indc:hover{border-color:var(--line2)}
.indc.chk{border-color:var(--ok);background:#0c2118}
.indc .nm{font-size:11px;color:#cfe0f2;margin-bottom:8px;height:28px;line-height:1.3}
.indc .val{font-family:var(--mono);font-size:12px;margin-top:8px}
.indc .val.a{color:var(--on)}.indc .val.b{color:var(--off)}.indc .val.g{color:var(--gnd)}
.indc .tick{font-size:10px;color:var(--ok);margin-top:4px;min-height:14px}

/* 间隔选择 */
.bays{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bayc{background:#0b1729;border:1px solid var(--line);border-radius:6px;padding:14px 10px;text-align:center;cursor:pointer;transition:.15s}
.bayc:hover{border-color:var(--line2);transform:translateY(-1px)}
.bayc.cur{border-color:#2a6fbe;background:#0f2540}
.bayc .n{font-family:var(--mono);font-size:15px;color:#dbeafe}
.bayc .d{font-size:10.5px;color:var(--txt3);margin-top:3px}
.bayc .s{font-size:10px;margin-top:6px;font-family:var(--mono)}

/* 调度电话 */
.phone{display:grid;grid-template-columns:196px 1fr;gap:14px}
.handset{background:#0b1729;border:1px solid var(--line);border-radius:8px;padding:14px;text-align:center}
.handset .ring{width:76px;height:76px;border-radius:50%;margin:4px auto 10px;background:#123763;
  display:flex;align-items:center;justify-content:center;border:2px solid #2a6fbe}
.handset.ringing .ring{animation:ringp .9s infinite}
@keyframes ringp{50%{box-shadow:0 0 0 12px rgba(42,111,190,.16)}}
.handset .nm{font-size:12.5px;color:#dbeafe}.handset .de{font-size:10.5px;color:var(--txt3);margin-top:2px}
.reclog{background:#0a1626;border:1px solid var(--line);border-radius:6px;padding:10px}
.reclog .row{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px dashed #17293f}
.reclog .row:last-child{border-bottom:0}
.reclog .k{width:78px;font-size:11px;color:var(--txt3);flex:none}
.reclog .v{font-family:var(--mono);font-size:11.5px;color:#cfe0f2}
.reclog input{background:#08111f;border:1px solid var(--line2);color:#cfe0f2;border-radius:4px;
  padding:4px 7px;font-family:var(--mono);font-size:11.5px;width:100%}

/* 五防 */
.wf{background:#050c16;border:1px solid #1b3350;border-radius:6px;padding:12px}
.wfsteps{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.wfs{background:#0b1729;border:1px solid var(--line);border-radius:5px;padding:8px 11px;font-size:11.5px;color:var(--txt2);cursor:pointer}
.wfs.done{border-color:var(--ok);color:var(--ok);background:#0b2018}
.wfs.tgt{border-color:#4d97e8;color:#dbeafe}

/* ---------- 右列：操作票 + 对话 ---------- */
.ticket{flex:1;min-height:0;display:flex;flex-direction:column}
.thead{flex:none;padding:10px 12px;border-bottom:1px solid var(--line);background:#0b1728}
.thead .ttl{font-size:12.5px;font-weight:700;letter-spacing:.5px}
.thead .meta{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;margin-top:7px}
.thead .meta div{font-size:10.5px;color:var(--txt3);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thead .meta b{color:#a9c4e2;font-weight:400}
.trows{flex:1;overflow:auto;padding:2px 0}
.trow{display:flex;gap:8px;padding:7px 12px;border-bottom:1px solid #0f1d31;cursor:pointer;transition:.12s}
.trow:hover{background:#0d1c2f}
.trow .no{width:30px;flex:none;font-family:var(--mono);font-size:11px;color:var(--txt3);padding-top:1px}
.trow .tx{flex:1;font-size:11.5px;line-height:1.55;color:var(--txt2)}
.trow .ck{width:22px;flex:none;text-align:center;font-family:var(--mono);font-size:14px;color:#22364e}
.trow.cur{background:linear-gradient(90deg,rgba(30,99,184,.24),transparent)}
.trow.cur .tx{color:#e9f3ff}
.trow.cur .no{color:#ffd88a;font-weight:700}
.trow.done .tx{color:#5e7793}
.trow.done .ck{color:var(--ok)}
.trow.bad{background:rgba(255,59,82,.10)}
.trow.bad .ck{color:var(--red)}
.trow.seg{background:#0a1524;cursor:default;padding:6px 12px}
.trow.seg .tx{font-size:10.5px;color:#6f89a8;letter-spacing:1px}
.trow.seg:hover{background:#0a1524}
.chat{flex:none;height:262px;border-top:1px solid var(--line);display:flex;flex-direction:column;background:#081321}
.chat .ch{flex:none;padding:7px 12px;font-size:11px;color:var(--txt3);letter-spacing:1px;border-bottom:1px solid #0f1d31}
.chat .cb{flex:1;overflow:auto;padding:10px 12px}
.msg{margin-bottom:9px;display:flex;gap:8px}
.msg .av{width:22px;height:22px;border-radius:4px;flex:none;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.msg.j .av{background:#123763;color:#9ecbff}
.msg.o .av{background:#123a2c;color:#8fe8c0}
.msg.s .av{background:#2a2338;color:#c3a8e8}
.msg .bd{flex:1;font-size:11.5px;line-height:1.62;color:var(--txt2);background:#0c1a2c;border:1px solid #14273f;border-radius:5px;padding:7px 9px}
.msg.o .bd{background:#0b1f19;border-color:#164031}
.msg.err .bd{background:#25101a;border-color:#5a2131;color:#ffb0bb}
.msg.ok .bd{background:#0b2018;border-color:#1c4a35}
.msg .bd .tag{display:inline-block;font-size:9.5px;padding:1px 5px;border-radius:3px;margin-right:6px;vertical-align:1px}
.tag.rl{background:#5a1220;color:#ff9aa8}.tag.wn{background:#4a3410;color:#ffcf7a}.tag.ok{background:#123a2c;color:#8fe8c0}

/* ---------- 底部操作条 ---------- */
.act{flex:none;border-top:1px solid var(--line);background:linear-gradient(180deg,#0b1728,#081321);padding:10px 14px}
.actrow{display:flex;gap:9px;align-items:center}
.mic{width:40px;height:40px;border-radius:50%;border:1px solid #2a6fbe;background:#123763;color:#dbeafe;
  cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;transition:.15s}
.mic:hover{background:#18477c}
.mic.rec{background:#7d1d1d;border-color:#c8352b;animation:pulse 1s infinite}
.rin{flex:1;background:#08111f;border:1px solid var(--line2);color:#e6edf6;border-radius:6px;
  padding:10px 12px;font-size:13px;font-family:var(--ui)}
.rin::placeholder{color:#3f5674}
.rin:focus{outline:none;border-color:#2a6fbe}
.btn{border:1px solid var(--line2);background:#0f2137;color:#cfe0f2;border-radius:6px;padding:10px 15px;
  font-size:12.5px;cursor:pointer;white-space:nowrap;transition:.15s}
.btn:hover{background:#16304e;border-color:#2a6fbe}
.btn:disabled{opacity:.34;cursor:not-allowed}
.btn.pri{background:var(--csg);border-color:#3f86d8;color:#fff;font-weight:600}
.btn.pri:hover{background:#2a76cf}
.btn.dan{background:#3a1119;border-color:#7d2334;color:#ff9aa8}
.btn.dan:hover{background:#521521}
.btn.warn{background:#3a2b0d;border-color:#7d5c1a;color:#ffcf7a}
.hintrow{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:11px;color:var(--txt3)}
.hintrow .k{background:#0d1d31;border:1px solid var(--line);border-radius:3px;padding:1px 6px;font-family:var(--mono);color:var(--txt2)}

/* ---------- 弹层 ---------- */
.mask{position:fixed;inset:0;background:rgba(3,8,15,.82);z-index:60;display:flex;align-items:center;
  justify-content:center;padding:26px;backdrop-filter:blur(3px);animation:fin .2s}
@keyframes fin{from{opacity:0}}
.dlg{background:#0c1727;border:1px solid var(--line2);border-radius:10px;width:min(880px,96vw);
  max-height:90vh;overflow:auto;box-shadow:0 30px 90px rgba(0,0,0,.7);animation:din .25s cubic-bezier(.2,.9,.3,1)}
@keyframes din{from{transform:translateY(18px) scale(.98);opacity:0}}
.dlg .dh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.dlg .dh b{font-size:15px;letter-spacing:.5px}
.dlg .dh .cls{margin-left:auto;cursor:pointer;color:var(--txt3);font-size:18px;line-height:1}
.dlg .db{padding:18px}
.dlg.red{border-color:#7d2334}
.dlg.red .dh{background:linear-gradient(90deg,rgba(255,59,82,.18),transparent)}
.dlg.red .dh b{color:#ff9aa8}
.dlg .df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.sec{margin-bottom:13px}
.sec .st{font-size:11px;letter-spacing:1.5px;color:var(--csgL);margin-bottom:7px}
.sec .sc{font-size:13px;line-height:1.75;color:var(--txt2)}
.sec .sc.quote{background:#0a1626;border-left:3px solid var(--csg);padding:10px 13px;border-radius:0 5px 5px 0;font-size:12.5px}
.chain{display:flex;gap:0;align-items:stretch;margin-top:12px;flex-wrap:wrap}
.chain .cn{flex:1;min-width:132px;background:#1b0d12;border:1px solid #4d1a24;border-radius:5px;padding:9px 11px;margin-right:16px;position:relative}
.chain .cn:last-child{margin-right:0}
.chain .cn::after{content:'▶';position:absolute;right:-14px;top:50%;transform:translateY(-50%);color:#5a2131;font-size:11px}
.chain .cn:last-child::after{display:none}
.chain .cn b{display:block;font-size:11.5px;color:#ff9aa8;margin-bottom:3px}
.chain .cn span{font-size:10.5px;color:#b98a92;line-height:1.5}
#arc{display:block;width:100%;border-radius:6px;background:#05090f;border:1px solid #2a1218}

/* 准备阶段 */
.prep{padding:20px;overflow:auto;height:100%}
.prepgrid{display:grid;grid-template-columns:1fr;gap:12px}
.pc .chkrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
.pc{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
.pc h5{margin:0 0 4px;font-size:13px;color:#cfe4fb}
.pc .sub2{font-size:10.5px;color:var(--txt3);margin-bottom:10px}
.chk{display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border-radius:5px;cursor:pointer;transition:.12s}
.chk:hover{background:#0d1c2f}
.chk .bx{width:15px;height:15px;border:1px solid #2c4d72;border-radius:3px;flex:none;margin-top:2px;
  display:flex;align-items:center;justify-content:center;font-size:10px;color:#061018}
.chk.on .bx{background:var(--ok);border-color:var(--ok)}
.chk .lb{font-size:11.5px;line-height:1.5;color:var(--txt2)}
.chk.on .lb{color:#cfe4fb}
.risks{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
.rk{border:1px solid var(--line);border-radius:6px;margin-bottom:8px;overflow:hidden}
.rk .rh{display:flex;gap:9px;align-items:center;padding:9px 11px;cursor:pointer;background:#0b1729}
.rk .rh .n{font-family:var(--mono);font-size:11px;color:var(--warn);width:24px}
.rk .rh .t{flex:1;font-size:12px;color:var(--txt2)}
.rk .rh .s{font-size:10.5px;color:var(--txt3);font-family:var(--mono)}
.rk.on .rh .s{color:var(--ok)}
.rk .rb{display:none;padding:10px 12px;background:#080f1b;font-size:11.5px;line-height:1.7;color:var(--txt3)}
.rk.open .rb{display:block}
.rk .rb b{color:#a9c4e2;font-weight:600}

/* 讲师台 */
.demo{position:fixed;right:12px;bottom:12px;z-index:50}
.demo .tg{background:#0f2137;border:1px solid var(--line2);color:var(--txt2);border-radius:20px;
  padding:7px 14px;font-size:11px;cursor:pointer}
.demo .bd{display:none;position:absolute;right:0;bottom:38px;width:246px;background:#0c1727;
  border:1px solid var(--line2);border-radius:8px;padding:11px;box-shadow:0 20px 50px rgba(0,0,0,.7)}
.demo.open .bd{display:block}
.demo .bd .t{font-size:10.5px;color:var(--txt3);letter-spacing:1px;margin-bottom:8px}
.demo .bd button{display:block;width:100%;text-align:left;margin-bottom:6px;background:#0f2137;
  border:1px solid var(--line);color:var(--txt2);border-radius:5px;padding:7px 9px;font-size:11.5px;cursor:pointer}
.demo .bd button:hover{background:#16304e}
.foot{display:none}
.tt{position:fixed;z-index:70;background:#0c1727;border:1px solid var(--line2);border-radius:5px;
  padding:7px 10px;font-size:11px;color:var(--txt2);max-width:280px;line-height:1.5;pointer-events:none;
  box-shadow:0 10px 30px rgba(0,0,0,.6);display:none}
.toast{position:fixed;left:50%;top:74px;transform:translateX(-50%);z-index:80;background:#0c1727;
  border:1px solid var(--line2);border-radius:6px;padding:10px 16px;font-size:12.5px;
  box-shadow:0 14px 40px rgba(0,0,0,.7);animation:tin .25s}
.toast.bad{border-color:#7d2334;color:#ff9aa8;background:#25101a}
.toast.ok{border-color:#1c4a35;color:#8fe8c0;background:#0b2018}
@keyframes tin{from{transform:translate(-50%,-12px);opacity:0}}
@media (max-width:1440px){.main{grid-template-columns:340px 1fr 340px}}

/* ================= 教学引导层 ================= */
.taskbar{flex:none;background:linear-gradient(180deg,#0d1e34,#0a1728);border-bottom:1px solid var(--line);padding:9px 14px 8px}
.tb1{display:flex;align-items:center;gap:11px}
.tbno{flex:none;background:#123763;color:#9ecbff;border:1px solid #2a6fbe;border-radius:4px;
  padding:3px 9px;font-family:var(--mono);font-size:11.5px;font-weight:700}
.tbtx{flex:1;font-size:13px;color:#e9f3ff;font-weight:600;line-height:1.45;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.modesw{flex:none;display:flex;border:1px solid var(--line2);border-radius:5px;overflow:hidden}
.modesw button{background:#0b1729;border:0;color:var(--txt3);font-size:11px;padding:5px 10px;cursor:pointer;
  border-right:1px solid var(--line);white-space:nowrap}
.modesw button:last-child{border-right:0}
.modesw button:hover{color:var(--txt2);background:#12233a}
.modesw button.on{background:var(--csg);color:#fff;font-weight:600}
.tb2{display:flex;align-items:center;gap:5px;margin-top:8px;flex-wrap:wrap}
.gs{display:inline-flex;align-items:center;gap:6px;background:#0b1729;border:1px solid var(--line);
  border-radius:14px;padding:4px 11px 4px 5px;font-size:11.5px;color:var(--txt3);white-space:nowrap}
.gs i{width:16px;height:16px;border-radius:50%;background:#1d3350;color:#6f89a8;font-style:normal;
  display:flex;align-items:center;justify-content:center;font-size:10px;font-family:var(--mono)}
.gs.ok{border-color:#1c4a35;color:#8fe8c0;background:#0b2018}
.gs.ok i{background:var(--ok);color:#061018}
.gs.now{border-color:#2a6fbe;color:#dbeafe;background:#123763;box-shadow:0 0 0 1px rgba(42,111,190,.35)}
.gs.now i{background:#4d97e8;color:#061018;animation:pulse 1.5s infinite}
.tb2 .ar{color:#2a4361;font-size:12px}
.tbsp{flex:1}
.hintbtn{background:#0f2137;border:1px solid var(--line2);color:#cfe0f2;border-radius:5px;
  padding:5px 11px;font-size:11.5px;cursor:pointer;white-space:nowrap;margin-left:6px}
.hintbtn:hover{background:#16304e}

/* 知识点卡 */
#kpbox{flex:none}
.kp{border-bottom:1px solid var(--line);background:#0a1626}
.kph{display:flex;align-items:center;gap:9px;padding:8px 14px;cursor:pointer}
.kph:hover{background:#0c1c30}
.kph b{font-size:12.5px;color:#cfe4fb;font-weight:600}
.tag2{background:#2a2338;color:#c3a8e8;border-radius:3px;padding:2px 7px;font-size:10px;flex:none}
.kpsp{flex:1}
.kpfold{font-size:11px;color:var(--txt3)}
.kpb{display:none;padding:2px 14px 12px}
.kp.open .kpb{display:block}
.kprow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kpc{margin-bottom:9px}
.kpt{font-size:10.5px;letter-spacing:1.2px;color:var(--csgL);margin-bottom:5px}
.kpt.warn{color:var(--warn)}
.kpc ul{margin:0;padding-left:16px}
.kpc li{font-size:11.5px;color:var(--txt2);line-height:1.7;margin-bottom:2px}
.kpc ul.err li{color:#e0a9a9}
.kpc p{margin:0;font-size:11.5px;color:var(--txt2);line-height:1.75}
.kpc p.rule{color:var(--txt3);font-size:11px}
.kpc.say{background:#0b1f19;border:1px solid #164031;border-radius:6px;padding:9px 11px;margin-top:4px}
.stdsay{color:#8fe8c0 !important;font-size:12.5px !important;margin-bottom:8px !important}
.kpc.say .btn{padding:5px 12px;font-size:11.5px}
.kplink{margin-top:8px;font-size:11px;color:var(--txt3)}
.kplink a{color:#9ecbff;cursor:pointer;margin-right:12px;border-bottom:1px dashed #2a6fbe}

/* 知识地图 */
.knav{background:#0a1524;border-right:1px solid var(--line);padding:10px 0;max-height:70vh;overflow:auto}
.kn{padding:9px 14px;cursor:pointer;border-left:3px solid transparent}
.kn:hover{background:#0d1c2f}
.kn b{display:block;font-size:12.5px;color:var(--txt2);font-weight:600}
.kn span{display:block;font-size:10.5px;color:var(--txt3);margin-top:2px}
.kn.on{background:#123763;border-left-color:#4d97e8}
.kn.on b{color:#dbeafe}
.kn.rel b::after{content:'　本项相关';font-size:9.5px;color:#8fe8c0;font-weight:400}
.kbody{padding:16px 20px 20px;max-height:70vh;overflow:auto}
.kbody h3{margin:0 0 14px;font-size:17px;color:#e9f3ff}
.kbody h3 em{font-style:normal;font-size:11px;color:var(--txt3);margin-left:10px;font-family:var(--mono)}
.kb{margin-bottom:14px;padding-left:12px;border-left:2px solid #1c3350}
.kbt{font-size:12.5px;color:#9ecbff;font-weight:600;margin-bottom:5px}
.kb p{margin:0;font-size:12.5px;color:var(--txt2);line-height:1.85}
.klink{color:#9ecbff;cursor:pointer;border-bottom:1px dashed #2a6fbe}

.kpnew{background:#4a3410;color:#ffcf7a;border-radius:3px;padding:1px 6px;font-size:9.5px;margin-left:6px}
.gs{padding:3px 9px 3px 4px;font-size:11px}
.gs i{width:15px;height:15px;font-size:9.5px}
.tb2{gap:4px;margin-top:7px}

#dhvid{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom;display:none;background:transparent}
.cfgbtn{background:rgba(6,16,28,.82);border:1px solid var(--line2);color:var(--txt2);border-radius:4px;
  width:26px;height:26px;cursor:pointer;font-size:13px;line-height:1;backdrop-filter:blur(4px)}
.cfgbtn:hover{color:#dbeafe;border-color:#2a6fbe}
.cfgrow{display:grid;gap:8px}
.cfgopt{display:flex;gap:10px;align-items:flex-start;background:#0b1729;border:1px solid var(--line);
  border-radius:6px;padding:10px 12px;cursor:pointer}
.cfgopt.on{border-color:#2a6fbe;background:#102540}
.cfgopt input{margin-top:3px}
.cfgopt b{display:block;font-size:12.5px;color:#cfe4fb}
.cfgopt span{display:block;font-size:11px;color:var(--txt3);margin-top:2px}
.cfgin{display:flex;gap:10px;align-items:center;margin-bottom:7px}
.cfgin label{width:104px;flex:none;font-size:11.5px;color:var(--txt3)}
.cfgin input{flex:1;background:#08111f;border:1px solid var(--line2);color:#cfe0f2;border-radius:4px;
  padding:6px 9px;font-family:var(--mono);font-size:11.5px}

/* ================= 陪练舱 v2：对练居中 ================= */
.main2{flex:1;display:grid;grid-template-columns:1fr 412px;gap:1px;background:var(--line);min-height:0}
.arena{position:relative;background:#07101d;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.arena-top{flex:1;min-height:0;display:grid;grid-template-columns:44% 56%;position:relative;z-index:2}
.arena #scene{position:absolute;inset:0;z-index:0}
.arena #scene svg{opacity:.85}
.arena::after{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(90deg,transparent 40%,rgba(7,16,29,.55) 60%,rgba(7,16,29,.78) 100%)}
.arena-l{position:relative;z-index:2;min-height:0}
.arena-l #dh{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center}
.arena-l #dh svg{width:100%;height:100%}
.arena-l .sync{position:absolute;left:12px;right:12px;bottom:10px;z-index:6;border:1px solid var(--line2);
  border-radius:5px;background:rgba(6,16,28,.82);backdrop-filter:blur(4px);border-top:1px solid var(--line2)}
.arena-l .rolecard{bottom:52px}
.arena-r{position:relative;z-index:3;min-height:0;display:flex;flex-direction:column;padding:12px 14px 12px 6px}
.chathead{flex:none;font-size:11px;letter-spacing:1.5px;color:var(--txt3);padding:2px 4px 8px;display:flex;align-items:center;gap:8px}
.chathead span{background:#123763;color:#9ecbff;border-radius:3px;padding:1px 7px;font-size:10px;letter-spacing:0}
.arena-r .cb{flex:1;overflow:auto;padding:0 6px 8px 2px;scroll-behavior:smooth}
/* 气泡：监护人靠左，操作人靠右 */
.arena-r .msg{margin-bottom:10px;gap:9px;animation:bub .25s cubic-bezier(.2,.9,.3,1)}
@keyframes bub{from{transform:translateY(8px);opacity:0}}
.arena-r .msg .av{width:26px;height:26px;border-radius:50%;font-size:11px}
.arena-r .msg .bd{font-size:13px;line-height:1.7;padding:9px 12px;border-radius:9px;max-width:88%;
  background:rgba(12,26,44,.92);border:1px solid #1a3150;backdrop-filter:blur(3px)}
.arena-r .msg.j .bd{border-top-left-radius:3px;color:#e6edf6}
.arena-r .msg.o{flex-direction:row-reverse}
.arena-r .msg.o .bd{border-top-right-radius:3px;background:rgba(11,31,25,.92);border-color:#164031;color:#d8f5e8}
.arena-r .msg.s{justify-content:center}
.arena-r .msg.s .av{display:none}
.arena-r .msg.s .bd{background:transparent;border:0;color:#8fa6c0;font-size:11.5px;text-align:center;max-width:100%;padding:2px 8px}
.arena-r .msg.s.err .bd{color:#ffb0bb}
.arena-r .msg.s.ok .bd{color:#8fe8c0}
.arena-r .msg.j.latest .bd{box-shadow:0 0 0 1px rgba(77,151,232,.55),0 8px 30px rgba(30,99,184,.25)}

/* 道具层（底部抽屉） */
.sheet{position:relative;z-index:8;flex:none;background:rgba(9,20,37,.97);border-top:1px solid var(--line2);
  box-shadow:0 -18px 50px rgba(0,0,0,.6);display:flex;flex-direction:column;overflow:hidden;
  height:52%;transition:height .32s cubic-bezier(.2,.9,.3,1)}
.sheet.closed{height:0;border-top:0}
.sheethead{flex:none;display:flex;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid var(--line);background:#0b1728}
.sheettitle{font-size:11px;letter-spacing:1.5px;color:var(--csgL);flex:none}
.sheethead .locbar{flex:1;padding:0;border:0;background:transparent;flex-wrap:nowrap;overflow-x:auto}
.sheethead .locbar .locbtn{padding:4px 9px;font-size:11px}
.sheetfold{flex:none;background:#0f2137;border:1px solid var(--line2);color:var(--txt2);border-radius:4px;padding:4px 10px;font-size:11px;cursor:pointer}
.sheet .panelwrap{flex:1;min-height:0;overflow:auto;padding:12px 14px}
.sheetpeek{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:7;background:#123763;border:1px solid #2a6fbe;
  color:#dbeafe;border-radius:16px;padding:6px 14px;font-size:11.5px;cursor:pointer;display:none;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.sheetpeek.show{display:block}
.sheetpeek.need{animation:needp 1.6s infinite;border-color:#7a5a1a;color:#ffcf7a}

/* 右栏 */
.side{background:var(--bg2);min-height:0;display:flex;flex-direction:column;overflow:hidden}
.side .ticket{flex:1;min-height:0;display:flex;flex-direction:column}
.side .thead .meta{grid-template-columns:1fr 1fr}
.side .taskbar{padding:9px 12px 8px}
.side .tbtx{font-size:12.5px}

/* 底部操作条 + 节拍带并排 */
.act{display:flex;align-items:stretch;gap:0;padding:0}
.act #actbar{flex:1;padding:10px 14px;min-width:0}
.act .beats{flex:none;width:412px;border-top:0;border-left:1px solid var(--line)}
.act .beat{padding:8px 2px 7px}
.act .beat i{display:none}
.askbtn{background:#2a2338;border-color:#5a4a80;color:#dcc9ff}
.askbtn:hover{background:#3a2f52}
.main,.col{display:none}

.trow.skip{opacity:.35;cursor:default}
.trow.skip:hover{background:transparent}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cfgopt.dis{opacity:.45;cursor:not-allowed}

.arena.sheetopen .rolecard,.arena.sheetopen .sync,.arena.sheetopen .stage-tag .live{display:none}
.arena.sheetopen .arena-l #dh{top:6px}
.sheet{height:50%}

/* ---------- 当前指令卡（陪练舱引导） ---------- */
.tbfoc{display:flex;align-items:center;gap:12px;margin-top:9px;padding:10px 13px;
  background:linear-gradient(90deg,rgba(30,99,184,.24),rgba(30,99,184,.05));
  border:1px solid #2a6fbe;border-radius:8px;animation:focin .3s}
@keyframes focin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.tbic{width:32px;height:32px;flex:none;display:flex;align-items:center;justify-content:center;
  background:#0d2745;border:1px solid #2a6fbe;border-radius:8px;color:#9ecbff}
.tbnow{flex:1;min-width:0}
.tbnow b{display:block;font-size:13.5px;color:#e8f1fc;letter-spacing:.3px;line-height:1.4}
.tbnow span{display:block;font-size:10.5px;color:#7d97b8;margin-top:2px}
.tbgo{background:#3a2b0d;border:1px solid #7d5c1a;color:#ffcf7a;border-radius:7px;padding:8px 13px;
  font-size:12px;cursor:pointer;flex:none;font-family:inherit;animation:needp 1.6s infinite}
.tbgo:hover{background:#52400f}
.tbhint{background:linear-gradient(135deg,#1e63b8,#2a76cf);border:1px solid #3f86d8;color:#fff;
  border-radius:8px;padding:7px 15px;font-size:12.5px;font-weight:600;cursor:pointer;flex:none;
  font-family:inherit;text-align:center;box-shadow:0 4px 14px rgba(30,99,184,.35)}
.tbhint:hover{background:linear-gradient(135deg,#2a76cf,#3f86d8)}
.tbhint i{font-style:normal;display:block;font-size:9px;color:#bcd8f8;font-weight:400;letter-spacing:1.5px;margin-top:1px}
.holdring{position:fixed;z-index:70;width:46px;height:46px;border-radius:50%;pointer-events:none;--p:0deg;
  background:conic-gradient(#9ecbff var(--p),rgba(77,151,232,.18) 0);
  -webkit-mask:radial-gradient(circle,transparent 58%,#000 60%);mask:radial-gradient(circle,transparent 58%,#000 60%);
  filter:drop-shadow(0 0 6px rgba(77,151,232,.7))}
#panelwrap div.tgt{outline:2px solid rgba(77,151,232,.85);outline-offset:2px;border-radius:6px;animation:tgtglow 1.5s infinite}

const RISKS=[["触电及电弧灼伤风险", "全过程规范穿戴个人防护用品，与带电部位保持足够安全距离；验电接地前规划操作站位和移动路径，防止误碰带电部位。", "设备转检修过程中现场仍存在带电部位，人员站位不当、距离不足或误碰带电设备，可能造成人员触电、电弧灼伤，甚至导致人身伤亡。"], ["不经五防或防误状态不一致风险", "认真完成五防模拟，核对五防主机、电脑钥匙和后台监控设备状态一致；五防锁具异常或无法开启时立即中止并上报，严禁未经审批私自解锁。", "未执行五防模拟或擅自解锁，可能造成误分、误合设备，甚至带电合接地刀闸，引发人身、设备或电网事故。"], ["安全工器具不合格风险", "使用前核对工器具名称、规格、数量、外观和试验有效期，只使用检查合格的工器具。", "工器具外观损坏、超过试验有效期或绝缘性能不良，可能在操作中失去防护作用。"], ["未严格执行唱票复诵和\"手指口述\"风险", "每一项均执行监护人完整唱票、操作人手指操作对象并复诵、监护人确认\"对，执行\"后方可操作。", "未形成口到、眼到、手到的双重核对闭环，可能对设备名称、操作方向或项目顺序听错、看错、做错，导致误操作。"], ["跳项、漏项或顺序错误风险", "严格按操作票顺序逐项执行，每项完成并回报后，由监护人立即在对应\"操作√\"栏标注\"√\"，不得补打勾或提前打勾。", "操作项目未按电气逻辑顺序执行，可能导致隔离或接地措施不完整，造成设备损坏或扩大停电范围。"], ["操作站位、手势或设备运动方向不当风险", "操作前评估站位、操作方向及工器具移动路径；监护人全程观察并及时纠正不规范动作。", "站位不合理、操作力量或方向错误，可能导致误碰带电部位、设备反向动作、机构损伤。"], ["走错间隔、图实不符或标识错误风险", "到达每一操作地点后，先核对间隔名称和待操作设备双重名称，同时确认图实一致、标实一致。", "未核对间隔名称、设备双重名称、接线图和现场标签，可能对运行设备进行误操作，造成人员触电、设备停电或事故范围扩大。"], ["后台运行方式、位置信号或报文异常风险", "操作前后核对后台运行方式、设备位置、二次遥信、光字信号及报文；后台数据异常时，以现场设备实际位置为准。", "测控通信中断、数据不刷新或遥信不一致，可能使操作人员误判设备状态。"], ["GIS刀闸、地刀位置确认不充分风险", "GIS刀闸、地刀操作后，核对后台位置显示及报文、汇控柜电气指示、机构箱机械指示、拐臂指示和转轴划线标识。", "仅依赖单一位置信号，可能在设备未完全到位时误判状态，导致隔离或接地措施不可靠。"], ["未确认无电压即合接地刀闸风险", "严格执行\"先验电再接地\"；GIS设备不具备直接验电条件时，分别核对后台二次电压和高压带电显示装置，两种非同源指示均发生应有变化后，方可合上116340地刀。", "线路仍带电或验电位置错误时合上接地刀闸，将造成带电合地刀、相间或对地短路，可能引发强烈电弧、设备损坏、人员伤害和电网事故。"], ["设备动作、锁具或指示发生变化却未及时中止的风险", "落实\"凡变化必上报\"，一旦发现异常立即中止操作，不得盲目重试；上报并经综合研判、重新核实处置完毕后，方可恢复操作。", "对异常盲目重试或强行操作，可能将设备缺陷或走错间隔扩大为人身、设备或电网事故。"], ["设备缺陷、环境变化及作业工法风险", "操作前结合设备状态、缺陷记录、现场环境和操作方式开展针对性风险辨识及事故预想。", "未开展事故预想，可能遗漏瓷瓶裂纹、设备卡涩、临近带电部位等风险。"]];

const KNOW=[{"id": "state", "t": "设备的四种状态", "sub": "运行 / 热备用 / 冷备用 / 检修", "body": [["四种状态怎么分", "运行：断路器与两侧隔离开关均在合位，设备带电并传输负荷。\n热备用：断路器分闸，两侧隔离开关仍在合位，一经合闸即可送电。\n冷备用：断路器与两侧隔离开关均在分位，设备与电网形成明显断开点，但未接地。\n检修：在冷备用基础上，验电确无电压后合上接地刀闸，并完成二次隔离与标志牌悬挂。"], ["本次任务的三段", "运行 → 热备用：断开1163开关（第5-7项）。\n热备用 → 冷备用：拉开11634、11632刀闸，1QK切就地（第10-14项）。\n冷备用 → 检修：两种验电、ZK切就地、合116340地刀、断二次电源、挂标志牌（第17-26项）。"], ["为什么必须分三段", "每一段状态转换都对应一次独立的调度下令。附录F 2.11.2 要求：调度采用逐项令下令时，操作票中应有明确的\"汇报调度\"和\"再经调度令\"操作项目。跨段连做等于无令操作。"]]}, {"id": "sanshen", "t": "三审与票令核对", "sub": "细则第十八条", "body": [["什么是三审", "操作票操作人自审、监护人审核、值班负责人审批并分别签名。涉及中高风险作业或500kV一次设备的操作，还应由巡维中心管理人员\"第四审\"并签名。"], ["接令后为什么要再审一次", "细则第十八条：接到调度正式指令后，应再次\"三审\"，核实操作票内容是否与调度正式指令一致。这一步防的是\"票是对的、令是另一回事\"。"], ["票令不一致怎么办", "立即暂停后续操作，汇报值班长，重新开具操作票并履行三审程序，处理后返回当前接令的\"再次三审\"节点。绝不能凭印象继续。"]]}, {"id": "wufang", "t": "五防与模拟预演", "sub": "风险第2条", "body": [["五防模拟要核什么", "检查五防主机、电脑钥匙状态正常，并确认五防系统与后台监控设备状态一致。模拟所依据的初始状态必须与设备实际状态一致，否则模拟通过也可能无法阻止现场误操作。"], ["模拟顺序", "断开1163开关 → 拉开11634刀闸 → 拉开11632刀闸 → 合上116340地刀。先切负荷、再形成明显隔离、验明无电后接地。"], ["锁具异常怎么办", "细则第十四条（二）：\"五防锁具无法正常开启\"应视同已发生\"走错间隔\"，立即中止操作并履行变化管理流程。严禁未经审批私自解锁，严禁私藏万能解锁钥匙。"]]}, {"id": "changpiao", "t": "唱票复诵与手指口述", "sub": "附录E · 风险第4条", "body": [["五拍动作闭环", "监护人按票面完整唱票 → 操作人手指操作对象并复诵 → 监护人核对后发出\"对，执行\"口令 → 操作人方可执行 → 操作人检查结果并回报 → 监护人收到后立即在对应栏标注\"√\"。"], ["一想二问三看", "口到、眼到、手到。手指的对象、念出的名称、操作的设备，三者必须落在同一个东西上。少任何一样，双重核对就不成立。"], ["标注\"√\"的时机", "附录F 2.13：操作项目完成后，由监护人立即在对应栏内标注\"√\"。不得补打勾，不得提前打勾。执行主、子项时，应先在主项对应栏内标注\"√\"。"]]}, {"id": "yandian", "t": "先验电再接地", "sub": "细则第十三条（四）· 附录G-23", "body": [["铁律", "所有接地操作前均应规范验电，确保接地刀闸静触头或接地线预接地点得到安全有效的\"先验电再接地\"。这是红线，触碰即一票否决。"], ["GIS不能直接验电怎么办", "按《安规》要求应有两个及以上非同样原理或非同源的指示且均已同时发生变化，才能确认该设备已无电。本站采用：① 监控后台核对线路二次电压确无电压；② 现场逐相核对高压带电显示装置确无电压。"], ["为什么要\"变化\"而不只是\"无电\"", "第4项在带电时先确认高压带电显示装置\"确有电压\"，就是为了给停电后的\"确无电压\"提供变化依据。装置若一直不亮，无法区分是真无电还是装置失灵。"], ["后果", "线路仍带电时合上接地刀闸，将造成带电合地刀、相间或对地短路，引发强烈电弧、设备损坏、人员伤害和电网事故。"]]}, {"id": "gis", "t": "GIS 位置的四项指示", "sub": "附录G-5 · 风险第9条", "body": [["哪四项", "监控后台刀闸位置显示及报文、汇控柜刀闸电气 ================================================= */

    this.onSpeakEnd = null;

  /* ---------- 姿态 ---------- */
  setPose(p, dir) {
    this.pose = p; this.poseT = 0;
    const R = this.armR, L = this.armL;
    const set = (ra, rb, rh, la, lb, lh) => {
      R.aT = ra; R.bT = rb; R.handT = rh; L.aT = la; L.bT = lb; L.handT = lh;
    };
    switch (p) {
      case 'idle':                                  // 站姿待命，双手自然下垂
        set(7, 5, 0, -7, -5, 0);
        this.leanT = 0; this.headPitchT = 0; this.browT = 0; break;
      case 'call':                                  // 唱票：右手抬至胸前，食指指向票面
        set(-32, -54, 1, -9, -7, 0);
        this.leanT = 1.5; this.browT = -2; this.headPitchT = 0; break;
      case 'confirm':                               // 对，执行：掌心前推确认
        set(-24, -72, 2, -9, -7, 0);
        this.leanT = 2; this.browT = 0; this.headPitchT = 0; break;
      case 'point':                                 // 指向设备面板
        set(-56, -18, 1, -8, -6, 0);
        this.leanT = 3; this.headYawT = -7; this.browT = -1; break;
      case 'explain':                               // 讲解：双手外摊
        set(27, -44, 2, -27, 44, 2);
        this.leanT = 0; this.browT = -3; this.headPitchT = 0; break;
      case 'stop':                                  // 制止：左手掌抬起前推 + 前倾
        set(-14, -22, 0, 42, 74, 2);
        this.leanT = 5; this.browT = -6; this.headPitchT = -3; break;
      case 'correct':                               // 纠错：右手食指轻摆
        set(-42, -60, 1, -9, -7, 0);
        this.leanT = 1; this.browT = -4; this.headPitchT = 0; break;
      case 'listen':                                // 倾听
        set(9, 7, 0, -9, -7, 0);
        this.leanT = -1; this.headPitchT = 2; this.browT = 1; break;
      case 'nod': this.headPitchT = 7; break;
    }
    if (p !== 'nod' && p !== 'point') this.headYawT = 0;
  }

  nod(times) {
    this._nod = { n: times || 1, t: 0 };
  }
  shake() { this._shake = { t: 0 }; }

  /* ---------- 说话 ---------- */
  buildSeq(text) {
    const seq = [];
    for (const ch of text) {
      if (ch >= '\u4e00' && ch <= '\u9fff') {
        const v = (typeof CH2V !== 'undefined' && CH2V[ch]) || '-E';
        seq.push({ o: v[0], n: v[1], ch });
      } else if (/[0-9]/.test(ch)) {
        seq.push({ o: '-', n: 'E', ch });
      } else if (/[a-zA-Z]/.test(ch)) {
        seq.push({ o: '-', n: 'I', ch });
      } else if (/[，。、；：？！,.;:?!（）()"'"']/.test(ch)) {
        seq.push({ o: 'X', n: 'X', ch, pause: true });
      }
    }
    return seq;
  }

  speak(text, opt) {
    opt = opt || {};
    this.stopSpeak(true);
    this.seq = this.buildSeq(text);
    this.speaking = true;
    this.perChar = (opt.rate || 0.115) * (window.__DH_SPEED || 1);
    this.seqStart = performance.now() / 1000;
    this.onSpeakEnd = opt.onEnd || null;
    this.ttsProgress = -1;
    if (opt.pose) this.setPose(opt.pose);
    // 内置渲染不播语音：口型与节奏按逐字时钟推进，声音由 HeyGen 预渲染片段承担
    return this;
  }

  finishSpeak() {
    this.speaking = false; this.seq = null; this.curV = 'X'; this.curCh = '';
    this.mouthTarget = Object.assign({}, VISEME.X);
    const cb = this.onSpeakEnd; this.onSpeakEnd = null;
    if (cb) cb();
  }

  stopSpeak(silent) {
    this.speaking = false; this.seq = null;
    this.mouthTarget = Object.assign({}, VISEME.X);
    if (!silent) { this.onSpeakEnd = null; }
  }

  /* ---------- 主循环 ---------- */
  _loop(now) {
    const dt = Math.min(0.05, (now - this.last) / 1000);
    this.last = now; this.t += dt;
    const T = this.t;

    // 口型
    if (this.speaking && this.seq) {
      const el = performance.now() / 1000 - this.seqStart;
      let idx;
      if (this.ttsProgress >= 0) idx = Math.min(this.seq.length - 1, this.ttsProgress);
      else idx = Math.floor(el / this.perChar);
      if (idx >= this.seq.length) { this.finishSpeak(); }
      else {
        const frac = (el / this.perChar) % 1;
        const s = this.seq[idx];
        const key = (s.o !== '-' && frac < 0.34) ? s.o : s.n;
        const v = VISEME[key] || VISEME.E;
        const amp = s.pause ? 0.1 : (0.82 + 0.18 * Math.sin(T * 21));
        this.mouthTarget = { w: v.w, h: v.h * amp, r: v.r, t: v.t, p: v.p };
        this.curV = key; this.curCh = s.ch;
      }
    }
    for (const k in this.mouth) {
      this.mouth[k] += (this.mouthTarget[k] - this.mouth[k]) * Math.min(1, dt * 26);
    }
    this.drawMouth();

    // 呼吸
    const br = Math.sin(T * 1.35) * 1.6;
    this.n.root.setAttribute('transform', `translate(210,${600 + br * 0.35})`);
    this.n.torso.setAttribute('transform', `translate(0,${br * 0.5}) scale(${1 + br * 0.0016},1)`);

    // 眨眼
    this.nextBlink -= dt;
    if (this.nextBlink <= 0) { this.blink = 1; this.nextBlink = 1.6 + Math.random() * 3.4; }
    if (this.blink > 0) this.blink = Math.max(0, this.blink - dt * 7.5);
    const bl = Math.sin(this.blink * Math.PI);
    const lidY = -7 + bl * 15.4;
    this.n.lidL.setAttribute('transform', `translate(0,${lidY})`);
    this.n.lidR.setAttribute('transform', `translate(0,${lidY})`);

    // 眼神游移
    if (Math.random() < dt * 0.35) this.gazeT = (Math.random() - 0.5) * 4;
    this.gaze += (this.gazeT - this.gaze) * dt * 5;
    this.n.pupils.setAttribute('transform', `translate(${this.gaze},${Math.sin(T * .7) * .6})`);

    // 眉
    this.brow += (this.browT - this.brow) * dt * 6;
    this.n.browL.setAttribute('transform', `translate(0,${this.brow})`);
    this.n.browR.setAttribute('transform', `translate(0,${this.brow})`);

    // 头
    if (this._nod) {
      this._nod.t += dt * 5.5;
      const k = this._nod.t;
      this.headPitch = Math.sin(k * Math.PI) * 9;
      if (k >= 1) { this._nod.n--; this._nod.t = 0; if (this._nod.n <= 0) { this._nod = null; this.headPitch = 0; } }
    } else if (this._shake) {
      this._shake.t += dt * 3.4;
      this.headYaw = Math.sin(this._shake.t * Math.PI * 3) * 11;
      if (this._shake.t >= 1) { this._shake = null; this.headYaw = 0; }
    } else {
      this.headYaw += (this.headYawT + Math.sin(T * 0.53) * 2.2 - this.headYaw) * dt * 4;
      this.headPitch += (this.headPitchT + Math.sin(T * 0.41) * 1.1 - this.headPitch) * dt * 4;
    }
    this.n.headin.setAttribute('transform',
      `rotate(${this.headYaw * .32}) skewX(${this.headYaw * .12}) translate(${this.headYaw * .55},${this.headPitch * .28}) scale(${1 - Math.abs(this.headYaw) * .0018},1)`);
    this.n.head.setAttribute('transform', `translate(0,${-386 + br * .5}) scale(.86) rotate(${this.headYaw * .16})`);

    // 身体前倾
    this.lean += (this.leanT - this.lean) * dt * 4;
    this.n.lean.setAttribute('transform', `rotate(${-this.lean * .18},0,-180) translate(${this.lean * .5},0)`);

    // 手臂
    this.poseT += dt;
    const sway = Math.sin(T * 1.1) * 1.2;
    const gest = this.speaking ? Math.sin(T * 4.6) * 4 : 0;
    for (const [arm, na, nb, nh, np, sgn] of [
      [this.armR, this.n.armRa, this.n.armRb, this.n.handR, this.n.handRp, 1],
      [this.armL, this.n.armLa, this.n.armLb, this.n.handL, this.n.handLp, -1]]) {
      arm.a += (arm.aT - arm.a) * dt * 5.2;
      arm.b += (arm.bT - arm.b) * dt * 5.2;
      arm.hand += (arm.handT - arm.hand) * dt * 7;
      const ga = (this.pose === 'call' || this.pose === 'explain' || this.pose === 'confirm') ? gest : 0;
      na.setAttribute('transform', `rotate(${arm.a + sway * sgn * .5 + ga * sgn})`);
      nb.setAttribute('transform', `translate(0,74) rotate(${arm.b + ga * .6 * sgn})`);
      np.setAttribute('d', this.handPath(arm.hand, sgn));
    }
    requestAnimationFrame(this._loop);
  }

  handPath(k, sgn) {
    // 腕关节在 (0,0)，手指沿 +y（前臂延长线）方向
    const s = sgn;
    if (k < 0.5) {
      // 自然握拳
      return `M -11 -7 Q -14 6 -7 16 Q 2 22 10 15 Q 14 3 11 -7 Z
              M ${-11 * s} -1 Q ${-17 * s} 5 ${-13 * s} 11 Q ${-9 * s} 13 ${-7 * s} 8 Z
              M -7 3 L 8 2 M -6 8 L 7 7`;
    }
    if (k < 1.5) {
      // 食指指点
      return `M -10 -7 Q -13 5 -7 14 Q 1 20 9 13 Q 13 2 10 -7 Z
              M ${-10 * s} -2 Q ${-16 * s} 4 ${-12 * s} 10 Q ${-8 * s} 12 ${-6 * s} 7 Z
              M -3.6 8 L -3.6 32 Q 0 36.5 3.6 32 L 3.6 8 Z`;
    }
    // 张开掌心
    return `M -13 -8 Q -16 8 -8 20 Q 2 26 12 18 Q 16 4 13 -8 Z
            M ${-13 * s} -3 Q ${-21 * s} 4 ${-16 * s} 12 Q ${-11 * s} 15 ${-8 * s} 9 Z
            M -9 16 Q -10.5 24 -7.5 27 Q -4.5 28 -4 24 L -3.5 17 Z
            M -1.5 18 Q -2.5 27 0.5 30 Q 3.5 30.5 4 26 L 4 18 Z
            M 6 16 Q 5.5 24 8 26.5 Q 10.5 27 11 23 L 11 15 Z`;
  }

  drawMouth() {
    const m = this.mouth, hw = m.w / 2, hh = m.h / 2;
    const cx = 0, cy = 0;
    const rx = hw * (1 - m.r * 0.42);
    const top = cy - hh, bot = cy + hh;
    const outer = `M ${-rx - 3} ${cy} Q ${cx} ${top - 3.2} ${rx + 3} ${cy} Q ${cx} ${bot + 3.6} ${-rx - 3} ${cy} Z`;
    const inner = `M ${-rx} ${cy} Q ${cx} ${top} ${rx} ${cy} Q ${cx} ${bot} ${-rx} ${cy} Z`;
    this.n.lip.setAttribute('d', outer);
    this.n.inner.setAttribute('d', m.h > 3 ? inner : '');
    if (m.t > 0.05 && m.h > 4) {
      const th = Math.min(4.2, m.h * 0.3) * m.t;
      this.n.teeth.setAttribute('d',
        `M ${-rx * .88} ${top + 1.2} Q ${cx} ${top - 0.4} ${rx * .88} ${top + 1.2} L ${rx * .8} ${top + 1.2 + th} Q ${cx} ${top + th + 2.4} ${-rx * .8} ${top + 1.2 + th} Z`);
    } else this.n.teeth.setAttribute('d', '');
    this.n.lipline.setAttribute('d', `M ${-rx - 3} ${cy} Q ${cx} ${cy - Math.max(1.2, hh * .5)} ${rx + 3} ${cy}`);
  }
}


/* ================= 数字人播放层 =================
   三档，按可用性自动降级：
     clips   HeyGen 预渲染透明 WebM —— 离线主用，现场首选
     stream  HeyGen 实时会话     —— 需外网，自由问答用
     builtin 内置 SVG 骨骼       —— 兜底，任何环境都能出画面
   打包时把 manifest 内联进 HEYGEN_MANIFEST，视频用相对路径引用，
   这样 file:// 直接双击也能播（fetch 会被 CORS 拦，<video src> 不会）。
================================================= */

const HEYGEN_MANIFEST = {};          // 打包时由 clips/manifest.json 内联
const HEYGEN_CFG = {
  mode: 'builtin',                   // clips | stream | builtin
  clipBase: 'clips/',
  apiKey: '', token: '',
  avatar: { jianhu: '', diaodu: '', zhiban: '' },
  quality: 'high'
};

const Avatar = {
  cur: null, vid: null, sdk: null, session: null, ready: false,

  init() {
    this.vid = document.getElementById('dhvid');
    const saved = (() => { try { return JSON.parse(localStorage.getItem('xwt_heygen') || '{}'); } catch (e) { return {}; } })();
    Object.assign(HEYGEN_CFG, saved);
    if (HEYGEN_CFG.mode === 'clips' && !Object.keys(HEYGEN_MANIFEST).length) HEYGEN_CFG.mode = 'builtin';
    this.apply();
  },

  save() { try { localStorage.setItem('xwt_heygen', JSON.stringify(HEYGEN_CFG)); } catch (e) { } },

  apply() {
    const m = HEYGEN_CFG.mode;
    const svg = document.getElementById('dh');
    if (svg) svg.style.display = (m === 'builtin') ? '' : 'none';
    if (this.vid) this.vid.style.display = (m === 'builtin') ? 'none' : '';
    const badge = document.getElementById('dhmode');
    if (badge) badge.textContent = ({ clips: 'HEYGEN · 预渲染', stream: 'HEYGEN · 实时', builtin: '内置渲染' })[m];
  },

  /* ---- 台词→片段查找：按文本精确匹配，未命中则降级 ---- */
  clipOf(text) {
    const t = (text || '').trim();
    for (const id in HEYGEN_MANIFEST) {
      const c = HEYGEN_MANIFEST[id];
      if (c.status === 'ok' && c.text.trim() === t) return HEYGEN_CFG.clipBase + c.file;
    }
    return null;
  },

  /* ---- 统一入口：与内置引擎签名一致 ---- */
  speak(text, opt) {
    opt = opt || {};
    if (HEYGEN_CFG.mode === 'clips') {
      const url = this.clipOf(text);
      if (url) return this.playClip(url, opt);
    }
    if (HEYGEN_CFG.mode === 'stream' && this.session) {
      return this.streamSpeak(text, opt);
    }
    return new Promise(res => { DH.speak(text, Object.assign({}, opt, { onEnd: res })); });
  },

  playClip(url, opt) {
    return new Promise(res => {
      const v = this.vid;
      if (!v) return res();
      v.onended = null;
      v.src = url;
      v.currentTime = 0;
      const done = () => { v.onended = null; v.onerror = null; res(); };
      v.onended = done;
      v.onerror = () => { DH.speak(opt.showText || '', { onEnd: done }); };
      const pr = v.play();
      if (pr && pr.catch) pr.catch(() => { setTimeout(done, 400); });
    });
  },

  stop() {
    if (this.vid) { try { this.vid.pause(); } catch (e) { } }
    if (this.session && this.sdk) { try { this.session.interrupt(); } catch (e) { } }
    DH.stopSpeak(true);
  },

  /* ---- 实时会话 ---- */
  async startStream(role) {
    if (!HEYGEN_CFG.token && !HEYGEN_CFG.apiKey) throw new Error('缺少 API Key 或 session token');
    let token = HEYGEN_CFG.token;
    if (!token) {
      const r = await fetch('https://api.heygen.com/v1/streaming.create_token', {
        method: 'POST', headers: { 'x-api-key': HEYGEN_CFG.apiKey }
      });
      if (!r.ok) throw new Error('取 token 失败 ' + r.status + '（本地打开时通常是跨域，请用本地服务器或直接粘贴 token）');
      token = (await r.json()).data.token;
    }
    const mod = await import('https://esm.sh/@heygen/streaming-avatar@2');
    const StreamingAvatar = mod.default;
    this.sdk = mod;
    const av = new StreamingAvatar({ token });
    av.on(mod.StreamingEvents.STREAM_READY, e => {
      if (this.vid && e.detail) { this.vid.srcObject = e.detail; this.vid.play(); }
    });
    await av.createStartAvatar({
      quality: HEYGEN_CFG.quality,
      avatarName: HEYGEN_CFG.avatar[role || 'jianhu'],
      language: 'zh'
    });
    this.session = av;
    return av;
  },

  async streamSpeak(text, opt) {
    try {
      await this.session.speak({ text, task_type: this.sdk.TaskType.REPEAT, taskMode: this.sdk.TaskMode.SYNC });
    } catch (e) {
      return new Promise(res => DH.speak(text, Object.assign({}, opt, { onEnd: res })));
    }
  },

  async switchRole(role) {
    if (HEYGEN_CFG.mode !== 'stream' || !this.session) return;
    try { await this.session.stopAvatar(); } catch (e) { }
    this.session = null;
    try { await this.startStream(role); } catch (e) { }
  }
};

      ['stream', 'HeyGen 实时会话', '需要外网与 API Key，用于自由问答'],
      ['builtin', '内置渲染', '拼音驱动的 SVG 骨骼，任何环境可用']].map(([k, n, d]) =>
        `<label class="cfgopt ${HEYGEN_CFG.mode === k ? 'on' : ''}">

        <div class="cfgin"><label>API Key</label><input id="cf_key" value="${HEYGEN_CFG.apiKey}" placeholder="从 HeyGen 后台 Settings → API 获取"></div>
        <div class="cfgin"><label>Session Token</label><input id="cf_tok" value="${HEYGEN_CFG.token}" placeholder="本地打开受跨域限制时，改为直接粘贴 token"></div>
        <div class="cfgin"><label>监护人形象</label><input id="cf_a1" value="${HEYGEN_CFG.avatar.jianhu}" placeholder="avatar_id"></div>
        <div class="cfgin"><label>调度员形象</label><input id="cf_a2" value="${HEYGEN_CFG.avatar.diaodu}" placeholder="avatar_id"></div>
        <div class="cfgin"><label>值班负责人</label><input id="cf_a3" value="${HEYGEN_CFG.avatar.zhiban}" placeholder="avatar_id"></div>
      </div>
      <div class="sec"><div class="st">说明</div>
        <div class="sc" style="font-size:11.5px;color:#93a9c4;line-height:1.8">
          预渲染片段随系统打包，离线播放；三种方式自动降级。
        </div>
      </div>
    </div>
    <div class="df"><button class="btn" id="cf_test">测试连接</button>
      <button class="btn pri" id="cf_ok">保存</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector('.cls').onclick = () => m.remove();
  m.querySelectorAll('input[name=dhmode]').forEach(r => r.onchange = () => {
    m.querySelectorAll('.cfgopt').forEach(o => o.classList.toggle('on', o.querySelector('input').checked));
  });
  m.querySelector('#cf_test').onclick = async () => {
    const btn = m.querySelector('#cf_test'); btn.textContent = '测试中…';
    HEYGEN_CFG.apiKey = m.querySelector('#cf_key').value.trim();
    try {
      const r = await fetch('https://api.heygen.com/v2/avatars', { headers: { 'x-api-key': HEYGEN_CFG.apiKey } });
      const j = await r.json();
      const n = ((j.data && (j.data.avatars || j.data)) || []).length;
      btn.textContent = r.ok ? `连接成功，${n} 个形象` : '失败 ' + r.status;
    } catch (e) { btn.textContent = '跨域受限，请用本地服务器打开'; }
  };
  m.querySelector('#cf_ok').onclick = () => {
    HEYGEN_CFG.mode = m.querySelector('input[name=dhmode]:checked').value;
    HEYGEN_CFG.apiKey = m.querySelector('#cf_key').value.trim();
    HEYGEN_CFG.token = m.querySelector('#cf_tok').value.trim();
    HEYGEN_CFG.avatar.jianhu = m.querySelector('#cf_a1').value.trim();
    HEYGEN_CFG.avatar.diaodu = m.querySelector('#cf_a2').value.trim();
    HEYGEN_CFG.avatar.zhiban = m.querySelector('#cf_a3').value.trim();
    Avatar.save(); Avatar.apply();
    if (HEYGEN_CFG.mode === 'stream') {
      Avatar.startStream('jianhu').then(() => toast('实时会话已建立', 'ok'))
        .catch(e => { toast('实时会话失败：' + e.message, 'bad'); HEYGEN_CFG.mode = 'builtin'; Avatar.apply(); });
    }
    m.remove();
  };
}

function guideSteps() {
  const st = STEP();
  if (!st) return [];
  const atLoc = S.loc === st.loc;
  const g = [];
  if (st.act === 'recv') {
    g.push({ t: `前往 ${LOC[st.loc].name}`, ok: atLoc });
    g.push({ t: '填写发令单位与发令人', ok: !!(S.ord.unit && S.ord.from) });
    g.push({ t: '复诵调度下令并核对票令一致', ok: S.beat > 1 });
  } else if (st.act === 'report') {
    g.push({ t: `前往 ${LOC[st.loc].name}`, ok: atLoc });
    g.push({ t: '向调度汇报本段完成情况', ok: S.beat > 1 });
  } else {
    g.push({ t: `前往 ${LOC[st.loc].name}`, ok: atLoc });
    g.push({ t: `手指「${devName(st.target)}」`, ok: !!S.sel });
    g.push({ t: '完整复诵票面内容', ok: S.beat > 2 });
    if (st.act === 'gis') {
      const n = ['hui', 'mech', 'arm', 'line'].filter(k => S.gis[k]).length;
      g.push({ t: `执行并核对四项位置指示（${n}/4）`, ok: S.beat > 3 && n >= 4 });
    } else {
      g.push({ t: '监护人发令后执行', ok: S.beat > 3 });
    }
    g.push({ t: '检查设备状态并回报', ok: S.beat > 4 });

}

  if (S.beat === 3) {
    if (st.act === 'gis') return { i: 'act', t: '执行操作并核对四项位置指示', h: teach ? '点击执行，逐项核对' : '长按执行，逐项核对', n: '执行后把四项位置指示逐项核对到位' };
    return { i: 'act', t: st.target ? `执行操作：${devName(st.target)}` : '按监护人发令执行操作', h: teach ? '点击设备执行' : '长按设备执行', n: '执行操作' };
  }
  if (S.beat === 4) return { i: 'speak', t: '检查设备状态并回报', h: '回报后点「回报」', n: '检查设备状态，向我回报' };
  return { i: 'check', t: '本项完成，监护人标"√"', h: '' };
}

function renderTaskbar() {
  const st = STEP();
  const bar = $('#taskbar');
  if (!bar) return;
  if (S.stage !== 'run' || !st) {
    bar.innerHTML = `<div class="tb1"><span class="tbno">—</span>
      <span class="tbtx">${S.stage === 'prep' ? '上岗前准备 · 三审 / 着装互检 / 风险分析' :
        S.stage === 'wufang' ? '五防模拟预演 · 按操作票顺序逐项模拟' : '本次陪练已结束'}</span>
      ${modeBtn()}</div>`;
    bindMode(); return;
  }
  const g = guideSteps();
  const cur = g.findIndex(x => !x.ok);
  const ins = instrNow();
  const lv = S.hintLv[st.no] || 0;
  bar.innerHTML = `
    <div class="tb1">
      <span class="tbno">第 ${st.no} 项</span>
      <span class="tbtx">${st.ticket}</span>
      ${modeBtn()}
    </div>
    ${ins ? `<div class="tbfoc">
      <span class="tbic">${AICON[ins.i] || ''}</span>
      <div class="tbnow"><b>${ins.t}</b>${ins.h ? `<span>${ins.h}</span>` : ''}</div>
      ${ins.go ? `<button class="tbgo" id="tb_go">前往 ${LOC[ins.go].name} →</button>` : ''}
      <button class="tbhint" id="btn_hint">我该做什么<i>提示 ${lv}/3</i></button>
    </div>` : ''}
    <div class="tb2">
      ${g.map((x, i) => `<span class="gs ${x.ok ? 'ok' : (i === cur ? 'now' : '')}">
        <i>${x.ok ? '✓' : i + 1}</i>${x.t}</span>`).join('<b class="ar">›</b>')}
      <span class="tbsp"></span>
      <button class="hintbtn" id="btn_know">知识地图</button>
    </div>`;
  bindMode();
  const tg = $('#tb_go'); if (tg) tg.onclick = () => goLoc(ins.go);
  $('#btn_hint').onclick = useHint;
  $('#btn_know').onclick = () => openKnow();
}

function modeBtn() {
  return `<span class="modesw">${Object.keys(MODES).map(k =>
    `<button data-mode="${k}" class="${S.mode === k ? 'on' : ''}" title="${MODES[k].d}">${MODES[k].n}</button>`).join('')}</span>`;
}
function bindMode() {
  $$('.modesw button').forEach(b => b.onclick = () => {
    S.mode = b.dataset.mode;
    toast(MODES[S.mode].n + '：' + MODES[S.mode].d, '');
    renderTaskbar(); renderKP(); updateActbar();
  });
}

/* ---------- 知识点卡 ---------- */
function renderKP() {
  const box = $('#kpbox');
  if (!box) return;
  const st = STEP();
  if (S.stage !== 'run' || !st || S.mode === 'exam') { box.innerHTML = ''; box.style.display = 'none'; return; }
  box.style.display = '';
  const kp = (typeof STEPKP !== 'undefined' && STEPKP[st.no]) || { k: [], pts: [], errs: [] };
  const topics = kp.k.map(id => KNOW.find(x => x.id === id)).filter(Boolean);
  // 只有当本项引入了尚未讲过的主题时才自动展开，避免反复占位
  const fresh = kp.k.filter(id => !S.kpSeen[id]);
  if (S.kpAuto !== st.no) {
    S.kpAuto = st.no;
    S.kpOpen = S.mode === 'teach' && fresh.length > 0;
    kp.k.forEach(id => S.kpSeen[id] = true);
  }
  const open = !!S.kpOpen;
  box.innerHTML = `
    <div class="kp ${open ? 'open' : ''}">
      <div class="kph" id="kph">
        <span class="tag2">知识点</span>
        <b>${topics.map(t => t.t).join(' · ') || '本项要点'}</b>
        <span class="kpsp"></span>
        ${fresh.length ? '<span class="kpnew">新知识点</span>' : ''}
        <span class="kpfold">${open ? '收起' : '展开'}</span>
      </div>
      <div class="kpb">
        <div class="kprow">
          <div class="kpc">
            <div class="kpt">这一项要做什么</div>
            <ul>${kp.pts.map(p => `<li>${p}</li>`).join('')}</ul>
          </div>
          <div class="kpc">
            <div class="kpt warn">常见错误</div>
            <ul class="err">${kp.errs.map(p => `<li>${p}</li>`).join('')}</ul>
          </div>
        </div>
        <div class="kpc">
          <div class="kpt">为什么这样做</div>
          <p>${st.why}</p>
        </div>
        <div class="kpc">
          <div class="kpt">依据条款</div>
          <p class="rule">${st.rule}</p>
        </div>
        ${S.mode === 'teach' && st.recite ? `
        <div class="kpc say">
          <div class="kpt">标准话术</div>
          <p class="stdsay">${st.recite}</p>
          <button class="btn" id="kp_follow">跟读这一句</button>
        </div>` : ''}
        ${topics.length ? `<div class="kplink">相关主题：${topics.map(t =>
        `<a data-k="${t.id}">${t.t}</a>`).join('')}</div>` : ''}
      </div>
    </div>`;
  $('#kph').onclick = () => { S.kpOpen = !open; S.kpAuto = st.no; renderKP(); };
  const f = $('#kp_follow');
  if (f) f.onclick = () => { if (S.beat === 1) { $('#rin').value = st.recite; $('#rin').focus(); } };
  $$('.kplink a').forEach(a => a.onclick = () => openKnow(a.dataset.k));
}

/* ---------- 三级提示 ---------- */
async function useHint() {
  const st = STEP(); if (!st) return;
  const lv = (S.hintLv[st.no] || 0) + 1;
  if (lv > 3) { toast('本项提示已用完', ''); return; }
  S.hintLv[st.no] = lv;
  S.hints.push({ step: st.no, lv, t: now() });
  const kp = STEPKP[st.no] || { hints: [] };
  const txt = kp.hints[lv - 1] || '';
  const label = ['方向提示', '要点提示', '标准答案'][lv - 1];
  say('s', `<span class="tag wn">${label}</span>${txt}`);
  if (lv === 3 && S.beat === 1) { $('#rin').value = st.recite; }
  S.score.rule -= (lv === 3 ? 4 : lv === 2 ? 2 : 1);
  renderTaskbar();
  await speak(txt, { pose: lv === 3 ? 'correct' : 'explain' });
}

/* ---------- 知识地图抽屉 ---------- */
function openKnow(focus) {
  const st = STEP();
  const rel = (st && STEPKP[st.no] && STEPKP[st.no].k) || [];
  let cur = focus || rel[0] || KNOW[0].id;
  const m = el('div', 'mask');
  const paint = () => {
    const k = KNOW.find(x => x.id === cur) || KNOW[0];
    m.innerHTML = `<div class="dlg" style="width:min(940px,96vw)">
      <div class="dh"><b>倒闸操作知识地图</b>
        <span style="font-size:11px;color:#93a9c4">当前第 ${st ? st.no : '—'} 项关联的主题已高亮</span>
        <span class="cls">×</span></div>
      <div class="db" style="display:grid;grid-template-columns:216px 1fr;gap:18px;padding:0">
        <div class="knav">${KNOW.map(x => `<div class="kn ${x.id === cur ? 'on' : ''} ${rel.includes(x.id) ? 'rel' : ''}" data-k="${x.id}">
          <b>${x.t}</b><span>${x.sub}</span></div>`).join('')}</div>
        <div class="kbody">
          <h3>${k.t}<em>${k.sub}</em></h3>
          ${k.body.map(b => `<div class="kb"><div class="kbt">${b[0]}</div><p>${b[1].replace(/\n/g, '<br>')}</p></div>`).join('')}
        </div>
      </div></div>`;
    m.querySelector('.cls').onclick = () => m.remove();
    m.querySelectorAll('.kn').forEach(n => n.onclick = () => { cur = n.dataset.k; paint(); });
  };
  paint();
  m.onclick = e => { if (e.target === m) m.remove(); };
  document.body.appendChild(m);
}

];
function startTour() {
  let i = 0;
  const box = el('div', 'tour');
  const ring = el('div', 'tourring');
  document.body.appendChild(ring); document.body.appendChild(box);
  const paint = () => {
    const [sel, t, d] = TOUR[i];
    const n = document.querySelector(sel);
    if (!n) { i++; return i < TOUR.length ? paint() : fin(); }
    const r = n.getBoundingClientRect();
    ring.style.cssText = `position:fixed;z-index:90;pointer-events:none;border:2px solid #4d97e8;border-radius:8px;
      box-shadow:0 0 0 9999px rgba(3,8,15,.74),0 0 24px rgba(77,151,232,.7);transition:.28s;
      left:${r.left - 4}px;top:${r.top - 4}px;width:${r.width + 8}px;height:${r.height + 8}px`;
    const tall = r.height > innerHeight * 0.5;
    box.style.cssText = `position:fixed;z-index:92;width:330px;background:#0c1727;border:1px solid #2a6fbe;
      border-radius:9px;padding:14px 16px;box-shadow:0 24px 60px rgba(0,0,0,.7);transition:.28s;
      left:0px;top:0px`;
    box.innerHTML = `<div style="font-size:10.5px;color:#4d97e8;font-family:var(--mono);letter-spacing:1px">
        界面导览 ${i + 1}/${TOUR.length}</div>
      <div style="font-size:15px;font-weight:700;margin:6px 0 7px">${t}</div>
      <div style="font-size:12.5px;color:#93a9c4;line-height:1.75">${d}</div>
      <div style="display:flex;gap:8px;margin-top:13px">
        <button class="btn" id="tr_skip" style="padding:7px 12px">跳过</button>
        <span style="flex:1"></span>
        ${i > 0 ? '<button class="btn" id="tr_prev" style="padding:7px 12px">上一步</button>' : ''}
        <button class="btn pri" id="tr_next" style="padding:7px 14px">${i === TOUR.length - 1 ? '开始陪练' : '下一步'}</button>
      </div>`;
    box.querySelector('#tr_skip').onclick = fin;
    box.querySelector('#tr_next').onclick = () => { i++; i < TOUR.length ? paint() : fin(); };
    const pv = box.querySelector('#tr_prev'); if (pv) pv.onclick = () => { i--; paint(); };
    // 定位：先渲染再量高，保证不超出视口
    const bh = box.offsetHeight || 200, bw = 330;
    let bx, by;
    if (tall) {                       // 目标很高（如舞台）→ 放在其右侧
      bx = r.right + 16; by = r.top + Math.min(60, r.height * .2);
    } else if (r.top < innerHeight * .5) {
      bx = r.left + r.width / 2 - bw / 2; by = r.bottom + 14;
    } else {
      bx = r.left + r.width / 2 - bw / 2; by = r.top - bh - 14;
    }
    bx = Math.min(Math.max(12, bx), innerWidth - bw - 12);
    by = Math.min(Math.max(12, by), innerHeight - bh - 12);
    box.style.left = bx + 'px'; box.style.top = by + 'px';
  };
  const fin = () => { box.remove(); ring.remove(); S.toured = true; };
  paint();
}

  // 教学模式下，同类错误第一次只提醒不计违规
  if (S.mode !== 'teach') return false;
  S.warned = S.warned || {};
  if (S.warned[kind]) return false;
  S.warned[kind] = true;
  return true;
}

/* ---------------- 工具 ---------------- */
function norm(s) { return (s || '').replace(/[\s，。、；：？！,.;:?!（）()"'"'·"" ]/g, ''); }
function lcs(a, b) {
  const m = a.length, n = b.length; if (!m || !n) return 0;
  let prev = new Array(n + 1).fill(0), cur = new Array(n + 1).fill(0);
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) cur[j] = a[i - 1] === b[j - 1] ? prev[j - 1] + 1 : Math.max(prev[j], cur[j - 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[n];
}
function sim(a, b) { a = norm(a); b = norm(b); if (!a || !b) return 0; return lcs(a, b) / Math.max(a.length, b.length); }
function toast(t, k) {
  const e = el('div', 'toast ' + (k || ''), t); document.body.appendChild(e);
  setTimeout(() => { e.style.transition = '.3s'; e.style.opacity = 0; setTimeout(() => e.remove(), 320); }, 2100);
}
function say(who, text, cls) {
  S.chat.push({ who, text, cls });
  const cb = $('#chat'); if (!cb) return;
  const map = { j: ['监', 'j'], o: ['操', 'o'], s: ['系', 's'], d: ['调', 'j'], z: ['值', 's'] };
  const m = map[who] || map.s;
  cb.querySelectorAll('.msg.latest').forEach(x => x.classList.remove('latest'));
  cb.appendChild(el('div', 'msg ' + m[1] + ' ' + (cls || '') + (who === 'j' || who === 'd' || who === 'z' ? ' latest' : ''), `<div class="av">${m[0]}</div><div class="bd">${text}</div>`));
  cb.scrollTop = cb.scrollHeight;
}
function pushMsg(t, k) {
  S.msgs.unshift({ t: now(), x: t, k: k || '' });
  if (S.msgs.length > 40) S.msgs.pop();
  const m = $('#msgs'); if (m) renderMsgs();
}
function renderMsgs() {
  const m = $('#msgs'); if (!m) return;
  m.innerHTML = S.msgs.map((x, i) => `<div class="${i === 0 ? 'new ' : ''}${x.k}"><span class="ts">${x.t}</span>${x.x}</div>`).join('');
}
function subtitle(who, text) {
  $('#subwho').textContent = who;
  $('#subtxt').innerHTML = text + '<span class="dh-wave"><i></i><i></i><i></i><i></i><i></i></span>';
}
function subtitleDone(text) { $('#subtxt').innerHTML = text; }

/* ---------------- 角色切换 ---------------- */
function useChar(k) {
  if (DHkey === k) return;
  DHkey = k; Avatar.stop(); Avatar.switchRole(k);
  DH.char = CHARACTERS[k]; DH.charKey = k; DH.render(); DH.setPose('idle');
  const c = CHARACTERS[k];
  $('#rcname').textContent = c.name;
  $('#rcrole').textContent = 'AI数字人陪练教练 · ' + c.role;
}

/* ---------------- 语音 ---------------- */
function speak(text, opt) {
  opt = opt || {};
  const who = opt.who || CHARACTERS[DHkey].role;
  subtitle(who, opt.show || text);
  if (opt.pose) DH.setPose(opt.pose);
  if (opt.nod) setTimeout(() => DH.nod(opt.nod), 120);
  if (opt.shake) setTimeout(() => DH.shake(), 120);
  return Avatar.speak(text, opt).then(() => {
    subtitleDone(opt.show || text);
    if (opt.pose && opt.rest !== false) DH.setPose('idle');
  });
}

function renderTop() {
  const done = STEPS.filter(s => s._done).length;

  $('#kvio').textContent = S.vio.length;
  $('#kvio').parentNode.className = 'kpi ' + (S.vio.length ? 'bad' : 'good');
  $('#kstop').textContent = S.abn.handled ? 1 : 0;
  const ph = STEP() ? STEP().phase : 3;
  const st = ['运行', '热备用', '冷备用', '检修'];
  let curIdx = 0;
  if (S.stage === 'end') curIdx = 3;
  else curIdx = Math.max(0, ph - 1);
  $('#states').innerHTML = st.map((n, i) =>
    `<div class="stp ${i < curIdx ? 'done' : ''} ${i === curIdx && S.stage !== 'end' ? 'cur' : ''} ${S.stage === 'end' ? 'done' : ''}"><i></i><span>${n}</span></div>`).join('');
}
function tick() {
  if (!S.t0) return;
  const s = Math.floor((Date.now() - S.t0) / 1000);
  $('#ktime').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}

    }
    const r = el('div', 'trow ' + (i === S.idx && S.stage === 'run' ? 'cur ' : '') + (s._done ? 'done ' : '') + (s._bad ? 'bad ' : '') + (s._skip ? 'skip' : ''),
      `<div class="no">${s.no}</div><div class="tx">${s.ticket}</div><div class="ck">${s._done ? '√' : (s._bad ? '×' : '')}</div>`);
    r.onclick = () => jumpTo(i);
    b.appendChild(r);
  });
  const cur = b.querySelector('.trow.cur'); if (cur) cur.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function jumpTo(i) {
  if (S.stage !== 'run' || S.ended) return;
  if (i === S.idx) return;
  if (STEPS[i]._done) { toast('该项已执行完毕', ''); return; }
  if (i < S.idx) { toast('操作票不得回退执行，已执行项不可重做', 'bad'); return; }
  // 跳项
  const skipped = [];
  for (let k = S.idx; k < i; k++) if (!STEPS[k]._done) skipped.push(STEPS[k].no);
  const t = STEPS[i];
  // 红线：未完成两种验电即合地刀
  if (t.redline === 'verify' && !(S.verify.v1 && S.verify.v2)) {
    S.idx = i; renderTicket();
    redlineGround(skipped);
    return;
  }
  violation('major', 'order', '跳项执行',
    `跳过第 ${skipped.join('、')} 项，直接执行第 ${t.no} 项`,
    '附录J 1.4 操作项目有漏项；1.5 操作项目顺序原则错误。附录F 2.13：操作项目完成后由监护人立即标注"√"，不得补打勾或提前打勾。');
  DH.setPose('correct');
  speak('停一下。操作票必须按顺序逐项执行，你跳过了前面的项目。请回到第' + STEPS[S.idx].no + '项。', { pose: 'correct', shake: true });
}

  S.score[dim] = (S.score[dim] || 0) - (level === 'red' ? 100 : level === 'major' ? 12 : 5);

  renderTop();

}

/* ---------------- 设备长按（手指口述/执行需按住，教学模式点按） ---------------- */
function bindDevHold(n) {
  const fire = () => devClick(n.dataset.dev);
  const needHold = () => S.stage === 'run' && (S.beat === 1 || S.beat === 3) && S.mode !== 'teach';
  n.onclick = e => { e.stopPropagation(); if (!needHold()) fire(); };
  let t = null, ring = null, raf = 0, t0 = 0;
  const clean = () => {
    if (t) { clearTimeout(t); t = null; }
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    if (ring) { ring.remove(); ring = null; }
  };
  n.addEventListener('pointerdown', e => {
    if (!needHold()) return;
    e.stopPropagation();
    const ms = S.beat === 3 ? 700 : 500;
    t0 = performance.now();
    ring = el('div', 'holdring');
    ring.style.left = (e.clientX - 23) + 'px'; ring.style.top = (e.clientY - 23) + 'px';
    document.body.appendChild(ring);
    const paint = () => {
      if (!ring) return;
      const f = Math.min(1, (performance.now() - t0) / ms);
      ring.style.setProperty('--p', (f * 360) + 'deg');
      if (f < 1) raf = requestAnimationFrame(paint);
    };
    raf = requestAnimationFrame(paint);
    t = setTimeout(() => { clean(); fire(); }, ms);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => n.addEventListener(ev, () => {
    if (!t) return;
    const held = performance.now() - t0;
    clean();
    if (held > 140) toast(S.beat === 3 ? '长按设备完成执行' : '长按设备完成手指口述');
  }));
}

/* ---------------- 设备点击 ---------------- */
function devClick(id) {
  if (!id) return;
  if (S.stage === 'wufang') return;
  if (S.stage !== 'run' || S.ended) return;
  const st = STEP();

  // 现场四指示 / 核对类热区
  if (id.startsWith('gis_')) { S.gis[id.slice(4)] = true; renderPanel(); return; }
  if (id.startsWith('cab_hvdisp_')) { S.gis['hv' + id.slice(11)] = true; renderPanel(); return; }
  if (id === 'bay_draw' || id === 'bay_label') { S.gis[id === 'bay_draw' ? 'draw' : 'label'] = true; renderPanel(); return; }

  // 第4拍：执行
  if (S.beat === 3) {
    if (id !== st.target) {
      violation('major', 'dual', '操作对象错误', `发令对象为 ${st.target}，实际操作 ${id}`,
        '风险7：走错间隔、图实不符或标识错误风险。');
      speak('你操作的不是本项设备。请核对双重名称后重新确认。', { pose: 'stop', shake: true });
      return;
    }
    doExecute(st); return;
  }
  // 第2拍：手指口述——先手指
  if (S.beat === 1) {
    if (st.loc !== S.loc) { toast('请先到达 ' + LOC[st.loc].name, 'bad'); return; }
    if (id === st.target) {
      S.sel = id;
      if (id === 'bay_plate') S.gis.plate = true;
      if (id === 'bay_hvdisp') S.gis.hv = true;
      renderPanel();
      $$('#panelwrap [data-dev="' + id + '"]').forEach(n => n.classList.add('sel'));
      say('o', `（手指${devName(id)}）`, '');
      $('#rin').focus();
      toast('已手指操作对象，请复诵票面内容', 'ok');
    } else if (lenient('point')) {
      say('s', `<span class="tag wn">提醒</span>手指的不是本项设备。本项要手指的是「${devName(st.target)}」。教学模式下这一次不计违规。`);
      speak(`手指的不是本项设备。本项要手指的是${devName(st.target)}。口到、眼到、手到，三者必须落在同一个对象上。`, { pose: 'correct' });
    } else {
      violation('minor', 'dual', '手指对象与票面不符', `票面对象为 ${devName(st.target)}，手指对象为 ${devName(id)}`,
        '附录E 变电电气操作行为规范：遵守"手指口述"原则规范唱票复诵，做到口到、眼到、手到。');
      speak('手指的不是本项设备。口到、眼到、手到，三者必须落在同一个对象上。', { pose: 'correct', shake: true });
    }
    return;
  }
  // 未发令即操作
  if (S.beat === 2 && id === st.target) {
    if (lenient('order')) {
      say('s', '<span class="tag wn">提醒</span>监护人还没有发出"对，执行"，此刻不能动设备。教学模式下这一次不计违规。');
      speak('等一下，我还没有发令。监护人确认"对，执行"之后你才可以操作。', { pose: 'stop' });
      return;
    }
    violation('major', 'dual', '未发出执行令即操作',
      '监护人尚未确认"对，执行"，操作人已动作设备', '风险4：每一项均执行监护人完整唱票、操作人手指操作对象并复诵、监护人确认"对，执行"后方可操作。');
    speak('本项我还没有发出执行令，不得操作。等我确认"对，执行"。', { pose: 'stop', shake: true });
    return;
  }
  if (S.beat >= 4) toast('本项已执行，请完成检查回报', '');
}
