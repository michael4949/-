<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小瓦特·班 · 班组长 AI 助手</title>
<style>
/* ===== 小瓦特·班 · 班组长 AI 助手（浅色 · 靛蓝 AI 体系） ===== */
:root{
  --bg:#f8f9fe; --paper:#ffffff; --tint:#eef0fb; --ink:#0e1430; --ink2:#3d4666; --ink3:#7b849c; --line:#e6e8f4; --line2:#d6d9ee;
  --pri:#5a5bf0; --prid:#4344c9; --vio:#9a4dff; --ok:#18b97a; --okbg:#e9f9f1; --warn:#d97706; --warnbg:#fff4e5; --bad:#e5484d; --badbg:#fef2f2; --info:#00a8c6; --infobg:#e6f8fb; --gold:#ffd166; --navy:#00367a;
  --sans:'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Noto Sans SC',sans-serif; --mono:'JetBrains Mono','SFMono-Regular',Consolas,monospace;
  --sbw:196px; --sidew:340px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.6;overflow:hidden}
button{font-family:inherit;cursor:pointer;font-size:12px}
input,textarea{font-family:inherit}
b{font-weight:700}
u{text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#cdd0e6;border-radius:4px}::-webkit-scrollbar-track{background:transparent}
#app{display:grid;grid-template-columns:var(--sbw) 1fr var(--sidew);height:100vh}

/* ---------- 左栏 ---------- */
.sb{background:var(--paper);border-right:1px solid var(--line);padding:14px 12px;display:flex;flex-direction:column;gap:3px;overflow:auto}
.sb .brand{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:2px 4px 10px}
.sb .brand img{height:34px;width:auto;display:block}
.sb .brand b{display:block;font-size:13.5px}.sb .brand span{display:block;font-size:10.5px;color:var(--ink3)}
.sb .grp{font-size:10.5px;color:var(--ink3);letter-spacing:1.5px;padding:10px 8px 4px}
.sb a{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:10px;color:var(--ink2);font-size:12.5px;text-decoration:none;cursor:pointer}
.sb a:hover{background:#f3f4fb}
.sb a i{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--tint);font-style:normal;font-size:12px}
.sb a i.v{background:#f1ebff}.sb a i.g{background:#e9f9f1}.sb a i.o{background:#fff4e5}.sb a i.c{background:#e6f8fb}.sb a i.r{background:#fef2f2}
.sb a.on{background:var(--tint);color:var(--pri);font-weight:600;box-shadow:inset 0 0 0 1px rgba(90,91,240,.35)}
.sb a em{font-style:normal;margin-left:auto;font-size:10px;border-radius:9px;padding:0 6px;background:var(--bad);color:#fff}
.sb .me{margin-top:auto;border-top:1px solid var(--line);padding:10px 6px 0;font-size:11px;color:var(--ink2);display:flex;gap:8px;align-items:center}
.sb .me i{width:26px;height:26px;border-radius:50%;background:var(--warnbg);color:var(--warn);font-style:normal;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:11px;flex:none}
.sb .me span{display:block;color:var(--ink3);font-size:10px}

/* ---------- 主区 ---------- */
#main{overflow:auto;position:relative;padding:14px 18px 60px;display:flex;flex-direction:column;gap:12px;min-width:0}
.cmd{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line2);border-radius:14px;padding:8px 12px;box-shadow:0 6px 20px rgba(90,91,240,.08);flex-wrap:wrap;flex:none}
.cmd .ic{width:24px;height:24px;border-radius:8px;background:linear-gradient(135deg,var(--pri),var(--vio));flex:none;position:relative}
.cmd .ic::after{content:'';position:absolute;inset:6px;border-radius:50%;background:#fff;opacity:.9}
.cmd input{flex:1;min-width:180px;border:0;outline:0;font:inherit;font-size:13px;color:var(--ink);background:transparent}
.cmd input::placeholder{color:#9aa1b8}
.cmd .tools{display:flex;gap:5px;align-items:center}
.cmd .tools em{font-style:normal;font-size:12px;color:var(--pri);background:var(--tint);border-radius:8px;padding:3px 7px;cursor:pointer;border:1px solid transparent}
.cmd .tools em:hover{border-color:var(--pri)}
.cmd .tools em.rec{background:var(--badbg);color:var(--bad);animation:blink 1s infinite}
.cmd .sug{flex-basis:100%;display:flex;gap:6px;flex-wrap:wrap;padding-top:2px}
.cmd .sug b{font-weight:400;font-size:11px;color:var(--ink2);background:#f3f4fb;border:1px solid var(--line);border-radius:10px;padding:2px 9px;cursor:pointer}
.cmd .sug b:hover{background:var(--tint);color:var(--pri);border-color:#c9cbf5}
@keyframes blink{50%{opacity:0}}
.ph1{display:flex;align-items:baseline;gap:10px;flex:none}
.ph1 h2{margin:0;font-size:17px}
.ph1 span{font-size:11.5px;color:var(--ink3)}
.ph1 .r{margin-left:auto;display:flex;gap:6px}
.hero{border-radius:16px;padding:12px 16px;background:linear-gradient(120deg,#eef0fb,#f7f4ff 55%,#fff4e5);border:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;flex:none}
.hero .g{font-size:11.5px;color:var(--ink3)}
.hero h4{margin:1px 0 4px;font-size:18px;font-weight:800}
.hero h4 em{font-style:normal;background:linear-gradient(90deg,var(--pri),var(--vio));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{margin:0;font-size:12.5px;color:var(--ink);line-height:1.7;min-height:44px}
.cur::after{content:'▌';color:var(--pri);animation:blink .8s infinite}
.hero .nums{display:flex;gap:6px}
.hero .nums div{background:rgba(255,255,255,.85);border-radius:12px;padding:6px 12px;text-align:center;min-width:80px;cursor:pointer}
.hero .nums b{display:block;font-size:18px;font-family:var(--mono);color:var(--warn)}
.hero .nums span{font-size:10.5px;color:var(--ink3)}
.sec{display:flex;align-items:center;gap:8px;margin:2px 0 -4px;flex:none}
.sec i{width:20px;height:20px;border-radius:6px;background:var(--warnbg);display:block}
.sec i.v{background:#f1ebff}.sec i.c{background:var(--infobg)}.sec i.g{background:var(--okbg)}
.sec b{font-size:13.5px}.sec em{font-style:normal;font-size:10px;background:var(--bad);color:#fff;border-radius:9px;padding:0 6px}
.sec span{margin-left:auto;font-size:11px;color:var(--ink3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:none}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:none}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;flex:none}
.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;flex:none}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:11px 13px;box-shadow:0 8px 24px rgba(20,30,80,.04);min-width:0}
.card .h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.card .h b{font-size:13px}.card .h span{margin-left:auto;font-size:11px;color:var(--ink3)}
.card .h .r{margin-left:auto;display:flex;gap:6px}
.dc{background:var(--paper);border-radius:14px;padding:11px 13px;border:1px solid var(--line);position:relative;overflow:hidden;box-shadow:0 8px 24px rgba(20,30,80,.05);display:flex;flex-direction:column;opacity:0;transform:translateY(8px);transition:opacity .45s,transform .45s;min-width:0}
.dc.in,.noanim .dc{opacity:1;transform:none}
.dc.wide{grid-column:1/-1}
.dc::before{content:'';position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,#ff7e5f,var(--bad))}
.dc.w::before{background:linear-gradient(90deg,#ffc93c,var(--warn))}.dc.n::before{background:linear-gradient(90deg,var(--pri),var(--vio))}.dc.ok::before{background:linear-gradient(90deg,#3ad29a,var(--ok))}
.lv{display:inline-block;font-size:10.5px;border-radius:10px;padding:1px 8px;background:var(--badbg);color:var(--bad);margin-bottom:5px;align-self:flex-start}
.dc.w .lv,.lv.w{background:var(--warnbg);color:var(--warn)}.dc.n .lv,.lv.n{background:var(--tint);color:var(--pri)}.dc.ok .lv,.lv.ok{background:var(--okbg);color:var(--ok)}.lv.c{background:var(--infobg);color:var(--info)}
.dc b.t{display:block;font-size:13px;margin-bottom:3px}
.dc p{margin:0 0 6px;font-size:12px;color:var(--ink2);line-height:1.6}
.bt{display:flex;gap:6px;margin-top:auto;flex-wrap:wrap;padding-top:4px}
button.b,.bt button{font-size:11px;border-radius:8px;padding:5px 10px;background:linear-gradient(90deg,var(--pri),#7c5cfa);color:#fff;font-weight:600;border:0}
button.g,.bt button.g{background:#fff;border:1px solid var(--line2);color:var(--ink2);font-weight:400}
button.s{padding:3px 8px;font-size:10.5px}
button:disabled{opacity:.5;cursor:default}
button.pressed{transform:scale(.96);filter:brightness(.9)}
.tag{display:inline-block;font-size:10px;border-radius:8px;padding:0 6px;background:var(--tint);color:var(--pri);margin-right:4px}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.w{background:var(--warnbg);color:var(--warn)}.tag.bad{background:var(--badbg);color:var(--bad)}.tag.c{background:var(--infobg);color:var(--info)}.tag.v{background:#f1ebff;color:var(--vio)}
.num{text-decoration:underline dotted var(--pri);text-underline-offset:3px;color:var(--pri);cursor:pointer}
.note{font-size:11px;color:var(--ink3)}
.conf{font-size:10.5px;color:var(--ink3);border-top:1px dashed var(--line);margin-top:6px;padding-top:4px}
.tabs{display:flex;gap:4px;flex:none;border-bottom:1px solid var(--line);padding-bottom:6px}
.tabs button{background:transparent;border:0;border-radius:8px;padding:5px 11px;color:var(--ink2);font-size:12.5px}
.tabs button.on{background:var(--tint);color:var(--pri);font-weight:600}
.tbl{overflow:auto}
table.t{border-collapse:collapse;width:100%;font-size:12px}
table.t th{text-align:left;font-weight:600;color:var(--ink2);border-bottom:1px solid var(--line2);padding:6px 8px;font-size:11px;white-space:nowrap}
table.t td{border-bottom:1px dashed var(--line);padding:5px 8px;vertical-align:top}
table.t tr.hl td{background:var(--tint)}
table.t tr.dim td{opacity:.3}
.jobs div{display:grid;grid-template-columns:1fr auto;gap:6px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:11.5px;align-items:center}
.jobs div span{color:var(--ink3);font-size:10.5px;white-space:nowrap}
.jobs div em{font-style:normal;color:var(--bad);font-size:10.5px}
.jobs div .bt{margin:0;padding:0}

/* 人员条带 */
.ppl{display:none;margin:6px 0 8px;border-top:1px dashed var(--line);padding-top:8px}
.ppl.on{display:block}
.ppl .row{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;flex-direction:column;gap:2px;width:96px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:11px;cursor:pointer;position:relative;transition:opacity .4s,transform .4s,border-color .2s}
.chip:hover{border-color:var(--pri)}
.chip b{font-size:12px}
.chip .hb{height:4px;border-radius:2px;background:var(--tint);overflow:hidden}
.chip .hb i{display:block;height:100%;background:var(--pri);width:0;transition:width .6s}
.chip .hr{font-family:var(--mono);font-size:10px;color:var(--ink3)}
.chip.dim{opacity:.32}
.chip .why{position:absolute;right:6px;top:5px;font-size:9.5px;color:var(--ink3);background:#fff;border-radius:6px;padding:0 4px;opacity:0;transition:.3s;max-width:56px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.dim .why,.chip.bad .why,.chip.lead .why{opacity:1}
.chip.bad{border-color:var(--bad)}.chip.bad .hb i{background:var(--bad)}.chip.bad .why{color:var(--bad)}
.chip.lead{border-color:var(--pri);background:var(--tint)}.chip.lead .why{color:var(--pri)}
.chip.pick{border-color:var(--ok);background:var(--okbg)}
.tk{font-size:11.5px;color:#5b5f7a;font-style:italic;background:#faf8ff;border:1px dashed #d9d0f5;border-radius:10px;padding:7px 10px;margin-top:8px;line-height:1.65;display:none}
.tk.on{display:block}
.tk .lbl{display:block;font-style:normal;font-size:10px;color:var(--vio);letter-spacing:1px;margin-bottom:2px}

/* 表单 */
.form{display:grid;grid-template-columns:70px 1fr;gap:5px 8px;font-size:11.5px;align-items:center}
.form label{color:var(--ink3);text-align:right}
.form div.f{border:1px solid #e0e3f0;border-radius:6px;padding:4px 8px;min-height:24px;background:#fbfbfe;color:var(--ink);transition:.2s}
.form div.f.fill{border-color:var(--pri);background:#f3f4ff}
.form .btnrow{grid-column:1/-1;margin-top:4px}

/* 照片识别 */
.photo{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:start}
.ph{position:relative;height:110px;border-radius:10px;overflow:hidden;background:linear-gradient(180deg,#9fb1c6,#5f7690 60%,#3e4f63);border:1px solid #d6dbe6;cursor:pointer}
.ph.big{height:220px}
.ph .pole{position:absolute;left:58%;top:6%;width:6px;height:90%;background:#c9ccd2;border-radius:3px}
.ph .wire{position:absolute;left:20%;top:22%;width:60%;height:2px;background:#3a3f48;transform:rotate(-8deg)}
.ph .wire2{position:absolute;left:38%;top:30%;width:34%;height:2px;background:#2b2f36;transform:rotate(38deg)}
.ph .tree{position:absolute;left:8%;top:30%;width:44%;height:60%;border-radius:50% 50% 20% 20%;background:radial-gradient(circle at 40% 40%,#4f8a3a,#2f5a25)}
.ph .cab{position:absolute;left:22%;top:14%;width:56%;height:80%;background:linear-gradient(180deg,#b9c0c9,#8e97a3);border-radius:4px;border:2px solid #6b7480}
.ph .cab::after{content:'';position:absolute;left:46%;top:44%;width:8%;height:10%;background:#3b3f48;border-radius:2px}
.ph .scan{position:absolute;left:0;right:0;top:-4px;height:3px;background:var(--vio);box-shadow:0 0 12px var(--vio);opacity:0}
.ph.scan .scan{animation:scan 1.6s ease-in-out 1 forwards;opacity:1}
@keyframes scan{from{top:-4px}to{top:100%}}
.ph .box{position:absolute;border:2px solid var(--gold);border-radius:4px;opacity:0;transition:.4s}
.ph .box.on,.ph.done .box{opacity:1}
.ph .box i{position:absolute;left:-2px;top:-16px;font-style:normal;font-size:9.5px;background:var(--gold);color:#3a2a00;padding:0 4px;border-radius:3px;white-space:nowrap}
.ph .box.bad{border-color:var(--bad)}.ph .box.bad i{background:var(--bad);color:#fff}
.rd{font-size:11.5px;line-height:1.6}
.rd div{opacity:0;transition:.4s}.rd div.in,.rd.done div{opacity:1}
.rd em{font-style:normal;color:var(--warn);font-size:11px}

/* 文稿 */
.doc{font-size:12px;line-height:1.75}
.doc h5{margin:0 0 6px;font-size:13px}
.doc p{margin:0 0 6px;color:var(--ink);transition:.3s;position:relative;padding-right:4px}
.doc p.old{opacity:.35;text-decoration:line-through}
.doc p.new{background:var(--okbg);border-radius:6px;padding:2px 6px}
.doc p .fetch{color:var(--vio);font-style:italic}
.doc .chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.doc .chips b{font-weight:400;font-size:10.5px;color:var(--pri);background:var(--tint);border-radius:8px;padding:2px 8px;cursor:pointer;border:1px solid transparent}
.doc .chips b:hover{border-color:var(--pri)}
.doc .foot{font-size:10.5px;color:var(--ink3);border-top:1px dashed var(--line);margin-top:8px;padding-top:6px}
.doclist a{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.doclist a:hover{background:var(--bg)}
.doclist a.on{background:var(--tint);border-color:#c9cbf5}
.doclist a b{font-size:12.5px;font-weight:600}
.doclist a span{font-size:10.5px;color:var(--ink3);margin-left:auto}

/* 台账聚光（覆盖主区） */
.spot{position:fixed;left:var(--sbw);right:var(--sidew);top:0;bottom:0;background:rgba(14,20,48,.28);z-index:40;display:none;padding:40px 60px;align-items:flex-start;justify-content:center}
.spot.on{display:flex}
.spot .box{background:#fff;border:1px solid #c9cbf5;border-radius:14px;padding:12px 14px;box-shadow:0 24px 60px rgba(20,30,80,.3);width:100%;max-width:820px;max-height:calc(100vh - 80px);display:flex;flex-direction:column}
.spot .h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.spot .h b{font-size:13px}.spot .h button{margin-left:auto;font-size:11px;background:var(--tint);color:var(--pri);border:0;border-radius:8px;padding:3px 9px}
.spot .tbl{overflow:auto}
.spot table.t tr{transition:.3s}
.spot.lit table.t tr{opacity:.22}
.spot.lit table.t tr.me{opacity:.55}
.spot table.t tr.me.hl{opacity:1;background:var(--tint)}
.spot table.t tr.me.hl td.v{color:var(--pri);font-weight:700}
.spot .sum{margin-top:6px;font-family:var(--mono);font-size:12px;color:var(--pri);text-align:right;min-height:20px}

/* 光标与通知 */
.cursor{position:absolute;width:18px;height:18px;z-index:30;pointer-events:none;opacity:0;transition:left .6s cubic-bezier(.4,.1,.2,1),top .6s cubic-bezier(.4,.1,.2,1),opacity .3s;left:0;top:0}
.cursor svg{width:18px;height:18px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.cursor.on{opacity:1}
.cursor .lbl{position:absolute;left:16px;top:14px;font-size:9.5px;background:var(--pri);color:#fff;border-radius:6px;padding:1px 6px;white-space:nowrap}
.flys{position:fixed;right:calc(var(--sidew) + 16px);top:76px;z-index:35;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.fly{background:#fff;border:1px solid #cfe9dc;border-left:3px solid var(--ok);border-radius:10px;padding:6px 10px;font-size:11px;box-shadow:0 8px 20px rgba(20,30,80,.12);opacity:0;transform:translateX(30px);transition:.5s}
.fly.in{opacity:1;transform:none}
.fly.w{border-left-color:var(--warn);border-color:#f5dfb8}

/* ---------- 右栏 · 小瓦特 ---------- */
.side{background:var(--paper);border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0;height:100vh}
.side .sh{padding:12px 14px 8px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.xw{width:76px;height:76px;position:relative;display:flex;align-items:center;justify-content:center;flex:none}
.xw .ring{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(90,91,240,.25);transition:.4s}
.xw.talk .ring{border-color:var(--pri);box-shadow:0 0 0 6px rgba(90,91,240,.12);animation:xr 1.2s infinite}
.xw.think .ring{border-style:dashed;border-color:var(--vio);animation:spin 6s linear infinite}
.xw.work .ring{border-color:var(--ok);box-shadow:0 0 0 6px rgba(24,185,122,.12)}
.xw.look .ring{border-color:var(--info);box-shadow:0 0 0 6px rgba(0,168,198,.12)}
.xw.listen .ring{border-color:var(--bad);box-shadow:0 0 0 6px rgba(229,72,77,.12);animation:xr 1s infinite}
@keyframes xr{50%{box-shadow:0 0 0 12px rgba(90,91,240,.04)}}
@keyframes spin{to{transform:rotate(360deg)}}
.xw svg,.xw img{width:62px;height:62px;border-radius:50%;object-fit:cover}
.xw .mouth{transform-origin:60px 78px}
.xw.talk .mouth{animation:mouth .28s infinite alternate}
@keyframes mouth{from{transform:scaleY(.4)}to{transform:scaleY(1.2)}}
.xw .eye{transform-origin:center}
.xw.think .eye{animation:eyeup 2s infinite}
.xw.look .eye{animation:eyedown 1.6s infinite}
@keyframes eyeup{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-3px)}}
@keyframes eyedown{0%,100%{transform:translate(0,0)}50%{transform:translate(-2px,3px)}}
.xw .brow{opacity:0}.xw.think .brow{opacity:1}
.xw.breath img,.xw.breath svg{animation:breath 3.6s ease-in-out infinite}
@keyframes breath{50%{transform:translateY(-2px) scale(1.02)}}
.side .sh .nm b{font-size:14px;display:block}
.side .sh .nm span{font-size:10.5px;color:var(--ink3);display:block}
.side .sh .nm span i{font-style:normal;color:var(--pri);font-weight:600}
.side .sub{margin:8px 12px 0;background:linear-gradient(135deg,#eef0fb,#f7f4ff);border-left:3px solid var(--pri);border-radius:0 10px 10px 0;padding:7px 10px;font-size:11.5px;line-height:1.6;min-height:48px;color:var(--ink2);flex:none}
.side .sub::before{content:'她在说 · ';color:var(--pri);font-weight:600;font-size:10.5px}
.chat{padding:10px 12px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow:auto;scroll-behavior:smooth}

const XW = {

  if (/催办|志远/.test(t)) { go(() => { const st = LS.get('defects', {})['d1']; if (st) XW.answer('志远站 F14 那条缺陷已经催办了，吴倩明天巡视顺路处理，回传照片后自动关闭。', null, { confirm: false }); else if (/状态|什么/.test(t)) XW.answer('志远站 F14 志甲线终端蓄电池锈蚀，8-28 登记、时限 3 天，现在超期 3 天，还没处理。要我发催办吗？', '志远站 F14 志甲线终端蓄电池锈蚀，8-28 登记、时限 3 天，现在超期 3 天，还没处理。要我发催办吗？<div class="bt"><button data-act="urge">发出催办</button><button class="g">先不用</button></div>', { confirm: false }); else ACT.urge(); }); return; }
  if (/值班表|排班/.test(t)) { go(() => ensure('sched', () => DUTY.run(), 'duty')); return; }
  if (/审票|工作票|审一下/.test(t)) { go(() => ensure('sched', () => TICKETREV.run(), 'ticket')); return; }
  if (/干了多久|塘尾线那组|进度/.test(t)) { go(() => ensure('sched', () => ACT['prog-check'](), 'prog')); return; }
  if (/班前会/.test(t)) { go(() => ensure('docs', () => DOCS.gen('premeet'))); return; }
  if (/月度总结|总结/.test(t)) { go(() => ensure('docs', () => DOCS.gen('monthly'))); return; }
  if (/周报/.test(t)) { go(() => ensure('docs', () => DOCS.gen('weekly'))); return; }
  if (/台风应对/.test(t)) { go(() => { if (DOCS.host || $('#sddoc')) DOCS.chip('typhoon'); else XW.answer('先打开一份文稿，我在安全那段加台风应对。', null, { confirm: false }); }); return; }
  if (/出.*题|出五道/.test(t)) { go(() => ensure('train', () => TRAINPG.genQ(/光差/.test(t) ? 'c5' : /整定/.test(t) ? 'c6' : 'c5'), 'course')); return; }
  if (/判.*卷/.test(t)) { go(() => ensure('train', () => TRAINPG.gradeRun(), 'grade')); return; }
  if (/实操|评分表|打.*分/.test(t)) { go(() => ensure('train', () => { TRAINPG.sheet = 's1'; TRAINPG.draw(); XW.answer('倒闸操作的评分表打开了，考评对象我先填了郭子扬，你改数字就行。', null, { confirm: false }); }, 'sheet')); return; }
  if (/谁去合适|检修任务|谁合适/.test(t)) { go(() => { const def = DISPATCH.defaults(); XW.answer('下周凤凰线 #20 杆绝缘子更换，我建议负责人' + def.lead.n + '，班员' + def.crew.map(p => p.n + '（本周 ' + p.week + ' 小时）').join('、') + '。理由：三个人都有登高证，' + def.lead.n + '有负责人资格，' + def.crew[0].n + '和' + def.crew[1].n + '这周工时最少。' + (XW.mem.get('凤凰线备选') ? '上次你把凤凰线的活给了' + XW.mem.get('凤凰线备选') + '，这次我也先想到他，看你定。' : '安排由你决定。'), null, {}); }); return; }
  if (/竞赛|人选/.test(t)) { go(() => XW.answer('技能竞赛人选我会先想到李文博（去年三等奖，"设备运维"L4）和郭子扬（29 岁，"故障分析"L3，这两年进步最快）。韩雪已经是技术能手，可以做指导。人选由你和所里定。', null, {})); return; }
  if (/带电作业资格|谁持有/.test(t)) { go(() => XW.answer('持带电作业资格的是黄伟强和李文博两个人，都在有效期内。登高作业证有六个人：韩雪、黄伟强、李文博、吴倩、郭子扬、赵敏。', null, { confirm: false })); return; }
  if (/两票|合格率/.test(t)) { go(() => { if (S.page === 'office') XW.answer('本月三个班两票：一班 12/12，二班 9/9，抢修班 15/15，都是全部合格。', null, { confirm: false }); else XW.answer('本月工作票 12 张，合格 12 张，合格率 100%。明天凤凰线那张第一种工作票我审过，补了验电和接地线档位。', null, { confirm: false }); }); return; }
  if (/三个班|哪个班|所里|人力缺口/.test(t)) { go(() => { if (/培训/.test(t)) XW.answer('三个班本月培训：一班 12 人里 4 人本月学时未完成，年度平均 76%；二班 81%，1 人未完成；抢修班 69%，3 人未完成。都是事实数据，怎么看由所里定。', null, { confirm: false }); else if (/证书/.test(t)) XW.answer('90 天内证书到期：一班 3 人、抢修班 2 人、二班 1 人。一班的三个我已经提醒过本人，复审这周开始报名。', null, { confirm: false }); else XW.answer('下个月人力最紧的是一班：凤凰线台风季专项巡视加三张证书复审占人，黄伟强和李文博工时已经连续两周超 24 小时。建议所里从抢修班借一名高级作业员两周。由所长定。', null, {}); }); return; }
  if (/考我|安规题/.test(t)) { go(() => ensure('safety', () => XW.answer('题在上面，选一个。', null, { confirm: false }), 'quiz')); return; }
  if (/经验/.test(t) && /记/.test(t)) { go(() => ACT['exp-start']()); return; }
  if (/存为案例|案例/.test(t)) { go(() => ensure('know', () => ACT['case-new']())); return; }
  if (who && /怎么样|最近|情况/.test(t)) { go(() => ensure('people', () => PEOPLEPG.show(who.n))); return; }
  if (/整定|定值|重合闸|差动|光差|遥控|安措|接地线|验电|电缆|外勤上限|零序/.test(t)) { go(() => { if (S.page === 'know') KNOWPG.ask(t); else ensure('know', () => KNOWPG.ask(t)); }); return; }
  if (/上次口径|按上次/.test(t)) { go(() => ensure('docs', () => DOCS.gen('weekly'))); return; }
  go(() => XW.answer('这件事我还不会办。今天能办的：派工、查工时、查证书和学时、写讲稿和材料、核对照片、催办缺陷、排值班表、审票、出题判卷、打实操分、答规程。', null, { confirm: false }));
};
Object.assign(ACT, {
  'ask-go'() { ensure('home', () => ACT['dispatch-go']({ dataset: {} })); },
  'ask-swap'() { ensure('home', () => ACT['home-swap']()); }
});

try{ boot(); }catch(e){ document.body.innerHTML='<pre style="color:#e5484d;padding:24px;white-space:pre-wrap">'+e.stack+'</pre>'; }
</script>
