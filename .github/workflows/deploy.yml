name: Deploy to GitHub Pages

# 构建并发布到 GitHub Pages，得到一个公开网址。
# 应用为纯前端：用户在网页里填自己的 Gemini Key（存浏览器本地），
# 因此无需任何密钥/Secrets 即可公开托管。
#
# 注意：本仓库的 Pages 当前用于「GitHub AI 雷达」报告画廊。为避免误覆盖，
# 本工作流只支持「手动触发」(workflow_dispatch)。确认要用 Pages 发布本应用后，
# 在 GitHub 仓库 Actions 页面手动运行即可。
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Enable & configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
