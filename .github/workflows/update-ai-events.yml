name: 刷新 AI 会议数据

# 浏览器有 CORS，抓取只能在服务端做 —— 由 Actions runner 定时跑爬虫，
# 把结果写回 aiconf/data/events.json 并内联进 index.html。
on:
  schedule:
    - cron: "17 */6 * * *"      # 每 6 小时一次（UTC）；错开整点避开高峰
  workflow_dispatch:            # 也可在 Actions 页面手动触发
    inputs:
      skip_gemini:
        description: "跳过 Gemini 联网检索（只跑站点适配器）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ai-events-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 浅克隆无法向另一分支推送

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 爬虫只用标准库，无需 pip install

      - name: 抓取并归一化
        env:
          # 可选：在仓库 Settings → Secrets 里加 GEMINI_API_KEY 即可启用联网检索。
          # 未配置时该源自动跳过，其余站点适配器照常工作。
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ inputs.skip_gemini }}" = "true" ]; then
            python3 aiconf/crawl.py --skip gemini
          else
            python3 aiconf/crawl.py
          fi

      - name: 把数据内联进 index.html
        run: python3 aiconf/build.py

      - name: 有变化才提交
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- aiconf/data/events.json aiconf/index.html; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          COUNT=$(python3 -c "import json;print(json.load(open('aiconf/data/events.json'))['totalEvents'])")
          git add aiconf/data/events.json aiconf/index.html
          git commit -m "chore(aiconf): 自动刷新会议数据（共 ${COUNT} 场）"
          for i in 1 2 3 4; do
            git push && break
            echo "推送失败，${i} 次重试…"
            git pull --rebase && sleep $((2 ** i))
          done

      # 网站发布在另一个分支的 docs/ 目录下（GitHub Pages 经典模式），
      # 所以刷新完数据还要同步过去，页面上才看得到新档期。
      - name: 同步到 GitHub Pages 分支
        env:
          PAGES_BRANCH: claude/jolly-volta-Qzl1D
        run: |
          set -e
          sync_once() {
            rm -rf /tmp/pages
            git fetch origin "$PAGES_BRANCH"
            git worktree prune
            git worktree add --detach /tmp/pages "origin/$PAGES_BRANCH"
            mkdir -p /tmp/pages/docs/aiconf/data
            cp "$GITHUB_WORKSPACE/aiconf/index.html"       /tmp/pages/docs/aiconf/index.html
            cp "$GITHUB_WORKSPACE/aiconf/data/events.json" /tmp/pages/docs/aiconf/data/events.json
          }

          sync_once
          cd /tmp/pages
          if git diff --quiet -- docs/aiconf; then
            echo "网站内容无变化，跳过"
            exit 0
          fi

          COUNT=$(python3 -c "import json;print(json.load(open('docs/aiconf/data/events.json'))['totalEvents'])")
          for i in 1 2 3 4; do
            cd /tmp/pages
            git add docs/aiconf
            git commit -q -m "deploy(aiconf): 刷新会议数据（共 ${COUNT} 场）" || true
            if git push origin "HEAD:$PAGES_BRANCH"; then
              echo "已同步到 $PAGES_BRANCH，Pages 会自动重新发布"
              exit 0
            fi
            echo "推送失败（可能有并发提交），第 ${i} 次重试…"
            sleep $((2 ** i))
            cd "$GITHUB_WORKSPACE"
            sync_once     # 基于最新的远端状态重做一遍，而不是硬塞
          done
          echo "同步失败：已重试 4 次" >&2
          exit 1
