[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemo-core"
version = "0.1.0"
description = "A self-evolving agent core — a Hermes-class learning runtime (skills + layered memory) built to run on Claude."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mnemo" }]
keywords = ["agent", "skills", "memory", "claude", "anthropic", "self-evolving"]

# The core runs on the standard library alone. Extras are opt-in.
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
mnemo = "mnemo.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mnemo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
