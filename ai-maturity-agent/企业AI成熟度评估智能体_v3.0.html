<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业AI成熟度评估智能体 v3.0 · 奇点达科技</title>
<script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.2/dist/html2pdf.bundle.min.js"></script>
<script src="config.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#070611;--bg2:#0c0a1d;--bg3:#120e26;
  --panel:rgba(255,255,255,.045);--panel2:rgba(255,255,255,.07);--brd:rgba(255,255,255,.10);
  --txt:#ecebf7;--mut:#9a96b8;--mut2:#6f6b8e;
  --v:#8b5cff;--v2:#a982ff;--c:#26e0d6;--c2:#5ff0e8;--pink:#ff5ca8;
  --grad:linear-gradient(120deg,#8b5cff 0%,#6a6bff 45%,#26e0d6 100%);
  --glow:0 0 24px rgba(139,92,255,.45);
}
html,body{height:100%}
body{font-family:'PingFang SC','Microsoft YaHei',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);line-height:1.7;overflow:hidden;-webkit-font-smoothing:antialiased}

/* animated ambient background */
.amb{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.amb .blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5;animation:float 18s ease-in-out infinite}
.amb .b1{width:520px;height:520px;background:radial-gradient(circle,#7b3cff,transparent 70%);top:-160px;left:-120px}
.amb .b2{width:460px;height:460px;background:radial-gradient(circle,#0fb9c4,transparent 70%);bottom:-180px;right:-120px;animation-delay:-6s}
.amb .b3{width:380px;height:380px;background:radial-gradient(circle,#ff4d97,transparent 70%);top:40%;left:55%;opacity:.28;animation-delay:-11s}
.amb .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:46px 46px;mask-image:radial-gradient(ellipse at 50% 40%,#000 30%,transparent 78%)}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-30px) scale(1.08)}}

.shell{position:relative;z-index:1;display:flex;height:100vh;overflow:hidden}

/* ===== Sidebar ===== */
.sb{width:288px;flex-shrink:0;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(18,14,38,.86),rgba(9,8,20,.92));backdrop-filter:blur(18px);border-right:1px solid var(--brd)}
.sb-top{padding:22px 22px 18px;border-bottom:1px solid var(--brd)}
.brand{display:flex;align-items:center;gap:12px}
.orb{width:42px;height:42px;flex-shrink:0;border-radius:50%;background:var(--grad);position:relative;box-shadow:var(--glow);animation:pulse 3.2s ease-in-out infinite}
.orb::before,.orb::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid rgba(139,92,255,.4);animation:ring 3.2s ease-out infinite}
.orb::after{animation-delay:1.6s}
.orb i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:18px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.4)}
@keyframes pulse{0%,100%{box-shadow:0 0 18px rgba(139,92,255,.4)}50%{box-shadow:0 0 30px rgba(38,224,214,.55)}}
@keyframes ring{0%{transform:scale(.8);opacity:.7}100%{transform:scale(1.6);opacity:0}}
.brand-tx .tag{font-size:8.5px;letter-spacing:3px;color:var(--mut2)}
.brand-tx h1{font-size:14.5px;font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1.3}
.brand-tx p{font-size:9px;color:var(--mut2);letter-spacing:1px}
.sb-sub{margin-top:14px;font-size:10px;color:var(--mut);display:flex;align-items:center;gap:6px}
.live{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);animation:blink 1.8s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}

.sb-steps{flex:1;overflow-y:auto;padding:18px 16px}
.sb-steps::-webkit-scrollbar{width:0}
.si{display:flex;gap:12px;padding:9px 8px;border-radius:10px;opacity:.4;transition:.35s;position:relative}
.si.on{opacity:1;background:var(--panel)}
.si.ok{opacity:.72}
.si-rail{position:absolute;left:19px;top:34px;bottom:-9px;width:1.5px;background:rgba(255,255,255,.08)}
.si:last-child .si-rail{display:none}
.si.ok .si-rail{background:linear-gradient(var(--c),rgba(38,224,214,.2))}
.si-dot{width:24px;height:24px;border-radius:50%;border:1.5px solid rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;z-index:1;background:var(--bg2);transition:.3s}
.si.on .si-dot{border-color:transparent;background:var(--grad);color:#fff;box-shadow:var(--glow)}
.si.ok .si-dot{border-color:var(--c);color:var(--c)}
.si-lbl b{display:block;font-size:11.5px;font-weight:600}
.si-lbl span{font-size:9px;color:var(--mut2);display:block}
.si-lbl .hint{font-size:8.5px;color:var(--c2);margin-top:2px;display:block}
.sb-ft{padding:14px 18px;border-top:1px solid var(--brd);font-size:8.5px;color:var(--mut2);line-height:1.8}
.sb-ft b{color:var(--mut)}
.pwr{margin-top:8px;display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border:1px solid var(--brd);border-radius:20px;font-size:8px;color:var(--mut);letter-spacing:.5px}
.pwr i{font-style:normal;width:6px;height:6px;border-radius:50%;background:var(--grad)}

/* ===== Main ===== */
.mn{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:54px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--brd);background:rgba(10,8,22,.5);backdrop-filter:blur(10px)}
.topbar .now{font-size:12px;color:var(--txt);font-weight:600;display:flex;align-items:center;gap:9px;min-width:0}
.topbar .now small{color:var(--mut2);font-weight:400;font-size:10px}
.tb-right{display:flex;align-items:center;gap:12px}
.pgw{width:110px;height:5px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.pgf{height:100%;border-radius:4px;background:var(--grad);transition:width .6s ease;width:4%}
.skipbtn{font-size:10px;padding:6px 11px;border:1px solid var(--brd);border-radius:8px;background:var(--panel);color:var(--mut);cursor:pointer;font-family:inherit;transition:.2s;white-space:nowrap}
.skipbtn:hover{color:var(--c2);border-color:rgba(38,224,214,.4)}
.chip-ai{font-size:9px;color:var(--c2);border:1px solid rgba(38,224,214,.3);padding:3px 9px;border-radius:20px;display:flex;align-items:center;gap:5px;white-space:nowrap}

.chat{flex:1;overflow-y:auto;padding:24px 28px 8px}
.chat::-webkit-scrollbar{width:8px}.chat::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:8px}
.msg{margin-bottom:18px;max-width:82%;animation:rise .35s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.ai{margin-right:auto}.msg.usr{margin-left:auto}
.who{font-size:9px;color:var(--mut2);margin-bottom:5px;font-weight:600;letter-spacing:1px;display:flex;align-items:center;gap:6px}
.msg.usr .who{justify-content:flex-end}
.who .av{width:16px;height:16px;border-radius:50%;background:var(--grad);font-size:8px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-style:normal}
.bbl{padding:13px 17px;font-size:13.5px;line-height:1.85;border-radius:4px 16px 16px 16px;word-break:break-word}
.msg.ai .bbl{background:var(--panel);border:1px solid var(--brd);backdrop-filter:blur(8px)}
.msg.ai .bbl strong{color:var(--c2)}
.msg.usr .bbl{background:var(--grad);color:#fff;border-radius:16px 4px 16px 16px;box-shadow:0 6px 20px rgba(139,92,255,.25)}
.msg.err .bbl{border-color:rgba(255,92,120,.4);background:rgba(255,92,120,.07)}

.cursorb{display:inline-block;width:8px;height:15px;background:var(--c);margin-left:3px;vertical-align:-2px;border-radius:2px;animation:blink 1s steps(2) infinite}
.st-status{display:flex;align-items:center;gap:9px;margin-top:4px;font-size:11px;color:var(--mut)}
.st-status em{font-style:normal}

.ph-div{display:flex;align-items:center;gap:12px;margin:28px 0 20px;animation:rise .4s ease}
.ph-div .ln{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(139,92,255,.45),transparent)}
.ph-div .bx{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 22px;border:1px solid rgba(139,92,255,.35);border-radius:14px;background:rgba(139,92,255,.08)}
.ph-div .bx b{font-size:11.5px;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px}
.ph-div .bx span{font-size:9px;color:var(--mut)}

.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.opts button{padding:9px 16px;border:1px solid var(--brd);border-radius:12px;font-size:12px;cursor:pointer;background:var(--panel);color:var(--txt);font-family:inherit;transition:.2s;position:relative;overflow:hidden}
.opts button:hover{border-color:transparent;background:rgba(139,92,255,.16);box-shadow:0 0 0 1px var(--v),0 6px 18px rgba(139,92,255,.22);transform:translateY(-1px)}
.opts.multi button.sel{background:linear-gradient(120deg,rgba(139,92,255,.3),rgba(38,224,214,.22));border-color:transparent;box-shadow:0 0 0 1px var(--c)}
.opts .hint{width:100%;font-size:10px;color:var(--mut2);margin-bottom:1px}
.opts.used button{opacity:.35;pointer-events:none;transform:none;box-shadow:none}
.opts.used button.picked{opacity:.75;border-color:rgba(38,224,214,.5);color:var(--c2)}
.confirm-m{margin-top:9px}
.confirm-m button{padding:9px 20px;border:none;border-radius:12px;background:var(--grad);color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;box-shadow:var(--glow)}
.confirm-m button:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}

.dot-anim{display:inline-flex;gap:5px;align-items:center}
.dot-anim span{width:6px;height:6px;border-radius:50%;background:var(--grad);animation:pk 1.3s infinite}
.dot-anim span:nth-child(2){animation-delay:.18s}.dot-anim span:nth-child(3){animation-delay:.36s}
@keyframes pk{0%,70%,100%{transform:scale(.6);opacity:.35}35%{transform:scale(1);opacity:1}}

/* ===== Input ===== */
.inp-bar{flex-shrink:0;border-top:1px solid var(--brd);background:rgba(10,8,22,.62);backdrop-filter:blur(12px);padding:12px 24px 14px}
.done-row{display:flex;gap:10px;justify-content:center;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.done-row .tip{width:100%;text-align:center;font-size:10px;color:var(--mut2)}
.file-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}
.up-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border:1px dashed var(--brd);border-radius:9px;font-size:11px;color:var(--mut);cursor:pointer;background:var(--panel);transition:.2s}
.up-btn:hover{border-color:var(--c);color:var(--c2)}
.ftag{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;background:rgba(38,224,214,.1);border:1px solid rgba(38,224,214,.25);border-radius:9px;font-size:10.5px;color:var(--c2)}
.ftag .x{cursor:pointer;opacity:.6}.ftag .x:hover{opacity:1}
.inp-row{display:flex;gap:10px;align-items:flex-end;background:var(--panel);border:1px solid var(--brd);border-radius:16px;padding:7px 7px 7px 16px;transition:.2s}
.inp-row:focus-within{border-color:var(--v);box-shadow:0 0 0 3px rgba(139,92,255,.14)}
.inp-row textarea{flex:1;border:none;background:transparent;color:var(--txt);font-size:13.5px;font-family:inherit;resize:none;outline:none;min-height:30px;max-height:150px;line-height:1.6;padding:6px 0}
.inp-row textarea::placeholder{color:var(--mut2)}
.send-btn{width:42px;height:42px;background:var(--grad);color:#fff;border:none;border-radius:12px;cursor:pointer;font-size:17px;flex-shrink:0;transition:.2s;box-shadow:var(--glow)}
.send-btn:hover{transform:scale(1.06)}
.send-btn:disabled{filter:grayscale(.7) brightness(.7);cursor:not-allowed;box-shadow:none;transform:none}
.inp-foot{text-align:center;font-size:9.5px;color:var(--mut2);margin-top:8px}

.btn-g{padding:10px 20px;border:none;border-radius:11px;background:var(--grad);color:#fff;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:var(--glow);transition:.2s;display:inline-flex;align-items:center;gap:7px}
.btn-g:hover{transform:translateY(-1px)}
.btn-o{padding:10px 18px;border:1px solid var(--brd);border-radius:11px;background:var(--panel);color:var(--txt);font-size:12px;cursor:pointer;font-family:inherit;transition:.2s}
.btn-o:hover{border-color:var(--v);color:var(--v2)}

/* ===== Welcome ===== */
.welcome{flex:1;overflow-y:auto;display:flex;align-items:center;justify-content:center;padding:36px}
.wbox{width:100%;max-width:620px;background:linear-gradient(160deg,rgba(24,18,48,.7),rgba(11,9,24,.78));border:1px solid var(--brd);border-radius:24px;padding:40px 40px 32px;backdrop-filter:blur(20px);box-shadow:0 30px 80px rgba(0,0,0,.5)}
.wbox .wtag{font-size:9px;letter-spacing:5px;color:var(--mut2);text-align:center}
.wbox h2{font-size:26px;text-align:center;margin:12px 0 6px;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:800;letter-spacing:1px}
.wbox .lead{color:var(--mut);font-size:13px;text-align:center;line-height:1.9;max-width:500px;margin:0 auto 22px}
.dims{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.dimc{background:var(--panel);border:1px solid var(--brd);border-radius:14px;padding:13px 10px;text-align:center;transition:.25s}
.dimc:hover{border-color:rgba(139,92,255,.5);background:rgba(139,92,255,.08);transform:translateY(-2px)}
.dimc .ic{font-size:19px}
.dimc b{display:block;font-size:11.5px;margin-top:5px;color:var(--txt);font-weight:600}
.dimc span{font-size:8.5px;color:var(--mut2);letter-spacing:1px}
.flowstrip{display:flex;gap:3px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:24px;padding:12px 10px;border:1px dashed rgba(255,255,255,.12);border-radius:14px}
.fs-i{font-size:10px;color:var(--mut);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.fs-i i{font-style:normal;width:16px;height:16px;border-radius:50%;background:rgba(139,92,255,.25);border:1px solid rgba(139,92,255,.5);color:var(--v2);font-size:8.5px;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.fs-a{color:var(--mut2);font-size:9px;margin:0 4px}
.go-btn{margin-top:4px;width:100%;padding:15px;background:var(--grad);color:#fff;border:none;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:2px;box-shadow:var(--glow);transition:.2s}
.go-btn:hover{transform:translateY(-2px);box-shadow:0 12px 34px rgba(139,92,255,.45)}
.go-sec{margin-top:10px;width:100%;padding:12px;background:var(--panel);color:var(--mut);border:1px solid var(--brd);border-radius:14px;font-size:12px;cursor:pointer;font-family:inherit;transition:.2s}
.go-sec:hover{color:var(--txt);border-color:var(--v)}
.wnote{text-align:center;font-size:10px;color:var(--mut2);margin-top:14px}

/* ===== Setup modal ===== */
.setup-ov{position:fixed;inset:0;z-index:80;background:rgba(7,6,17,.85);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:20px}
.setup-bx{width:min(500px,94vw);background:linear-gradient(160deg,rgba(26,20,52,.97),rgba(11,9,24,.99));border:1px solid var(--brd);border-radius:20px;padding:30px 32px}
.setup-bx h3{font-size:17px;margin-bottom:6px;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.setup-bx p{font-size:12px;color:var(--mut);line-height:1.9;margin-bottom:12px}
.setup-bx .way{background:var(--panel);border:1px solid var(--brd);border-radius:12px;padding:13px 15px;margin-bottom:11px;font-size:11.5px;color:var(--mut);line-height:1.8}
.setup-bx .way b{color:var(--c2);display:block;font-size:12px;margin-bottom:3px}
.setup-bx .way code{background:rgba(38,224,214,.12);color:var(--c2);padding:1px 6px;border-radius:5px;font-size:10.5px}
.setup-bx input{width:100%;padding:12px 15px;border:1px solid var(--brd);border-radius:11px;font-size:13px;font-family:inherit;outline:none;background:var(--panel);color:var(--txt);margin-bottom:12px}
.setup-bx input:focus{border-color:var(--v)}
.setup-acts{display:flex;gap:10px;justify-content:flex-end}

/* ===== Report View ===== */
.rview{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#1a1726}
.rview-bar{flex-shrink:0;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(10,8,22,.85);border-bottom:1px solid var(--brd)}
.rview-bar .t{font-size:13px;font-weight:600;display:flex;align-items:center;gap:9px}
.rview-bar .acts{display:flex;gap:10px}
.rstage{flex:1;overflow:auto;padding:30px 20px;display:flex;justify-content:center;align-items:flex-start}
.rstage::-webkit-scrollbar{width:10px}.rstage::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px}
#reportScaler{transform-origin:top center}

/* ===== The actual PDF document (A4 @96dpi = 794x1123) ===== */
#reportDoc{width:794px;background:#fff;color:#1f2430;font-family:'PingFang SC','Microsoft YaHei',sans-serif;box-shadow:0 24px 70px rgba(0,0,0,.5)}
#reportDoc *{box-sizing:border-box}
.rpage{width:794px;min-height:1123px;position:relative;overflow:hidden;padding:54px 58px;background:#fff}
.rpage.pb{page-break-before:always}
/* cover */
.rcover{padding:0;display:flex;flex-direction:column;justify-content:space-between;color:#fff;background:#0a1020}
.rcover .bgimg{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0}
.rcover .ov{position:absolute;inset:0;z-index:1}
.rcover .ct{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:space-between;height:1123px;padding:64px 60px}
.cov-top{display:flex;justify-content:space-between;align-items:flex-start}
.cov-brand{display:flex;align-items:center;gap:12px}
.cov-brand .cmark{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:#fff}
.cov-brand .bt small{font-size:9px;letter-spacing:4px;opacity:.8;display:block}
.cov-brand .bt b{font-size:14px;letter-spacing:1px}
.cov-date{font-size:11px;opacity:.85;text-align:right;letter-spacing:1px}
.cov-mid{margin-top:auto;margin-bottom:auto}
.cov-kick{font-size:12px;letter-spacing:8px;opacity:.85;margin-bottom:18px}
.cov-mid h1{font-size:48px;font-weight:800;line-height:1.18;letter-spacing:2px;margin-bottom:18px;text-shadow:0 4px 30px rgba(0,0,0,.4)}
.cov-mid .sub{font-size:14.5px;opacity:.9;line-height:1.9;max-width:560px}
.cov-co{margin-top:26px;display:inline-flex;align-items:center;gap:12px;padding:12px 22px;border-radius:14px;backdrop-filter:blur(6px)}
.cov-co .lab{font-size:10px;opacity:.7;letter-spacing:2px}
.cov-co .nm{font-size:22px;font-weight:700}
.cov-badge{position:relative;display:flex;align-items:center;gap:20px;margin-top:28px}
.cov-badge .ring{width:104px;height:104px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid rgba(255,255,255,.55);backdrop-filter:blur(4px)}
.cov-badge .ring b{font-size:34px;font-weight:800;line-height:1}
.cov-badge .ring small{font-size:9px;letter-spacing:2px;opacity:.85;margin-top:3px}
.cov-badge .meta b{font-size:19px;display:block}
.cov-badge .meta span{font-size:11.5px;opacity:.85;line-height:1.7;max-width:380px;display:block}
.cov-foot{display:flex;justify-content:space-between;align-items:flex-end;font-size:10px;opacity:.8;letter-spacing:1px;border-top:1px solid rgba(255,255,255,.25);padding-top:18px}

/* report inner */
.rh{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.rh .no{font-size:11px;font-weight:800;color:#fff;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rh h2{font-size:20px;font-weight:800;letter-spacing:1px}
.rh .en{margin-left:auto;font-size:9px;letter-spacing:3px;color:#aeb3c2}
.rdiv{height:3px;border-radius:3px;margin:10px 0 20px}

function fmt(t){return esc(t).replace(/\n/g,"<br>").replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>");}
function jsStr(t){return String(t).replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/\n/g,"\\n").replace(/</g,"\\x3c");}
function fnum(v,d){var n=parseFloat(v);return isNaN(n)?(d||0):n;}
function clampScore(v,d){var n=fnum(v,d==null?3:d);return Math.max(0.5,Math.min(5,n));}
function trimS(s){return s.trim();}
function arr(a){return Array.isArray(a)?a:[];}
function strv(s,d){return (typeof s==="string"&&s.trim())?s.trim():(d||"");}
function wait(ms){return new Promise(function(r){setTimeout(r,ms);});}
function chatArea(){return document.getElementById("chatArea");}

/* ---------------- Persistence (断点续评) ---------------- */
function slimConv(){
  return conv.map(function(m){
    var o={};
    for(var k in m){ if(k!=="files") o[k]=m[k]; }
    if(m.files) o.files=m.files.map(function(f){return {name:f.name,type:f.type};});
    return o;
  });
}
function saveState(){
  try{
    localStorage.setItem("aim2_state", JSON.stringify({
      v:3, ts:Date.now(), phase:phase, conv:slimConv(), done:done,
      REPORT:REPORT, PALETTE:PALETTE, themeKW:themeKW
    }));
  }catch(e){}
  if(coverData){ try{ localStorage.setItem("aim2_cover", coverData); }catch(e){} }
}
function loadState(){
  try{
    var s=JSON.parse(localStorage.getItem("aim2_state")||"null");
    if(!s || s.v!==3 || !s.conv || !s.conv.length) return false;
    phase=s.phase||0; conv=s.conv; done=!!s.done; REPORT=s.REPORT||null;
    PALETTE=s.PALETTE||null; themeKW=s.themeKW||"";
    try{ coverData=localStorage.getItem("aim2_cover")||null; }catch(e){}
    return true;
  }catch(e){ return false; }
}
function clearState(){
  try{ localStorage.removeItem("aim2_state"); localStorage.removeItem("aim2_cover"); }catch(e){}
}

/* ---------------- Report JSON Schema (structured outputs) ---------------- */
var STR={type:"string"};
var NUM={type:"number"};
function OBJ(props,req){return {type:"object",additionalProperties:false,required:req||Object.keys(props),properties:props};}
function ARR(items){return {type:"array",items:items};}
var REPORT_SCHEMA = OBJ({
  company:STR, industry:STR, scale:STR, revenue:STR,
  overallScore:NUM, level:{type:"string",enum:["L1","L2","L3","L4","L5"]}, levelName:STR, levelDesc:STR,
  summary:STR, background:STR,
  keyMetrics:ARR(OBJ({label:STR,value:STR,note:STR})),
  dimensions:ARR(OBJ({
    name:STR, score:NUM, benchmark:NUM, analysis:STR,
    subItems:ARR(OBJ({name:STR,score:NUM})),
    strength:STR, gap:STR, risk:STR, quickWin:STR
  })),
  findings:OBJ({strengths:ARR(STR),weaknesses:ARR(STR),opportunities:ARR(STR),risks:ARR(STR)}),
  gapAnalysis:OBJ({targetLevel:STR,targetName:STR,narrative:STR,keyGaps:ARR(OBJ({dimension:STR,current:NUM,target:NUM,action:STR}))}),
  roadmap:OBJ({d30:ARR(OBJ({title:STR,detail:STR,kpi:STR})),d90:ARR(OBJ({title:STR,detail:STR,kpi:STR})),d180:ARR(OBJ({title:STR,detail:STR,kpi:STR}))}),
  benefits:OBJ({narrative:STR,items:ARR(OBJ({name:STR,estimate:STR,basis:STR}))}),
  products:ARR(OBJ({name:STR,category:STR,reason:STR,value:STR})),
  governance:ARR(STR),
  palette:OBJ({primary:STR,secondary:STR,accent:STR,name:STR}),
  coverKeyword:STR
});

/* ---------------- Sidebar / topbar ---------------- */
function rSteps(){
  var h="";
  PHASES.forEach(function(p,i){
    var c = (done&&i===5) ? "ok" : (i<phase ? "ok" : (i===phase ? "on" : ""));
    h+='<div class="si '+c+'"><div class="si-rail"></div><div class="si-dot">'+((i<phase||(done&&i===5))?"✓":p.ic)+'</div><div class="si-lbl"><b>'+p.t+'</b><span>'+p.d+'</span>'+(i===phase&&!done?'<span class="hint">▸ '+p.hint+'</span>':"")+'</div></div>';
  });
  document.getElementById("steps").innerHTML=h;
}
function updateTopbar(){
  var tp=document.getElementById("tb-phase"), ts=document.getElementById("tb-step"),
      pg=document.getElementById("pgf"), sk=document.getElementById("skipBtn");
  if(!tp) return;
  var p=Math.min(phase,5);
  tp.textContent=PHASES[p].t;
  ts.textContent="· 环节 "+(p+1)+"/6 · "+PHASES[p].hint;
  if(pg) pg.style.width=(done?100:Math.round((p/6)*100+4))+"%";
  if(sk){
    sk.style.display=(done||busy||phase>=5)?"none":"";
    sk.textContent=(phase>=4)?"生成报告 ➝":"跳到下一环节 ➝";
  }
}

/* hide protocol markers while streaming */
function cleanStream(t){
  t=t.replace(/\[THEME\][\s\S]*?\[\/THEME\]/g,"")
     .replace(/\[OPTM\][\s\S]*?\[\/OPTM\]/g,"")
     .replace(/\[OPT\][\s\S]*?\[\/OPT\]/g,"")
     .replace(/\[NEXT\]/g,"");
  // truncate at any unclosed marker opening
  var mks=["[THEME]","[OPTM]","[OPT]","[RPTJSON]"];
  for(var i=0;i<mks.length;i++){
    var p=t.indexOf(mks[i]);
    if(p>=0) t=t.slice(0,p);
  }
  // trailing partial bracket like "[OP" / "[NE"
  var lb=t.lastIndexOf("[");
  if(lb>=0 && lb>=t.length-10 && t.indexOf("]",lb)<0) t=t.slice(0,lb);
  return t.trim();
}

/* ---------------- Anthropic API (streaming) ---------------- */
function buildApiMessages(){
  var apiMsgs=[];
  conv.slice(-60).forEach(function(m){
    if(m.sys||m.err) return;
    var role=m.from==="ai"?"assistant":"user";
    var content;
    if(m.files && m.files.length>0){
      var parts=[];
      m.files.forEach(function(f){
        if(f.b64){
          if(f.type && f.type.indexOf("image/")===0){ parts.push({type:"image",source:{type:"base64",media_type:f.type,data:f.b64}}); }
          else if(f.type==="application/pdf"){ parts.push({type:"document",source:{type:"base64",media_type:"application/pdf",data:f.b64}}); }
        }
      });
      parts.push({type:"text",text:m.text});
      content=parts.length>1?parts:m.text;
    }else{ content=m.text; }
    if(apiMsgs.length>0 && apiMsgs[apiMsgs.length-1].role===role && typeof apiMsgs[apiMsgs.length-1].content==="string" && typeof content==="string"){
      apiMsgs[apiMsgs.length-1].content+="\n"+content;
    }else{ apiMsgs.push({role:role,content:content}); }
  });
  if(apiMsgs.length===0 || apiMsgs[0].role==="assistant"){ apiMsgs.unshift({role:"user",content:"开始评估"}); }
  return apiMsgs;
}

/* single streaming call: parses SSE, reconstructs content blocks */
function streamCall(body, onDelta, onStatus){
  return fetch(API_URL,{method:"POST",headers:hdrs(),body:JSON.stringify(body)}).then(function(resp){
    if(!resp.ok){
      return resp.json().catch(function(){return null;}).then(function(j){
        var e=new Error((j&&j.error&&j.error.message)||("HTTP "+resp.status));
        e.status=resp.status; e.etype=j&&j.error&&j.error.type;
        throw e;
      });
    }
    var reader=resp.body.getReader(), dec=new TextDecoder(), buf="";
    var blocks=[], stop=null, acc="";
    function handleLine(line){
      line=line.replace(/\r$/,"");
      if(line.indexOf("data:")!==0) return;
      var data=line.slice(5).trim();
      if(!data) return;
      var ev; try{ ev=JSON.parse(data); }catch(e){ return; }
      if(ev.type==="error"){
        var er=new Error((ev.error&&ev.error.message)||"流式传输错误");
        er.etype=ev.error&&ev.error.type; er.status=529;
        throw er;
      }
      if(ev.type==="content_block_start"){
        var blk=ev.content_block?JSON.parse(JSON.stringify(ev.content_block)):{};
        blocks[ev.index]=blk;
        if(blk.type==="thinking"&&onStatus) onStatus("深度思考中…");
        else if(blk.type==="server_tool_use"&&onStatus) onStatus("正在联网检索行业数据…");
        else if(blk.type==="web_search_tool_result"&&onStatus) onStatus("正在阅读检索结果…");
        if(blk.type==="tool_use"||blk.type==="server_tool_use"){ blk.__pj=""; }
      }else if(ev.type==="content_block_delta"){
        var b=blocks[ev.index]; if(!b) return;
        var d=ev.delta||{};
        if(d.type==="text_delta"){ b.text=(b.text||"")+d.text; acc+=d.text; if(onDelta) onDelta(acc); }
        else if(d.type==="thinking_delta"){ b.thinking=(b.thinking||"")+(d.thinking||""); }
        else if(d.type==="input_json_delta"){ b.__pj=(b.__pj||"")+(d.partial_json||""); }
        else if(d.type==="signature_delta"){ b.signature=(b.signature||"")+(d.signature||""); }
      }else if(ev.type==="content_block_stop"){
        var bb=blocks[ev.index];
        if(bb && bb.__pj!==undefined){
          try{ bb.input=bb.__pj?JSON.parse(bb.__pj):(bb.input||{}); }catch(e){ bb.input=bb.input||{}; }
          delete bb.__pj;
        }
      }else if(ev.type==="message_delta"){
        if(ev.delta && ev.delta.stop_reason) stop=ev.delta.stop_reason;
      }
    }
    function pump(){
      return reader.read().then(function(r){
        if(r.done){
          if(buf){ buf.split("\n").forEach(handleLine); }
          return {blocks:blocks.filter(Boolean), stop_reason:stop, text:acc};
        }
        buf+=dec.decode(r.value,{stream:true});
        var lines=buf.split("\n"); buf=lines.pop();
        for(var i=0;i<lines.length;i++) handleLine(lines[i]);
        return pump();
      });
    }
    return pump();
  });
}

/* full turn: retries + pause_turn continuation for server tools */
function runTurn(messages, opt){
  var base={model:MODEL, max_tokens:opt.max_tokens||16000, system:opt.system, stream:true, thinking:{type:"adaptive"}};
  if(opt.tools) base.tools=opt.tools;
  if(opt.output_config) base.output_config=opt.output_config;
  var msgs=messages.slice(), iter=0, accPrefix="", attempt=0;
  function once(){
    var body={}; for(var k in base) body[k]=base[k];
    body.messages=msgs;
    return streamCall(body, function(t){ if(opt.onDelta) opt.onDelta(accPrefix+t); }, opt.onStatus)
    .catch(function(err){
      if(err.status===400 && base.tools){ delete base.tools; return once(); }
      if(err.status===400 && base.output_config){ delete base.output_config; if(opt.onSchemaDrop) opt.onSchemaDrop(); return once(); }
      var retriable=(err.status===429||err.status===529||(err.status>=500&&err.status<600)||err.etype==="overloaded_error");
      if(retriable && attempt<2){
        attempt++;
        if(opt.onStatus) opt.onStatus("模型服务繁忙，"+(attempt*3)+" 秒后自动重试…");
        return wait(attempt*3000).then(once);
      }
      throw err;
    });
  }
  function step(){
    return once().then(function(res){
      if(res.stop_reason==="pause_turn" && iter<6){
        iter++; accPrefix+=res.text;
        msgs=msgs.concat([{role:"assistant",content:res.blocks}]);
        return step();
      }
      res.text=accPrefix+res.text;
      return res;
    });
  }
  return step();
}

function processResp(raw){
  var text=(raw||"").trim();
  if(!text){ text="抱歉，我没有接收到有效回复。"; }

  var tm=text.match(/\[THEME\]([\s\S]*?)\[\/THEME\]/);
  if(tm){ parseTheme(tm[1]); text=text.replace(/\[THEME\][\s\S]*?\[\/THEME\]/g,"").trim(); }

  // safety: if model emitted report JSON in chat (legacy behaviour)
  var rm=text.match(/\[RPTJSON\]([\s\S]*?)(\[\/RPTJSON\]|$)/);
  if(rm){
    text=text.replace(/\[RPTJSON\][\s\S]*?(\[\/RPTJSON\]|$)/,"").trim();
    if(text){ var mx={from:"ai",text:text}; conv.push(mx); addMsgEl(mx,false); }
    onReportJSON(rm[1]);
    return;
  }

  var advance = text.indexOf("[NEXT]")>=0;
  if(advance) text=text.replace(/\[NEXT\]/g,"").trim();

  var opts=null, optsm=null, m;
  if(m=text.match(/\[OPTM\]([\s\S]*?)\[\/OPTM\]/)){ optsm=m[1].split("|").map(trimS).filter(Boolean); text=text.replace(/\[OPTM\][\s\S]*?\[\/OPTM\]/g,"").trim(); }
  if(m=text.match(/\[OPT\]([\s\S]*?)\[\/OPT\]/)){ opts=m[1].split("|").map(trimS).filter(Boolean); text=text.replace(/\[OPT\][\s\S]*?\[\/OPT\]/g,"").trim(); }
  text=text.replace(/\[\/?(OPT|OPTM|THEME|NEXT|RPTJSON)\]/g,"").trim();

  if(advance){
    phase=Math.min(phase+1,5);
    conv.push({sys:true, ph:phase}); addDividerEl(phase);
  }

  // fallback options: never leave a question without clickable choices
  var msg={from:"ai", text:text, opts:opts, optsm:optsm};
  if(!opts && !optsm && !done && phase>=1 && phase<=4 && /[?？]/.test(text)){
    msg.opts=FALLBACK_OPTS.slice(); msg.fallback=true;
  }
  multiSel={};
  conv.push(msg); addMsgEl(msg, true); scrollBottom(false);

  if(advance && phase>=5 && !done && !reportRequested){ saveState(); startReport(null); return; }

  // auto-continue: model advanced phase but forgot to ask the first question
  if(advance && phase<=4 && !msg.opts && !msg.optsm && !/[?？]/.test(text) && !autoContinued[phase]){
    autoContinued[phase]=true;
    conv.push({from:"usr", hidden:true, text:"(系统提示：请立即提出本环节的第一个问题，并按规则附上选项。)"});
    saveState();
    callAPI();
    return;
  }
  saveState();
}

function parseTheme(s){

  var mp={};
  if(isHex(o.primary)) mp.primary=o.primary;
  if(isHex(o.secondary)) mp.secondary=o.secondary;
  if(isHex(o.accent)) mp.accent=o.accent;
  if(o.name) mp.name=o.name;

}

function parseReportJSON(s){
  if(!s) return null;
  s=String(s).trim().replace(/^```json/i,"").replace(/^```/,"").replace(/```$/,"").trim();
  var a=s.indexOf("{"), b=s.lastIndexOf("}");
  if(a>=0 && b>a) s=s.slice(a,b+1);
  try{ return JSON.parse(s); }catch(e){}
  try{ return JSON.parse(s.replace(/,(\s*[}\]])/g,"$1")); }catch(e){}
  return null;
}

/* ---------------- Cover image ---------------- */
function fetchAsDataURL(url, timeoutMs){
  return new Promise(function(resolve){
    var fin=false;
    var timer=setTimeout(function(){ if(!fin){fin=true;resolve(null);} },timeoutMs||8000);
    fetch(url,{mode:"cors"}).then(function(res){
      if(!res.ok) throw 0;
      return res.blob();
    }).then(function(blob){
      if(!blob || !blob.type || blob.type.indexOf("image")!==0) throw 0;
      var fr=new FileReader();
      fr.onload=function(){ if(!fin){fin=true;clearTimeout(timer);resolve(fr.result);} };
      fr.onerror=function(){ if(!fin){fin=true;clearTimeout(timer);resolve(null);} };
      fr.readAsDataURL(blob);
    }).catch(function(){ if(!fin){fin=true;clearTimeout(timer);resolve(null);} });
  });
}
function loadCover(keyword){
  var kwRaw=(keyword||"business technology").trim();
  var prompt=encodeURIComponent("cinematic professional cover photograph of "+kwRaw+", modern high-end corporate, wide angle, dramatic lighting, depth of field, no text");
  var tries=[
    ["https://image.pollinations.ai/prompt/"+prompt+"?width=1600&height=900&nologo=true&seed=7",16000],
    ["https://image.pollinations.ai/prompt/"+prompt+"?width=1600&height=900&nologo=true&seed=23",12000],
    ["https://picsum.photos/seed/"+(kwRaw.replace(/[^a-z0-9]/gi,"")||"ai")+"/1600/900",8000]
  ];
  var i=0;
  function next(){
    if(i>=tries.length) return Promise.resolve(null);
    var t=tries[i++];
    return fetchAsDataURL(t[0],t[1]).then(function(d){ return d||next(); });
  }
  return next();
}

function radar(scores, benchmarks, fill, stroke){
  var cx=170,cy=152,R=110,N=6;
  function P(r,i){var a=(-90+i*360/N)*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];}
  var s='<svg width="340" height="306" viewBox="0 0 340 306">';
  for(var k=1;k<=5;k++){var pts="";for(var i=0;i<N;i++){var p=P(R*k/5,i);pts+=p[0].toFixed(1)+","+p[1].toFixed(1)+" ";}s+='<polygon points="'+pts+'" fill="'+(k%2?"#fbfbfe":"#f3f4f9")+'" stroke="#e6e8f0" stroke-width="1"/>';}
  for(var i=0;i<N;i++){var p=P(R,i);s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'" stroke="#e2e4ee" stroke-width="1"/>';}
  // benchmark polygon (dashed grey)
  var bp="";for(var i=0;i<N;i++){var sc=Math.max(0,Math.min(5,fnum(benchmarks[i],0)));var p=P(R*sc/5,i);bp+=p[0].toFixed(1)+","+p[1].toFixed(1)+" ";}
  s+='<polygon points="'+bp+'" fill="none" stroke="#9aa0b0" stroke-width="1.5" stroke-dasharray="5,4"/>';
  var dp="";for(var i=0;i<N;i++){var sc=Math.max(0,Math.min(5,fnum(scores[i],0)));var p=P(R*sc/5,i);dp+=p[0].toFixed(1)+","+p[1].toFixed(1)+" ";}
  s+='<polygon points="'+dp+'" fill="'+fill+'" fill-opacity="0.22" stroke="'+stroke+'" stroke-width="2.5"/>';
  for(var i=0;i<N;i++){var sc=Math.max(0,Math.min(5,fnum(scores[i],0)));var p=P(R*sc/5,i);s+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.5" fill="'+stroke+'"/>';}
  for(var i=0;i<N;i++){var p=P(R+22,i);var anc="middle";if(p[0]>cx+8)anc="start";if(p[0]<cx-8)anc="end";s+='<text x="'+p[0].toFixed(1)+'" y="'+(p[1]+4).toFixed(1)+'" font-size="11" font-weight="600" fill="#4a5060" text-anchor="'+anc+'">'+DIMS[i].s+'</text>';}
  s+='</svg>';
  return s;
}

/* ---------------- PDF export ---------------- */
function exportPDF(){
  var el=document.getElementById("reportDoc");
  var btn=document.getElementById("pdfBtn");
  var scaler=document.getElementById("reportScaler");
  if(!el){ alert("报告尚未就绪"); return; }
  var prevT=scaler?scaler.style.transform:"";
  if(scaler) scaler.style.transform="none";
  if(btn){ btn.disabled=true; btn.innerHTML="⏳ 正在生成 PDF…"; }
  function restore(){ if(scaler) scaler.style.transform=prevT; if(btn){ btn.disabled=false; btn.innerHTML="⤓ 下载 PDF 报告"; } fitReport(); }
  if(typeof html2pdf==="undefined"){
    restore(); window.print(); return;
  }
  var fname=((REPORT&&REPORT.company)?REPORT.company:"企业")+"_AI成熟度评估报告.pdf";
  var opt={
    margin:0,
    filename:fname,
    image:{type:"jpeg",quality:0.95},
    html2canvas:{scale:2,useCORS:true,allowTaint:false,backgroundColor:"#ffffff",logging:false,windowWidth:794},
    jsPDF:{unit:"px",format:[794,1123],orientation:"portrait",compress:true},
    pagebreak:{mode:["css","legacy"]}
  };
  html2pdf().set(opt).from(el).save().then(function(){ restore(); }).catch(function(e){
    restore();
    alert("自动导出遇到问题，将改用浏览器打印（可选择「另存为PDF」）。\n"+(e&&e.message?e.message:""));
    window.print();
  });
}
