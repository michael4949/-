<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智衡 · 企业AI高价值场景识别与排序智能体</title>
<meta name="description" content="通过引导式问答，识别并排序企业AI高价值落地场景，一键生成专业图文PDF报告。覆盖全行业、全职能，纯前端本地运行。">
<style>
/* ============================================================
   智衡 · AI价值罗盘  —  Enterprise AI Value Compass
   独立单文件应用 · 浅色主题 · 无外部依赖
   ============================================================ */
:root{
  --c1:#6366f1; --c2:#8b5cf6; --c3:#06b6d4; --c4:#10b981; --c5:#f59e0b; --c6:#ec4899;
  --ink:#0f172a; --ink2:#334155; --mut:#64748b; --mut2:#94a3b8;
  --line:#e2e8f0; --line2:#e8ebff;
  --bg:#f6f8fe; --card:#ffffff;
  --grad:linear-gradient(135deg,#6366f1 0%,#8b5cf6 50%,#06b6d4 100%);
  --grad-soft:linear-gradient(135deg,#eef0ff 0%,#f5efff 55%,#e9faff 100%);
  --shadow:0 8px 30px rgba(80,90,200,.10);
  --shadow-lg:0 18px 50px rgba(80,90,200,.16);
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC","Source Han Sans SC","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
::selection{background:#c7d2fe;color:#1e1b4b}
button{font-family:inherit}

/* ---------- 背景装饰：光斑 + 点阵 + 神经网络线 ---------- */
.blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.5;z-index:-2;pointer-events:none}
.b1{width:520px;height:520px;left:-140px;top:-160px;background:radial-gradient(circle,#c7d2fe,transparent 65%)}
.b2{width:620px;height:620px;right:-200px;top:30%;background:radial-gradient(circle,#cffafe,transparent 65%)}
.b3{width:460px;height:460px;left:30%;bottom:-220px;background:radial-gradient(circle,#ede9fe,transparent 65%)}
.grid-deco{position:fixed;inset:0;z-index:-3;pointer-events:none;
  background-image:radial-gradient(rgba(99,102,241,.10) 1px,transparent 1px);
  background-size:26px 26px;
  mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 30%,transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 30%,transparent 75%);
}
.net-deco{position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:-1;pointer-events:none;opacity:.55}

/* ---------- 顶栏 ---------- */
.appbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;
  padding:12px 26px;background:rgba(255,255,255,.72);backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(226,232,240,.8)}
.brand{display:flex;align-items:center;gap:11px}
.brand .mark{width:36px;height:36px;border-radius:11px;background:var(--grad);position:relative;
  box-shadow:0 4px 14px rgba(99,102,241,.45);display:flex;align-items:center;justify-content:center}
.brand .mark::after{content:"✦";color:#fff;font-size:17px}
.brand b{font-size:16.5px;letter-spacing:.5px}
.brand .sub{font-size:11.5px;color:var(--mut);display:block;margin-top:-3px;letter-spacing:.3px}
.ai-chip{font-size:10.5px;font-weight:700;letter-spacing:1px;color:#fff;background:var(--grad);
  border-radius:99px;padding:2.5px 9px;margin-left:2px;box-shadow:0 2px 8px rgba(139,92,246,.4)}
.appbar .sp{flex:1}
.appbar .hint{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.appbar .hint .dot{width:7px;height:7px;border-radius:50%;background:var(--c4);box-shadow:0 0 0 3px rgba(16,185,129,.18);animation:pulse 2.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(16,185,129,.18)}50%{box-shadow:0 0 0 6px rgba(16,185,129,.07)}}

/* ---------- 通用按钮 ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:none;cursor:pointer;border-radius:12px;
  padding:11px 22px;font-size:14.5px;font-weight:600;transition:all .22s ease;white-space:nowrap}
.btn.primary{background:var(--grad);color:#fff;box-shadow:0 6px 20px rgba(99,102,241,.38)}
.btn.primary:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(99,102,241,.48)}
.btn.primary:active{transform:translateY(0)}
.btn.ghost{background:#fff;color:var(--ink2);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:#a5b4fc;color:var(--c1);background:#fafbff}
.btn.subtle{background:transparent;color:var(--mut);padding:9px 14px}
.btn.subtle:hover{color:var(--c1);background:#eef0ff}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:none}
.btn.lg{padding:14px 34px;font-size:16px;border-radius:14px}

/* ---------- 向导舞台 ---------- */
.stage{max-width:920px;margin:0 auto;padding:30px 22px 80px}
.progress-wrap{margin:6px 0 22px}
.progress-meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);margin-bottom:8px}
.progress-meta b{color:var(--c1)}
.pbar{height:7px;background:#e8ebfa;border-radius:99px;overflow:hidden;position:relative}
.pbar i{display:block;height:100%;background:var(--grad);border-radius:99px;width:0;
  transition:width .5s cubic-bezier(.4,0,.2,1);box-shadow:0 0 10px rgba(99,102,241,.5)}

/* 智能体对话气泡 */
.agent-row{display:flex;gap:14px;align-items:flex-start;margin-bottom:18px}
.orb{width:52px;height:52px;border-radius:50%;flex:none;position:relative;
  background:radial-gradient(circle at 32% 30%,#a5b4fc,#6366f1 45%,#0891b2 100%);
  box-shadow:0 6px 18px rgba(99,102,241,.45), inset 0 -4px 10px rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;animation:float 4.5s ease-in-out infinite}
.orb::before{content:"";position:absolute;inset:-5px;border-radius:50%;
  border:1.5px dashed rgba(99,102,241,.45);animation:spin 14s linear infinite}
.orb::after{content:"✦";color:#fff;font-size:20px;text-shadow:0 0 12px rgba(255,255,255,.9)}
.orb.lg{width:120px;height:120px}.orb.lg::after{font-size:46px}.orb.lg::before{inset:-12px;border-width:2px}
.orb.sm{width:34px;height:34px;animation:none}.orb.sm::after{font-size:13px}.orb.sm::before{inset:-4px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.bubble{background:#fff;border:1px solid var(--line2);border-radius:4px 18px 18px 18px;
  padding:15px 20px;box-shadow:var(--shadow);flex:1;min-height:56px}
.bubble .who{font-size:11.5px;font-weight:700;letter-spacing:1.5px;color:var(--c1);margin-bottom:3px}
.bubble .say{font-size:15.5px;color:var(--ink);line-height:1.75}
.bubble .why{font-size:12.5px;color:var(--mut);margin-top:7px;padding-top:7px;border-top:1px dashed var(--line);display:flex;gap:6px}
.bubble .why::before{content:"💡";font-size:12px}
.tdots{display:inline-flex;gap:5px;padding:6px 2px}
.tdots i{width:7px;height:7px;border-radius:50%;background:#a5b4fc;animation:bk 1.1s infinite}
.tdots i:nth-child(2){animation-delay:.18s}.tdots i:nth-child(3){animation-delay:.36s}
@keyframes bk{0%,70%,100%{opacity:.3;transform:translateY(0)}35%{opacity:1;transform:translateY(-4px)}}

/* 问题卡片 */
.qcard{background:var(--card);border:1px solid var(--line2);border-radius:20px;
  box-shadow:var(--shadow);padding:26px 28px;animation:rise .4s ease}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.fieldlabel{font-size:13.5px;font-weight:700;color:var(--ink2);margin:18px 0 10px;display:flex;align-items:center;gap:8px}
.fieldlabel:first-child{margin-top:0}
.fieldlabel .opt-tag{font-size:11px;color:var(--mut);font-weight:500;background:#f1f5f9;border-radius:99px;padding:1px 9px}
.fieldlabel .req{color:var(--c6)}
.group-cap{font-size:12px;font-weight:700;color:var(--mut);letter-spacing:1px;margin:16px 0 8px}
.opt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
.opt-grid.wide{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.opt{position:relative;border:1.5px solid var(--line);border-radius:13px;padding:11px 13px;cursor:pointer;
  background:#fff;transition:all .18s ease;user-select:none;display:flex;align-items:center;gap:9px}
.opt:hover{border-color:#a5b4fc;transform:translateY(-1.5px);box-shadow:0 6px 16px rgba(99,102,241,.13)}
.opt .ic{font-size:18px;flex:none}
.opt .t{font-size:13.8px;font-weight:600;color:var(--ink2);line-height:1.35}
.opt .d{font-size:11.5px;color:var(--mut);line-height:1.4;margin-top:1px}
.opt .ck{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;background:var(--grad);
  color:#fff;font-size:11px;display:none;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(99,102,241,.5)}
.opt.sel{border-color:transparent;background:var(--grad-soft);box-shadow:0 0 0 1.6px var(--c1),0 6px 16px rgba(99,102,241,.16)}
.opt.sel .t{color:var(--c1)}
.opt.sel .ck{display:flex}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 15px;font-size:13px;
  color:var(--ink2);cursor:pointer;transition:all .16s;user-select:none}
.chip:hover{border-color:#a5b4fc;color:var(--c1)}
.chip.sel{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(99,102,241,.35)}
.likert{display:flex;gap:8px;align-items:stretch}
.likert .lk{flex:1;text-align:center;border:1.5px solid var(--line);border-radius:11px;padding:9px 6px;
  cursor:pointer;transition:all .16s;background:#fff}
.likert .lk .n{font-weight:800;font-size:15px;color:var(--mut2)}
.likert .lk .l{font-size:11px;color:var(--mut);line-height:1.3;margin-top:2px}
.likert .lk:hover{border-color:#a5b4fc}
.likert .lk.sel{border-color:transparent;background:var(--grad-soft);box-shadow:0 0 0 1.6px var(--c1)}
.likert .lk.sel .n{color:var(--c1)}.likert .lk.sel .l{color:var(--ink2)}
input.txt{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 16px;font-size:15px;
  font-family:inherit;color:var(--ink);outline:none;transition:all .2s;background:#fff}
input.txt:focus{border-color:var(--c1);box-shadow:0 0 0 4px rgba(99,102,241,.12)}
input.txt::placeholder{color:#b6c0d4}
.counterhint{font-size:12px;color:var(--mut2);margin-top:9px}
.err-msg{color:#e11d48;font-size:13px;margin-top:10px;display:none;align-items:center;gap:6px}
.err-msg.show{display:flex;animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.btnbar{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:12px}

/* 欢迎页 */
.welcome{text-align:center;padding:34px 10px 10px}
.welcome h1{font-size:34px;line-height:1.35;letter-spacing:1px;margin:24px 0 4px}
.welcome h1 .gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.welcome .en{font-size:12.5px;letter-spacing:4px;color:var(--mut2);text-transform:uppercase;margin-bottom:14px}
.welcome p.lead{max-width:640px;margin:0 auto;color:var(--mut);font-size:15.5px}
.feat-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:26px 0 30px}
.feat{background:rgba(255,255,255,.8);border:1px solid var(--line2);border-radius:14px;padding:12px 18px;
  font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:8px;box-shadow:0 4px 14px rgba(99,102,241,.07)}
.feat .fi{font-size:16px}
.steps-mini{display:flex;justify-content:center;gap:0;margin:8px 0 30px;flex-wrap:wrap}
.smini{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut)}
.smini .num{width:22px;height:22px;border-radius:50%;background:#eef0ff;color:var(--c1);font-weight:700;
  font-size:11.5px;display:flex;align-items:center;justify-content:center}
.smini .arrow{margin:0 12px;color:#c7d2fe}
.privacy-note{font-size:12px;color:var(--mut2);margin-top:18px}

/* 摘要确认 */
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
.sumitem{background:#f8faff;border:1px solid var(--line2);border-radius:12px;padding:10px 14px}
.sumitem .k{font-size:11.5px;color:var(--mut);letter-spacing:.5px}
.sumitem .v{font-size:13.5px;font-weight:600;color:var(--ink);margin-top:2px;line-height:1.5}
.ack{margin-top:16px;background:var(--grad-soft);border:1px solid #ddd9ff;border-radius:14px;padding:14px 18px;
  font-size:13.5px;color:#41368f;line-height:1.8}
.ack b{color:#3730a3}

/* ---------- 分析动画页 ---------- */
.ana{max-width:560px;margin:0 auto;padding:70px 22px;text-align:center}
.ana h2{font-size:23px;margin:28px 0 6px}
.ana .sub{color:var(--mut);font-size:13.5px;margin-bottom:30px}
.ana-steps{list-style:none;text-align:left;background:#fff;border:1px solid var(--line2);border-radius:18px;
  padding:20px 24px;box-shadow:var(--shadow)}
.ana-steps li{display:flex;align-items:center;gap:12px;padding:9px 0;font-size:14px;color:var(--mut2);transition:color .3s}
.ana-steps li .st{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;transition:all .3s}
.ana-steps li.run{color:var(--ink)}
.ana-steps li.run .st{border-color:var(--c1);border-top-color:transparent;animation:spin 1s linear infinite}
.ana-steps li.done{color:var(--ink2)}
.ana-steps li.done .st{background:var(--grad);border-color:transparent}
.ana-steps li.done .st::after{content:"✓"}
.ana-pct{font-size:38px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;
  color:transparent;margin-top:26px;font-variant-numeric:tabular-nums}

/* ---------- 报告视图 ---------- */
#viewReport{padding-bottom:90px}
.rtoolbar{position:sticky;top:61px;z-index:40;max-width:850px;margin:18px auto 8px;display:flex;gap:10px;
  align-items:center;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);
  border:1px solid var(--line2);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow)}
.rtoolbar .sp{flex:1}
.wstyle{display:flex;gap:6px;align-items:center;background:#f1f4fd;border-radius:10px;padding:4px}
.wstyle span{font-size:12px;color:var(--mut);padding:0 4px 0 8px}
.wstyle button{border:none;background:transparent;border-radius:8px;padding:5px 12px;font-size:12.5px;
  color:var(--mut);cursor:pointer;font-weight:600}
.wstyle button.on{background:#fff;color:var(--c1);box-shadow:0 2px 6px rgba(99,102,241,.18)}
.print-tip{max-width:850px;margin:0 auto 6px;font-size:12px;color:var(--mut2);text-align:center}

/* —— A4 纸张 —— */
.sheet{width:210mm;min-height:296mm;background:#fff;margin:16px auto;box-shadow:0 10px 40px rgba(60,70,160,.14);
  border-radius:6px;padding:15mm 16mm 12mm;position:relative;display:flex;flex-direction:column;overflow:hidden}
.sheet .pfoot{margin-top:auto;padding-top:4mm;border-top:1px solid #eef0f8;display:flex;justify-content:space-between;
  font-size:9.5px;color:#a3adc2;letter-spacing:.5px}
.sheet .pfoot .pf-brand{display:flex;gap:6px;align-items:center}
.sheet .pfoot .pf-brand::before{content:"✦";color:var(--c1)}

/* 报告排版 */
.kicker{font-size:10.5px;font-weight:800;letter-spacing:3px;color:var(--c1);margin-bottom:3mm;display:flex;align-items:center;gap:8px}
.kicker::before{content:"";width:22px;height:2.5px;background:var(--grad);border-radius:2px;display:inline-block}
.rh{font-size:21.5px;font-weight:800;color:var(--ink);letter-spacing:.5px;margin-bottom:4.5mm;line-height:1.3}
.rh3{font-size:13.5px;font-weight:800;color:var(--ink);margin:5mm 0 2.5mm;display:flex;align-items:center;gap:7px}
.rh3::before{content:"";width:8px;height:8px;border-radius:2.5px;background:var(--grad);transform:rotate(45deg);flex:none}
.rp{font-size:11.8px;color:#3b4a63;line-height:1.95;text-align:justify;margin-bottom:2.6mm}
.rp b{color:var(--ink)}
.rlist{margin:0 0 2.5mm;padding-left:0;list-style:none}
.rlist li{font-size:11.5px;color:#3b4a63;line-height:1.85;padding-left:16px;position:relative;margin-bottom:1.2mm;text-align:justify}
.rlist li::before{content:"◆";position:absolute;left:1px;top:0;color:var(--c2);font-size:8px;line-height:2.6}
.rlist li b{color:var(--ink)}
.note{background:linear-gradient(135deg,#f6f7ff,#f3fbff);border:1px solid #e3e6fb;border-left:3.5px solid var(--c1);
  border-radius:10px;padding:3.5mm 4.5mm;font-size:11px;color:#46557a;line-height:1.85;margin:3mm 0;text-align:justify}
.note b{color:#3730a3}
.tag{display:inline-block;font-size:9.8px;font-weight:600;color:#4f46e5;background:#eef0ff;border:1px solid #dde1ff;
  border-radius:99px;padding:1px 9px;margin:0 4px 4px 0}
.tag.cy{color:#0e7490;background:#ecfeff;border-color:#bae6fd}
.tag.gn{color:#047857;background:#ecfdf5;border-color:#bbf7d0}

.tag.pk{color:#be185d;background:#fdf2f8;border-color:#fbcfe8}
.tbl{width:100%;border-collapse:collapse;font-size:10.6px;margin:2.5mm 0}

  padding:2.2mm 2.6mm;border-bottom:1.5px solid #d8ddfb;white-space:nowrap}
.tbl td{padding:2mm 2.6mm;border-bottom:1px solid #eef1f8;color:#3b4a63;line-height:1.6;vertical-align:top}
.tbl tr:nth-child(even) td{background:#fafbff}
.tbl .num{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:3.5mm;margin:3mm 0}
.kpi{background:linear-gradient(160deg,#f7f8ff,#f2fbff);border:1px solid #e4e7fb;border-radius:11px;padding:3.5mm 4mm;position:relative;overflow:hidden}
.kpi::after{content:"✦";position:absolute;right:7px;top:5px;color:#dadeff;font-size:13px}
.kpi .kv{font-size:17px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.3}
.kpi .kl{font-size:9.8px;color:var(--mut);margin-top:1mm;line-height:1.4}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:5mm;align-items:start}
.grid2.r37{grid-template-columns:1.15fr .85fr}
.chartbox{background:#fdfdff;border:1px solid #edf0fb;border-radius:12px;padding:3.5mm;margin:2.5mm 0}
.chartbox .ct{font-size:10.5px;font-weight:700;color:var(--ink2);margin-bottom:1.5mm;display:flex;justify-content:space-between;align-items:center}
.chartbox .ct .cu{font-weight:500;color:var(--mut2);font-size:9.5px}
.legend{display:flex;flex-wrap:wrap;gap:3mm;font-size:9.8px;color:var(--mut);margin-top:1.5mm}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:-1px}
.meter{display:flex;align-items:center;gap:7px;font-size:10.3px;color:var(--mut);margin-bottom:1.6mm}

.meter .mfill{height:100%;border-radius:99px;background:var(--grad)}
.meter .mv{width:34px;text-align:right;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.quadchip{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;border-radius:99px;padding:1.5px 10px}
.q-win{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}
.q-str{background:#eef0ff;color:#4f46e5;border:1px solid #ddе1ff;border:1px solid #dde1ff}

/* ---- 渲染原语 ---- */
function optHtml(it,sel,k,multi){
  return `<div class="opt ${sel?'sel':''}" data-k="${k}" data-v="${it.id}" ${multi?'data-multi="1"':''}>
    ${it.ic?`<span class="ic">${it.ic}</span>`:''}
    <div><div class="t">${h(it.label)}</div>${it.d?`<div class="d">${h(it.d)}</div>`:''}</div>
    <span class="ck">✓</span></div>`;
}
function gridHtml(items,k,multi,wide){
  const cur=multi?(A[k]||[]):A[k];
  return `<div class="opt-grid ${wide?'wide':''}">`+items.map(it=>optHtml(it,multi?cur.includes(it.id):cur===it.id,k,multi)).join('')+`</div>`;
}
function chipsHtml(items,k){
  const cur=A[k]||[];
  return `<div class="chips">`+items.map(it=>`<span class="chip ${cur.includes(it.id)?'sel':''}" data-k="${k}" data-v="${it.id}" data-multi="1" data-chip="1">${h(it.label)}</span>`).join('')+`</div>`;
}
function likertHtml(k,labels){
  return `<div class="likert">`+labels.map((l,i)=>`<div class="lk ${A[k]===i+1?'sel':''}" data-k="${k}" data-v="${i+1}" data-num="1"><div class="n">${i+1}</div><div class="l">${h(l)}</div></div>`).join('')+`</div>`;
}
const label=(t,opt,req)=>`<div class="fieldlabel">${h(t)} ${req?'<span class="req">*</span>':''}${opt?`<span class="opt-tag">${h(opt)}</span>`:''}</div>`;

/* ================================================================
   §5 智能评分引擎
================================================================ */
const W_STYLES={quick:{v:.42,f:.58},balance:{v:.52,f:.48},value:{v:.66,f:.34}};
const GENAI_TAGS=['生成式AI','大语言模型','数字人','检索增强(RAG)','智能体(Agent)','代码生成'];

function runEngine(){
  const cands=SCN.filter(s=>s.ind==='all'||s.ind.includes(A.industry));
  const w=W_STYLES[A.style]||W_STYLES.balance;
  const revMid=find(REVENUES,A.rev).mid, sizeF=find(SIZES,A.emp).f;
  const budgetCap=find(BUDGETS,A.budget).cap, talentAdj=find(TALENTS,A.talent).adj, compAdj=find(COMPS,A.comp).adj;
  const speedM=find(SPEEDS,A.speed).m;
  const E=cands.map(s=>{
    let v=s.v,f=s.f; const why=[],flags=[];
    /* —— 价值修正 —— */
    let gAdd=0; s.goals.forEach(g=>{const i=A.goals.indexOf(g); if(i>=0)gAdd+=[0.9,0.6,0.4][i]||0.3;});
    gAdd=Math.min(gAdd,1.6); v+=gAdd;
    if(gAdd>0.8)why.push('与「'+s.goals.filter(g=>A.goals.includes(g)).map(g=>find(GOALS,g).label).join('、')+'」战略目标高度对齐');
    if(A.fns.includes(s.fn)){v+=0.7;}else{v-=0.45;}
    const mp=(s.pains||[]).filter(p=>A.pains.includes(p));
    v+=Math.min(mp.length*0.8,2.0);
    if(mp.length)why.push('直接回应痛点：'+mp.map(painLabel).join('、'));
    if(s.ind!=='all'){v+=0.4;why.push('为'+(indOf().label||'本行业')+'特化场景，行业内已有对标实践');}
    /* —— 可行性修正 —— */
    f+=(A.dm-3)*0.33*s.data;
    f+=(A.sys-3)*0.2+(A.aiexp-2)*0.22+talentAdj;
    if(s.cost>budgetCap){f-=(s.cost-budgetCap)*1.1;flags.push('投入档位高于当前预算区间，建议分期或寻求专项预算');}
    const isGen=s.tech.some(t=>GENAI_TAGS.includes(t));
    f+=compAdj*(isGen||['cs','mkt'].includes(s.fn)?1:0.45);
    if(compAdj<0&&isGen)flags.push('涉敏行业使用生成式AI需配套内容审核与数据脱敏机制');
    if(s.ttv>speedM){f-=Math.min(1.2,(s.ttv-speedM)*0.1);flags.push('预计见效周期 '+s.ttv+' 个月，长于期望，需管理预期或拆分里程碑');}
    if(A.dm<=2&&s.data>=3)flags.push('对数据基础要求高，建议先行开展数据补课专项');
    if(A.talent==='t0'&&s.cost>=2)flags.push('建议引入外部交付伙伴并同步培养内部种子团队');
    v=clamp(v,1,10);f=clamp(f,1,10);
    if(f>=7.5)why.push('实施门槛低、技术成熟，适合快速启动');
    const prio=v*w.v+f*w.f;
    const quad=v>=6.5?(f>=6.5?'win':'str'):(f>=6.5?'eff':'obs');
    /* —— 价值与投入测算（方向性） —— */
    const base=revMid*(v/10);
    const annualLo=Math.max(base*0.005,0.0015),annualHi=Math.max(base*0.013,0.005);
    const INV=[[25,80],[80,300],[300,1000]][s.cost-1];
    const invLo=INV[0]*sizeF/10000,invHi=INV[1]*sizeF/10000;
    const payback=Math.round(((invLo+invHi)/2)/(((annualLo+annualHi)/2)/12)+s.ttv*0.5);
    return {s,v:r1(v),f:r1(f),prio:r1(prio),quad,mp,why:why.slice(0,3),flags:flags.slice(0,3),
      annualLo,annualHi,invLo,invHi,payback:clamp(payback,2,36)};
  });
  E.sort((a,b)=>b.prio-a.prio);
  E.forEach((e,i)=>e.rank=i+1);
  /* —— 就绪度雷达 —— */
  const tMap={t0:1.8,t1:3,t2:4.2},cMap={c1:3.8,c2:3,c3:2.6};
  const radar=[
   {label:'战略牵引',me:clamp(2.3+A.goals.length*0.5+(['ceo','cio'].includes(A.role)?0.7:0),1,5),avg:3.2},
   {label:'数据基础',me:A.dm,avg:3.0},{label:'系统与算力',me:A.sys,avg:3.1},
   {label:'人才组织',me:clamp(tMap[A.talent]+A.aiexp*0.12,1,5),avg:2.8},
   {label:'治理合规',me:clamp(cMap[A.comp]+(A.fns.includes('legal')?0.3:0),1,5),avg:3.0},
   {label:'场景经验',me:clamp(A.aiexp+Math.min(A.pains.length,6)*0.08,1,5),avg:2.9},
  ];
  const mAvg=radar.reduce((t,d)=>t+d.me,0)/radar.length;
  const mat=mAvg<1.9?{lv:'L1',name:'起步级'}:mAvg<2.7?{lv:'L2',name:'试点级'}:mAvg<3.5?{lv:'L3',name:'推广级'}:mAvg<4.3?{lv:'L4',name:'规模级'}:{lv:'L5',name:'引领级'};
  /* —— 路线图 —— */
  const top10=E.slice(0,10);
  const p1=[],p2=[],p3=[];
  for(const e of top10){
    if(p1.length<3&&(e.f>=7||(e.s.cost===1&&e.s.ttv<=3)))p1.push(e);
    else if(p2.length<4&&e.s.cost<=2)p2.push(e);
    else if(p3.length<3)p3.push(e);
  }
  for(const e of top10){ if(!p1.includes(e)&&!p2.includes(e)&&!p3.includes(e)){ if(p1.length<2)p1.push(e);else if(p2.length<4)p2.push(e);else if(p3.length<3)p3.push(e);} }
  /* —— 预算分配 —— */
  let alloc=[
   {label:'场景试点与应用建设',val:50,color:'#6366f1'},
   {label:'数据与平台底座',val:A.dm<=2?30:A.dm===3?24:17,color:'#06b6d4'},
   {label:'人才与组织能力',val:A.talent==='t0'?17:13,color:'#8b5cf6'},
   {label:'AI治理与安全',val:A.comp==='c1'?13:8,color:'#10b981'},
  ];
  const tot=alloc.reduce((t,x)=>t+x.val,0);alloc.forEach(x=>x.val=Math.round(x.val/tot*100));
  alloc[0].val+=100-alloc.reduce((t,x)=>t+x.val,0);
  /* —— ROI 曲线（Top5 组合） —— */
  const port=E.slice(0,5);
  const invTotal=port.reduce((t,e)=>t+(e.invLo+e.invHi)/2,0);
  const months=24,inv=[],val=[];let cv=0;
  const starts=port.map((e,i)=>(i<2?1:i<4?4:9));
  for(let m=0;m<=months;m++){
    inv.push(invTotal*(m<=6?0.12+m*0.08:Math.min(1,0.6+(m-6)*0.045)));
    let add=0;
    port.forEach((e,i)=>{const st=starts[i]+e.s.ttv*0.6;const run=((e.annualLo+e.annualHi)/2)/12;
      if(m>st)add+=run*Math.min(1,(m-st)/4);});
    cv+=add;val.push(cv);
  }
  let breakeven=val.findIndex((x,i)=>x>=inv[i]&&i>2); if(breakeven<0)breakeven=null;
  return {E,top10,top3:E.slice(0,3),radar,mAvg:r1(mAvg),mat,phases:[p1,p2,p3],alloc,roi:{inv,val,breakeven},
    annualLoSum:port.reduce((t,e)=>t+e.annualLo,0),annualHiSum:port.reduce((t,e)=>t+e.annualHi,0),
    invLoSum:port.reduce((t,e)=>t+e.invLo,0),invHiSum:port.reduce((t,e)=>t+e.invHi,0),w};
}

/* ================================================================
   §6 SVG 图表生成器（无依赖，打印矢量清晰）
================================================================ */
const AX='#94a3b8',GRID='#e8ecf6';
const QCOLOR={win:'#10b981',str:'#6366f1',eff:'#06b6d4',obs:'#94a3b8'};
const QNAME={win:'速赢区',str:'战略区',eff:'效率区',obs:'储备区'};

function svgRadar(dims){
  const W=340,H=252,cx=W/2,cy=H/2+6,R=88,n=dims.length,g=gid('rd');
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-height:64mm">`;
  s+=`<defs><linearGradient id="${g}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1" stop-opacity=".5"/><stop offset="1" stop-color="#06b6d4" stop-opacity=".35"/></linearGradient></defs>`;
  for(let lv=1;lv<=5;lv++){const ps=dims.map((_,i)=>pt(i,R*lv/5).join(',')).join(' ');
    s+=`<polygon points="${ps}" fill="${lv===5?'#fafbff':'none'}" stroke="${GRID}" stroke-width="1"/>`;}
  dims.forEach((_,i)=>{const [x,y]=pt(i,R);s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${GRID}"/>`;});
  const avgPs=dims.map((d,i)=>pt(i,R*d.avg/5).join(',')).join(' ');
  s+=`<polygon points="${avgPs}" fill="none" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="4 3"/>`;
  const mePs=dims.map((d,i)=>pt(i,R*d.me/5).join(',')).join(' ');
  s+=`<polygon points="${mePs}" fill="url(#${g})" stroke="#6366f1" stroke-width="2"/>`;
  dims.forEach((d,i)=>{const [x,y]=pt(i,R*d.me/5);s+=`<circle cx="${x}" cy="${y}" r="3" fill="#fff" stroke="#6366f1" stroke-width="2"/>`;});
  dims.forEach((d,i)=>{const [x,y]=pt(i,R+17);
    s+=`<text x="${x}" y="${y-2}" text-anchor="middle" font-size="9.5" fill="#475569" font-weight="600">${d.label}</text>`;
    s+=`<text x="${x}" y="${y+9}" text-anchor="middle" font-size="8.5" fill="#6366f1" font-weight="700">${d.me.toFixed(1)}</text>`;});
  return s+'</svg>';
}

function svgBubble(items){
  const W=470,H=330,L=42,T=16,Rt=14,B=34,pw=W-L-Rt,ph=H-T-B,g=gid('bb');
  const X=x=>L+(x-1)/9*pw, Y=y=>T+ph-(y-1)/9*ph, sx=X(6.5),sy=Y(6.5);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;
  s+=`<rect x="${sx}" y="${T}" width="${L+pw-sx}" height="${sy-T}" fill="#10b981" opacity=".06"/>`;
  s+=`<rect x="${L}" y="${T}" width="${sx-L}" height="${sy-T}" fill="#6366f1" opacity=".06"/>`;

function renderReport(){
  $('#viewWizard').hidden=true;$('#viewAnalysis').hidden=true;$('#viewReport').hidden=false;
  $$('.wstyle button').forEach(b=>b.classList.toggle('on',b.dataset.ws===A.style));
  const root=$('#reportRoot');
  root.innerHTML=[secCover(),secToc(),secSummary(),secProfile(),secMethod(),secLandscape(),secMatrix(),secRank(),
    secDeep(R.top3[0],0),secDeep(R.top3[1],1),secDeep(R.top3[2],2),
    secRoadmap(),secInvest(),secRisk(),secAction(),secAppendixA(),secAppendixB()].join('');
  const sheets=$$('.sheet',root);
  sheets.forEach((sh,i)=>{const f=sh.querySelector('.pfx');if(f)f.textContent='第 '+(i+1)+' 页 · 共 '+sheets.length+' 页 · '+todayStr();});
  window.scrollTo(0,0);
}
