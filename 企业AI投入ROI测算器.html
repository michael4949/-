<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业AI投入ROI测算器 | 奇点达科技</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@600;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  /* 应用自身主题：墨黑 + 翡翠绿 + 鎏金（财务/回报气质，与"场景识别"智能体差异化） */
  --bg:#0d1117; --bg2:#11161f; --panel:#161c26; --panel2:#1c2330;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --emerald:#1fae82; --emerald-d:#0f7a5a; --emerald-l:#3ed6a6;
  --gold:#d4af37; --gold-l:#f0d066;
  --tx:#e8edf2; --tx2:#aab4c0; --tx3:#6b7686;
  --usr:#13503c;
}
html,body{height:100%}
body{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.7;-webkit-font-smoothing:antialiased}

.shell{display:flex;height:100vh;overflow:hidden}

/* 侧栏 */
.sb{width:286px;background:linear-gradient(180deg,#0b0f15,#0e131b);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0}
.sb-top{padding:22px 20px 18px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--emerald),var(--emerald-d));display:flex;align-items:center;justify-content:center;font-weight:900;color:#06231a;font-size:17px;box-shadow:0 4px 16px rgba(31,174,130,.35)}
.brand .tt{line-height:1.25}
.brand .tt b{font-size:14px;font-weight:800;letter-spacing:.3px;display:block}
.brand .tt span{font-size:9px;color:var(--tx3);letter-spacing:2.5px}
.sb-sub{margin-top:12px;font-size:11px;color:var(--tx2);line-height:1.6}
.ind-badge{display:none;margin-top:12px;align-items:center;gap:7px;padding:7px 11px;border-radius:9px;background:rgba(31,174,130,.1);border:1px solid rgba(31,174,130,.28);font-size:11px;color:var(--emerald-l)}
.ind-badge.on{display:flex}
.ind-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--emerald-l);box-shadow:0 0 8px var(--emerald-l)}

.steps{flex:1;overflow-y:auto;padding:16px 14px}
.steps-h{font-size:9px;letter-spacing:2px;color:var(--tx3);padding:0 6px 8px}
.si{display:flex;gap:11px;padding:8px 6px;border-radius:9px;opacity:.45;transition:.3s}
.si.on{opacity:1;background:rgba(255,255,255,.03)}
.si.ok{opacity:.7}
.si-dot{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;color:var(--tx2)}
.si.on .si-dot{border-color:var(--emerald);color:var(--emerald-l);background:rgba(31,174,130,.12)}
.si.ok .si-dot{border-color:var(--emerald);background:var(--emerald);color:#06231a}
.si-lbl b{font-size:12px;font-weight:600;display:block;color:var(--tx)}
.si-lbl span{font-size:10px;color:var(--tx3)}
.sb-ft{padding:13px 18px;border-top:1px solid var(--line);font-size:9px;color:var(--tx3);line-height:1.7}

/* 主区 */
.mn{flex:1;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(900px 500px at 70% -10%,#16202c 0%,var(--bg) 60%)}

/* 欢迎页 */
.welcome{flex:1;display:flex;align-items:center;justify-content:center;padding:32px;overflow-y:auto}
.wbox{max-width:620px;width:100%;background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:20px;padding:40px 38px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.wbox .eyebrow{font-size:10px;letter-spacing:4px;color:var(--gold);margin-bottom:14px;font-weight:700}
.wbox h1{font-family:'Noto Serif SC',serif;font-size:30px;font-weight:900;line-height:1.25;margin-bottom:14px}
.wbox h1 em{font-style:normal;color:var(--emerald-l)}
.wbox .lead{color:var(--tx2);font-size:14px;line-height:1.85;margin-bottom:24px}
.wgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:26px}
.wcard{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:15px 12px;text-align:center}
.wcard b{display:block;font-family:'Noto Serif SC',serif;font-size:20px;color:var(--gold-l);margin-bottom:3px}
.wcard span{font-size:10px;color:var(--tx3)}
.field{margin-bottom:14px}
.field label{font-size:12px;color:var(--tx2);display:block;margin-bottom:6px;font-weight:500}
.field label .opt{color:var(--tx3);font-weight:400}
.field input{width:100%;padding:12px 14px;border:1px solid var(--line2);border-radius:11px;font-size:13px;font-family:inherit;background:var(--bg2);color:var(--tx);outline:none;transition:.2s}
.field input:focus{border-color:var(--emerald);box-shadow:0 0 0 3px rgba(31,174,130,.15)}
.field .hint{font-size:10px;color:var(--tx3);margin-top:5px}
.toggle-row{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--bg2);border:1px solid var(--line);border-radius:11px;margin-bottom:20px;cursor:pointer}
.toggle-row .sw{width:38px;height:22px;border-radius:11px;background:#2a3340;position:relative;flex-shrink:0;transition:.2s}
.toggle-row .sw::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s}
.toggle-row.on .sw{background:var(--emerald)}
.toggle-row.on .sw::after{left:19px}
.toggle-row .tl b{font-size:12px;display:block}
.toggle-row .tl span{font-size:10px;color:var(--tx3)}
.go{width:100%;padding:15px;background:linear-gradient(135deg,var(--emerald),var(--emerald-d));color:#fff;border:none;border-radius:13px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;letter-spacing:1px;transition:.2s;box-shadow:0 10px 30px rgba(31,174,130,.3)}
.go:hover{transform:translateY(-1px);box-shadow:0 14px 38px rgba(31,174,130,.42)}
.wfoot{text-align:center;font-size:10px;color:var(--tx3);margin-top:14px}

/* 对话 */
.chat{flex:1;overflow-y:auto;padding:26px 30px 10px;scroll-behavior:smooth}
.chat-inner{max-width:780px;margin:0 auto}
.msg{margin-bottom:18px;display:flex;flex-direction:column}
.msg.usr{align-items:flex-end}
.who{font-size:10px;color:var(--tx3);margin-bottom:5px;font-weight:600;letter-spacing:.5px}
.bbl{max-width:88%;padding:14px 18px;border-radius:15px;font-size:13.5px;line-height:1.85}
.msg.ai .bbl{background:var(--panel);border:1px solid var(--line);border-radius:4px 15px 15px 15px}
.msg.usr .bbl{background:linear-gradient(135deg,var(--usr),#0d3e2e);color:#eafff6;border-radius:15px 4px 15px 15px}
.bbl strong{color:var(--emerald-l);font-weight:700}
.msg.usr .bbl strong{color:#fff}
.web-tag{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:var(--gold-l);background:rgba(212,175,55,.1);border:1px solid rgba(212,175,55,.25);padding:3px 9px;border-radius:8px;margin-bottom:8px}

/* 选项 */
.opts{display:flex;flex-wrap:wrap;gap:9px;margin-top:13px;max-width:88%}
.opts button{padding:11px 16px;border:1px solid var(--line2);border-radius:12px;font-size:12.5px;cursor:pointer;background:var(--panel2);color:var(--tx);font-family:inherit;transition:.18s;text-align:left;line-height:1.4}
.opts button:hover{border-color:var(--emerald);background:rgba(31,174,130,.12);color:var(--emerald-l);transform:translateY(-1px)}
.opts .opt-num{display:inline-block;width:18px;height:18px;line-height:18px;text-align:center;border-radius:5px;background:rgba(255,255,255,.06);font-size:10px;margin-right:7px;color:var(--tx3)}
.opts-hint{font-size:10px;color:var(--tx3);margin-top:9px;display:flex;align-items:center;gap:5px}

.dots span{display:inline-block;width:7px;height:7px;background:var(--emerald-l);border-radius:50%;margin-right:4px;animation:pk 1.3s infinite}
.dots span:nth-child(2){animation-delay:.18s}.dots span:nth-child(3){animation-delay:.36s}
@keyframes pk{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}

/* 输入条 */
.inbar{border-top:1px solid var(--line);background:rgba(13,17,23,.85);backdrop-filter:blur(8px);padding:14px 30px 18px}
.inbar-inner{max-width:780px;margin:0 auto}
.frow{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}
.up{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border:1px dashed var(--line2);border-radius:9px;font-size:11px;color:var(--tx2);cursor:pointer;background:transparent;transition:.2s}
.up:hover{border-color:var(--emerald);color:var(--emerald-l)}
.ftag{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;font-size:11px;color:var(--emerald-l)}
.ftag .x{cursor:pointer;color:var(--tx3)}.ftag .x:hover{color:#ff6b6b}
.irow{display:flex;gap:10px;align-items:flex-end}
.irow textarea{flex:1;border:1px solid var(--line2);border-radius:13px;padding:13px 16px;font-size:13.5px;font-family:inherit;resize:none;outline:none;min-height:48px;max-height:150px;line-height:1.5;background:var(--bg2);color:var(--tx);transition:.2s}
.irow textarea:focus{border-color:var(--emerald);box-shadow:0 0 0 3px rgba(31,174,130,.13)}
.irow textarea::placeholder{color:var(--tx3)}
.send{width:48px;height:48px;background:linear-gradient(135deg,var(--emerald),var(--emerald-d));color:#fff;border:none;border-radius:13px;cursor:pointer;font-size:18px;flex-shrink:0;transition:.2s;box-shadow:0 6px 18px rgba(31,174,130,.3)}
.send:hover{transform:translateY(-1px)}.send:disabled{background:#2a3340;box-shadow:none;cursor:not-allowed}
.done-note{text-align:center;color:var(--tx3);font-size:12px;padding:8px}
.done-note a{color:var(--emerald-l);cursor:pointer}

/* 报告视图 */
.rptview{flex:1;overflow-y:auto;padding:26px;background:#2b3340}
.rptbar{max-width:794px;margin:0 auto 18px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.rptbar .lt{color:#cfd6df;font-size:13px}
.rptbar .lt b{color:#fff}
.rptbar .btns{display:flex;gap:9px}
.btn{padding:11px 20px;border-radius:11px;font-size:13px;font-weight:700;cursor:pointer;border:none;font-family:inherit;transition:.2s;display:inline-flex;align-items:center;gap:7px}
.btn.pri{background:linear-gradient(135deg,var(--gold),#b8941f);color:#231c05;box-shadow:0 8px 22px rgba(212,175,55,.3)}
.btn.pri:hover{transform:translateY(-1px)}
.btn.pri:disabled{opacity:.6;cursor:wait;transform:none}
.btn.sec{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.18)}
.btn.sec:hover{background:rgba(255,255,255,.16)}

/* A4 文档 —— 行业主题通过 .doc 上的 CSS 变量注入 */
.doc{--p:#0f6b52;--pd:#0a4d3b;--ac:#d4af37;--tint:#eef7f3;--ink:#1d2530}
.page{width:794px;margin:0 auto 22px;background:#fff;color:var(--ink);box-shadow:0 18px 60px rgba(0,0,0,.4);overflow:hidden}
/* 封面 */
.cover{width:794px;height:1123px;position:relative;overflow:hidden;background:var(--pd)}
.cover-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover-ov{position:absolute;inset:0}
.cover-grain{position:absolute;inset:0;opacity:.10;background-image:radial-gradient(circle at 1px 1px,#fff 1px,transparent 0);background-size:22px 22px}
.cover-ct{position:absolute;inset:0;display:flex;flex-direction:column;padding:70px 64px;color:#fff}
.cover-top{display:flex;align-items:center;justify-content:space-between}
.cover-eye{display:flex;align-items:center;gap:11px;font-size:12px;letter-spacing:3px;font-weight:700;color:rgba(255,255,255,.92)}
.cover-eye .lg{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-weight:900}
.seal{width:96px;height:96px;border-radius:50%;border:2px solid var(--ac);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--ac);transform:rotate(-8deg);background:rgba(0,0,0,.12)}
.seal b{font-family:'Noto Serif SC',serif;font-size:22px;line-height:1}
.seal span{font-size:8px;letter-spacing:2px;margin-top:3px}
.cover-mid{margin-top:auto}
.cover-kicker{font-size:14px;letter-spacing:6px;color:var(--ac);font-weight:700;margin-bottom:18px}
.cover-title{font-family:'Noto Serif SC',serif;font-size:62px;font-weight:900;line-height:1.12;letter-spacing:1px;text-shadow:0 4px 30px rgba(0,0,0,.4)}
.cover-rule{width:90px;height:4px;background:var(--ac);margin:26px 0 22px;border-radius:2px}
.cover-sub{font-size:19px;color:rgba(255,255,255,.94);font-weight:500;line-height:1.6;max-width:560px}
.cover-meta{margin-top:54px;display:flex;gap:42px;border-top:1px solid rgba(255,255,255,.25);padding-top:24px}
.cover-meta div span{font-size:10px;letter-spacing:2px;color:rgba(255,255,255,.6);display:block;margin-bottom:4px}
.cover-meta div b{font-size:15px;font-weight:600}
.cover-foot{margin-top:18px;font-size:11px;color:rgba(255,255,255,.55)}

/* 正文 */
.body{padding:58px 64px 64px}
.doc-h1{font-family:'Noto Serif SC',serif;font-size:23px;font-weight:900;color:var(--pd);margin:34px 0 14px;padding-bottom:11px;border-bottom:2px solid var(--p);display:flex;align-items:center;gap:12px}
.doc-h1:first-child{margin-top:0}
.doc-h1 .no{width:30px;height:30px;border-radius:8px;background:var(--p);color:#fff;font-family:'Noto Sans SC';font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.doc-h2{font-size:15px;font-weight:700;color:var(--ink);margin:20px 0 8px}
.doc p{font-size:13px;line-height:1.95;margin-bottom:9px;color:#36404d}
.doc li{font-size:13px;line-height:1.9;margin:3px 0 3px 4px;color:#36404d;list-style:none;padding-left:18px;position:relative}
.doc li::before{content:"";position:absolute;left:2px;top:10px;width:6px;height:6px;border-radius:50%;background:var(--p)}
.doc strong{color:var(--pd);font-weight:700}
.doc table{width:100%;border-collapse:collapse;margin:12px 0 16px;font-size:12px;box-shadow:0 1px 0 var(--p)}
.doc th{background:var(--p);color:#fff;padding:10px 12px;text-align:left;font-weight:600;font-size:12px}
.doc td{padding:9px 12px;border-bottom:1px solid #e6ebf0;color:#36404d}
.doc tr:nth-child(even) td{background:var(--tint)}
.kpis{display:flex;gap:13px;flex-wrap:wrap;margin:14px 0 18px}
.kpi{flex:1;min-width:150px;background:linear-gradient(160deg,var(--tint),#fff);border:1px solid #e3eae6;border-top:3px solid var(--ac);border-radius:13px;padding:18px 16px}
.kpi .k-l{font-size:11px;color:#6b7686;margin-bottom:7px;font-weight:500}
.kpi .k-v{font-family:'Noto Serif SC',serif;font-size:30px;font-weight:900;color:var(--pd);line-height:1}
.kpi .k-s{font-size:10px;color:#8a94a0;margin-top:6px}
.verdict{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--p),var(--pd));color:#fff;border-radius:15px;padding:20px 24px;margin:16px 0 20px;box-shadow:0 12px 30px rgba(0,0,0,.12)}
.verdict .vbadge{font-family:'Noto Serif SC',serif;font-size:17px;font-weight:900;padding:9px 16px;border-radius:10px;background:var(--ac);color:#231c05;white-space:nowrap;flex-shrink:0}
.verdict .vtx{font-size:14px;line-height:1.6;font-weight:500}
.note{background:var(--tint);border-left:4px solid var(--ac);border-radius:0 11px 11px 0;padding:13px 18px;margin:12px 0;font-size:12.5px;color:#3a4450;line-height:1.8}
.note b{color:var(--pd)}
.doc-foot{margin-top:40px;padding-top:16px;border-top:1px solid #e6ebf0;text-align:center;font-size:10px;color:#9aa4b0;line-height:1.8}

@media(max-width:1040px){.sb{display:none}}
@media(max-width:860px){.page,.cover{width:100%;height:auto}.cover{min-height:560px}.cover-title{font-size:40px}.body{padding:34px 24px}.rptview{padding:14px}}
</style>
</head>
<body>
<div class="shell">
  <aside class="sb">
    <div class="sb-top">
      <div class="brand">
        <div class="logo">奇</div>
        <div class="tt"><b>AI投入ROI测算器</b><span>SINGULARITY REACH</span></div>
      </div>
      <div class="sb-sub">用数字说服老板拍板——算清 AI 到底<b style="color:var(--gold-l)">值不值得投、投多少、多久回本</b>。</div>
      <div class="ind-badge" id="indBadge"><span class="dot"></span><span id="indTx"></span></div>
    </div>
    <div class="steps" id="steps"></div>
    <div class="sb-ft">奇点达「3+2+1」标准化产品<br>软件第三件 · ROI 测算器<br>报告由 Claude 大模型 + 实时联网生成</div>
  </aside>
  <div class="mn" id="main"></div>
</div>
<input type="file" id="fileIn" multiple accept=".pdf,.png,.jpg,.jpeg,.txt,.csv,.xlsx,.docx" style="display:none">

<script>
/* ============== 配置 ============== */
var MODEL = "claude-opus-4-8";          // 大模型
var MAXTOK = 4200;

var PHASES = [
  {t:"企业经营基线",   d:"行业 / 营收 / 人员 / 成本"},
  {t:"AI场景与投入",   d:"拟投场景 / 预算 / 周期"},
  {t:"成本结构拆解",   d:"逐项量化当前成本"},
  {t:"收益模型构建",   d:"降本 / 增效 / 增收"},
  {t:"财务指标测算",   d:"ROI / NPV / IRR / 回本"},
  {t:"测算报告输出",   d:"投资决策建议书"}
];

/* 行业 → 配色 + 封面图关键词（报告随客户行业属性变色 + 配封面图） */
var INDUSTRY = {
  manufacturing:{label:"制造业",   q:"modern factory automation robotics",      p:"#1f5673",pd:"#13384c",ac:"#e3902c",tint:"#eef3f7"},
  healthcare:   {label:"医疗健康", q:"modern hospital healthcare technology",    p:"#0d8a7a",pd:"#075c52",ac:"#3ab5a3",tint:"#ecf7f4"},
  finance:      {label:"金融",     q:"finance skyline business district",        p:"#1b3a5b",pd:"#102742",ac:"#c9a227",tint:"#eef1f6"},
  retail:       {label:"零售电商", q:"retail store shopping ecommerce",           p:"#b8392b",pd:"#7d2419",ac:"#e3902c",tint:"#fbeeec"},
  technology:   {label:"科技互联网",q:"data center technology server abstract",   p:"#5b3fc4",pd:"#3a268a",ac:"#22b8cf",tint:"#f0eefb"},
  logistics:    {label:"物流供应链",q:"logistics warehouse shipping containers",  p:"#1c5d99",pd:"#103f6b",ac:"#ef7d23",tint:"#ecf2f8"},
  realestate:   {label:"房地产建筑",q:"modern architecture building construction",p:"#8a6d3b",pd:"#5c4824",ac:"#c9a227",tint:"#f6f2ea"},
  energy:       {label:"能源电力", q:"solar wind energy power renewable",         p:"#2e8b57",pd:"#1c5c39",ac:"#e3b32c",tint:"#edf6f1"},
  agriculture:  {label:"农业食品", q:"smart agriculture farming green field",     p:"#4a7c2f","pd":"#2f521d",ac:"#d2a32c",tint:"#eff5ea"},
  food:         {label:"餐饮",     q:"restaurant kitchen culinary modern",        p:"#c0392b",pd:"#86271d",ac:"#e0a52c",tint:"#fbeeec"},
  automotive:   {label:"汽车出行", q:"automotive manufacturing car technology",   p:"#2c3e50",pd:"#1a262f",ac:"#d33b2c",tint:"#eef1f4"},

/* ============== 调用 Claude ============== */
function buildMsgs(){
  var arr=[];
  conv.slice(-20).forEach(function(m){
    var role=m.from==="ai"?"assistant":"user", content;
    if(m.files&&m.files.length){
      var parts=[];
      m.files.forEach(function(f){
        if(f.type&&f.type.indexOf("image/")===0) parts.push({type:"image",source:{type:"base64",media_type:f.type,data:f.b64}});
        else if(f.type==="application/pdf") parts.push({type:"document",source:{type:"base64",media_type:"application/pdf",data:f.b64}});
      });
      parts.push({type:"text",text:m.text}); content=parts;
    } else content=m.text;
    if(arr.length&&arr[arr.length-1].role===role&&typeof arr[arr.length-1].content==="string"&&typeof content==="string")
      arr[arr.length-1].content+="\n"+content;
    else arr.push({role:role,content:content});
  });
  if(arr.length&&arr[0].role==="assistant") arr.unshift({role:"user",content:"开始测算"});
  return arr;
}

function callAPI(){
  busy=true; render();
  var isReport=(phase>=5);
  var body={ model:MODEL, max_tokens: isReport?8000:1600, system:getSys(), messages:buildMsgs(),
             output_config:{ effort: isReport?"high":"medium" } };
  if(useWeb) body.tools=[{type:"web_search_20260209",name:"web_search",max_uses:isReport?6:3}];

  doFetch(body, false);
}
function doFetch(body, retried){
  fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify(body)
  }).then(function(r){return r.json();}).then(function(data){
    if(data.error){
      // 联网工具 / 参数不被支持时，去掉它们自动重试一次，保证可用性
      if(!retried && (body.tools||body.output_config)){
        var b2=JSON.parse(JSON.stringify(body)); delete b2.tools; delete b2.output_config; doFetch(b2,true); return;
      }
      busy=false; conv.push({from:"ai",text:"⚠️ 接口出错："+(data.error.message||JSON.stringify(data.error))}); render(); return;
    }
    if(data.stop_reason==="pause_turn" && (body._cont||0)<4){
      var b3=JSON.parse(JSON.stringify(body)); b3.messages.push({role:"assistant",content:data.content}); b3._cont=(body._cont||0)+1; doFetch(b3,retried); return;
    }
    busy=false;
    var txt="", used=false;
    (data.content||[]).forEach(function(c){
      if(c.type==="text") txt+=c.text;
      if(c.type==="server_tool_use"||c.type==="web_search_tool_result") used=true;
    });
    if(!txt) txt="（未获取到内容，请再试一次或换种说法。）";
    processResp(txt, used);
  }).catch(function(err){ busy=false; conv.push({from:"ai",text:"⚠️ 连接失败："+err.message+"（请检查网络或 API Key）"}); render(); });
}

function processResp(raw, web){
  var text=raw;
  var mi=text.match(/\[IND\]\s*([a-z_]+)\s*\[\/IND\]/i);
  if(mi){ var k=mi[1].toLowerCase(); if(INDUSTRY[k])industryKey=k; text=text.replace(/\[IND\][\s\S]*?\[\/IND\]/i,"").trim(); }
  var mc=text.match(/\[CO\]([\s\S]*?)\[\/CO\]/);
  if(mc){ company=mc[1].trim(); text=text.replace(/\[CO\][\s\S]*?\[\/CO\]/,"").trim(); }
  var mr=text.match(/\[RPT\]([\s\S]*?)\[\/RPT\]/);
  if(mr){ report=mr[1].trim(); text=text.replace(/\[RPT\][\s\S]*?\[\/RPT\]/,"").trim(); done=true; phase=5;
          if(text) conv.push({from:"ai",text:text,web:web}); render(); return; }
  if(text.indexOf("[RPT]")>=0){ report=text.slice(text.indexOf("[RPT]")+5).replace(/\[\/RPT\]/,"").trim(); done=true; phase=5; render(); return; } // 报告被截断时兜底
  if(text.indexOf("[NEXT]")>=0){ text=text.replace(/\[NEXT\]/g,"").trim(); phase=Math.min(phase+1,5); }
  var opts=null, mo=text.match(/\[OPT\]([\s\S]*?)\[\/OPT\]/);
  if(mo){ opts=mo[1].split("|").map(function(s){return s.trim();}).filter(Boolean); text=text.replace(/\[OPT\][\s\S]*?\[\/OPT\]/,"").trim(); }
  conv.push({from:"ai",text:text,opts:opts,web:web}); render();
}

  var docHTML=buildDoc(report,t);
  var h='<div class="rptview"><div class="rptbar">';
  h+='<div class="lt">报告已生成 · 行业主题：<b>'+t.label+'</b>'+(company?(' · <b>'+esc(company)+'</b>'):'')+'</div>';
  h+='<div class="btns"><button class="btn sec" onclick="location.reload()">↺ 重新测算</button><button class="btn sec" onclick="changeCover()">🖼 更换封面</button><button class="btn pri" id="dlBtn" onclick="downloadPDF()">⬇ 下载高清 PDF</button></div>';
  h+='<input type="file" id="coverIn" accept="image/*" style="display:none">';
  h+='</div>';
  h+=docHTML;
  h+='</div>';
  mn.innerHTML=h;
}

function buildDoc(raw,t){
  // 抽取封面字段
  var coverTitle="企业AI投入ROI测算报告", coverSub="";
  var m1=raw.match(/\[COVERTITLE\]([\s\S]*?)\[\/COVERTITLE\]/); if(m1){coverTitle=m1[1].trim(); raw=raw.replace(m1[0],"");}
  var m2=raw.match(/\[COVERSUB\]([\s\S]*?)\[\/COVERSUB\]/);   if(m2){coverSub=m2[1].trim();   raw=raw.replace(m2[0],"");}
  if(!coverSub) coverSub=(company?("为「"+company+"」量身测算 · "):"")+t.label;

  var styleVars='--p:'+t.p+';--pd:'+t.pd+';--ac:'+t.ac+';--tint:'+t.tint+';';
  var dt=new Date(), ds=dt.getFullYear()+"年"+(dt.getMonth()+1)+"月"+dt.getDate()+"日";
  var rno="SR-ROI-"+(""+dt.getFullYear()).slice(2)+(("0"+(dt.getMonth()+1)).slice(-2))+"-"+Math.random().toString(36).slice(2,6).toUpperCase();

  var ovBg='linear-gradient(180deg,rgba(0,0,0,.50),rgba(0,0,0,.12) 34%,rgba(0,0,0,0) 50%),'
          +'linear-gradient(0deg,'+hexA(t.pd,1)+' 4%,'+hexA(t.pd,.55)+' 40%,'+hexA(t.pd,0)+' 66%)';
  var cover='<div class="cover" id="pdfCover" style="'+styleVars+'background:'+t.pd+'">'
    +'<img class="cover-photo" id="coverPhoto" crossorigin="anonymous" src="'+coverURL()+'" onload="this.dataset.ok=1" onerror="coverFallback(this)">'
    +'<div class="cover-ov" style="background:'+ovBg+'"></div><div class="cover-grain"></div>'
    +'<div class="cover-ct">'
      +'<div class="cover-top"><div class="cover-eye"><span class="lg">奇</span>SINGULARITY REACH TECHNOLOGY</div>'
      +'<div class="seal"><b>定制</b><span>CUSTOM</span></div></div>'
      +'<div class="cover-mid">'
        +'<div class="cover-kicker">AI 投资决策报告</div>'
        +'<div class="cover-title">'+esc(coverTitle)+'</div>'
        +'<div class="cover-rule"></div>'
        +'<div class="cover-sub">'+esc(coverSub)+'</div>'
        +'<div class="cover-meta">'
          +'<div><span>报 告 日 期</span><b>'+ds+'</b></div>'
          +'<div><span>报 告 编 号</span><b>'+rno+'</b></div>'
          +'<div><span>测 算 引 擎</span><b>Claude · 实时联网</b></div>'
        +'</div>'
        +'<div class="cover-foot">本报告基于贵司经营数据与行业基准测算 · 仅供投资决策参考</div>'
      +'</div>'
    +'</div></div>';

  var body='<div class="page" id="pdfBody" style="'+styleVars+'"><div class="body">'+parseBody(raw)+
    '<div class="doc-foot">本报告由奇点达「企业AI投入ROI测算器」生成 · 数据含估算成分，精确测算请联系行业专家团队<br>SINGULARITY REACH TECHNOLOGY · '+rno+'</div></div></div>';

  return '<div class="doc" style="'+styleVars+'">'+cover+body+'</div>';
}

function parseBody(raw){
  var lines=raw.split("\n"), h="", i=0, hno=0;
  function closeTable(st){ return st?"</tbody></table>":""; }
  var inT=false;
  function flushKpis(buf){ if(!buf.length)return""; var s='<div class="kpis">'; buf.forEach(function(k){ var p=k.split("|"); s+='<div class="kpi"><div class="k-l">'+inl((p[0]||"").trim())+'</div><div class="k-v">'+inl((p[1]||"").trim())+'</div><div class="k-s">'+inl((p[2]||"").trim())+'</div></div>'; }); return s+'</div>'; }

  for(i=0;i<lines.length;i++){
    var l=lines[i].trim();
    // KPI 连续聚合
    if(/^\[KPI\]/.test(l)){
      var buf=[];
      while(i<lines.length && /^\[KPI\]/.test(lines[i].trim())){ var mm=lines[i].trim().match(/^\[KPI\]([\s\S]*?)\[\/KPI\]/); if(mm)buf.push(mm[1]); i++; }
      i--; if(inT){h+="</tbody></table>";inT=false;} h+=flushKpis(buf); continue;
    }
    if(!l){ if(inT){h+="</tbody></table>";inT=false;} continue; }
    var mv=l.match(/^\[VERDICT\s*([^\]]*)\]([\s\S]*?)\[\/VERDICT\]/);
    if(mv){ if(inT){h+="</tbody></table>";inT=false;} h+='<div class="verdict"><div class="vbadge">'+esc(mv[1].trim()||"测算结论")+'</div><div class="vtx">'+inl(mv[2].trim())+'</div></div>'; continue; }
    var mn2=l.match(/^\[NOTE\]([\s\S]*?)\[\/NOTE\]/);
    if(mn2){ if(inT){h+="</tbody></table>";inT=false;} h+='<div class="note">'+inl(mn2[1].trim())+'</div>'; continue; }
    if(l.indexOf("# ")===0){ if(inT){h+="</tbody></table>";inT=false;} hno++; h+='<div class="doc-h1"><span class="no">'+hno+'</span>'+inl(l.slice(2).replace(/^[一二三四五六七八九十]+[、.\s]*/,"")) +'</div>'; continue; }
    if(l.indexOf("## ")===0){ if(inT){h+="</tbody></table>";inT=false;} h+='<div class="doc-h2">'+inl(l.slice(3))+'</div>'; continue; }
    if(l.indexOf("### ")===0){ if(inT){h+="</tbody></table>";inT=false;} h+='<div class="doc-h2">'+inl(l.slice(4))+'</div>'; continue; }
    if(/\|/.test(l) && /\|.*\|/.test(l)){
      if(/^[\|\s\-:]+$/.test(l)) continue;
      var cells=l.split("|").filter(function(c){return c.trim()!=="";});
      if(!inT){ h+='<table><thead><tr>'; cells.forEach(function(c){h+='<th>'+inl(c.trim())+'</th>';}); h+='</tr></thead><tbody>'; inT=true; }
      else { h+='<tr>'; cells.forEach(function(c){h+='<td>'+inl(c.trim())+'</td>';}); h+='</tr>'; }
      continue;
    }
    if(inT){h+="</tbody></table>";inT=false;}
    if(/^[-•]\s/.test(l)){ h+='<li>'+inl(l.slice(2))+'</li>'; continue; }
    if(/^\d+[.、]\s/.test(l)){ h+='<li>'+inl(l.replace(/^\d+[.、]\s/,''))+'</li>'; continue; }
    h+='<p>'+inl(l)+'</p>';
  }
  if(inT)h+="</tbody></table>";
  return h;
}

/* ============== 导出 PDF ============== */
function downloadPDF(){
  var btn=document.getElementById("dlBtn"); if(btn){btn.disabled=true; btn.textContent="⏳ 正在生成 PDF…";}
  var fin=function(){ if(btn){btn.disabled=false; btn.textContent="⬇ 下载高清 PDF";} };
  var waitImg=new Promise(function(res){
    var img=document.getElementById("coverPhoto");
    if(!img||img.dataset.ok==="1"||img.style.display==="none") return res();
    var done=false, d=function(){ if(!done){done=true;res();} };
    img.addEventListener("load",d); img.addEventListener("error",d); setTimeout(d,6000);
  });
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(function(){
    return waitImg;
  }).then(function(){
    var jsPDF=window.jspdf.jsPDF;
    var pdf=new jsPDF("p","pt","a4"); var W=595.28, H=841.89;
    var cover=document.getElementById("pdfCover"), bodyEl=document.getElementById("pdfBody");
    var opt={scale:2,useCORS:true,allowTaint:false,backgroundColor:"#ffffff",logging:false};
    html2canvas(cover,opt).then(function(c1){
      pdf.addImage(c1.toDataURL("image/jpeg",0.94),"JPEG",0,0,W,H,"cover","FAST");
      return html2canvas(bodyEl,opt);
    }).then(function(c2){
      var imgW=W, imgH=c2.height*imgW/c2.width, pos=0, data=c2.toDataURL("image/jpeg",0.94);
      while(pos<imgH-2){
        pdf.addPage();
        pdf.addImage(data,"JPEG",0,-pos,imgW,imgH,"body","FAST");
        pos+=H;
      }
      var fn=(company?company+"-":"")+"AI投入ROI测算报告.pdf";
      pdf.save(fn); fin();
    }).catch(function(e){
      // 封面图跨域污染兜底：改用渐变封面后重试一次
      if(!coverTainted){ coverTainted=true; coverFallback(document.getElementById("coverPhoto")); setTimeout(downloadPDF,350); return; }
      alert("PDF 生成遇到问题："+e.message+"\n可改用浏览器菜单「打印 → 另存为 PDF」导出。"); fin();
    });
  });
}

render();
</script>
