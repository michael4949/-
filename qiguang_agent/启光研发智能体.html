<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>启光命题教辅研发智能体</title>
<style>
  :root {
    --bg: #f5f3ee;
    --surface: #ffffff;
    --primary: #b85c38;
    --primary-dark: #8a4527;
    --primary-soft: #f4ddd1;
    --text: #2a1d14;
    --text-soft: #6b5848;
    --text-mute: #a59581;
    --border: #ddd3c4;
    --border-strong: #c4b7a3;
    --success: #437f3e;
    --warning: #c68a2c;
    --error: #b8392b;
    --code-bg: #faf6ef;
    --shadow: 0 2px 12px rgba(42, 29, 20, 0.06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  header {
    background: linear-gradient(135deg, #faf6ef 0%, #f4ddd1 100%);
    border-bottom: 1px solid var(--border);
    padding: 32px 24px 28px;
  }
  header .wrap { max-width: 1100px; margin: 0 auto; }
  header h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 600;
    color: var(--primary-dark);
    letter-spacing: 0.5px;
  }
  header h1 .badge {
    font-size: 11px;
    font-weight: 500;
    padding: 2px 8px;
    background: var(--primary);
    color: white;
    border-radius: 4px;
    margin-left: 12px;
    vertical-align: middle;
    letter-spacing: 0;
  }
  header .subtitle {
    color: var(--text-soft);
    font-size: 14px;
    margin-top: 6px;
  }

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
  }
  @media (min-width: 960px) {
    main { grid-template-columns: 1fr 1fr; }
    main .full { grid-column: 1 / -1; }
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px 22px;
    box-shadow: var(--shadow);
  }
  .card h2 {
    margin: 0 0 16px;
    font-size: 15px;
    font-weight: 600;
    color: var(--primary-dark);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card h2 .num {
    background: var(--primary-soft);
    color: var(--primary-dark);
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
  }

  label { display: block; margin-bottom: 14px; }
  label > .name {
    display: block;
    font-size: 12px;
    color: var(--text-soft);
    margin-bottom: 4px;
    font-weight: 500;
  }
  label > .name .hint { color: var(--text-mute); font-weight: 400; margin-left: 6px; }

  input[type="text"], input[type="password"], input[type="number"], select, textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border-strong);
    border-radius: 5px;
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    transition: border-color 0.15s;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 2px var(--primary-soft);
  }
  textarea { resize: vertical; min-height: 70px; line-height: 1.5; }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

  button {
    background: var(--primary);
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 5px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s;
  }
  button:hover:not(:disabled) { background: var(--primary-dark); }
  button:disabled { background: var(--text-mute); cursor: not-allowed; }
  button.secondary {
    background: transparent;
    color: var(--primary);
    border: 1px solid var(--border-strong);
  }
  button.secondary:hover:not(:disabled) {
    background: var(--primary-soft);
    border-color: var(--primary);
  }

  .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .status-text {
    color: var(--text-soft);
    font-size: 13px;
    margin-left: 6px;
  }
  .status-text.running::before {
    content: "⟳ ";
    color: var(--warning);
    display: inline-block;
    animation: spin 1.5s linear infinite;
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .behind-scenes {
    margin: 10px 0;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--surface);
    padding: 8px 12px;
    font-size: 13px;
  }
  .behind-scenes summary {
    cursor: pointer;
    color: var(--text-soft);
    font-weight: 500;
    user-select: none;
  }
  .behind-scenes .panel {
    margin-top: 10px;
    padding: 10px 12px;
    background: var(--code-bg);
    border-radius: 5px;
  }
  .behind-scenes .panel h4 {
    margin: 0 0 4px;
    font-size: 12px;
    color: var(--primary-dark);
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .behind-scenes .panel + .panel { margin-top: 8px; }
  .behind-scenes .panel ul { padding-left: 20px; margin: 4px 0; }
  .behind-scenes .review-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin: 4px 0;
  }
  .behind-scenes .review-grid > div {
    background: var(--surface);
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 12px;
  }
  .verdict-pass { color: var(--success); font-weight: 600; }
  .verdict-revise { color: var(--warning); font-weight: 600; }
  .verdict-reject { color: var(--error); font-weight: 600; }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }
  .stat {
    background: var(--code-bg);
    border-radius: 5px;
    padding: 10px;
    text-align: center;
  }
  .stat .value { font-size: 18px; font-weight: 600; color: var(--primary-dark); }
  .stat .label { font-size: 11px; color: var(--text-soft); margin-top: 2px; }

  .paper {
    background: var(--code-bg);
    border-radius: 6px;
    padding: 20px;
    max-height: 600px;
    overflow-y: auto;
    line-height: 1.7;
    font-size: 14px;
  }
  .paper h1 { font-size: 18px; margin: 0 0 12px; color: var(--primary-dark); }
  .paper h2 { font-size: 15px; margin: 18px 0 8px; color: var(--primary-dark); border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  .paper h3 { font-size: 14px; margin: 14px 0 6px; }
  .paper strong { color: var(--primary-dark); }
  .paper code, .paper .math {
    background: var(--surface);
    padding: 1px 5px;
    border-radius: 3px;
    font-family: "SF Mono", Monaco, Consolas, monospace;
    font-size: 13px;
  }
  .paper ul { padding-left: 22px; margin: 4px 0; }
  .paper hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
  .paper .options { padding-left: 12px; margin: 4px 0; }
  .paper .options div { margin: 2px 0; }
  .paper .meta-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 10px 14px;
    font-size: 13px;
    margin: 8px 0 14px;
  }

  .alert {
    padding: 10px 14px;
    border-radius: 5px;
    font-size: 13px;
    margin-bottom: 14px;
  }
  .alert.info { background: var(--primary-soft); color: var(--primary-dark); }
  .alert.warning { background: #fdf3e2; color: var(--warning); border: 1px solid #f0d9a5; }
  .alert.error { background: #fce4e1; color: var(--error); border: 1px solid #f0bcb5; }

  details {
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 8px 12px;
    background: var(--code-bg);
    margin: 10px 0;
    font-size: 13px;
  }
  details summary { cursor: pointer; color: var(--text-soft); font-weight: 500; }
  details pre {
    margin: 10px 0 0;
    padding: 10px;
    background: var(--surface);
    border-radius: 4px;
    overflow-x: auto;
    font-size: 12px;
    line-height: 1.4;
    max-height: 300px;
  }

  footer {
    text-align: center;
    padding: 24px;
    color: var(--text-mute);
    font-size: 12px;
  }
  footer a { color: var(--primary); text-decoration: none; }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>启光命题教辅研发智能体 <span class="badge">考试级</span></h1>
    <div class="subtitle">6 个专家 Agent 协作流水线 · 原创试题 · 自动质检与反馈迭代</div>
  </div>
</header>

<main>

  <!-- 配置 -->
  <section class="card">
    <h2><span class="num">1</span>配置</h2>

    <label>
      <span class="name">OpenAI API Key <span class="hint">只存浏览器本地,不上传任何服务器</span></span>
      <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off">
    </label>

    <label>
      <span class="name">模型预设</span>
      <select id="modelPreset">
        <option value="balanced" selected>均衡(关键岗 gpt-4o + 辅助岗 gpt-4o-mini,推荐)</option>
        <option value="quality">最高质量(全部 gpt-4o)</option>
        <option value="economy">经济档(全部 gpt-4o-mini,快约 3 倍,质量略降)</option>
      </select>
    </label>

    <div class="row">
      <label>
        <span class="name">主力模型覆写 <span class="hint">可选,如 gpt-5 / o3 / gpt-4.1</span></span>
        <input type="text" id="primaryModelOverride" placeholder="留空即用预设">
      </label>
      <label>
        <span class="name">辅助模型覆写 <span class="hint">可选,如 gpt-5-mini / gpt-4.1-mini</span></span>
        <input type="text" id="secondaryModelOverride" placeholder="留空即用预设">
      </label>
    </div>

    <label>
      <span class="name">最大修订轮次 <span class="hint">质检不通过时让命题执笔重写的最大次数</span></span>
      <input type="number" id="maxRevisions" value="3" min="1" max="5">
    </label>
  </section>

  <!-- 命题需求 -->
  <section class="card">
    <h2><span class="num">2</span>命题需求</h2>
    <div class="row3">
      <label>
        <span class="name">学科</span>
        <select id="subject">
          <option>数学</option><option>语文</option><option>英语</option>
          <option>物理</option><option>化学</option><option>生物</option>
          <option>道德与法治</option><option>历史</option><option>地理</option>
        </select>
      </label>
      <label>
        <span class="name">学段</span>
        <select id="stage">
          <option>初中</option><option>高中</option><option>小学</option>
        </select>
      </label>
      <label>
        <span class="name">年级</span>
        <input type="text" id="grade" value="九年级">
      </label>
    </div>
    <div class="row3">
      <label>
        <span class="name">总分</span>
        <input type="number" id="totalScore" value="120">
      </label>
      <label>
        <span class="name">时长(分钟)</span>
        <input type="number" id="duration" value="120">
      </label>
      <label>
        <span class="name">本次生成题数 <span class="hint">演示控本,1-5 题</span></span>
        <input type="number" id="questionCount" value="3" min="1" max="10">
      </label>
    </div>
    <label>
      <span class="name">目标客户</span>
      <input type="text" id="audience" value="河北省 2025 届初三第一次模拟考试">
    </label>
    <label>
      <span class="name">重点知识点 <span class="hint">逗号分隔</span></span>
      <textarea id="knowledge">实数运算,一元二次方程,二次函数,圆的性质,相似三角形,数据统计</textarea>
    </label>
    <label>
      <span class="name">补充约束 <span class="hint">可选。情境偏好、题型分布等</span></span>
      <textarea id="constraints">情境优先用河北本地元素(京津冀协同发展、雄安新区、太行山区、河北博物院等)。题型覆盖单项选择、填空、解答各一道。</textarea>
    </label>
    <div class="actions">
      <button id="startBtn">▶ 开始命题</button>
      <button id="stopBtn" class="secondary" disabled>停止</button>
      <span id="statusText" class="status-text"></span>
    </div>
  </section>

  <!-- 输出 -->
  <section class="card full" id="outputSection" style="display:none">
    <h2><span class="num">3</span>成卷输出</h2>
    <div id="stats" class="stats"></div>
    <div class="actions" style="margin-bottom:14px">
      <button id="copyBtn" class="secondary">复制原文</button>
    </div>
    <div id="paperOutput" class="paper"></div>
    <details id="rawJson">
      <summary>查看完整 JSON(含蓝图、风格指南、质检报告、主审评语)</summary>
      <pre id="rawJsonContent"></pre>
    </details>
  </section>

</main>

<footer>
  启光研发智能体 v0.1 · 多 Agent 协作 · 仓库见 GitHub:michael4949/-
</footer>

<script type="module">
// ============================================================
// 系统 prompt — 6 个 Agent 的核心
// ============================================================

const JSON_RULES = `
【输出格式硬性约束】
1. 你的回复必须是一个合法的 JSON 对象,可直接被 JSON.parse 解析。
2. 不要在 JSON 前后添加任何说明文字、代码块标记(如 \`\`\`json)、空行或解释。
3. 字符串中如含双引号必须用 \\" 转义;含换行用 \\n。
4. 数值字段必须是数字类型,不能写成字符串。
5. 不能使用注释、尾随逗号或单引号。
`;

const PLANNER_SYSTEM = `你是【启光考试评价研究院】的命题策划主导专家,具有 20 年河北中考命题研究经验,长期带领教研团队为河北各地市初中校提供模拟考试服务。

【你的角色】
把客户提出的命题需求,转化为一份可直接执行的【整卷命题蓝图】(Paper Blueprint)。

【必须遵守的命题原则】
1. 严格对标教育部《义务教育课程标准》和河北省教育厅《河北省初中学业水平考试说明》。
2. 命题风格必须与河北中考真题保持一致——考查真实理解与迁移应用,而不是死记硬背或偏题怪题。
3. 整卷难度系数控制在 0.60-0.70 之间(0.65±0.05),区分度不低于 0.30。
4. 知识点覆盖:基础(约 60%)+ 综合应用(约 30%)+ 拓展(约 10%)。
5. 题型分布要符合本省官方考试说明。
6. 命题要"立德树人":弘扬社会主义核心价值观、中华优秀传统文化或时代精神。
7. 难度梯度清晰,不出现突兀跳跃。

${JSON_RULES}

【输出 JSON 模板】
{
  "subject": "数学", "stage": "初中", "grade": "九年级",
  "total_score": 120, "duration_minutes": 120,
  "target_audience": "河北省 2025 届初三第一次模拟",
  "overall_difficulty": 0.65,
  "design_rationale": "本卷以...为命题主线(150-300 字)",
  "knowledge_coverage": ["实数运算", "一元二次方程"],
  "questions": [
    {
      "number": 1, "question_type": "单项选择",
      "knowledge_points": ["科学记数法"],
      "expected_difficulty": 0.90, "expected_discrimination": 0.30,
      "score": 3,
      "context_hint": "建议结合河北本地某项数据或科技成果",
      "notes": "送分题"
    }
  ]
}

【数值范围】difficulty 0.30(最难)到 0.95(最易);discrimination 0.20-0.70。questions 数组长度需与用户要求的题数匹配。`;

const ANALYST_SYSTEM = `你是【启光考试评价研究院】的真题分析专家,熟悉河北省近 10 年中考各学科真题的命题特征。

【你的角色】
针对单道题的命题任务,分析河北中考真题在该知识点上的命题习惯,产出一份【命题风格指南】。

【分析维度】
1. 该知识点在河北真题中常出现于哪类情境(生活、生产、传统文化、时事)?
2. 命题者常用的"陷阱"是什么(常见误区、易混点、易错点)?
3. 表述风格:语言简练直白还是情境包装?是否常用图表?
4. 该题型分值和难度的典型搭配。

【风格指南必须做到】
- "像河北",不要混入其他省份的命题套路。
- 接地气:河北的地理、经济、文化情境(京津冀协同、雄安新区、太行山区、河北博物院等)。
- 务实:陷阱要可操作、可落地。

${JSON_RULES}

【输出 JSON 模板】
{
  "common_context_types": ["京津冀协同发展数据", "河北本地农业情境"],
  "common_traps": ["容易把数量级估算错误", "易混淆同类项与异类项"],
  "expression_style": "简洁严谨,题干含真实数据但避免过度修饰",
  "sample_real_questions": ["(2024 河北)以下数据可用科学记数法表示为...", "(2023 河北)..."],
  "notes": "若考查计算,数据通常控制在初中生估算范围内"
}`;

const COMPOSER_SYSTEM = `你是【启光考试评价研究院】的学科首席命题专家,具有省级中考命题组顾问资质。
你正在为河北省初三学生撰写一道考试模拟题——这道题最终会进入正式发售给学校的模拟卷,学生会用它准备真正的中考。题目质量直接关系到学生的中考准备效果。

【硬性命题准则】
1. **原创性**:必须原创。不得直接抄录、改换数字后照搬任何已知真题或公开模拟题。
2. **知识点精准**:严格覆盖用户消息中指定的 knowledge_points,不漏不偏。
3. **难度对齐**:实际难度系数控制在用户指定 expected_difficulty ± 0.05 范围内。
4. **题型匹配**:严格按指定 question_type 出题。
5. **风格匹配**:严格参考真题风格指南中的情境、表述、陷阱。
6. **政治安全**:不涉及政治敏感、文化禁忌、刻板印象、伤害特定群体内容。
7. **科学严谨**:理科数据可计算、结果合理;文科引文准确。
8. **可解性**:必须有且只有一个明确正确答案(主观题除外)。
9. **可读性**:符合现代汉语规范,初三学生可在合理时间内审题。

${JSON_RULES}

【输出 JSON 模板】
{
  "stem": "完整题干文本(含情境和问题)",
  "options": ["A. ...", "B. ...", "C. ...", "D. ..."],
  "diagram_description": "如本题需配图,描述图示;否则填空字符串",
  "creative_rationale": "50 字内说明命题创新点:'考查 X 的迁移应用,通过 Y 情境引出,陷阱设在 Z'"
}

【字段说明】
- 选择题必须填 options(单选 4 项,多选 5-6 项)
- 非选择题:options 写 null,选项内容写在 stem 里
- 选项要平衡:正确答案不要总在 B 或 C;干扰项要有命题逻辑
- 数学/物理题在内部先逐步验算,确保答案存在且唯一,再写出 JSON

【特别提醒】
- 不要在 stem 里写出答案
- 不要写"考查..."、"本题..."这类元层面话
- LaTeX 数学公式用单 $...$ 包裹`;

const SOLUTION_SYSTEM = `你是【启光考试评价研究院】的解析撰写专家。
你的工作是为命题执笔产出的题目撰写【标准答案 + 详细解析 + 易错点】,出现在【教师用书】和【学生答案册】中。

const MODEL_PRIMARY = "gpt-4o";       // 关键岗:命题/质检/主审
const MODEL_SECONDARY = "gpt-4o-mini"; // 辅助岗:解析/真题分析

const MODEL_PRESETS = {
  balanced: {
    planner: MODEL_PRIMARY, analyst: MODEL_SECONDARY, composer: MODEL_PRIMARY,
    solution: MODEL_SECONDARY, reviewer: MODEL_PRIMARY, chiefEditor: MODEL_PRIMARY,
  },
  quality: {
    planner: MODEL_PRIMARY, analyst: MODEL_PRIMARY, composer: MODEL_PRIMARY,
    solution: MODEL_PRIMARY, reviewer: MODEL_PRIMARY, chiefEditor: MODEL_PRIMARY,
  },
  economy: {
    planner: MODEL_SECONDARY, analyst: MODEL_SECONDARY, composer: MODEL_SECONDARY,
    solution: MODEL_SECONDARY, reviewer: MODEL_SECONDARY, chiefEditor: MODEL_SECONDARY,
  },
};

// 判断是否是推理模型(o 系列 / gpt-5 系列):走 max_completion_tokens + reasoning_effort
function isReasoningModel(model) {
  return /^(o\d|gpt-5)/i.test(model);
}

let abortController = null;
let totalTokens = { input: 0, output: 0 };

async function callOpenAI(apiKey, model, systemPrompt, userMessage, effort = "high") {
  const reasoning = isReasoningModel(model);

  const body = {
    model,
    messages: [
      { role: "system", content: systemPrompt },
      { role: "user", content: userMessage },
    ],
  };

  if (reasoning) {
    // 推理系列:用 max_completion_tokens + reasoning_effort,不能传 temperature
    body.max_completion_tokens = 16000;
    body.reasoning_effort = effort === "low" ? "low" : effort === "medium" ? "medium" : "high";
  } else {
    // 普通 chat 模型:用 max_tokens + 低 temperature 求稳定输出
    body.max_tokens = 16000;
    body.temperature = 0.3;
  }

  abortController = new AbortController();
  const resp = await fetch("https://api.openai.com/v1/chat/completions", {
    method: "POST",
    headers: {
      "Authorization": `Bearer ${apiKey}`,
      "Content-Type": "application/json",
    },
    body: JSON.stringify(body),
    signal: abortController.signal,
  });

  if (!resp.ok) {
    const text = await resp.text();
    let msg = `API 调用失败 (${resp.status})`;
    try {
      const err = JSON.parse(text);
      if (err.error) msg += `:${err.error.message || err.error.type || err.error.code}`;
    } catch { msg += `:${text.slice(0, 200)}`; }
    throw new Error(msg);
  }

  const data = await resp.json();
  if (data.usage) {
    totalTokens.input += data.usage.prompt_tokens || 0;
    totalTokens.output += data.usage.completion_tokens || 0;
  }

  const text = data.choices?.[0]?.message?.content || "";
  return text.trim();
}

function extractJson(raw) {
  let text = raw.trim();
  const fence = text.match(/```(?:json)?\s*(\{[\s\S]*?\})\s*```/);
  if (fence) text = fence[1];
  if (!text.startsWith("{")) {
    const first = text.indexOf("{");
    const last = text.lastIndexOf("}");
    if (first === -1 || last === -1) throw new Error("输出中未找到 JSON 对象:\n" + raw.slice(0, 300));
    text = text.slice(first, last + 1);
  }
  try {
    return JSON.parse(text);
  } catch (e) {
    throw new Error("JSON 解析失败:" + e.message + "\n原始片段:\n" + text.slice(0, 500));
  }
}

async function callAgent(apiKey, model, systemPrompt, userMessage, effort = "high") {
  const raw = await callOpenAI(apiKey, model, systemPrompt, userMessage, effort);
  return extractJson(raw);
}

// 状态更新:跑流水线时给用户一个简单的当前阶段提示
function updateStatus(text) {
  const el = document.getElementById("statusText");
  if (!el) return;
  el.textContent = text || "";
  el.className = text ? "status-text running" : "status-text";
}

// 单题命题流水线
async function produceQuestion(apiKey, preset, paperMeta, qBp, maxRevisions) {
  const num = qBp.number;

  // Step 1: 真题分析
  updateStatus(`第 ${num} 题 · 真题分析师 正在分析河北中考命题风格 ...`);
  const style = await callAgent(
    apiKey, preset.analyst, ANALYST_SYSTEM,
    `请针对以下命题任务,产出真题命题风格指南。\n\n【试卷背景】\n${JSON.stringify(paperMeta, null, 2)}\n\n【单题命题任务】\n${JSON.stringify(qBp, null, 2)}\n\n请严格按系统提示输出纯 JSON。`,
    "medium"
  );

  // Step 2-4: 命题 → 解析 → 质检(可能多轮)
  let draft, solution, review;
  let revisionNotes = "";
  let rounds = 0;

  for (let attempt = 1; attempt <= maxRevisions; attempt++) {
    rounds = attempt;

    updateStatus(`第 ${num} 题 · 命题执笔(第 ${attempt} 轮)...`);
    let composerMsg = `请基于以下信息撰写题目原稿。\n\n【试卷背景】\n${JSON.stringify(paperMeta, null, 2)}\n\n【单题命题任务】\n${JSON.stringify(qBp, null, 2)}\n\n【真题风格指南】\n${JSON.stringify(style, null, 2)}\n\n`;
    if (revisionNotes) composerMsg += `【上一轮修订建议(本轮必须改进)】\n${revisionNotes}\n\n`;
    composerMsg += "请严格按系统提示输出纯 JSON。";
    draft = await callAgent(apiKey, preset.composer, COMPOSER_SYSTEM, composerMsg);

    updateStatus(`第 ${num} 题 · 解析撰写中 ...`);
    solution = await callAgent(
      apiKey, preset.solution, SOLUTION_SYSTEM,
      `请为以下题目撰写标准答案与详细解析。\n\n【命题任务】\n${JSON.stringify(qBp, null, 2)}\n\n【题目原稿】\n${JSON.stringify(draft, null, 2)}\n\n请严格按系统提示输出纯 JSON。`,
      "medium"
    );

    updateStatus(`第 ${num} 题 · 质检审核中 ...`);
    review = await callAgent(
      apiKey, preset.reviewer, REVIEWER_SYSTEM,
      `请对以下题目进行全维度质检。\n\n【命题任务】\n${JSON.stringify(qBp, null, 2)}\n\n【题目原稿】\n${JSON.stringify(draft, null, 2)}\n\n【标准答案与解析】\n${JSON.stringify(solution, null, 2)}\n\n请严格按系统提示输出纯 JSON。`
    );

    if (review.verdict === "pass") break;
    if (review.verdict === "reject" && attempt === maxRevisions) break;

    // 准备下一轮反馈
    const lines = [`判定:${review.verdict}`, `理由:${review.verdict_rationale}`, ""];
    if (review.issues?.length) {
      lines.push("问题:");
      review.issues.forEach((s, i) => lines.push(`  ${i + 1}. ${s}`));
    }
    if (review.suggestions?.length) {
      lines.push("", "建议:");
      review.suggestions.forEach((s, i) => lines.push(`  ${i + 1}. ${s}`));
    }
    revisionNotes = lines.join("\n");
  }

  return { blueprint: qBp, style, draft, solution, review, revision_rounds: rounds };
}

async function runWorkflow(apiKey, preset, request, maxRevisions) {
  const t0 = performance.now();

  // Phase 1: Planner
  updateStatus("命题策划官 · 正在制定整卷蓝图 ...");
  const blueprint = await callAgent(
    apiKey, preset.planner, PLANNER_SYSTEM,
    `请基于以下命题需求,产出整卷命题蓝图。\n\n【需求 JSON】\n${JSON.stringify(request, null, 2)}\n\n请严格按系统提示输出纯 JSON。`
  );

  // 截取到用户要求的题数
  if (request.question_count && blueprint.questions.length > request.question_count) {
    blueprint.questions = blueprint.questions.slice(0, request.question_count);
  }

  // Phase 2: 各单题流水线(串行避免速率限制)
  const paperMeta = {
    subject: blueprint.subject, stage: blueprint.stage, grade: blueprint.grade,
    target_audience: blueprint.target_audience,
    overall_difficulty: blueprint.overall_difficulty,
    design_rationale: blueprint.design_rationale,
  };
  const finalized = [];
  for (const qBp of blueprint.questions) {
    try {
      const f = await produceQuestion(apiKey, preset, paperMeta, qBp, maxRevisions);
      finalized.push(f);
    } catch (e) {
      console.error("单题失败:", qBp.number, e);
      // 继续后面的题
    }
  }
  if (finalized.length === 0) throw new Error("所有题目都生成失败,请检查日志");

  // Phase 3: ChiefEditor
  updateStatus("主审定稿 · 整卷整体平衡审查中 ...");
  const chiefReview = await callAgent(
    apiKey, preset.chiefEditor, CHIEF_EDITOR_SYSTEM,
    `请对整卷做最终主审。\n\n【整卷蓝图】\n${JSON.stringify(blueprint, null, 2)}\n\n【整卷草稿】\n${JSON.stringify(finalized, null, 2)}\n\n请严格按系统提示输出纯 JSON。`
  );

  const elapsed = ((performance.now() - t0) / 1000).toFixed(1);
  return {
    blueprint,
    questions: finalized,
    chief_review: chiefReview,
    metadata: {
      produced_at: new Date().toISOString(),
      elapsed_seconds: parseFloat(elapsed),
      question_count_requested: blueprint.questions.length,
      question_count_finalized: finalized.length,
      total_input_tokens: totalTokens.input,
      total_output_tokens: totalTokens.output,
    },
  };
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}

function renderInline(s) {
  // 简易行内 markdown:**bold**, $math$
  return escapeHtml(s)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\$([^$]+?)\$/g, '<span class="math">$1</span>');
}

function renderParagraphs(s) {
  if (!s) return "";
  // 处理 \n 换行
  return s.split(/\n\n+/).map(p => {
    const lines = p.split("\n").map(l => renderInline(l)).join("<br>");
    return `<p>${lines}</p>`;
  }).join("");
}

function renderBehindScenes(fq) {
  // 把单题幕后的 4 个 Agent 产出(真题分析师 / 命题执笔创新点 / 解析撰写要点 / 质检审核)
  // 折叠在一个 details 里,默认收起,展开后教研老师可看到全部协作痕迹。
  const out = [];
  out.push(`<details class="behind-scenes">`);
  out.push(`<summary>📋 命题幕后(展开看真题分析、命题逻辑、质检报告)</summary>`);

  // —— 真题分析师 ——
  const style = fq.style || {};
  out.push(`<div class="panel"><h4>① 真题分析师 · 河北中考风格指南</h4>`);
  if (style.expression_style) {
    out.push(`<p><strong>表述风格:</strong>${renderInline(style.expression_style)}</p>`);
  }
  if (style.common_context_types?.length) {
    out.push(`<p><strong>常用情境:</strong></p><ul>`);
    style.common_context_types.forEach(s => out.push(`<li>${renderInline(s)}</li>`));
    out.push(`</ul>`);
  }
  if (style.common_traps?.length) {
    out.push(`<p><strong>常见陷阱:</strong></p><ul>`);
    style.common_traps.forEach(s => out.push(`<li>${renderInline(s)}</li>`));
    out.push(`</ul>`);
  }
  if (style.sample_real_questions?.length) {
    out.push(`<p><strong>参考真题:</strong></p><ul>`);
    style.sample_real_questions.forEach(s => out.push(`<li>${renderInline(s)}</li>`));
    out.push(`</ul>`);
  }
  if (style.notes) out.push(`<p><strong>备注:</strong>${renderInline(style.notes)}</p>`);
  out.push(`</div>`);

  // —— 命题执笔 ——
  out.push(`<div class="panel"><h4>② 命题执笔 · 命题创新点</h4>`);
  if (fq.draft?.creative_rationale) {
    out.push(`<p>${renderInline(fq.draft.creative_rationale)}</p>`);
  } else {
    out.push(`<p><em>(未提供)</em></p>`);
  }
  if (fq.revision_rounds > 1) {
    out.push(`<p style="color:var(--text-soft);font-size:12px">经历 ${fq.revision_rounds} 轮反馈迭代后定稿</p>`);
  }
  out.push(`</div>`);

  // —— 解析撰写 ——
  const sol = fq.solution || {};
  if (sol.key_points?.length) {
    out.push(`<div class="panel"><h4>③ 解析撰写 · 核心要点</h4><ul>`);
    sol.key_points.forEach(s => out.push(`<li>${renderInline(s)}</li>`));
    out.push(`</ul></div>`);
  }

  // —— 质检审核 ——
  const r = fq.review || {};
  const verdictClass = `verdict-${r.verdict || "pass"}`;
  out.push(`<div class="panel"><h4>④ 质检审核 · 6 维度评估</h4>`);
  out.push(`<div class="review-grid">
    <div>难度:<strong>${(r.difficulty_score ?? 0).toFixed(2)}</strong></div>
    <div>区分度:<strong>${(r.discrimination_score ?? 0).toFixed(2)}</strong></div>
    <div>表述质量:<strong>${(r.expression_quality ?? 0).toFixed(2)}</strong></div>
    <div>知识点对位:<strong>${r.knowledge_coverage_match ? "✓" : "✗"}</strong></div>
    <div>答案正确:<strong>${r.answer_correctness ? "✓" : "✗"}</strong></div>
    <div>政治安全:<strong>${r.political_safety ? "✓" : "✗"}</strong></div>
  </div>`);
  out.push(`<p><strong>终审:</strong> <span class="${verdictClass}">${escapeHtml(r.verdict || "")}</span></p>`);
  if (r.verdict_rationale) out.push(`<p><strong>理由:</strong>${renderInline(r.verdict_rationale)}</p>`);
  if (r.issues?.length) {
    out.push(`<p><strong>发现的问题:</strong></p><ul>`);
    r.issues.forEach(s => out.push(`<li>${renderInline(s)}</li>`));
    out.push(`</ul>`);
  }
  if (r.suggestions?.length) {
    out.push(`<p><strong>修改建议:</strong></p><ul>`);
    r.suggestions.forEach(s => out.push(`<li>${renderInline(s)}</li>`));
    out.push(`</ul>`);
  }
  out.push(`</div>`);

  out.push(`</details>`);
  return out.join("");
}

function renderPaper(paper) {
  const bp = paper.blueprint;
  const out = [];
  out.push(`<h1>${escapeHtml(bp.target_audience)} · ${escapeHtml(bp.subject)}模拟卷</h1>`);
  out.push(`<div class="meta-box">
    <strong>学段:</strong>${escapeHtml(bp.stage)} ${escapeHtml(bp.grade)} ·
    <strong>总分:</strong>${bp.total_score} ·
    <strong>时长:</strong>${bp.duration_minutes} 分钟 ·
    <strong>预期难度:</strong>${bp.overall_difficulty}
  </div>`);

  // ===== 命题策划官 =====
  out.push("<h2>命题策划官 · 整卷理念</h2>");
  out.push(renderParagraphs(bp.design_rationale));
  out.push("<p><strong>重点考查知识点:</strong></p><ul>");
  bp.knowledge_coverage.forEach(k => out.push(`<li>${escapeHtml(k)}</li>`));
  out.push("</ul>");

  // ===== 试题正文(命题执笔 + 单题幕后) =====
  out.push("<hr><h2>试题正文</h2>");
  paper.questions.forEach(fq => {
    out.push(`<h3>第 ${fq.blueprint.number} 题(${escapeHtml(fq.blueprint.question_type)}, ${fq.blueprint.score} 分)</h3>`);
    out.push(renderParagraphs(fq.draft.stem));
    if (fq.draft.options && fq.draft.options.length) {
      out.push('<div class="options">');
      fq.draft.options.forEach(o => out.push(`<div>${renderInline(o)}</div>`));
      out.push("</div>");
    }
    if (fq.draft.diagram_description) {
      out.push(`<p><em>📊 配图说明:${escapeHtml(fq.draft.diagram_description)}</em></p>`);
    }
    // 单题命题幕后(真题分析师 + 命题执笔创新点 + 解析撰写要点 + 质检审核)
    out.push(renderBehindScenes(fq));
  });

  // ===== 解析撰写 =====
  out.push("<hr><h2>解析撰写 · 参考答案与详解</h2>");
  paper.questions.forEach(fq => {
    out.push(`<h3>第 ${fq.blueprint.number} 题</h3>`);
    out.push(`<p><strong>答案:</strong>${renderInline(fq.solution.answer)}</p>`);
    out.push("<p><strong>解析:</strong></p>");
    out.push(renderParagraphs(fq.solution.solution));
    if (fq.solution.common_mistakes && fq.solution.common_mistakes.length) {
      out.push("<p><strong>易错点:</strong></p><ul>");
      fq.solution.common_mistakes.forEach(m => out.push(`<li>${renderInline(m)}</li>`));
      out.push("</ul>");
    }
    if (fq.solution.extension) {
      out.push(`<p><strong>拓展:</strong>${renderInline(fq.solution.extension)}</p>`);
    }
  });

  // ===== 主审定稿 =====
  out.push("<hr><h2>主审定稿 · 整卷终审评语</h2>");
  out.push(`<div class="meta-box">
    <strong>整卷综合质量评分:</strong>${paper.chief_review.overall_quality_score.toFixed(2)} ·
    <strong>是否可发布:</strong>${paper.chief_review.publishable ? "✓ 是" : "✗ 否(需重做)"}
  </div>`);
  out.push(renderParagraphs(paper.chief_review.executive_summary));

  if (paper.chief_review.balance_issues && paper.chief_review.balance_issues.length) {
    out.push("<p><strong>整卷平衡问题:</strong></p><ul>");
    paper.chief_review.balance_issues.forEach(x => out.push(`<li>${renderInline(x)}</li>`));
    out.push("</ul>");
  }
  if (paper.chief_review.style_consistency_issues && paper.chief_review.style_consistency_issues.length) {
    out.push("<p><strong>风格一致性问题:</strong></p><ul>");
    paper.chief_review.style_consistency_issues.forEach(x => out.push(`<li>${renderInline(x)}</li>`));
    out.push("</ul>");
  }
  if (paper.chief_review.final_adjustments && paper.chief_review.final_adjustments.length) {
    out.push("<p><strong>最终调整建议:</strong></p><ul>");
    paper.chief_review.final_adjustments.forEach(a => {
      out.push(`<li>第 ${a.question_number} 题:${renderInline(a.adjustment)}</li>`);
    });
    out.push("</ul>");
  }

  return out.join("");
}

// ============================================================
// UI 绑定
// ============================================================

let currentPaper = null;

// 加载本地存储的 API Key 与模型覆写
const apiKeyInput = document.getElementById("apiKey");
const primaryOverrideInput = document.getElementById("primaryModelOverride");
const secondaryOverrideInput = document.getElementById("secondaryModelOverride");
const STORAGE_KEY = "qiguang_openai_key";
const STORAGE_PRIMARY = "qiguang_openai_primary";
const STORAGE_SECONDARY = "qiguang_openai_secondary";
apiKeyInput.value = localStorage.getItem(STORAGE_KEY) || "";
primaryOverrideInput.value = localStorage.getItem(STORAGE_PRIMARY) || "";
secondaryOverrideInput.value = localStorage.getItem(STORAGE_SECONDARY) || "";
apiKeyInput.addEventListener("change", () => {
  localStorage.setItem(STORAGE_KEY, apiKeyInput.value.trim());
});
primaryOverrideInput.addEventListener("change", () => {
  localStorage.setItem(STORAGE_PRIMARY, primaryOverrideInput.value.trim());
});
secondaryOverrideInput.addEventListener("change", () => {
  localStorage.setItem(STORAGE_SECONDARY, secondaryOverrideInput.value.trim());
});

// 用模型覆写值替换预设
function applyModelOverrides(presetName) {
  const preset = { ...MODEL_PRESETS[presetName] };
  const primary = primaryOverrideInput.value.trim();
  const secondary = secondaryOverrideInput.value.trim();
  if (primary) {
    preset.planner = preset.composer = preset.reviewer = preset.chiefEditor = primary;
  }
  if (secondary) {
    preset.analyst = preset.solution = secondary;
  }
  return preset;
}

document.getElementById("startBtn").addEventListener("click", async () => {
  const apiKey = apiKeyInput.value.trim();
  if (!apiKey) {
    alert("请先填写 OpenAI API Key");
    apiKeyInput.focus();
    return;
  }
  localStorage.setItem(STORAGE_KEY, apiKey);

  const request = {
    subject: document.getElementById("subject").value,
    stage: document.getElementById("stage").value,
    grade: document.getElementById("grade").value,
    total_score: parseInt(document.getElementById("totalScore").value, 10),
    duration_minutes: parseInt(document.getElementById("duration").value, 10),
    target_audience: document.getElementById("audience").value,
    question_count: parseInt(document.getElementById("questionCount").value, 10),
    knowledge_focus: document.getElementById("knowledge").value.split(/[,,]/).map(s => s.trim()).filter(Boolean),
    constraints: document.getElementById("constraints").value,
  };

  const presetName = document.getElementById("modelPreset").value;
  const preset = applyModelOverrides(presetName);
  const maxRevisions = parseInt(document.getElementById("maxRevisions").value, 10);

  updateStatus("准备开始 ...");
  totalTokens = { input: 0, output: 0 };
  document.getElementById("outputSection").style.display = "none";

  const startBtn = document.getElementById("startBtn");
  const stopBtn = document.getElementById("stopBtn");
  startBtn.disabled = true;
  stopBtn.disabled = false;

  try {
    const paper = await runWorkflow(apiKey, preset, request, maxRevisions);
    currentPaper = paper;
    showResult(paper);
  } catch (e) {
    if (e.name === "AbortError") {
      alert("已停止");
    } else {
      console.error(e);
      alert("命题流水线异常:" + e.message);
    }
  } finally {
    updateStatus("");
    startBtn.disabled = false;
    stopBtn.disabled = true;
    abortController = null;
  }
});

document.getElementById("stopBtn").addEventListener("click", () => {
  if (abortController) abortController.abort();
});

function showResult(paper) {
  const section = document.getElementById("outputSection");
  section.style.display = "block";

  // 统计卡片(按 gpt-4o 单价上限估算:input $2.5/1M, output $10/1M)
  const stats = document.getElementById("stats");
  const estCost = (totalTokens.input * 2.5 + totalTokens.output * 10) / 1_000_000;
  stats.innerHTML = `
    <div class="stat"><div class="value">${paper.questions.length}</div><div class="label">已定稿题数</div></div>
    <div class="stat"><div class="value">${paper.chief_review.overall_quality_score.toFixed(2)}</div><div class="label">主审评分</div></div>
    <div class="stat"><div class="value">${paper.metadata.elapsed_seconds}s</div><div class="label">耗时</div></div>
    <div class="stat"><div class="value">~$${estCost.toFixed(2)}</div><div class="label">估算成本(按 gpt-4o)</div></div>
  `;

  document.getElementById("paperOutput").innerHTML = renderPaper(paper);
  document.getElementById("rawJsonContent").textContent = JSON.stringify(paper, null, 2);
  section.scrollIntoView({ behavior: "smooth" });
}

document.getElementById("copyBtn").addEventListener("click", async () => {
  const node = document.getElementById("paperOutput");
  if (!node || !node.textContent.trim()) return;
  try {
    await navigator.clipboard.writeText(node.innerText);
    const btn = document.getElementById("copyBtn");
    const orig = btn.textContent;
    btn.textContent = "✓ 已复制";
    setTimeout(() => { btn.textContent = orig; }, 1500);
  } catch {
    alert("复制失败,请手动选中文字复制");
  }
});
</script>
